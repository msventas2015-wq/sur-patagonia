name = "sur-patagonia"
compatibility_date = "2024-09-23"
main = "worker/index.mjs"
keep_vars = true

# The staging branch must never use the production deployment/preview command.
# Staging is deployed explicitly with --config wrangler.staging.toml.
[build]
command = "node scripts/staging/guard-default-deploy.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/r/*", "/api/qr/*", "/api/contacto"]
