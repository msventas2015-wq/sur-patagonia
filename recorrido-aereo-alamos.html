<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Recorrido aéreo · Álamos Productivo · Sur Patagonian</title>
<meta name="description" content="Recorrido aéreo 360 del loteo Álamos Productivo, El Bolsón.">
<link rel="stylesheet" href="/css/recorrido-medios.css?v=20261110-medios1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Recorrido aéreo · dirección «referencias» (maqueta docs/maquetas/alamos-referencias.html, aprobada para prueba local por Mariano).
   Títulos Montserrat gruesos, ficha por capas sin bisel ni sombra dura, barra inferior continua, marcadores tipográficos. */
html,body{overscroll-behavior:contain}
body{margin:0;background:#101719}
.f-root{--ink:#f6f5ee;--soft:rgba(246,245,238,.72);--dim:rgba(246,245,238,.52);--line:rgba(255,255,255,.14);--gold:#e8c96a;--sheet-alpha:.53;--r40:#ffebc7;--r16:#99c7ff;font:400 14px/1.45 'Montserrat',Arial,sans-serif;color:var(--ink)}
.f-root *{box-sizing:border-box;font-style:normal}
/* Especificidad cero: cada botón define su propio color (si no, el Play claro quedaba con ícono blanco). */
:where(.f-root a){color:inherit;text-decoration:none}
:where(.f-root button){font:inherit;color:inherit;cursor:pointer}
.f-root button:focus-visible,.f-root a:focus-visible{outline:2px solid #e4dfbe;outline-offset:4px}
.f-root svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hz-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(8,23,25,.62),transparent 48%),linear-gradient(0deg,rgba(7,22,30,.6),transparent 34%,transparent 78%,rgba(7,22,30,.38))}

/* Fundidos */
.hz-fx{transition:opacity .45s ease,transform .45s ease,visibility 0s linear 0s}
.hz-off{opacity:0;visibility:hidden;pointer-events:none!important;transition:opacity .3s ease,transform .3s ease,visibility 0s linear .3s}

/* Barra superior */
.hz-top{position:absolute;left:28px;right:28px;top:22px;display:flex;align-items:center;gap:14px;z-index:8;pointer-events:none}
.hz-top > *{pointer-events:auto}
.hz-back{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;color:rgba(255,255,255,.82);min-height:40px}
.hz-back svg{width:18px;height:18px}
.hz-back img{width:118px;height:auto;display:block}
.hz-right{margin-left:auto;display:flex;align-items:center;gap:18px}
.hz-coord{font-size:11px;letter-spacing:.06em;line-height:1.35;text-align:right;pointer-events:none}
.hz-menu{border:0;border-left:1px solid var(--line);background:none;display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;min-height:40px;padding:0 0 0 16px}
.hz-sky{min-height:36px;padding:0 12px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(23,47,56,.38);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:11px;font-weight:600;white-space:nowrap}
.hz-sky-credit{position:absolute;right:24px;bottom:8px;z-index:20;color:#dde6ef;font-size:10px;line-height:1.4;text-shadow:0 1px 3px #07131e;background:rgba(10,24,35,.55);padding:3px 6px;border-radius:3px}.hz-sky-credit a{color:inherit;text-decoration:underline}@media(max-width:600px){.hz-sky-credit{right:12px;bottom:90px;font-size:9px}.hz-started .hz-sky-credit{bottom:2px;padding-block:1px;pointer-events:none}.hz-started .hz-sky-credit a{pointer-events:auto}}
.hz-sky[aria-pressed="true"]{color:var(--gold);border-color:rgba(232,201,106,.6)}
.hz-cal{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;opacity:.75}

/* Brújula: cinta que se corre con el rumbo */
.hz-compass{position:absolute;top:2px;left:50%;width:240px;height:36px;margin-left:-120px;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);z-index:6}
.hz-tape{position:absolute;left:0;top:0;height:36px;width:2160px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.34) 0 1px,transparent 1px 15px) 0 25px/100% 7px no-repeat;will-change:transform}
.hz-tape span{position:absolute;top:8px;width:40px;margin-left:-20px;text-align:center;font-size:11px;color:rgba(255,255,255,.62)}
.hz-tape span.n{color:#fff;font-weight:700}
.hz-compass::after{content:'';position:absolute;left:50%;bottom:4px;width:16px;height:2px;margin-left:-8px;background:#ece8d5}

/* Columna izquierda: nombre, leyenda y ficha */
.hz-left{position:absolute;left:28px;top:96px;width:300px;z-index:7;display:flex;flex-direction:column;pointer-events:none}
.hz-left > *{pointer-events:auto}
.hz-name{margin:0 0 16px;font-size:64px;line-height:.9;letter-spacing:-.06em;font-weight:900;text-transform:uppercase;text-shadow:0 10px 26px rgba(8,32,35,.3);transition:font-size .5s ease,margin .5s ease;pointer-events:none}
.hz-started .hz-name{font-size:27px;line-height:.94;letter-spacing:-.055em;font-weight:800;margin:0 0 14px}
.hz-intro{font-size:12px;color:var(--soft);margin:0 0 22px;letter-spacing:.02em}
.hz-start{display:flex;flex-wrap:wrap;gap:10px}
.hz-go{min-height:46px;padding:0 20px;border-radius:6px;display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.35);background:rgba(23,47,56,.38);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.hz-go.main{background:#f0f3e9;color:#192a2d;border-color:#f0f3e9}
.hz-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:10px;color:rgba(244,246,242,.85);margin-bottom:22px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.hz-lg{display:inline-flex;align-items:center;gap:5px}
.hz-lg i{display:inline-block;width:6px;height:6px;background:#aab7ba}
.hz-st-disponible i{background:#4dc992}
.hz-st-no_disponible i{background:#c58f83}
.hz-lg small{color:var(--dim);font-size:9.5px}
.hz-lg-e{width:100%;color:var(--dim);font-size:9.5px}
.hz-lg-e b{font-weight:700}

/* Fichas por capas: lámina translúcida, borde de luz y una segunda lámina asomando abajo. Sin bisel ni sombra dura. */
.hz-cards{position:relative}
.hz-card{position:absolute;top:0;left:0;right:0;padding:18px 22px 20px;background:linear-gradient(140deg,rgba(230,242,241,.10),transparent 42%),rgba(12,29,35,var(--sheet-alpha));border:1px solid rgba(244,255,255,.24);border-top-color:rgba(255,255,255,.48);border-radius:16px;-webkit-backdrop-filter:blur(24px) saturate(.85);backdrop-filter:blur(24px) saturate(.85);box-shadow:0 16px 40px rgba(3,15,22,.22);max-height:calc(100dvh - 330px);overflow:auto;scrollbar-width:thin;scrollbar-color:#8b9a9d transparent}
.hz-card.hz-off{transform:translateY(-6px)}
.hz-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;letter-spacing:.09em;color:#dde6e3;text-transform:uppercase}
.hz-x{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);width:44px;height:44px;margin:-6px -10px -6px 0;border-radius:10px;display:grid;place-items:center;flex:none}
.hz-card h3{font-size:40px;line-height:1;margin:17px 0 24px;font-weight:800;letter-spacing:-.055em}
.hz-measure{display:flex;gap:20px;align-items:flex-end;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.14)}
.hz-big{font-size:40px;font-weight:600;line-height:1;letter-spacing:-.06em}
.hz-big small{font-size:18px;font-weight:500;letter-spacing:-.02em}
.hz-mlabel{font-size:11px;color:#d8e2e0;margin-top:8px}
.hz-phase{padding-left:20px;border-left:1px solid rgba(255,255,255,.14)}
.hz-phase strong{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:600;line-height:1}
.hz-phase strong::before{content:'';width:12px;height:2px;background:var(--sc,#fff)}
.hz-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0 12px;font-size:12px}
.hz-row b{font-weight:600;color:#edf2ee;text-align:right}
.hz-availability{display:flex;align-items:center;justify-content:flex-end;gap:7px}
.hz-availability i{display:block;width:6px;height:6px;background:#aab7ba;flex:none}
.hz-availability.hz-st-disponible i{background:#4dc992}
.hz-availability.hz-st-no_disponible i{background:#c58f83}
.hz-row + .hz-row{padding-top:4px}
.hz-missing{font-size:11px;color:#c5d1d0;line-height:1.65;margin:8px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.hz-missing strong{font-weight:600;color:#edf2ee;display:block;margin-bottom:3px}
.hz-src{font-size:10px;color:#c2d2cf;margin:16px 0 0;line-height:1.6}
.hz-zl{color:#efe0b4}
.hz-hide{display:none!important}

/* Marcadores tipográficos anclados al terreno (sin anillos ni bolas) */
.hz-labels{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden;overflow:clip}
.hz-a{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s;will-change:transform,opacity}
.hz-a.hz-vis{visibility:visible;transition:opacity .4s ease,visibility 0s}
.hz-stem{position:absolute;left:-.5px;bottom:0;width:1px;height:60px;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.18))}
.hz-dot{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border:1px solid #fff;background:rgba(255,255,255,.4);transform:rotate(45deg)}
.hz-mk{position:absolute;left:-10px;bottom:62px;display:flex;align-items:baseline;gap:8px;border:0;background:none;padding:4px 6px 4px 0;text-align:left;white-space:nowrap;pointer-events:auto;text-shadow:0 2px 13px #051a21}
.hz-mk strong{font-size:31px;font-weight:800;letter-spacing:-.08em;line-height:1}
.hz-lbl{font-size:10.5px;line-height:1.2;color:#eef6f2}
.hz-lbl small{font-size:10px;color:rgba(238,246,242,.72)}
.hz-sel .hz-mk strong{color:var(--gold)}
.hz-sel .hz-stem{background:linear-gradient(var(--gold),rgba(232,201,106,.15))}
.hz-sel .hz-dot{border-color:var(--gold);background:rgba(232,201,106,.5)}
.hz-zone{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:9.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.9);text-shadow:0 2px 8px rgba(10,20,26,.9);white-space:nowrap}
.hz-rt{position:absolute;left:0;bottom:40px;border-left:1px solid var(--rc);padding:0 0 0 11px;font-size:11px;line-height:1.6;color:#f5efce;white-space:nowrap;text-shadow:0 2px 10px rgba(5,26,33,.9)}
.hz-rt b{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#fff}
.hz-rcopy{display:block;color:rgba(245,239,206,.85)}
.hz-arrow{display:none;width:15px;height:15px}
.hz-edge .hz-stem,.hz-edge .hz-dot,.hz-edge .hz-rcopy{display:none}
.hz-edge .hz-rt{bottom:-10px}
.hz-edge .hz-arrow{display:block}
.hz-flip .hz-rt{left:auto;right:0;border-left:0;border-right:1px solid var(--rc);padding:0 11px 0 0;text-align:right}
.hz-flip .hz-rt b{justify-content:flex-end}
.hz-poi{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:11px;font-weight:500;color:rgba(255,255,255,.88);text-shadow:0 2px 8px rgba(10,20,26,.95)}
.hz-poi small{display:block;font-size:9.5px;font-weight:400;color:rgba(255,255,255,.62)}
.hz-poi svg{width:14px;height:14px}
.hz-office{position:absolute;left:0;top:0;display:flex;flex-direction:row;align-items:center;gap:10px;padding:2px 0 2px 10px;border-left:1px solid var(--gold);white-space:nowrap;text-shadow:0 2px 10px rgba(5,26,33,.9)}
/* Picos originales (assets/logos/picos-blanco.png, 309 × 169) con su proporción; a la derecha, nombre y dirección. */
.hz-office .hz-picos{height:32px;width:auto;aspect-ratio:309/169;object-fit:contain;flex:none;display:block}
.hz-otx{display:flex;flex-direction:column;gap:2px;line-height:1.25}
.hz-otx > span{font-size:11px;color:rgba(255,255,255,.88)}
.hz-lead{position:absolute;left:0;top:0;width:0;height:0;border:0 solid rgba(232,201,106,.75);opacity:0;transition:opacity .3s;pointer-events:none}
.hz-poi + .hz-lead,.hz-lead.hz-lw{border-color:rgba(255,255,255,.55)}
.hz-office b{font-size:12px;font-weight:700;letter-spacing:-.01em}
.hz-office small{font-size:8.5px;letter-spacing:.04em;color:rgba(255,255,255,.55)}

/* Título en el paisaje: se proyecta con la cámara real (posición y perspectiva) */
.hz-world{position:absolute;left:0;top:0;z-index:2;pointer-events:none;transform-origin:50% 100%;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s;will-change:transform,opacity;text-shadow:0 2px 0 rgba(104,124,126,.5),0 10px 26px rgba(8,32,35,.28)}
.hz-world.hz-vis{visibility:visible;transition:opacity .5s ease,visibility 0s}
.hz-world small{display:block;font-size:11px;font-weight:500;letter-spacing:.24em;color:rgba(244,245,233,.8);margin-bottom:10px}
.hz-world strong{display:block;font-size:clamp(36px,5.9vw,70px);line-height:.87;font-weight:900;letter-spacing:-.065em;text-transform:uppercase;white-space:nowrap}
.hz-world strong + strong{color:rgba(233,236,231,.87)}
.hz-world::after{content:'';display:block;height:1px;width:70%;margin-top:20px;background:linear-gradient(90deg,rgba(255,255,255,.48),transparent)}

/* Entorno */
.hz-pop{position:absolute;right:28px;top:76px;width:280px;padding:18px 20px 6px;border-radius:3px 18px 3px 3px;z-index:9;background:linear-gradient(135deg,rgba(220,235,233,.15),rgba(19,39,43,.6));border:1px solid rgba(244,255,255,.22);border-top-color:rgba(255,255,255,.44);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.hz-pop.hz-off{transform:translateY(-6px)}
.hz-pop h2{font-size:15px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.hz-pop button{width:100%;border:0;border-top:1px solid var(--line);background:none;display:flex;align-items:center;gap:12px;padding:12px 0;text-align:left;font-size:12px;min-height:44px}
.hz-pop button small{margin-left:auto;font-size:10px;color:var(--dim);white-space:nowrap}
.hz-pop p{font-size:9.5px;color:var(--dim);margin:6px 0 10px;line-height:1.5}

/* Una sola barra de navegación; las capas se abren a pedido en una superficie común. */
.hz-layers{position:absolute;left:calc(50% + 80px);bottom:116px;width:290px;padding:12px 16px 8px;z-index:10;background:linear-gradient(145deg,rgba(232,243,240,.1),transparent 55%),rgba(12,29,35,.84);border:1px solid rgba(244,255,255,.27);border-top-color:rgba(255,255,255,.48);border-radius:16px;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 18px 40px rgba(3,15,22,.22)}
.hz-layers-head{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-bottom:4px}
.hz-layers-head strong{font-size:14px;letter-spacing:-.02em}
.hz-layers-head .hz-x{margin:0 -6px 0 0}
.hz-layer{position:relative;border:0;border-top:1px solid var(--line);background:transparent;display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 2px;font-size:12px;color:#eef2ee;text-align:left;transition:background .18s}
.hz-layer svg{width:19px;height:19px;opacity:.88}
.hz-layer-copy{display:flex;flex-direction:column;gap:3px;white-space:nowrap}
.hz-layer-copy b{font-size:12px;font-weight:600;letter-spacing:-.02em}
.hz-layer-copy small{font-size:10px;color:#c2d1d2}
.hz-layer .hz-on{display:none}
.hz-layer[aria-pressed="true"] .hz-layer-copy b{color:#fff}
.hz-layer[aria-pressed="true"] .hz-on{display:inline}
.hz-layer[aria-pressed="true"] .hz-off-copy{display:none}
.hz-switch{margin-left:auto;width:32px;height:20px;border-radius:10px;background:rgba(5,15,20,.6);border:1px solid rgba(255,255,255,.3);position:relative;flex:none}
.hz-switch::after{content:'';position:absolute;left:3px;top:3px;width:12px;height:12px;border-radius:50%;background:#a7b7bd;transition:transform .18s}
.hz-layer[aria-pressed="true"] .hz-switch{background:#dce7da;border-color:#dce7da}
.hz-layer[aria-pressed="true"] .hz-switch::after{background:#243d3e;transform:translateX(12px)}
.hz-layer.hz-landscape::after{content:'↗';margin-left:auto;font-size:20px;color:#dce7da}
.hz-layer:disabled{opacity:.55;cursor:wait}
.hz-layer:disabled .hz-layer-copy small span{display:none}
.hz-layer:disabled .hz-layer-copy small::after{content:'Actualizando…'}
@media(hover:hover){.hz-layer:not(:disabled):hover{background:rgba(255,255,255,.07)}.hz-chip:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.55)}.hz-play:hover{background:#fff}.hz-speed:hover,.hz-layer-toggle:hover,.hz-x:hover{background:rgba(255,255,255,.15)}}
.hz-layer:active:not(:disabled),.hz-chip:active{transform:translateY(1px)}
.hz-player{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(740px,calc(100% - 48px));min-height:76px;padding:12px 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(155deg,rgba(213,231,230,.13),transparent 55%),rgba(12,29,35,.72);border:1px solid rgba(223,239,240,.27);border-top-color:rgba(255,255,255,.48);border-radius:16px;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 12px 36px rgba(0,13,20,.22);z-index:11}
.hz-play{border:1px solid rgba(255,255,255,.55);background:#e5ecdf;color:#192a2d;width:48px;height:48px;flex:none;border-radius:10px;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.hz-play svg{width:18px;height:18px;stroke-width:2.2}
.hz-play .hz-fill{fill:currentColor}
.hz-plabel{font-size:12px;min-width:112px;line-height:1.5}
.hz-plabel strong{display:block;font-weight:700}
.hz-plabel span{color:#d6e1dd;font-size:10px}
.hz-timeline{display:flex;position:relative;flex:1;justify-content:space-between;align-items:center;gap:6px;padding-bottom:6px;margin:0 4px}
.hz-rail{position:absolute;left:22px;right:22px;bottom:0;height:1px;background:rgba(255,255,255,.22)}
.hz-rail i{position:absolute;inset:0;background:var(--gold);transform-origin:0 50%;transform:scaleX(0)}
.hz-chip{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.035);position:relative;width:44px;height:44px;flex:none;font-size:12px;font-weight:600;color:#eff3ec;border-radius:8px;z-index:1;transition:background .18s,border-color .18s,transform .18s}
.hz-chip[aria-current="step"]{background:#e5eadf;color:#17342d;border-color:#f2f5e9;font-weight:800;box-shadow:0 3px 9px rgba(0,0,0,.13)}
.hz-speed{border:1px solid rgba(255,255,255,.2);background:rgba(10,29,37,.35);font-size:12px;font-weight:600;padding:0 10px;min-width:48px;height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.hz-speed small{font-size:8px;font-weight:500;color:#c6d5d9}
.hz-layer-toggle{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:92px;padding:0 10px;border:1px solid rgba(255,255,255,.32);border-radius:9px;background:rgba(255,255,255,.08);font-size:12px;font-weight:600}
.hz-layer-toggle[aria-expanded="true"]{background:#e5eadf;color:#17342d;border-color:#f2f5e9}
.hz-layer-toggle svg{width:18px;height:18px}
.hz-help{position:absolute;left:50%;bottom:116px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:18px;padding:8px 10px 8px 18px;z-index:7;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(12,29,35,.72);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:12px}
.hz-help span{display:flex;align-items:center;gap:8px}
.hz-help .hz-x{margin:0;background:transparent;border:0}

<body>
<div id="recorrido"></div>
<template id="recorrido-tpl">
<div class="f-root {{ rootCls }}" ref="{{ setRoot }}" style="position: relative; width: 100%; height: 100vh; height: 100dvh; min-height: 560px; overflow: hidden; background: #101719;">
<canvas data-f="gl" ref="{{ setGl }}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block;"></canvas>
<canvas data-f="ov" ref="{{ setOv }}" role="img" aria-label="Recorrido aéreo 360 del loteo Álamos Productivo con las manzanas dibujadas sobre el terreno. Arrastre para mirar alrededor." onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerCancel="{{ onUp }}" onPointerLeave="{{ onLeave }}" onWheel="{{ onWheel }}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab;"></canvas>
<div class="hz-shade"></div>
<div class="hz-world" ref="{{ setWorld }}" aria-hidden="true"><small>RECORRIDO AÉREO 360°</small><strong>Álamos</strong><strong>Productivo</strong></div>
<div class="hz-labels" ref="{{ setLabels }}"></div>
<sc-if value="{{ sunsetEntry }}" hint-placeholder-val="{{ false }}">
<div class="hz-entry" aria-hidden="true"><img src="/assets/recorridos/alamos/ingreso-atardecer.jpg" alt="" fetchpriority="high" onError="{{ entryError }}"><span class="hz-entry-note">Atardecer recreado con IA sobre fotografía de El Bolsón</span></div>
</sc-if>

<header class="hz-top">
<a class="hz-back" href="/alamos" aria-label="Volver a la página de Álamos Productivo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg><span>by</span><img src="/assets/logohorizontalblanco.png" alt="Sur Patagonian" width="118" height="14"></a>
<div class="hz-compass" aria-hidden="true"><div class="hz-tape" ref="{{ setTape }}"></div></div>
<div class="hz-right">
<span class="hz-coord">EL BOLSÓN<br>PATAGONIA ARGENTINA</span>
<sc-if value="{{ skyTest }}" hint-placeholder-val="{{ false }}">
<button type="button" class="hz-sky" aria-pressed="{{ skyPressed }}" aria-label="{{ skyTxt }}" title="{{ skyTxt }}" onClick="{{ toggleSky }}">{{ skyShort }}</button>
</sc-if>
<sc-if value="{{ calMode }}" hint-placeholder-val="{{ false }}">
<button type="button" class="hz-cal" aria-label="Calzar plano" aria-expanded="{{ panelOpen }}" onClick="{{ togglePanel }}" disabled="{{ panelOff }}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg></button>
</sc-if>
<button type="button" class="hz-menu" aria-label="Panorámicas y entorno" aria-expanded="{{ entOpen }}" aria-controls="hz-entorno" onClick="{{ toggleEnt }}"><span>Panorámicas y entorno</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></button>
</div>
</header>
<sc-if value="{{ skyCredit }}" hint-placeholder-val="{{ false }}"><span class="hz-sky-credit">Cielo recreado · <a href="https://www.eso.org/public/images/eso0932a/" target="_blank" rel="noopener">ESO/S. Brunier</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · estrellas adaptadas + horizonte IA</span></sc-if>

<div class="hz-left">
<h1 class="hz-name">Álamos<br>Productivo</h1>
<sc-if value="{{ showStart }}" hint-placeholder-val="{{ false }}">
<p class="hz-intro">Recorrido aéreo 360° · 5 vistas del loteo y 4 panorámicas · El Bolsón</p>
<div class="hz-start">
<button type="button" class="hz-go main" onClick="{{ startPrimary }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>{{ startPrimaryLabel }}</button>
<button type="button" class="hz-go" onClick="{{ startSecondary }}">{{ startSecondaryLabel }}</button>
</div>
</sc-if>
<div class="hz-legend hz-fx {{ legendCls }}" role="group" aria-label="Disponibilidad de los lotes">
<span class="hz-lg hz-st-disponible"><i aria-hidden="true"></i>Disponible <small>{{ legend.disp }}</small></span>
<span class="hz-lg hz-st-no_disponible"><i aria-hidden="true"></i>No disponible <small>{{ legend.nodisp }}</small></span>
<span class="hz-lg hz-st-sin"><i aria-hidden="true"></i>Sin informar <small>{{ legend.sin }}</small></span>
<span class="hz-lg-e">Líneas del plano por etapa: <b style="color:#ffc761">1</b> · <b style="color:#73f2c2">2</b> · <b style="color:#8cbfff">3</b></span>
</div>
<div class="hz-cards">
<section class="hz-card hz-lot-card hz-fx {{ lotCls }}" aria-live="polite" aria-label="Ficha del lote">
<alamos-ficha manzana="{{ lot.kicker }}" lote="{{ lot.title }}"></alamos-ficha>
<div class="hz-lot-visual"><img src="/assets/recorridos/alamos/vista-sector.jpg" alt="Vista aérea general del sector, no tomada desde el lote"><span class="hz-sector">{{ lot.kicker }} · VISTA DEL SECTOR</span><button type="button" class="hz-x" aria-label="Cerrar ficha del lote" onClick="{{ closeLot }}">×</button>
<div class="hz-media-empty {{ mediaEmptyCls }}"><strong>{{ mediaHeading }}</strong><span>{{ mediaMessage }}</span></div>
<div class="hz-media-tabs" role="group" aria-label="Imágenes del lote"><button type="button" aria-pressed="{{ mediaSectorPressed }}" onClick="{{ mediaSector }}">Sector</button><button type="button" aria-pressed="{{ media360Pressed }}" onClick="{{ media360 }}">Vista 360°</button><button type="button" aria-pressed="{{ mediaPhotosPressed }}" onClick="{{ mediaPhotos }}">Fotos del lote</button></div></div>
<div class="hz-lot-body"><div class="hz-lot-heading"><h3>{{ lot.title }}</h3><span class="hz-availability {{ lot.estCls }}"><i aria-hidden="true"></i>{{ lot.estado }}</span></div>
<div class="hz-measure"><div><div class="hz-big">{{ lot.areaNum }} <small>m²</small></div><div class="hz-mlabel">Superficie del lote</div></div><div class="hz-phase"><strong>Etapa {{ lot.stageNum }}</strong><div class="hz-mlabel">Según plano</div></div></div>
<button type="button" class="hz-locate" onClick="{{ locateLot }}">Ubicar en el plano <span aria-hidden="true">↗</span></button>
<details class="hz-lot-details"><summary>Información del lote</summary><div class="hz-row"><span>Manzana</span><b>{{ lot.kicker }}</b></div>
<sc-for list="{{ lot.rows }}" as="row" hint-placeholder-count="0"><div class="hz-row"><span>{{ row.k }}</span><b>{{ row.v }}</b></div></sc-for>
<p class="hz-missing {{ lot.missCls }}"><strong>Información por completar</strong>{{ lot.missing }}</p>
<p class="hz-src hz-zl {{ lot.zCls }}">Lote real del plano. Los galpones son una recreación ilustrativa.</p></details>
<p class="hz-src">Superficie y etapa según el plano del loteo. Los colores indican etapas.</p></div>
</section>
<section class="hz-card hz-fx {{ selCls }}" aria-live="polite" aria-label="Ficha de manzana">
<div class="hz-head"><span>Zona productiva</span><button type="button" class="hz-x" aria-label="Cerrar ficha de manzana" onClick="{{ closeSel }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<h3>{{ sel.title }}</h3>
<div class="hz-measure"><div><div class="hz-big">{{ sel.lots }} <small>lotes</small></div><div class="hz-mlabel">En la manzana</div></div><div class="hz-phase"><strong>{{ sel.stage }}</strong><div class="hz-mlabel">Etapa</div></div></div>
<div class="hz-row"><span>Superficies</span><b>{{ sel.area }}</b></div>
<p class="hz-src">Toque o señale un lote para ver su ficha. Datos según el plano del loteo.</p>
<div class="hz-block-lots" aria-label="Lotes de la manzana"><sc-for list="{{ sel.lotItems }}" as="item" hint-placeholder-count="0"><button type="button" onClick="{{ item.go }}">{{ item.name }}</button></sc-for></div>
</section>
</div>
</div>

<aside class="hz-locator {{ locatorCls }}" tabindex="-1" aria-label="Ubicación del lote seleccionado"><div class="hz-locator-head"><strong>Ubicación del lote</strong><button type="button" aria-label="Ocultar localizador" onClick="{{ closeLocator }}">−</button></div><svg viewBox="0 0 280 180" role="img" aria-label="Plano real con el lote seleccionado resaltado" ref="{{ setLocator }}"></svg><p>{{ lot.kicker }} · {{ lot.title }}</p></aside>
<section id="hz-entorno" class="hz-pop hz-fx {{ entCls }}" aria-label="Alrededor de Álamos">
<h2>Panorámicas y entorno</h2>
<div ref="{{ setEntList }}"></div>
<sc-if value="{{ openProjectMedia }}"><button type="button" class="hz-pano" onClick="{{ openProjectMedia }}">Fotos y panorámicas del proyecto</button></sc-if>
<p>Elegí una panorámica para volar hasta ella. Los otros lugares orientan la mirada. Distancias aproximadas en línea recta.</p>
</section>

<sc-if value="{{ zoneNote }}" hint-placeholder-val="{{ false }}">
<p class="hz-note">Zona productiva: recreación ilustrativa de galpones y depósitos en las manzanas 1 a 4, a escala real.</p>
</sc-if>

<sc-if value="{{ showUi }}" hint-placeholder-val="{{ false }}">
<div id="hz-capas" class="hz-layers hz-fx {{ layersCls }}" role="group" aria-label="Capas del recorrido">
<div class="hz-layers-head"><strong>Qué querés ver</strong><button type="button" class="hz-x" aria-label="Cerrar capas" onClick="{{ closeLayers }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<button type="button" class="hz-layer" aria-label="Mostrar u ocultar marcadores" aria-pressed="{{ signsPressed }}" onClick="{{ toggleSigns }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 10c0 5-6 10-6 10S6 15 6 10a6 6 0 1 1 12 0z"></path><circle cx="12" cy="10" r="2"></circle></svg><span class="hz-layer-copy"><b>Marcadores</b><small><span class="hz-on">Visibles</span><span class="hz-off-copy">Ocultos</span></small></span><i class="hz-switch" aria-hidden="true"></i></button>
<button type="button" class="hz-layer" aria-label="Mostrar u ocultar accesos" aria-pressed="{{ accPressed }}" onClick="{{ toggleAcc }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20l3-16m6 0 3 16M12 6v3m0 4v3m0 3v1"></path></svg><span class="hz-layer-copy"><b>Accesos</b><small><span class="hz-on">Visibles</span><span class="hz-off-copy">Ocultos</span></small></span><i class="hz-switch" aria-hidden="true"></i></button>
<button type="button" class="hz-layer" aria-pressed="{{ zonePressed }}" aria-label="{{ zoneLbl }}" onClick="{{ toggleZone }}" disabled="{{ zoneBusy }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20V9l9-5 9 5v11H3zm4 0v-8h10v8M7 15h10M7 18h10"></path></svg><span class="hz-layer-copy"><b>Zona productiva</b><small><span class="hz-on">Visible</span><span class="hz-off-copy">Oculta</span></small></span><i class="hz-switch" aria-hidden="true"></i></button>
<button type="button" class="hz-layer hz-landscape" aria-label="Ver solo el paisaje, sin información" onClick="{{ goClean }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V3h5m8 0h5v5m0 8v5h-5M8 21H3v-5"></path></svg><span class="hz-layer-copy"><b>Solo paisaje</b><small>Ocultar interfaz</small></span></button>
</div>
<button type="button" class="hz-return {{ contextCls }}" onClick="{{ returnToTour }}">↙ Volver al loteo</button>
<nav class="hz-player" aria-label="Recorrido aéreo">
<button type="button" class="hz-play" aria-label="{{ playLbl }}" title="{{ playLbl }}" onClick="{{ togglePlay }}">
<sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg></sc-if>
<sc-if value="{{ iconPlay }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="hz-fill" d="M8 5l11 7-11 7z"></path></svg></sc-if>
<sc-if value="{{ iconBack }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"></path></svg></sc-if>
</button>
<div class="hz-plabel"><strong>Recorrido</strong><span>{{ viewTxt }}</span></div>
<div class="hz-timeline" role="group" aria-label="Vistas del recorrido">
<span class="hz-rail" aria-hidden="true"><i ref="{{ setRail }}"></i></span>
<sc-for list="{{ chips }}" as="chip" hint-placeholder-count="5">
<button type="button" class="hz-chip" aria-label="{{ chip.label }}" aria-current="{{ chip.current }}" onClick="{{ chip.go }}">{{ chip.n }}</button>
</sc-for>
</div>
<button type="button" class="hz-speed" aria-label="{{ speedLbl }}" title="{{ speedLbl }}" onClick="{{ cycleSpeed }}"><span>{{ speedTxt }}</span><small>Velocidad</small></button>
<button type="button" class="hz-layer-toggle" aria-label="Elegir capas del recorrido" aria-controls="hz-capas" aria-expanded="{{ layersOpen }}" onClick="{{ toggleLayers }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-5 9 5-9 5-9-5zm0 5l9 5 9-5M3 18l9 5 9-5"></path></svg>Capas</button>
</nav>
<sc-if value="{{ showHelp }}" hint-placeholder-val="{{ false }}">
<aside class="hz-help" aria-label="Cómo explorar"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M7 9l-3 3 3 3m10-6 3 3-3 3"></path></svg>Arrastrá para explorar</span><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-6 1-3 6-3-16z"></path></svg>Seleccioná un lote</span><button type="button" class="hz-x" aria-label="Cerrar ayuda" onClick="{{ dismissHelp }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></aside>
</sc-if>
</sc-if>

<div class="hz-status hz-fx {{ statusCls }}" role="status" aria-live="polite">{{ statusTxt }}</div>

<sc-if value="{{ hasTip }}" hint-placeholder-val="{{ false }}">
<div class="hz-tip" style="left: {{ tip.x }}px; top: {{ tip.y }}px;"><b>{{ tip.t1 }}</b><span style="color: {{ tip.col }};">{{ tip.t2 }}</span></div>
</sc-if>

<sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
<div class="hz-loading"><span>{{ loadTxt }}</span></div>
</sc-if>

<button type="button" class="hz-show" onClick="{{ exitClean }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>Mostrar información</button>

<sc-if value="{{ panelOpen }}" hint-placeholder-val="{{ false }}">
<div class="f-panel" style="background: rgba(5,31,32,.92); border: 1px solid rgba(218,241,222,.28); border-radius: 2px; padding: 16px; display: flex; flex-direction: column; gap: 12px; color: #eaf5ec;">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
<span style="font-size: 16px; font-weight: 600;">Calzar plano · {{ sceneName }}</span>
<span style="font-size: 12px; color: #8eb69b;">{{ pairsTxt }}</span>
</div>
<span style="font-size: 13px; line-height: 1.45; color: #eaf5ec; background: rgba(142,182,155,.16); padding: 8px 10px; border-radius: 2px;">{{ hintTxt }}</span>
<canvas data-f="mm" ref="{{ setMm }}" role="img" aria-label="Plano chico de las 11 manzanas. Toque una esquina para elegirla." onClick="{{ onMmClick }}" style="width: 100%; height: 250px; display: block; background: #0b2b26; border: 1px solid rgba(218,241,222,.2); border-radius: 2px; cursor: crosshair;"></canvas>
<div style="display: flex; gap: 8px; flex-wrap: wrap;">
<button type="button" class="f-btn" onClick="{{ undoPair }}" disabled="{{ noPairs }}">Deshacer</button>
<button type="button" class="f-btn" onClick="{{ clearPairs }}" disabled="{{ noPairs }}">Borrar puntos</button>
<button type="button" class="f-btn f-primary" onClick="{{ saveCal }}" style="flex-grow: 1;">Listo este punto</button>
</div>
<button type="button" class="f-btn" onClick="{{ copyAll }}" style="width: 100%;">Copiar los ajustes para fijarlos</button>
<button type="button" class="f-btn" onClick="{{ aimZone }}" style="width: 100%;">Encuadre para render (sin interfaz)</button>
<span style="font-size: 12px; color: rgba(234,245,236,.75);">{{ saveTxt }}</span>
<details>
<summary>Ajuste fino a mano</summary>
<div style="display: flex; flex-direction: column; gap: 10px; padding-top: 8px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; justify-content: space-between; font-size: 13px;"><label for="f-heading">Rumbo</label><span>{{ txt.heading }}</span></div>
<input id="f-heading" class="f-range" type="range" min="0" max="360" step="0.1" value="{{ cal.heading }}" onChange="{{ onHeading }}">
</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; justify-content: space-between; font-size: 13px;"><label for="f-agl">Altura sobre el suelo</label><span>{{ txt.agl }}</span></div>
<input id="f-agl" class="f-range" type="range" min="40" max="450" step="1" value="{{ cal.agl }}" onChange="{{ onAgl }}">
</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; justify-content: space-between; font-size: 13px;"><label for="f-dx">Correr oeste ↔ este</label><span>{{ txt.dx }}</span></div>
<input id="f-dx" class="f-range" type="range" min="-80" max="80" step="0.5" value="{{ cal.dx }}" onChange="{{ onDx }}">
</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; justify-content: space-between; font-size: 13px;"><label for="f-dy">Correr sur ↔ norte</label><span>{{ txt.dy }}</span></div>
<input id="f-dy" class="f-range" type="range" min="-80" max="80" step="0.5" value="{{ cal.dy }}" onChange="{{ onDy }}">
</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; justify-content: space-between; font-size: 13px;"><label for="f-tilt">Inclinación adelante ↔ atrás</label><span>{{ txt.tilt }}</span></div>
<input id="f-tilt" class="f-range" type="range" min="-8" max="8" step="0.05" value="{{ cal.tilt }}" onChange="{{ onTilt }}">
</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; justify-content: space-between; font-size: 13px;"><label for="f-roll">Inclinación izquierda ↔ derecha</label><span>{{ txt.roll }}</span></div>
<input id="f-roll" class="f-range" type="range" min="-8" max="8" step="0.05" value="{{ cal.roll }}" onChange="{{ onRoll }}">
</div>
<button type="button" class="f-btn" onClick="{{ resetCal }}">Volver al ajuste fijado</button>
</div>
</details>
<sc-if value="{{ showJson }}" hint-placeholder-val="{{ false }}">
<label for="f-json" style="font-size: 12px; color: rgba(234,245,236,.75);">Seleccione todo este texto, cópielo y péguelo en el chat:</label>
<textarea id="f-json" readOnly="{{ yes }}" value="{{ jsonTxt }}" onFocus="{{ selectAll }}" style="width: 100%; height: 90px; background: #0b2b26; color: #eaf5ec; border: 1px solid rgba(218,241,222,.25); border-radius: 2px; font: 11px/1.4 ui-monospace, Menlo, monospace; padding: 8px;"></textarea>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ hasLocal }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 20px; top: 84px; max-width: 420px; background: rgba(5,31,32,.9); border: 2px solid #ffb74d; border-radius: 2px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; pointer-events: auto; z-index: 14; font-family: system-ui, sans-serif;">
<span style="font-size: 14px; font-weight: 600; color: #ffb74d;">Ajustes guardados solo en esta computadora</span>
<span style="font-size: 12px; color: rgba(234,245,236,.85);">Mándele una captura de este recuadro a Claude para fijarlos para todos.</span>
<sc-for list="{{ localRows }}" as="row" hint-placeholder-count="5">
<span style="font: 12px/1.5 ui-monospace, Menlo, monospace; color: #eaf5ec;">{{ row.txt }}</span>
</sc-for>
</div>
</sc-if>
</div>
</template>
<script type="module" src="/js/recorrido-aereo.mjs?v=20261117-cierre-venta1"></script>
<script type="module">import {connectAlamosCards} from '/js/recorrido-alamos-fichas.mjs?v=20261117-cierre-venta1';connectAlamosCards();</script>
</body>
</html>
