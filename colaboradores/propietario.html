<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Propietario — Sur Patagonian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="manifest" href="/colaboradores/manifest.json" />
  <meta name="theme-color" content="#090909" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sur Patagonian" />
  <link rel="apple-touch-icon" href="/assets/app-icon-180.png" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/colaboradores/sw.js', { scope: '/colaboradores/' })
      })
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#090909;
      --card:#141414;
      --border:rgba(255,255,255,.07);
      --accent:#d76f3f;
      --dorado:#c9a84c;
      --verde:#50c878;
      --rojo:#e05c5c;
      --gris:#888;
      --blanco:#f5f3f0;
    }
    body {
      min-height:100vh;
      background:var(--bg);
      color:var(--blanco);
      font-family:'Inter',system-ui,sans-serif;
    }
    button { font:inherit; }
    .header {
      position:sticky;
      top:0;
      z-index:100;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
      padding:1rem 1.6rem;
      background:rgba(9,9,9,.96);
      border-bottom:1px solid var(--border);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }
    .owner-brand-img { display:block; width:190px; max-width:42vw; height:auto; }
    .hdr-r { display:flex; align-items:center; gap:.8rem; }
    .badge-dev {
      padding:.22rem .65rem;
      border:1px solid rgba(255,255,255,.12);
      border-radius:999px;
      background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.55);
      font-size:.55rem;
      font-weight:700;
      letter-spacing:.1em;
      text-transform:uppercase;
    }
    .btn-salir {
      min-height:44px;
      padding:.32rem .75rem;
      border:1px solid var(--border);
      border-radius:7px;
      background:none;
      color:var(--gris);
      cursor:pointer;
      font-size:.7rem;
    }
    .btn-salir:hover, .btn-salir:focus-visible { border-color:var(--rojo); color:var(--rojo); }
    .main { position:relative; z-index:10; max-width:1180px; margin:0 auto; padding:2rem 1.8rem 4rem; }
    .hero { margin-bottom:1.8rem; }
    .hero h1 {
      margin-bottom:.35rem;
      font-family:'Cormorant Garamond',serif;
      font-size:2.6rem;
      font-weight:300;
      letter-spacing:.07em;
      line-height:1.1;
      text-transform:uppercase;
    }
    .hero-sub {
      color:var(--gris);
      font-size:.67rem;
      letter-spacing:.1em;
      line-height:1.6;
      text-transform:uppercase;
    }
    .periodo-bar { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:1rem; }
    .btn-p {
      min-height:44px;
      padding:.48rem .88rem;
      border:1px solid rgba(255,255,255,.09);
      border-radius:8px;
      background:rgba(255,255,255,.05);
      color:rgba(255,255,255,.5);
      cursor:pointer;
      font-size:.63rem;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .btn-p:hover, .btn-p:focus-visible { border-color:rgba(201,168,76,.35); color:var(--dorado); }
    .btn-p.activo { border-color:rgba(201,168,76,.42); background:rgba(201,168,76,.14); color:#e8c96a; }
    .card, .sec-blk {
      margin-bottom:1.2rem;
      padding:1.4rem;
      border:1px solid rgba(255,255,255,.07);
      border-top-color:rgba(255,255,255,.12);
      border-radius:14px;
      background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
      backdrop-filter:blur(4px);
    }
    .sec { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem; }
    .sec-t { color:var(--dorado); font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    .sec-b {
      display:inline-block;
      padding:.18rem .6rem;
      border:1px solid rgba(255,255,255,.09);
      border-radius:999px;
      color:rgba(255,255,255,.46);
      font-size:.58rem;
      font-weight:600;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .sec-b[data-estado="nueva"] { border-color:rgba(201,168,76,.42); color:var(--dorado); }
    .sec-b[data-estado="activa"] { border-color:rgba(80,200,120,.38); color:var(--verde); }
    .sec-b[data-estado="moderada"] { border-color:rgba(215,111,63,.42); color:var(--accent); }
    .sec-b[data-estado="sin_movimiento_reciente"] { border-color:rgba(136,136,136,.3); color:var(--gris); }
    .canal-tbl { width:100%; border-collapse:collapse; }
    .canal-tbl th {
      padding:.5rem .65rem .7rem;
      border-bottom:1px solid rgba(255,255,255,.06);
      color:rgba(255,255,255,.3);
      font-size:.58rem;
      font-weight:600;
      letter-spacing:.08em;
      text-align:left;
      text-transform:uppercase;
    }
    .canal-tbl td {
      padding:.8rem .65rem;
      border-bottom:1px solid rgba(255,255,255,.04);
      color:rgba(255,255,255,.78);
      font-size:.76rem;
      vertical-align:middle;
    }
    .canal-tbl tr:last-child td { border-bottom:0; }
    .canal-tbl tbody tr:hover td { background:rgba(255,255,255,.02); }
    .canal-tbl .r { text-align:right; }
    .canal-tbl strong { display:block; color:var(--blanco); font-weight:600; }
    .canal-tbl small { display:block; margin-top:.15rem; color:var(--gris); font-size:.67rem; line-height:1.45; }
    .canal-tbl td.owner-network-inmobiliarias { color:var(--dorado); }
    .canal-tbl td.owner-network-puntos { color:#b88fd6; }
    .owner-funnel-table tbody tr:nth-child(1) td:last-child { color:#b39ddb; }
    .owner-funnel-table tbody tr:nth-child(2) td:last-child { color:#35c6b4; }
    .owner-funnel-table tbody tr:nth-child(3) td:last-child { color:#f29a5a; }
    .owner-funnel-table tbody tr:nth-child(4) td:last-child { color:#d9a7ff; }
    .owner-property-row { min-height:44px; cursor:pointer; }
    .owner-property-row:focus-visible { outline:2px solid var(--dorado); outline-offset:-2px; }
    .owner-property-thumb { display:block; width:64px; height:48px; object-fit:cover; }
    .owner-detail-grid { display:grid; grid-template-columns:minmax(180px,280px) 1fr; gap:1.3rem; align-items:center; }
    #detailHero .owner-property-thumb { width:100%; height:190px; }
    #detailTitle { margin:.2rem 0 .45rem; font-family:'Inter',system-ui,sans-serif; font-size:1.55rem; font-weight:500; line-height:1.25; }
    #detailMeta { color:var(--gris); font-size:.75rem; line-height:1.7; }
    .owner-chip-row { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.85rem; }
    .owner-back { margin-bottom:1rem; }
    .owner-hidden { display:none !important; }
    .owner-map-shell {
      position:relative;
      overflow:hidden;
      width:100%;
      height:400px;
      margin-bottom:1.8rem;
      border:1px solid rgba(255,255,255,.07);
      border-top-color:rgba(255,255,255,.12);
      border-radius:14px;
      background:#0b0b0d;
    }
    .owner-map { width:100%; height:100%; background:#0b0b0d; }
    .owner-map .leaflet-control-zoom a { background:rgba(12,12,14,.94); color:var(--dorado); border-color:var(--border); }
    .owner-map .leaflet-control-zoom a:hover,
    .owner-map .leaflet-control-zoom a:focus { background:var(--card); color:#e8c96a; }
    .owner-map .leaflet-control-attribution { background:rgba(8,8,8,.72); color:var(--gris); }
    .owner-map .leaflet-control-attribution a { color:var(--gris); }
    .owner-map .leaflet-tile-pane { filter:invert(1) grayscale(1) contrast(.85) brightness(1.5); }
    .owner-map .leaflet-popup-content-wrapper {
      overflow:hidden;
      padding:0;
      border:1px solid rgba(201,168,76,.22);
      border-radius:8px;
      background:var(--blanco);
      box-shadow:0 8px 26px rgba(0,0,0,.42);
    }
    .owner-map .leaflet-popup-tip { background:var(--blanco); }
    .owner-map .leaflet-popup-content { width:220px; max-width:calc(100vw - 72px); margin:0; }
    .owner-map .leaflet-popup-close-button {
      z-index:2;
      top:5px;
      right:5px;
      width:24px;
      height:24px;
      border-radius:50%;
      background:rgba(245,243,240,.92);
      color:#6a6560;
      line-height:22px;
    }
    .owner-map-popup { overflow:hidden; color:#1a1714; font-family:'Inter',system-ui,sans-serif; }
    .owner-map-popup-img { display:block; width:100%; height:126px; object-fit:cover; background:#f0eeeb; }
    .owner-map-popup-img-ph { display:flex; align-items:center; justify-content:center; width:100%; height:126px; background:#f0eeeb; color:#6a6560; font-size:1.8rem; }
    .owner-map-popup-body { padding:.8rem .9rem .9rem; }
    .owner-map-popup-title { margin-bottom:.3rem; color:#1a1714; font-size:.82rem; font-weight:600; line-height:1.3; }
    .owner-map-popup-loc { margin-bottom:.75rem; color:#6a6560; font-size:.7rem; line-height:1.4; }
    .owner-map-popup-btn {
      display:block;
      width:100%;
      padding:.58rem;
      border:0;
      background:#1a1714;
      color:#fff !important;
      font-size:.62rem;
      font-weight:700;
      letter-spacing:.12em;
      text-align:center;
      text-decoration:none !important;
      text-transform:uppercase;
      transition:background .2s;
    }
    .owner-map-popup-btn:hover, .owner-map-popup-btn:focus-visible { background:var(--dorado); }
    .kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:.9rem; margin-bottom:1.2rem; }
    .kpi {
      position:relative;
      overflow:hidden;
      padding:1.35rem 1.45rem;
      border:1px solid rgba(255,255,255,.08);
      border-top-color:rgba(255,255,255,.14);
      border-radius:14px;
      background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    }
    .kpi::before {
      content:'';
      position:absolute;
      top:20%;
      bottom:20%;
      left:0;
      width:2px;
      border-radius:99px;
      background:var(--c,var(--accent));
    }
    .kpi-lbl { margin-bottom:.55rem; color:rgba(255,255,255,.42); font-size:.58rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; }
    .kpi-n {
      margin-bottom:.35rem;
      background:linear-gradient(135deg,#fff,rgba(255,255,255,.7));
      color:var(--blanco);
      font-size:2.35rem;
      font-weight:300;
      line-height:1;
      background-clip:text;
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .kpi-m { color:var(--gris); font-size:.65rem; line-height:1.45; }
    .empty-msg { padding:2rem 1rem; color:rgba(255,255,255,.34); font-size:.75rem; line-height:1.6; text-align:center; }
    #legalNote { margin-top:1.4rem; padding-top:1rem; border-top:1px solid var(--border); color:var(--gris); font-size:.68rem; line-height:1.6; }
    .sp-bg-brand {
      position:fixed;
      right:0;
      bottom:6vh;
      left:0;
      z-index:1;
      height:65vh;
      background:url('../assets/ChatGPT Image 19 jun 2026, 23_34_52.png') center 52% / cover no-repeat;
      filter:grayscale(1) brightness(.75);
      opacity:.11;
      pointer-events:none;
      -webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 12%,black 82%,transparent 100%);
      mask-image:linear-gradient(to bottom,transparent 0%,black 12%,black 82%,transparent 100%);
    }
    @media(max-width:760px) {
      .kpi-row { grid-template-columns:repeat(2,1fr); }
      .owner-detail-grid { grid-template-columns:1fr; }
      #detailHero .owner-property-thumb { height:220px; }
      .owner-map-shell { height:320px; }
    }
    @media(max-width:520px) {
      .header { padding:.8rem 1rem; }
      .badge-dev { display:none; }
      .main { padding:1.5rem 1rem 3rem; }
      .hero h1 { font-size:1.85rem; }
      .card, .sec-blk { padding:1rem; }
      .kpi { padding:1.1rem; }
      .kpi-n { font-size:1.8rem; }
      .canal-tbl thead { display:none; }
      .canal-tbl, .canal-tbl tbody, .canal-tbl tr, .canal-tbl td { display:block; width:100%; }
      .canal-tbl tr { padding:.85rem 0; border-bottom:1px solid rgba(255,255,255,.06); }
      .canal-tbl tr:last-child { border-bottom:0; }
      .canal-tbl td { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.3rem .15rem; border:0; text-align:right; }
      .canal-tbl td::before { content:attr(data-label); color:var(--gris); font-size:.58rem; letter-spacing:.07em; text-align:left; text-transform:uppercase; }
      .canal-tbl td:first-child { justify-content:flex-start; text-align:left; }
      .canal-tbl td:first-child::before { display:none; }
      .canal-tbl .r { text-align:right; }
      .owner-property-thumb { width:72px; height:54px; }
      .owner-property-row { min-height:44px; }
      .owner-map-shell { height:260px; margin-bottom:1.5rem; }
    }
  </style>
</head>
<body>
<div class="sp-bg-brand"></div>

<header class="header">
  <img class="owner-brand-img" src="../assets/logos/logo-horizontal-blanco.png" alt="Sur Patagonian" />
  <div class="hdr-r">
    <span class="badge-dev">Propietario</span>
    <button class="btn-salir" id="btnSalir" type="button">Salir</button>
  </div>
</header>

<main class="main">
  <div id="view" aria-live="polite">
    <div class="empty-msg">Verificando acceso…</div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const supabase = createClient(
    'https://wajkfydxutptcvvfwrvq.supabase.co',
    'sb_publishable_RKpmv1VDwMOB25phyfFrog_OdI-wB8s',
    { auth: { storageKey: 'sp-colab-session' } }
  )

  const view = document.getElementById('view')
  let cartera = []
  let detalle = null
  let periodo = '30'
  let ownerMap = null

  const esc = value => String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')

  const numero = value => new Intl.NumberFormat('es-AR').format(Number(value) || 0)

  function fecha(value) {
    if (!value) return 'Sin actividad registrada'
    const date = new Date(`${value}T12:00:00`)
    if (Number.isNaN(date.getTime())) return 'Sin fecha'
    return new Intl.DateTimeFormat('es-AR', {
      day: '2-digit',
      month: 'short',
      year: 'numeric',
    }).format(date)
  }

  function precio(data) {
    if (data.precio == null) return 'Precio a consultar'
    const monto = new Intl.NumberFormat('es-AR', {
      maximumFractionDigits: 0,
    }).format(Number(data.precio) || 0)
    return `${esc(data.moneda || '')} ${monto}`.trim()
  }

  function urlImagen(value) {
    if (!value) return ''
    try {
      const url = new URL(value, location.origin)
      return ['http:', 'https:'].includes(url.protocol) ? url.href : ''
    } catch (_) {
      return ''
    }
  }

  function imagen(value, alt) {
    const src = urlImagen(value)
    return src
      ? `<img class="owner-property-thumb" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()" />`
      : ''
  }

  function estadoLabel(value) {
    return {
      nueva: 'Nueva / en preparación',
      activa: 'Activa',
      moderada: 'Moderada',
      sin_movimiento_reciente: 'Sin movimiento reciente',
    }[value] || 'Sin movimiento reciente'
  }

  function jsonArray(value) {
    if (Array.isArray(value)) return value
    if (!value) return []
    try {
      const parsed = JSON.parse(value)
      return Array.isArray(parsed) ? parsed : []
    } catch (_) {
      return []
    }
  }

  function destroyOwnerMap() {
    if (!ownerMap) return
    ownerMap.off()
    ownerMap.remove()
    ownerMap = null
  }

  function coordenadaPropiedad(propiedad) {
    if (!propiedad || propiedad.latitud == null || propiedad.latitud === '' ||
        propiedad.longitud == null || propiedad.longitud === '') return null
    const latitud = Number(propiedad.latitud)
    const longitud = Number(propiedad.longitud)
    if (!Number.isFinite(latitud) || !Number.isFinite(longitud) ||
        latitud < -90 || latitud > 90 || longitud < -180 || longitud > 180) return null
    return { propiedad, latitud, longitud }
  }

  function propiedadesConCoordenadas(propiedades) {
    return (Array.isArray(propiedades) ? propiedades : [])
      .map(coordenadaPropiedad)
      .filter(Boolean)
  }

  function crearPopupPropiedad(propiedad) {
    const titulo = String(propiedad.titulo || 'Propiedad')
    const popup = document.createElement('div')
    popup.className = 'owner-map-popup'

    const foto = urlImagen(propiedad.foto_url)
    if (foto) {
      const imagenPopup = document.createElement('img')
      imagenPopup.className = 'owner-map-popup-img'
      imagenPopup.src = foto
      imagenPopup.alt = titulo
      imagenPopup.loading = 'lazy'
      imagenPopup.addEventListener('error', () => {
        const placeholder = document.createElement('div')
        placeholder.className = 'owner-map-popup-img-ph'
        placeholder.setAttribute('aria-hidden', 'true')
        placeholder.textContent = '⌂'
        imagenPopup.replaceWith(placeholder)
      }, { once: true })
      popup.appendChild(imagenPopup)
    } else {
      const placeholder = document.createElement('div')
      placeholder.className = 'owner-map-popup-img-ph'
      placeholder.setAttribute('aria-hidden', 'true')
      placeholder.textContent = '⌂'
      popup.appendChild(placeholder)
    }

    const cuerpo = document.createElement('div')
    cuerpo.className = 'owner-map-popup-body'

    const tituloPopup = document.createElement('div')
    tituloPopup.className = 'owner-map-popup-title'
    tituloPopup.textContent = titulo
    cuerpo.appendChild(tituloPopup)

    const ubicacionPopup = document.createElement('div')
    ubicacionPopup.className = 'owner-map-popup-loc'
    ubicacionPopup.textContent = `📍 ${[propiedad.ubicacion, propiedad.ciudad].filter(Boolean).join(' · ') || 'Ubicación no informada'}`
    cuerpo.appendChild(ubicacionPopup)

    const enlace = document.createElement('a')
    enlace.className = 'owner-map-popup-btn'
    enlace.href = `/propiedad.html?id=${encodeURIComponent(String(propiedad.propiedad_id || ''))}`
    enlace.target = '_blank'
    enlace.rel = 'noopener noreferrer'
    enlace.textContent = 'Ver propiedad →'
    cuerpo.appendChild(enlace)

    popup.appendChild(cuerpo)
    return popup
  }

  function mapaMarkup(propiedades, etiqueta) {
    if (!window.L || !propiedadesConCoordenadas(propiedades).length) return ''
    return `
      <div class="owner-map-shell" id="ownerMapShell">
        <div class="owner-map" id="ownerMap" role="region" aria-label="${esc(etiqueta)}"></div>
      </div>`
  }

  function renderOwnerMap(propiedades, vista) {
    const puntos = propiedadesConCoordenadas(propiedades)
    const shell = document.getElementById('ownerMapShell')
    const container = document.getElementById('ownerMap')
    const leaflet = window.L

    if (!puntos.length || !shell || !container || !leaflet) {
      shell?.remove()
      return
    }

    const mapa = leaflet.map(container, {
      zoomControl: true,
      scrollWheelZoom: false,
    })
    ownerMap = mapa

    leaflet.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19,
    }).addTo(mapa)

    const icono = leaflet.divIcon({
      html: `<div style="display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 3px 8px rgba(0,0,0,0.4));">
        <div style="width:44px;height:44px;border-radius:50%;background:#1a1714;border:2px solid #c9a84c;display:flex;align-items:center;justify-content:center;">
          <img src="https://surpatagonian.com/assets/pn.png" style="width:28px;height:auto;display:block;filter:invert(1);" />
        </div>
        <div style="width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:13px solid #1a1714;margin-top:-1px;"></div>
      </div>`,
      className: '',
      iconSize: [44, 57],
      iconAnchor: [22, 57],
      popupAnchor: [0, -60],
    })

    puntos.forEach(({ propiedad, latitud, longitud }) => {
      const titulo = String(propiedad.titulo || 'Propiedad')
      leaflet.marker([latitud, longitud], {
        icon: icono,
        title: titulo,
        alt: titulo,
      }).bindPopup(crearPopupPropiedad(propiedad), {
        maxWidth: 240,
        minWidth: 200,
        autoPanPadding: [24, 24],
      }).addTo(mapa)
    })

    if (vista === 'cartera' && puntos.length > 1) {
      mapa.fitBounds(
        leaflet.latLngBounds(puntos.map(({ latitud, longitud }) => [latitud, longitud])),
        { padding: [40, 40], maxZoom: 13 }
      )
    } else {
      mapa.setView([puntos[0].latitud, puntos[0].longitud], 13)
    }

    window.requestAnimationFrame(() => {
      if (ownerMap === mapa) mapa.invalidateSize()
    })
  }

  function renderError(mensaje, accion) {
    destroyOwnerMap()
    view.innerHTML = `
      <div class="hero">
        <h1>No pudimos cargar el panel</h1>
        <div class="hero-sub">${esc(mensaje)}</div>
      </div>
      <div class="card">
        <div class="empty-msg">
          Intentá nuevamente. Si el problema continúa, contactá a Sur Patagonian.<br />
          <button class="btn-p" type="button" data-action="${esc(accion)}">Reintentar</button>
        </div>
      </div>`
  }

  function renderCartera() {
    destroyOwnerMap()
    detalle = null
    history.replaceState({}, '', 'propietario.html')

    if (!cartera.length) {
      view.innerHTML = `
        <div class="hero">
          <h1>Mis propiedades</h1>
          <div class="hero-sub">Visibilidad sobre la actividad registrada de tu propiedad.</div>
        </div>
        <div class="card">
          <div class="empty-msg">Todavía no tenés propiedades asignadas. Contactá a Sur Patagonian.</div>
        </div>`
      return
    }

    view.innerHTML = `
      <div class="hero">
        <h1>Mis propiedades</h1>
        <div class="hero-sub">Visibilidad sobre la actividad registrada de tu propiedad. · Actualizado ${esc(fecha(new Date().toISOString().slice(0, 10)))}</div>
      </div>
      <div class="card">
        <div class="sec">
          <div class="sec-t">Cartera asignada</div>
          <div class="sec-b">${numero(cartera.length)} ${cartera.length === 1 ? 'propiedad' : 'propiedades'}</div>
        </div>
        <table class="canal-tbl">
          <thead>
            <tr>
              <th>Propiedad</th>
              <th>Incorporación</th>
              <th class="r">Actores / ciudades</th>
              <th class="r">Vistas 30 días</th>
              <th class="r">Consultas 30 días</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            ${cartera.map(p => `
              <tr class="owner-property-row" role="button" tabindex="0" data-property-id="${esc(p.propiedad_id)}" aria-label="Ver ${esc(p.titulo)}">
                <td>
                  <div class="owner-chip-row">
                    ${imagen(p.foto_url, p.titulo)}
                    <span><strong>${esc(p.titulo)}</strong><small>${esc([p.ubicacion, p.ciudad].filter(Boolean).join(' · ') || 'Ubicación no informada')}</small></span>
                  </div>
                </td>
                <td data-label="Incorporación">${esc(fecha(p.fecha_incorporacion))}</td>
                <td class="r" data-label="Actores / ciudades">${numero(p.actores_total)} / ${numero(p.ciudades_total)}</td>
                <td class="r" data-label="Vistas 30 días">${numero(p.vistas_30d)}</td>
                <td class="r" data-label="Consultas 30 días">${numero(p.consultas_30d)}</td>
                <td data-label="Estado"><span class="sec-b" data-estado="${esc(p.estado)}">${esc(estadoLabel(p.estado))}</span></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${mapaMarkup(cartera, 'Ubicación de mis propiedades')}`
    renderOwnerMap(cartera, 'cartera')
  }

  function renderDetalle() {
    destroyOwnerMap()
    if (!detalle) return
    const desdePublicacion = periodo === 'all'
    const sufijo = desdePublicacion ? 'desde_publicacion' : '30d'
    const periodoTexto = desdePublicacion ? 'Desde publicación' : 'Últimos 30 días'
    const actividad = jsonArray(detalle[
      desdePublicacion
        ? 'consultas_por_fecha_desde_publicacion'
        : 'consultas_por_fecha_30d'
    ])
    const ciudades = jsonArray(detalle.actores_por_ciudad)
    const volverOculto = cartera.length <= 1 ? ' owner-hidden' : ''

    const etapas = [
      ['Recibidas', detalle[`recibidas_${sufijo}`]],
      ['Contactadas', detalle[`contactadas_${sufijo}`]],
      ['Visitas', detalle[`visitas_etapa_${sufijo}`]],
      ['Ofertas', detalle[`ofertas_${sufijo}`]],
    ]

    view.innerHTML = `
      <button class="btn-p owner-back${volverOculto}" type="button" data-action="cartera">← Volver a mis propiedades</button>
      <div class="hero">
        <h1>Actividad de la propiedad</h1>
        <div class="hero-sub">Visibilidad sobre la actividad registrada de tu propiedad.</div>
        <div class="periodo-bar" role="group" aria-label="Período de métricas">
          <button class="btn-p ${periodo === '30' ? 'activo' : ''}" type="button" data-periodo="30">30 días</button>
          <button class="btn-p ${periodo === 'all' ? 'activo' : ''}" type="button" data-periodo="all">Desde publicación</button>
        </div>
      </div>

      <div class="card owner-detail-grid" id="detailHero">
        <div>${imagen(detalle.foto_url, detalle.titulo)}</div>
        <div>
          <div class="sec-t">Propiedad asignada</div>
          <h2 id="detailTitle">${esc(detalle.titulo)}</h2>
          <div id="detailMeta">
            ${esc([detalle.ubicacion, detalle.ciudad, detalle.provincia].filter(Boolean).join(' · ') || 'Ubicación no informada')}<br />
            ${esc(precio(detalle))}
            ${detalle.superficie_total != null ? ` · ${numero(detalle.superficie_total)} m²` : ''}
            ${detalle.dormitorios != null ? ` · ${numero(detalle.dormitorios)} dormitorios` : ''}
          </div>
          <div class="owner-chip-row">
            <span class="sec-b" data-estado="${esc(detalle.estado)}">${esc(estadoLabel(detalle.estado))}</span>
            <span class="sec-b">Incorporada ${esc(fecha(detalle.fecha_incorporacion))}</span>
          </div>
        </div>
      </div>

      <div class="kpi-row">
        <div class="kpi" style="--c:#b88fd6">
          <div class="kpi-lbl">Vistas</div>
          <div class="kpi-n">${numero(detalle[`vistas_${sufijo}`])}</div>
          <div class="kpi-m">${esc(periodoTexto)}</div>
        </div>
        <div class="kpi" style="--c:var(--accent)">
          <div class="kpi-lbl">Consultas</div>
          <div class="kpi-n">${numero(detalle[`consultas_${sufijo}`])}</div>
          <div class="kpi-m">${esc(periodoTexto)}</div>
        </div>
        <div class="kpi" style="--c:var(--dorado)">
          <div class="kpi-lbl">Actores activos</div>
          <div class="kpi-n">${numero(detalle.actores_total)}</div>
          <div class="kpi-m">${numero(detalle.inmobiliarias_total)} inmobiliarias · ${numero(detalle.puntos_venta_total)} puntos</div>
        </div>
        <div class="kpi" style="--c:#3bbf88">
          <div class="kpi-lbl">Ciudades</div>
          <div class="kpi-n">${numero(detalle.ciudades_total)}</div>
          <div class="kpi-m">Última actividad: ${esc(fecha(detalle.ultima_actividad_fecha))}</div>
        </div>
      </div>

      ${mapaMarkup([detalle], `Ubicación de ${detalle.titulo || 'la propiedad'}`)}

      <div class="card">
        <div class="sec">
          <div class="sec-t">Red agregada por ciudad</div>
          <div class="sec-b">${numero(detalle.actores_total)} actores</div>
        </div>
        ${ciudades.length ? `
          <table class="canal-tbl owner-network-table">
            <thead><tr><th>Ciudad</th><th class="r">Total</th><th class="r">Inmobiliarias</th><th class="r">Puntos de exhibición</th></tr></thead>
            <tbody>${ciudades.map(item => `
              <tr>
                <td><strong>${esc(item.ciudad || 'Sin ciudad')}</strong></td>
                <td class="r" data-label="Total">${numero(item.total)}</td>
                <td class="r owner-network-inmobiliarias" data-label="Inmobiliarias">${numero(item.inmobiliarias)}</td>
                <td class="r owner-network-puntos" data-label="Puntos de exhibición">${numero(item.puntos_venta)}</td>
              </tr>`).join('')}</tbody>
          </table>`
          : '<div class="empty-msg">Todavía no hay actores activos asociados.</div>'}
      </div>

      <div class="card">
        <div class="sec">
          <div class="sec-t">Embudo agregado</div>
          <div class="sec-b">${esc(periodoTexto)}</div>
        </div>
        <table class="canal-tbl owner-funnel-table">
          <thead><tr><th>Etapa</th><th class="r">Cantidad</th></tr></thead>
          <tbody>${etapas.map(([label, value]) => `
            <tr><td><strong>${esc(label)}</strong></td><td class="r" data-label="Cantidad">${numero(value)}</td></tr>`
          ).join('')}</tbody>
        </table>
      </div>

      <div class="card">
        <div class="sec">
          <div class="sec-t">Actividad diaria agregada</div>
          <div class="sec-b">Hasta 10 fechas</div>
        </div>
        ${actividad.length ? `
          <table class="canal-tbl">
            <thead><tr><th>Fecha</th><th class="r">Recibidas</th><th class="r">Contactadas</th><th class="r">Visitas</th><th class="r">Ofertas</th></tr></thead>
            <tbody>${actividad.map(item => `
              <tr>
                <td><strong>${esc(fecha(item.fecha))}</strong></td>
                <td class="r" data-label="Recibidas">${numero(item.recibidas)}</td>
                <td class="r" data-label="Contactadas">${numero(item.contactadas)}</td>
                <td class="r" data-label="Visitas">${numero(item.visitas)}</td>
                <td class="r" data-label="Ofertas">${numero(item.ofertas)}</td>
              </tr>`).join('')}</tbody>
          </table>`
          : '<div class="empty-msg">No hay actividad de etapas para este período.</div>'}
      </div>

      <div class="sec-blk">
        <div class="sec">
          <div class="sec-t">Contenido disponible</div>
          <div class="sec-b">${numero(detalle.fotos_cantidad)} fotos</div>
        </div>
        <div class="owner-chip-row">
          <span class="sec-b">Fotos: ${numero(detalle.fotos_cantidad)}</span>
          <span class="sec-b">Video: ${detalle.tiene_video ? 'Sí' : 'No'}</span>
          <span class="sec-b">Tour 360: ${detalle.tiene_tour_360 ? 'Sí' : 'No'}</span>
          <span class="sec-b">QR activo: ${detalle.tiene_qr ? 'Sí' : 'No'}</span>
        </div>
        <p id="legalNote">Los indicadores reflejan la actividad registrada por la plataforma. Son informativos y no constituyen garantía de consultas, ofertas ni venta.</p>
      </div>`
    renderOwnerMap([detalle], 'detalle')
  }

  async function abrirDetalle(propiedadId) {
    destroyOwnerMap()
    view.innerHTML = '<div class="empty-msg">Cargando actividad de la propiedad…</div>'
    const { data, error } = await supabase.rpc(
      'rpc_propietario_propiedad',
      { p_propiedad_id: propiedadId }
    )
    if (error) {
      renderError(error.message, `detalle:${propiedadId}`)
      return
    }
    detalle = Array.isArray(data) ? data[0] : data
    if (!detalle) {
      renderError('La propiedad no está disponible o ya no está asignada a tu cuenta.', 'cartera')
      return
    }
    history.replaceState({}, '', `propietario.html?propiedad=${encodeURIComponent(propiedadId)}`)
    renderDetalle()
  }

  async function cargarCartera() {
    destroyOwnerMap()
    view.innerHTML = '<div class="empty-msg">Cargando propiedades asignadas…</div>'
    const { data, error } = await supabase.rpc('rpc_propietario_cartera')
    if (error) {
      renderError(error.message, 'cargar')
      return
    }
    cartera = Array.isArray(data) ? data : []
    const solicitada = new URLSearchParams(location.search).get('propiedad')
    const destino = solicitada && cartera.some(p => p.propiedad_id === solicitada)
      ? solicitada
      : cartera.length === 1
        ? cartera[0].propiedad_id
        : null
    if (destino) {
      await abrirDetalle(destino)
      return
    }
    renderCartera()
  }

  view.addEventListener('click', async event => {
    const row = event.target.closest('[data-property-id]')
    if (row) {
      await abrirDetalle(row.dataset.propertyId)
      return
    }
    const periodButton = event.target.closest('[data-periodo]')
    if (periodButton) {
      periodo = periodButton.dataset.periodo
      renderDetalle()
      return
    }
    const actionButton = event.target.closest('[data-action]')
    if (!actionButton) return
    const action = actionButton.dataset.action
    if (action === 'cartera') {
      renderCartera()
      return
    }
    if (action === 'cargar') await cargarCartera()
    if (action.startsWith('detalle:')) await abrirDetalle(action.slice(8))
  })

  view.addEventListener('keydown', async event => {
    if (!['Enter', ' '].includes(event.key)) return
    const row = event.target.closest('[data-property-id]')
    if (!row) return
    event.preventDefault()
    await abrirDetalle(row.dataset.propertyId)
  })

  document.getElementById('btnSalir').addEventListener('click', async () => {
    destroyOwnerMap()
    await supabase.auth.signOut()
    location.href = 'login.html'
  })

  window.addEventListener('pagehide', destroyOwnerMap)

  const { data: { session } } = await supabase.auth.getSession()
  if (!session) {
    location.replace('login.html')
  } else {
    const { data: { user }, error: userError } = await supabase.auth.getUser()
    const meta = user?.app_metadata || {}
    if (userError || !user || meta.rol !== 'colaborador') {
      await supabase.auth.signOut()
      location.replace('login.html')
    } else if (meta.tipo_acceso !== 'propietario') {
      const ruta = meta.tipo_acceso === 'desarrollador'
        ? 'desarrollador.html'
        : 'index.html'
      location.replace(ruta)
    } else {
      await cargarCartera()
    }
  }
</script>
</body>
</html>
