<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Colaboradores — Sur Patagonia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0e0c;
      --card: #161513;
      --border: rgba(255,255,255,0.07);
      --accent: #d76f3f;
      --dorado: #c9a84c;
      --gris: #888;
      --blanco: #f5f3f0;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--blanco);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
    }

    .logo {
      text-align: center;
      margin-bottom: 2.2rem;
    }
    .logo-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--blanco);
    }
    .logo-text span { color: var(--accent); }
    .logo-sub {
      font-size: .65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gris);
      margin-top: .35rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 2rem 1.8rem;
    }

    .card-titulo {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: .3rem;
    }
    .card-desc {
      font-size: .74rem;
      color: var(--gris);
      margin-bottom: 1.6rem;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 1rem; }
    .form-label {
      display: block;
      font-size: .62rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--gris);
      font-weight: 600;
      margin-bottom: .4rem;
    }
    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--blanco);
      padding: .7rem 1rem;
      border-radius: 10px;
      font-size: .85rem;
      font-family: inherit;
      transition: border-color .18s;
    }
    .form-input:focus { outline: none; border-color: var(--accent); }
    .form-input::placeholder { color: rgba(255,255,255,.25); }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: .8rem;
      border-radius: 10px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: .4rem;
      transition: opacity .18s;
    }
    .btn-login:hover { opacity: .88; }
    .btn-login:disabled { opacity: .5; cursor: not-allowed; }

    .error-msg {
      display: none;
      background: rgba(224,92,92,.1);
      border: 1px solid rgba(224,92,92,.25);
      color: #e05c5c;
      border-radius: 8px;
      padding: .65rem .9rem;
      font-size: .75rem;
      margin-bottom: 1rem;
    }
    .error-msg.visible { display: block; }

    .footer-note {
      text-align: center;
      font-size: .65rem;
      color: var(--gris);
      margin-top: 1.4rem;
      line-height: 1.6;
    }
    .footer-note a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="logo">
    <div class="logo-text">SUR <span>PATAGONIA</span></div>
    <div class="logo-sub">Portal de Colaboradores</div>
  </div>

  <div class="card">
    <div class="card-titulo">Ingresá a tu panel</div>
    <p class="card-desc">Accedé con el mail y contraseña que te proporcionamos para ver tus métricas y consultas.</p>

    <div class="error-msg" id="errorMsg"></div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" id="inputEmail" placeholder="tu@mail.com" autocomplete="email" />
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-input" id="inputPass" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="btn-login" id="btnLogin" onclick="login()">Ingresar</button>
  </div>

  <div class="footer-note">
    ¿Problemas para acceder?<br>
    Contactanos en <a href="mailto:info@surpatagonia.com.ar">info@surpatagonia.com.ar</a>
  </div>
</div>

<script type="module">
  import { supabase } from '../js/config.js'

  // Si ya está logueado, redirigir directo
  const { data: { session } } = await supabase.auth.getSession()
  if (session) location.href = 'index.html'

  const showError = msg => {
    const el = document.getElementById('errorMsg')
    el.textContent = msg
    el.classList.add('visible')
  }

  window.login = async function() {
    const email = document.getElementById('inputEmail').value.trim()
    const pass  = document.getElementById('inputPass').value
    const btn   = document.getElementById('btnLogin')

    document.getElementById('errorMsg').classList.remove('visible')

    if (!email || !pass) { showError('Completá email y contraseña.'); return }

    btn.disabled = true
    btn.textContent = 'Ingresando…'

    const { error } = await supabase.auth.signInWithPassword({ email, password: pass })

    if (error) {
      btn.disabled = false
      btn.textContent = 'Ingresar'
      showError('Email o contraseña incorrectos.')
      return
    }

    // Verificar que tiene un canal asociado
    const { data: { user } } = await supabase.auth.getUser()
    const { data: canal } = await supabase.from('canales').select('id').eq('user_id', user.id).maybeSingle()

    if (!canal) {
      await supabase.auth.signOut()
      btn.disabled = false
      btn.textContent = 'Ingresar'
      showError('Tu cuenta no tiene un canal asignado. Contactá a Sur Patagonia.')
      return
    }

    location.href = 'index.html'
  }

  // Enter para loguear
  document.addEventListener('keydown', e => { if (e.key === 'Enter') window.login() })
</script>
</body>
</html>
