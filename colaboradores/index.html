<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Panel — Sur Patagonia Colaboradores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0e0c;
      --card: #161513;
      --border: rgba(255,255,255,0.07);
      --accent: #d76f3f;
      --dorado: #c9a84c;
      --verde: #50c878;
      --gris: #888;
      --blanco: #f5f3f0;
      --rojo: #e05c5c;
    }
    body {
      background: var(--bg);
      color: var(--blanco);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .header-logo span { color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .header-canal { font-size: .75rem; color: var(--gris); }
    .header-canal strong { color: var(--blanco); display: block; font-size: .82rem; }
    .btn-refresh {
      font-size:.63rem;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
      padding:.36rem .88rem;
      border-radius:999px;
      border:1px solid rgba(100,149,237,.35);
      background:rgba(100,149,237,.08);
      color:#8fb2ff;
      cursor:pointer;
      font-family:inherit;
      transition:all .18s;
    }
    .btn-refresh:hover { border-color:#6495ed; color:#fff; }
    .btn-refresh:disabled { opacity:.5; cursor:wait; }
    .sync-status { font-size:.63rem; color:var(--gris); min-width:92px; }
    .btn-salir {
      background: none;
      border: 1px solid var(--border);
      color: var(--gris);
      padding: .35rem .8rem;
      border-radius: 8px;
      font-size: .72rem;
      cursor: pointer;
      font-family: inherit;
      transition: all .18s;
    }
    .btn-salir:hover { border-color: var(--rojo); color: var(--rojo); }

    /* Main */
    .main { max-width: 900px; margin: 0 auto; padding: 2rem 1.4rem; }

    .bienvenida { margin-bottom: 1.8rem; }
    .bienvenida h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.9rem;
      font-weight: 300;
      margin-bottom: .3rem;
    }
    .bienvenida p { font-size: .76rem; color: var(--gris); }

    /* Estado QR */
    .qr-status {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.3rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .qr-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .qr-dot.activo { background: var(--verde); box-shadow: 0 0 8px rgba(80,200,120,.5); }
    .qr-dot.campana { background: var(--dorado); box-shadow: 0 0 8px rgba(201,168,76,.5); }
    .qr-dot.inactivo { background: var(--gris); }
    .qr-info { flex: 1; }
    .qr-label { font-size: .7rem; color: var(--gris); }
    .qr-valor { font-size: .85rem; font-weight: 600; }
    .qr-codigo { font-family: monospace; font-size: .72rem; color: var(--accent); margin-left: auto; }

    /* KPIs */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: .8rem;
      margin-bottom: 1.2rem;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
    }
    .kpi-n {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: .3rem;
    }
    .kpi-n.accent { color: var(--accent); }
    .kpi-n.dorado { color: var(--dorado); }
    .kpi-n.verde  { color: var(--verde); }
    .kpi-label { font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gris); font-weight: 600; }
    .kpi-sub { font-size: .65rem; color: var(--gris); margin-top: .3rem; }

    /* Sección */
    .seccion {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.3rem 1.4rem;
      margin-bottom: 1.2rem;
    }
    .sec-titulo {
      font-size: .6rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gris);
      font-weight: 600;
      margin-bottom: 1rem;
    }

    /* Tabla consultas */
    .tabla { width: 100%; border-collapse: collapse; }
    .tabla th {
      font-size: .58rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gris);
      font-weight: 600;
      padding: .55rem .7rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .tabla td {
      font-size: .76rem;
      color: var(--blanco);
      padding: .75rem .7rem;
      border-bottom: 1px solid rgba(255,255,255,.04);
      vertical-align: top;
    }
    .tabla tr:last-child td { border-bottom: none; }

    /* Estado badges */
    .estado-badge {
      display: inline-block;
      padding: .15rem .55rem;
      border-radius: 999px;
      font-size: .6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      white-space: nowrap;
    }
    .estado-nueva        { background: rgba(80,200,120,.12); color: var(--verde); }
    .estado-en_contacto  { background: rgba(201,168,76,.12); color: var(--dorado); }
    .estado-en_negociacion { background: rgba(215,111,63,.12); color: var(--accent); }
    .estado-cerrada      { background: rgba(100,149,237,.12); color: #6495ed; }
    .estado-descartada   { background: rgba(136,136,136,.12); color: var(--gris); }

    /* Via badge */
    .via-badge {
      font-size: .6rem;
      color: var(--gris);
      font-family: monospace;
    }
    .via-badge.qr { color: var(--accent); }

    .empty-msg {
      text-align: center;
      padding: 2rem;
      color: var(--gris);
      font-size: .8rem;
    }

    /* Tipo canal badge */
    .tipo-pill {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .62rem;
      font-weight: 600;
      padding: .18rem .55rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .tipo-pasivo    { background: rgba(136,136,136,.12); color: var(--gris); border: 1px solid rgba(136,136,136,.2); }
    .tipo-activo    { background: rgba(201,168,76,.1); color: var(--dorado); border: 1px solid rgba(201,168,76,.25); }

    .sp { width: 28px; height: 28px; border: 2px solid rgba(255,255,255,.1); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 4rem auto; display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider { height: 1px; background: var(--border); margin: 1.4rem 0; }

    /* ── Mensajes ── */
    .msg-inbox { display:flex; flex-direction:column; gap:.5rem; }
    .msg-card { background:rgba(255,255,255,.025); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .msg-card-head { display:flex; align-items:center; gap:.7rem; padding:.85rem 1rem; cursor:pointer; }
    .msg-unread-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; }
    .msg-unread-dot.leido { background:transparent; }
    .msg-card-asunto { font-size:.82rem; font-weight:600; color:var(--blanco); flex:1; }
    .msg-card-fecha  { font-size:.62rem; color:var(--gris); white-space:nowrap; }
    .msg-card-body   { display:none; border-top:1px solid var(--border); padding:.9rem 1rem 1rem; }
    .msg-card-body.open { display:block; }
    .msg-card-cuerpo { font-size:.78rem; color:rgba(255,255,255,.78); line-height:1.7; white-space:pre-wrap; margin-bottom:.8rem; }

    .reply-area { margin-top:.6rem; }
    .reply-titulo { font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gris); font-weight:600; margin-bottom:.55rem; }
    .reply-item-colab { background:rgba(215,111,63,.07); border-radius:8px; padding:.55rem .75rem; margin-bottom:.35rem; }
    .reply-item-colab .reply-cuerpo { font-size:.75rem; color:rgba(255,255,255,.7); }
    .reply-item-colab .reply-meta { font-size:.6rem; color:var(--gris); margin-top:.2rem; }
    .reply-input {
      width:100%; padding:.5rem .7rem; background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.1); color:var(--blanco);
      border-radius:8px; font-family:'Inter',sans-serif; font-size:.76rem;
      resize:vertical; min-height:60px; box-sizing:border-box; margin-top:.4rem;
    }
    .reply-input:focus { outline:none; border-color:rgba(215,111,63,.5); }
    .btn-reply {
      margin-top:.5rem; padding:.42rem 1rem; background:var(--accent); color:#fff;
      border:none; border-radius:8px; font-size:.72rem; font-weight:600;
      cursor:pointer; font-family:'Inter',sans-serif; transition:opacity .15s;
    }
    .btn-reply:hover { opacity:.85; }
    .btn-reply:disabled { opacity:.4; cursor:not-allowed; }
    .no-msgs { text-align:center; padding:2rem; color:var(--gris); font-size:.78rem; }
    .badge-nuevo { font-size:.58rem; background:rgba(215,111,63,.15); color:var(--accent); border-radius:999px; padding:.1rem .5rem; flex-shrink:0; }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-logo">SUR <span>PATAGONIA</span></div>
  <div class="header-right">
    <div class="header-canal" id="headerCanal"></div>
    <button class="btn-refresh" id="btnRefresh" type="button" onclick="actualizarPanel()">Actualizar</button>
    <span class="sync-status" id="syncStatus">—</span>
    <button class="btn-salir" onclick="salir()">Salir</button>
  </div>
</header>

<!-- MAIN -->
<main class="main" id="mainContent">
  <div class="sp"></div>
</main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const supabase = createClient(
    'https://wajkfydxutptcvvfwrvq.supabase.co',
    'sb_publishable_RKpmv1VDwMOB25phyfFrog_OdI-wB8s',
    { auth: { storageKey: 'sp-colab-session' } }
  )

  window.salir = async function() {
    await supabase.auth.signOut()
    location.href = 'login.html'
  }

  function setSyncStatus(text) {
    const el = document.getElementById('syncStatus')
    if (el) el.textContent = text
  }

  window.actualizarPanel = () => cargarPanel()

  const esc  = s => !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  const fmt  = iso => iso ? new Date(iso).toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' }) : '—'
  const ESTADO_LABEL = { nueva:'Nueva', en_contacto:'En contacto', en_negociacion:'En negociación', cerrada:'Cerrada', descartada:'Descartada' }

  // Codifica el apellido: "Juan González" → "Juan Go***"
  const codificarNombre = nombre => {
    if (!nombre) return '—'
    const partes = nombre.trim().split(/\s+/)
    if (partes.length === 1) return partes[0]
    const apellido = partes[partes.length - 1]
    const codApellido = apellido.slice(0, 2) + '***'
    return [...partes.slice(0, -1), codApellido].join(' ')
  }

  async function cargarPanel() {
    const btnRefresh = document.getElementById('btnRefresh')
    if (btnRefresh) btnRefresh.disabled = true
    setSyncStatus('Actualizando...')

    try {
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) { location.href = 'login.html'; return }

    const userId = session.user.id

    // ── Cargar TODOS los canales del usuario ───────
    const { data: canales } = await supabase
      .from('canales').select('*').eq('user_id', userId).order('nombre')

    if (!canales?.length) {
      document.getElementById('mainContent').innerHTML =
        '<div class="empty-msg">No tenés canales asignados. Contactá a Sur Patagonia.</div>'
      setSyncStatus('Sin canales')
      return
    }

    const esPasivo  = session.user.user_metadata?.tipo_acceso !== 'activo'
    const codigos   = canales.map(c => c.codigo)
    const ahora     = new Date()
    const hace30    = new Date(ahora - 30 * 86400000).toISOString()

    // Header
    document.getElementById('headerCanal').innerHTML =
      `<strong>${esc(canales[0].nombre)}</strong>${canales.length > 1 ? ` <span style="font-size:.65rem;opacity:.6;">+${canales.length - 1} canales</span>` : ''}`

    // ── Cargar métricas globales + mensajes ───────
    const canalIds    = canales.map(c => c.id)
    const ciudadesMias = [...new Set(canales.map(c => c.ciudad).filter(Boolean))]
    const provinciasMias = [...new Set(canales.map(c => c.provincia).filter(Boolean))]

    // canal_ref almacena el codigo de la REFERENCIA (no del canal).
    // El admin lo resuelve por prefijo: canal_ref.startsWith(canal.codigo + '-').
    // Acá buscamos primero todas las referencias del canal y filtramos por esos códigos.
    // También incluimos canal.codigo directamente como fallback (links sin referencia).
    const { data: misRefs } = await supabase
      .from('referencias')
      .select('codigo, canal_id')
      .in('canal_id', canalIds)
    const refCodigos = misRefs?.map(r => r.codigo) || []
    // codigos de filtrado = referencia codes + canal codes (fallback)
    const codigosRef = [...new Set([...refCodigos, ...codigos])]

    const [rVisitas, rVisitas30, rContactos, rCampanas, rMensajes] = await Promise.all([
      supabase.from('visitas').select('created_at, canal_via, canal_ref').in('canal_ref', codigosRef),
      supabase.from('visitas').select('id', { count:'exact', head:true }).in('canal_ref', codigosRef).gte('created_at', hace30),
      supabase.from('contactos').select('*').in('canal_ref', codigosRef).order('created_at', { ascending: false }),
      supabase.from('campanas_canales')
        .select('canal_id, campanas(nombre, activa, fecha_inicio, fecha_fin)')
        .in('canal_id', canales.map(c => c.id)),
      supabase.from('mensajes')
        .select('id, asunto, cuerpo, usuario_id, ciudad, provincia, tipo_acceso, provincias_arr, ciudades_arr, canal_ids, created_at, mensajes_respuestas(id, usuario_id, cuerpo, created_at)')
        .order('created_at', { ascending: false })
    ])

    const visitas    = rVisitas.data    || []
    const scans30    = rVisitas30.count || 0
    const contactos  = rContactos.data  || []

    // Filtrar mensajes para este usuario
    // Lógica: si usuario_id está → solo ese usuario
    // Si no → AND entre todos los filtros activos.
    // Soporta tanto campos nuevos (arrays) como campos viejos (single value).
    const userTipoAcceso = esPasivo ? 'pasivo' : 'activo'
    const misCanalesIds  = canales.map(c => c.id)
    const todosMsg = rMensajes.data || []
    const misMensajes = todosMsg.filter(m => {
      if (m.usuario_id) return m.usuario_id === userId

      // ── Nuevos campos multi-select (arrays) ──
      // canal_ids: alguno de los mis canales debe estar en la lista
      if (m.canal_ids?.length) {
        if (!m.canal_ids.some(id => misCanalesIds.includes(id))) return false
      }
      // provincias_arr: mi provincia debe estar en alguna de las seleccionadas
      if (m.provincias_arr?.length) {
        if (!m.provincias_arr.some(p => provinciasMias.includes(p))) return false
      }
      // ciudades_arr: mi ciudad debe estar en alguna de las seleccionadas
      if (m.ciudades_arr?.length) {
        if (!m.ciudades_arr.some(c => ciudadesMias.includes(c))) return false
      }

      // ── Compatibilidad con campos viejos (mensajes anteriores) ──
      if (!m.provincias_arr && !m.ciudades_arr && !m.canal_ids) {
        if (m.ciudad      && !ciudadesMias.includes(m.ciudad))      return false
        if (m.provincia   && !provinciasMias.includes(m.provincia)) return false
        if (m.tipo_acceso && m.tipo_acceso !== userTipoAcceso)      return false
      }

      return true
    })
    const totalScans = visitas.length
    const conv       = totalScans > 0 ? ((contactos.length / totalScans) * 100).toFixed(1) : 0

    // Campaña activa por canal
    const campanaActiva = {}
    ;(rCampanas.data || []).forEach(row => {
      const c = row.campanas
      if (!c?.activa) return
      const ini = c.fecha_inicio ? new Date(c.fecha_inicio) : null
      const fin = c.fecha_fin    ? new Date(c.fecha_fin)    : null
      if ((!ini || ini <= ahora) && (!fin || fin >= ahora)) {
        campanaActiva[row.canal_id] = c.nombre
      }
    })

    // Mapa refCodigo → canalId (canal_id viene en misRefs)
    const refACanal = {}
    ;(misRefs || []).forEach(r => { refACanal[r.codigo] = r.canal_id })

    // ── Cards de canales (activo) ──────────────────
    const renderCards = () => canales.map(c => {
      // Todos los codigos (referencia o canal directo) que pertenecen a este canal
      const misCodigos = new Set([c.codigo, ...(misRefs || []).filter(r => r.canal_id === c.id).map(r => r.codigo)])
      const cScans    = visitas.filter(v => misCodigos.has(v.canal_ref)).length
      const cContacts = contactos.filter(x => misCodigos.has(x.canal_ref)).length
      const estado    = !c.activo ? 'inactivo' : campanaActiva[c.id] ? 'campana' : 'activo'
      const estadoLabel = estado === 'inactivo' ? 'QR inactivo'
        : campanaActiva[c.id] ? `Campaña: ${campanaActiva[c.id]}`
        : 'QR activo'
      return `
      <div class="qr-status" style="flex-direction:column;align-items:flex-start;gap:.6rem;padding:1rem 1.2rem;">
        <div style="display:flex;align-items:center;gap:.6rem;width:100%;">
          <div class="qr-dot ${estado}"></div>
          <div class="qr-info" style="flex:1;">
            <div class="qr-label" style="font-weight:600;font-size:.8rem;">${esc(c.nombre)}</div>
            <div class="qr-valor" style="font-size:.68rem;">${esc(estadoLabel)}</div>
          </div>
          <div class="qr-codigo">${esc(c.codigo)}</div>
        </div>
        <div style="display:flex;gap:1.5rem;font-size:.72rem;color:var(--gris);">
          <span><strong style="color:var(--blanco);font-size:.9rem;">${cScans}</strong> scans</span>
          <span><strong style="color:var(--dorado);font-size:.9rem;">${cContacts}</strong> consultas</span>
        </div>
      </div>`
    }).join('')

    // ── Render ─────────────────────────────────────
    const main = document.getElementById('mainContent')
    main.innerHTML = `
      <div class="bienvenida">
        <h1>Bienvenido</h1>
        <p>${canales[0].ciudad ? esc(canales[0].ciudad) + (canales[0].provincia ? ', ' + esc(canales[0].provincia) : '') : 'Tu panel de colaborador'}
          · <span class="tipo-pill tipo-${esPasivo ? 'pasivo':'activo'}">${esPasivo ? 'Punto de venta' : 'Inmobiliaria / Vendedor'}</span>
        </p>
      </div>

      <!-- KPIs globales -->
      <div class="kpi-grid">
        <div class="kpi">
          <div class="kpi-n accent">${totalScans.toLocaleString('es-AR')}</div>
          <div class="kpi-label">Scans totales</div>
          <div class="kpi-sub">todos tus canales</div>
        </div>
        <div class="kpi">
          <div class="kpi-n">${scans30.toLocaleString('es-AR')}</div>
          <div class="kpi-label">Scans últimos 30 días</div>
          <div class="kpi-sub">actividad reciente</div>
        </div>
        <div class="kpi">
          <div class="kpi-n dorado">${contactos.length}</div>
          <div class="kpi-label">Consultas generadas</div>
          <div class="kpi-sub">leads de tus canales</div>
        </div>
        <div class="kpi">
          <div class="kpi-n verde">${conv}%</div>
          <div class="kpi-label">Tasa de conversión</div>
          <div class="kpi-sub">scans → consultas</div>
        </div>
      </div>

      ${!esPasivo && canales.length > 1 ? `
      <!-- Cards por canal -->
      <div class="seccion">
        <div class="sec-titulo">Tus canales</div>
        <div style="display:flex;flex-direction:column;gap:.6rem;">${renderCards()}</div>
      </div>` : esPasivo ? `
      <!-- Estado QR pasivo -->
      ${renderCards()}` : renderCards()}

      <!-- Tabla de consultas -->
      ${esPasivo ? renderPasivo(contactos) : renderActivo(contactos)}

      <!-- Mensajes de Sur Patagonia -->
      <div class="seccion" id="secMensajes">
        <div class="sec-titulo">Mensajes de Sur Patagonia${misMensajes.length ? ` <span class="badge-nuevo" style="margin-left:.4rem;">${misMensajes.length}</span>` : ''}</div>
        <div class="msg-inbox" id="msgInbox">
          ${misMensajes.length ? misMensajes.map((m, i) => `
            <div class="msg-card" id="msgCard-${i}">
              <div class="msg-card-head" onclick="toggleMsg(${i})">
                <div class="msg-unread-dot" id="dot-${i}"></div>
                <div class="msg-card-asunto">${esc(m.asunto)}</div>
                <div class="msg-card-fecha">${fmt(m.created_at)}</div>
              </div>
              <div class="msg-card-body" id="msgBody-${i}">
                <div class="msg-card-cuerpo">${esc(m.cuerpo)}</div>
                ${!esPasivo ? `
                  <div class="reply-area">
                    <div class="reply-titulo">Tu respuesta</div>
                    ${(m.mensajes_respuestas || []).filter(r => r.usuario_id === userId).map(r => `
                      <div class="reply-item-colab">
                        <div class="reply-cuerpo">${esc(r.cuerpo)}</div>
                        <div class="reply-meta">${fmt(r.created_at)}</div>
                      </div>`).join('')}
                    <textarea class="reply-input" id="replyInput-${i}" placeholder="Escribí tu respuesta..."></textarea>
                    <button class="btn-reply" onclick="enviarRespuesta('${m.id}', ${i}, ${JSON.stringify(canales[0]?.nombre||'').replace(/"/g,'&quot;')})">Enviar respuesta</button>
                  </div>` : ''}
              </div>
            </div>`).join('') : '<div class="no-msgs">No tenés mensajes por ahora.</div>'}
        </div>
      </div>
    `

    function renderPasivo(contactos) {
      if (!contactos.length) return `
        <div class="seccion">
          <div class="sec-titulo">Consultas generadas</div>
          <div class="empty-msg">Aún no hay consultas. Cuando alguien consulte desde tu QR, aparecerá aquí.</div>
        </div>`
      const filas = contactos.slice(0, 30).map(c => `
        <tr>
          <td>${fmt(c.created_at)}</td>
          <td><span class="via-badge ${c.canal_via === 'qr' ? 'qr':''}">${c.canal_via === 'qr' ? '⬛ QR físico' : '🔗 Link'}</span></td>
          <td><span class="estado-badge estado-${esc(c.estado||'nueva')}">${esc(ESTADO_LABEL[c.estado]||'Nueva')}</span></td>
        </tr>`).join('')
      return `
        <div class="seccion">
          <div class="sec-titulo">Consultas generadas por tu canal</div>
          <div style="overflow-x:auto;">
            <table class="tabla">
              <thead><tr><th>Fecha</th><th>Origen</th><th>Estado</th></tr></thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
        </div>`
    }

    function renderActivo(contactos) {
      if (!contactos.length) return `
        <div class="seccion">
          <div class="sec-titulo">Consultas</div>
          <div class="empty-msg">Aún no hay consultas de tus canales.</div>
        </div>`

      // Mapa codigo → nombre de canal para la columna Canal
      const nombreCanal = {}
      canales.forEach(c => { nombreCanal[c.codigo] = c.nombre })

      const filas = contactos.slice(0, 50).map(c => `
        <tr>
          <td style="white-space:nowrap">${fmt(c.created_at)}</td>
          <td>
            <span style="font-weight:500">${esc(codificarNombre(c.nombre))}</span>
            ${c.mensaje ? `<span style="display:block;font-size:.67rem;color:var(--gris);margin-top:.15rem;">${esc(c.mensaje.slice(0,70))}${c.mensaje.length > 70 ? '…':''}</span>` : ''}
          </td>
          <td style="font-size:.72rem;color:var(--gris);">${esc(c.propiedades?.titulo || c.proyecto_slug || '—')}</td>
          <td style="font-size:.7rem;color:var(--gris);">${esc(nombreCanal[c.canal_ref] || c.canal_ref || '—')}</td>
          <td><span class="via-badge ${c.canal_via === 'qr' ? 'qr':''}">${c.canal_via === 'qr' ? '⬛ QR' : '🔗 Link'}</span></td>
          <td><span class="estado-badge estado-${esc(c.estado||'nueva')}">${esc(ESTADO_LABEL[c.estado]||'Nueva')}</span></td>
        </tr>`).join('')

      return `
        <div class="seccion">
          <div class="sec-titulo">Tus consultas — todos los canales</div>
          <div style="overflow-x:auto;">
            <table class="tabla">
              <thead>
                <tr>
                  <th>Fecha</th><th>Nombre</th><th>Propiedad</th><th>Canal</th><th>Origen</th><th>Estado</th>
                </tr>
              </thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
        </div>`
    }

    // ── Mensajes: toggle y respuesta ──
    window.toggleMsg = (i) => {
      document.getElementById(`msgBody-${i}`).classList.toggle('open')
      const dot = document.getElementById(`dot-${i}`)
      if (dot) dot.classList.add('leido')
    }

    window.enviarRespuesta = async (mensajeId, i, canalNombre) => {
      const input = document.getElementById(`replyInput-${i}`)
      const cuerpo = input.value.trim()
      if (!cuerpo) return
      const btn = input.nextElementSibling
      btn.disabled = true; btn.textContent = 'Enviando...'
      const { error } = await supabase.from('mensajes_respuestas').insert({
        mensaje_id: mensajeId,
        usuario_id: userId,
        usuario_nombre: session.user.email,
        canal_nombre: canalNombre,
        cuerpo
      })
      if (error) {
        btn.textContent = 'Error — intentá de nuevo'
        btn.disabled = false
      } else {
        input.value = ''
        btn.textContent = '✓ Respuesta enviada'
        // Mostrar respuesta en pantalla
        const replyArea = input.parentNode
        const newItem = document.createElement('div')
        newItem.className = 'reply-item-colab'
        newItem.innerHTML = `<div class="reply-cuerpo">${esc(cuerpo)}</div><div class="reply-meta">Ahora</div>`
        replyArea.insertBefore(newItem, input)
        setTimeout(() => { btn.textContent = 'Enviar respuesta'; btn.disabled = false }, 2000)
      }
    }

      setSyncStatus('Actualizado ' + new Date().toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' }))
    } catch (err) {
      console.error('Error al actualizar panel colaborador', err)
      setSyncStatus('Error al actualizar')
    } finally {
      if (btnRefresh) btnRefresh.disabled = false
    }
  }

  cargarPanel()
</script>
</body>
</html>
