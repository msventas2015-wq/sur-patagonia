<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Panel — Sur Patagonia Colaboradores</title>
  <link rel="manifest" href="/colaboradores/manifest.json">
  <meta name="theme-color" content="#0f0e0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sur Patagonia">
  <link rel="apple-touch-icon" href="/assets/app-icon-180.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/colaboradores/sw.js', { scope: '/colaboradores/' });
      });
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0e0c;
      --card: #161513;
      --border: rgba(255,255,255,0.07);
      --accent: #d76f3f;
      --dorado: #c9a84c;
      --verde: #50c878;
      --gris: #aaa;
      --blanco: #f5f3f0;
      --rojo: #e05c5c;
    }
    body {
      background: var(--bg);
      color: var(--blanco);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: rgba(15,14,12,.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-brand { display:flex; flex-direction:row; align-items:center; gap:.9rem; }
    .header-brand img { width:240px; height:auto; filter:brightness(0) invert(1); opacity:.96; }
    .header-brand span { color:rgba(255,255,255,.45); font-size:.52rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase; padding-left:.9rem; border-left:1px solid rgba(255,255,255,.12); }
    .sp-bg-brand {
      position: fixed;
      bottom: 6vh; left: 0; right: 0;
      height: 65vh;
      background: url('../assets/ChatGPT Image 19 jun 2026, 23_34_52.png') center 52% / cover no-repeat;
      filter: grayscale(1) brightness(0.75);
      opacity: .11;
      pointer-events: none;
      z-index: 9;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 82%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 82%, transparent 100%);
    }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .header-canal { font-size: .75rem; color: var(--gris); }
    .header-canal strong { color: var(--blanco); display: block; font-size: .82rem; }
    .btn-salir {
      background: none;
      border: 1px solid var(--border);
      color: var(--gris);
      padding: .35rem .8rem;
      border-radius: 8px;
      font-size: .72rem;
      cursor: pointer;
      font-family: inherit;
      transition: all .18s;
    }
    .btn-salir:hover { border-color: var(--rojo); color: var(--rojo); }

    /* Main */
    .main { max-width: 900px; margin: 0 auto; padding: 2rem 1.4rem; }

    /* Hero pasivo */
    .pasivo-hero {
      position: relative; overflow: hidden;
      padding: 2rem 2.2rem 1.8rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(201,168,76,.18);
      border-top: 1px solid rgba(201,168,76,.48);
      border-radius: 14px;
      background:
        radial-gradient(circle at 92% 20%, rgba(215,111,63,.1), transparent 32%),
        linear-gradient(135deg, rgba(201,168,76,.09), rgba(255,255,255,.01) 60%),
        #11100e;
    }
    .pasivo-hero::after {
      content: ''; position: absolute; inset: auto 0 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,.4), transparent);
    }
    .pasivo-eyebrow { font-size:.55rem; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:#c9a84c; margin-bottom:.6rem; }
    .pasivo-titulo {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800; letter-spacing: -.03em; line-height: 1; text-transform: uppercase;
      background: linear-gradient(120deg, #ffffff 0%, rgba(255,255,255,.6) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: .4rem;
    }
    .pasivo-geo { font-size:.61rem; color:rgba(255,255,255,.3); letter-spacing:.14em; text-transform:uppercase; margin-top:.4rem; }
    .pasivo-status { display:flex; align-items:center; gap:.5rem; margin-top:.9rem; font-size:.61rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.45); }

    /* Estado QR */
    .qr-status {
      background: linear-gradient(160deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,.02) 100%);
      border: 1px solid rgba(255,255,255,.07);
      border-top: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      padding: 1rem 1.3rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .qr-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .qr-dot.activo { background: var(--verde); box-shadow: 0 0 8px rgba(80,200,120,.5); }
    .qr-dot.campana { background: var(--dorado); box-shadow: 0 0 8px rgba(201,168,76,.5); }
    .qr-dot.inactivo { background: var(--gris); }
    .qr-info { flex: 1; }
    .qr-label { font-size: .7rem; color: var(--gris); }
    .qr-valor { font-size: .85rem; font-weight: 600; }
    .qr-codigo { font-family: monospace; font-size: .72rem; color: var(--accent); margin-left: auto; }

    /* KPIs */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: .8rem;
      margin-bottom: 1.2rem;
    }
    .kpi {
      background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%);
      border: 1px solid rgba(255,255,255,.08);
      border-top: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
      position: relative; overflow: hidden;
    }
    .kpi::before { content:''; position:absolute; left:0; top:20%; bottom:20%; width:2px; background:linear-gradient(to bottom,transparent,var(--c,#c9a84c),transparent); border-radius:99px; }
    .kpi-grid .kpi:nth-child(1) { --c:#d76f3f; }
    .kpi-grid .kpi:nth-child(2) { --c:#6495ed; }
    .kpi-grid .kpi:nth-child(3) { --c:#c9a84c; }
    .kpi-grid .kpi:nth-child(4) { --c:#50c878; }
    .kpi-n {
      font-size: 2.45rem;
      font-weight: 300;
      line-height: 1;
      margin-bottom: .3rem;
      background: linear-gradient(135deg, #fff, rgba(255,255,255,.7));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .kpi-n.accent { background: linear-gradient(135deg,#d76f3f,#e8956a); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .kpi-n.dorado { background: linear-gradient(135deg,#c9a84c,#e8c96a); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .kpi-n.verde  { background: linear-gradient(135deg,#50c878,#7de89a); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .kpi-label { font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gris); font-weight: 600; }
    .kpi-sub { font-size: .65rem; color: var(--gris); margin-top: .3rem; }

    /* Sección */
    .seccion {
      background: linear-gradient(160deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,.02) 100%);
      border: 1px solid rgba(255,255,255,.07);
      border-top: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      padding: 1.3rem 1.4rem;
      margin-bottom: 1.2rem;
    }
    .sec-titulo {
      font-size: .6rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gris);
      font-weight: 600;
      margin-bottom: 1rem;
    }

    /* Tabla consultas */
    .tabla { width: 100%; border-collapse: collapse; }
    .tabla th {
      font-size: .58rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gris);
      font-weight: 600;
      padding: .55rem .7rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .tabla td {
      font-size: .76rem;
      color: var(--blanco);
      padding: .75rem .7rem;
      border-bottom: 1px solid rgba(255,255,255,.04);
      vertical-align: top;
    }
    .tabla tr:last-child td { border-bottom: none; }

    /* Estado badges */
    .estado-badge {
      display: inline-block;
      padding: .15rem .55rem;
      border-radius: 999px;
      font-size: .6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      white-space: nowrap;
    }
    .estado-nueva        { background: rgba(80,200,120,.12); color: var(--verde); }
    .estado-en_contacto  { background: rgba(201,168,76,.12); color: var(--dorado); }
    .estado-en_negociacion { background: rgba(215,111,63,.12); color: var(--accent); }
    .estado-cerrada      { background: rgba(100,149,237,.12); color: #6495ed; }
    .estado-descartada   { background: rgba(136,136,136,.12); color: var(--gris); }

    /* Via badge */
    .via-badge {
      font-size: .6rem;
      color: #6495ed;
      font-family: monospace;
    }
    .via-badge.qr { color: var(--verde); }

    .empty-msg {
      text-align: center;
      padding: 2rem;
      color: var(--gris);
      font-size: .8rem;
    }

    /* Tipo canal badge */
    .tipo-pill {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .62rem;
      font-weight: 600;
      padding: .18rem .55rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .tipo-pasivo    { background: rgba(136,136,136,.12); color: var(--gris); border: 1px solid rgba(136,136,136,.2); }
    .tipo-activo    { background: rgba(201,168,76,.1); color: var(--dorado); border: 1px solid rgba(201,168,76,.25); }

    .sp { width: 28px; height: 28px; border: 2px solid rgba(255,255,255,.1); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 4rem auto; display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider { height: 1px; background: var(--border); margin: 1.4rem 0; }

    /* ── Mensajes ── */
    .msg-inbox { display:flex; flex-direction:column; gap:.5rem; }
    .msg-card { background:rgba(255,255,255,.025); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .msg-card-head { display:flex; align-items:center; gap:.7rem; padding:.85rem 1rem; cursor:pointer; }
    .msg-unread-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; }
    .msg-unread-dot.leido { background:transparent; }
    .msg-card-asunto { font-size:.82rem; font-weight:600; color:var(--blanco); flex:1; }
    .msg-card-fecha  { font-size:.62rem; color:var(--gris); white-space:nowrap; }
    .msg-card-body   { display:none; border-top:1px solid var(--border); padding:.9rem 1rem 1rem; }
    .msg-card-body.open { display:block; }
    .msg-card-cuerpo { font-size:.78rem; color:rgba(255,255,255,.78); line-height:1.7; white-space:pre-wrap; margin-bottom:.8rem; }

    .reply-area { margin-top:.6rem; }
    .reply-titulo { font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gris); font-weight:600; margin-bottom:.55rem; }
    .reply-item-colab { background:rgba(215,111,63,.07); border-radius:8px; padding:.55rem .75rem; margin-bottom:.35rem; }
    .reply-item-colab .reply-cuerpo { font-size:.75rem; color:rgba(255,255,255,.7); }
    .reply-item-colab .reply-meta { font-size:.6rem; color:var(--gris); margin-top:.2rem; }
    .reply-input {
      width:100%; padding:.5rem .7rem; background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.1); color:var(--blanco);
      border-radius:8px; font-family:'Inter',sans-serif; font-size:.76rem;
      resize:vertical; min-height:60px; box-sizing:border-box; margin-top:.4rem;
    }
    .reply-input:focus { outline:none; border-color:rgba(215,111,63,.5); }
    .btn-reply {
      margin-top:.5rem; padding:.42rem 1rem; background:var(--accent); color:#fff;
      border:none; border-radius:8px; font-size:.72rem; font-weight:600;
      cursor:pointer; font-family:'Inter',sans-serif; transition:opacity .15s;
    }
    .btn-reply:hover { opacity:.85; }
    .btn-reply:disabled { opacity:.4; cursor:not-allowed; }
    .no-msgs { text-align:center; padding:2rem; color:var(--gris); font-size:.78rem; }
    .badge-nuevo { font-size:.58rem; background:rgba(215,111,63,.15); color:var(--accent); border-radius:999px; padding:.1rem .5rem; flex-shrink:0; }

    /* ── Panel de impacto del aliado ── */
    .main.pv-main { max-width:1220px; padding-top:1.5rem; }
    .pv-hero { position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:2rem; min-height:230px; padding:2.4rem 2.2rem; margin-bottom:.75rem; border:1px solid rgba(201,168,76,.18); border-top-color:rgba(201,168,76,.52); border-radius:14px; background:radial-gradient(circle at 88% 20%,rgba(215,111,63,.13),transparent 34%),linear-gradient(135deg,rgba(201,168,76,.1),rgba(255,255,255,.015) 58%),#11100e; }
    .pv-hero::after { content:''; position:absolute; inset:auto 0 0; height:1px; background:linear-gradient(90deg,transparent,rgba(201,168,76,.45),transparent); }
    .pv-hero-eyebrow { margin-bottom:1.1rem; color:#c9a84c; font-size:.55rem; font-weight:700; letter-spacing:.24em; text-transform:uppercase; }
    .pv-hero-hola { color:rgba(255,255,255,.45); font-family:'Inter',sans-serif; font-size:.82rem; font-weight:300; line-height:1.1; letter-spacing:.04em; }
    .pv-hero-hola strong { display:block; font-family:'Inter',sans-serif; font-size:2rem; font-weight:700; color:#f5f3f0; letter-spacing:-.02em; line-height:1.05; margin-top:.25rem; }
    .pv-hero-impacto { max-width:560px; margin-top:1.1rem; color:rgba(255,255,255,.52); font-size:.83rem; line-height:1.65; }
    .pv-hero-geo { display:none; }
    .pv-identity { display:flex; flex-direction:column; align-items:center; gap:.85rem; min-width:150px; }
    .pv-monogram { width:82px; height:82px; display:grid; place-items:center; border:1px solid rgba(201,168,76,.32); border-radius:50%; background:rgba(201,168,76,.07); color:#e8c96a; font-family:'Cormorant Garamond',serif; font-size:1.75rem; letter-spacing:.08em; box-shadow:0 0 32px rgba(201,168,76,.08); }
    .pv-monogram-mobile { display:none; }
    .pv-mini-mapa-wrap { display:flex; flex-direction:column; align-items:center; gap:.45rem; }
    .pv-mini-mapa { width:160px; height:160px; overflow:hidden; border:1px solid rgba(201,168,76,.25); border-radius:10px; background:#111; pointer-events:none; }
    .pv-mini-mapa-label { max-width:160px; color:rgba(255,255,255,.3); font-size:.56rem; letter-spacing:.14em; text-align:center; text-transform:uppercase; }
    #pvMiniMapa .leaflet-control-zoom, #pvMiniMapa .leaflet-control-attribution { display:none !important; }
    .pv-hero-estado { display:flex; align-items:center; justify-content:center; gap:.5rem; color:rgba(255,255,255,.55); font-size:.61rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
    .pv-hero-code { color:rgba(255,255,255,.18); font-family:monospace; font-size:.56rem; }
    .pv-resumen { margin-bottom:1.25rem; padding:.75rem 1rem; text-align:center; color:rgba(255,255,255,.42); font-size:.72rem; }
    .pv-resumen strong { color:#e8c96a; font-weight:600; }
    .pv-kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.8rem; margin-bottom:1rem; }
    .pv-kpi { position:relative; overflow:hidden; min-height:148px; padding:1.25rem 1.3rem; border:1px solid rgba(255,255,255,.07); border-top-color:rgba(255,255,255,.13); border-radius:12px; background:linear-gradient(145deg,rgba(255,255,255,.052),rgba(255,255,255,.018)); }
    .pv-kpi::before { content:''; position:absolute; left:0; top:22%; bottom:22%; width:2px; background:var(--pv-c,#c9a84c); opacity:.75; }
    .pv-kpi-label { margin-bottom:.55rem; color:rgba(255,255,255,.42); font-size:.58rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase; }
    .pv-kpi-n { font-size:2.45rem; font-weight:300; line-height:1; background:linear-gradient(135deg,#fff,rgba(255,255,255,.7)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .pv-kpi-n.pv-dorado { background:linear-gradient(135deg,#c9a84c,#e8c96a); background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .pv-kpi-sub { margin-top:.55rem; color:rgba(255,255,255,.3); font-size:.63rem; line-height:1.45; }
    .pv-kpi-delta { display:inline-flex; align-items:center; gap:.25rem; margin-top:.45rem; font-size:.61rem; font-weight:600; }
    .pv-delta-pos { color:#50c878; }
    .pv-delta-neg { color:#d9825b; }
    .pv-delta-neu { color:rgba(255,255,255,.3); }
    .pv-sec { padding:1.45rem 1.55rem; margin-bottom:1rem; border:1px solid rgba(255,255,255,.07); border-top-color:rgba(255,255,255,.12); border-radius:12px; background:linear-gradient(155deg,rgba(255,255,255,.042),rgba(255,255,255,.014)); }
    .pv-sec-head { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin-bottom:1.15rem; }
    .pv-sec-titulo { color:var(--gris); font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    .pv-sec-sub { margin-top:.35rem; color:rgba(255,255,255,.45); font-size:.66rem; }
    .pv-chart-wrap { position:relative; height:270px; }
    .pv-opt-label { font-size:.55rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.35); margin-bottom:.65rem; padding-bottom:.5rem; border-bottom:1px solid rgba(255,255,255,.06); }
    .pv-flt-bar { display:flex; align-items:center; gap:.35rem; flex-wrap:wrap; }
    .pv-flt-btn { min-height:32px; padding:.36rem .88rem; border:1px solid rgba(255,255,255,.09); border-radius:8px; background:rgba(255,255,255,.05); color:rgba(255,255,255,.5); font:600 .63rem 'Inter',sans-serif; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; transition:all .2s; }
    .pv-flt-btn:hover { border-color:rgba(201,168,76,.35); color:var(--dorado); }
    .pv-flt-btn.activo { background:linear-gradient(135deg,rgba(201,168,76,.22),rgba(201,168,76,.08)); border-color:rgba(201,168,76,.42); color:#e8c96a; box-shadow:0 0 14px rgba(201,168,76,.12); }
    .pv-flt-custom { display:flex; align-items:flex-end; justify-content:flex-end; gap:.55rem; margin:0 0 1rem; padding:.7rem; border-top:1px solid rgba(255,255,255,.05); }
    .pv-flt-custom label { display:flex; flex-direction:column; gap:.3rem; color:rgba(255,255,255,.3); font-size:.55rem; text-transform:uppercase; letter-spacing:.09em; }
    .pv-fecha-input { padding:.38rem .5rem; border:1px solid rgba(255,255,255,.1); border-radius:7px; background:rgba(255,255,255,.04); color:#f5f3f0; color-scheme:dark; font:500 .67rem 'Inter',sans-serif; }
    .pv-aplicar { min-height:31px; padding:.35rem .75rem; border:0; border-radius:7px; background:#c9a84c; color:#15130e; font:700 .6rem 'Inter',sans-serif; cursor:pointer; }
    .pv-impact-grid { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr); gap:1rem; margin-bottom:1rem; }
    /* ── Pipeline CRM ── */
    .pv-pipeline { display:grid; grid-template-columns:1fr 22px 1fr 22px 1fr 22px 1fr 22px 1fr; gap:0; align-items:stretch; margin:.25rem 0; }
    .pv-pipe-step { position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; padding:1.4rem .9rem 1.2rem; border:1px solid rgba(255,255,255,.07); border-top-color:rgba(255,255,255,.12); border-radius:12px; background:linear-gradient(160deg,rgba(255,255,255,.048),rgba(255,255,255,.015)); transition:transform .2s; }
    .pv-pipe-step + .pv-pipe-step { margin-left:.55rem; }
    .pv-pipe-ico { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-size:.9rem; margin-bottom:.75rem; flex-shrink:0; }
    .pv-pipe-n { font-size:2.6rem; font-weight:300; line-height:1; color:#f8f6f2; margin-bottom:.35rem; }

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
  import { aplicarConfigVisual, leerConfigVisual } from '../js/panel-config.js'
  import QRCode from 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm'

  const supabase = createClient(
    'https://wajkfydxutptcvvfwrvq.supabase.co',
    'sb_publishable_RKpmv1VDwMOB25phyfFrog_OdI-wB8s',
    { auth: { storageKey: 'sp-colab-session' } }
  )

  leerConfigVisual(supabase).then(aplicarConfigVisual).catch(() => {})

  window.salir = async function() {
    await supabase.auth.signOut()
    location.href = 'login.html'
  }

  const esc  = s => !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  const fmt  = iso => iso ? new Date(iso).toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' }) : '—'
  const ESTADO_LABEL = { nueva:'Nueva', en_contacto:'En contacto', en_negociacion:'En negociación', cerrada:'Cerrada', descartada:'Descartada' }
  const ESTADO_LABEL_PASIVO = { nueva:'Nueva', en_contacto:'Contactada', en_negociacion:'Visita programada', cerrada:'Operación cerrada', descartada:'Descartada' }

  // Codifica el apellido: "Juan González" → "Juan Go***"
  const codificarNombre = nombre => {
    if (!nombre) return '—'
    const partes = nombre.trim().split(/\s+/)
    if (partes.length === 1) return partes[0]
    const apellido = partes[partes.length - 1]
    const codApellido = apellido.slice(0, 2) + '***'
    return [...partes.slice(0, -1), codApellido].join(' ')
  }

  ;(async () => {
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) { location.href = 'login.html'; return }

    const userId = session.user.id

    // ── Cargar TODOS los canales del usuario ───────
    const { data: canales } = await supabase
      .from('canales').select('*').eq('user_id', userId).order('nombre')

    if (!canales?.length) {
      document.getElementById('mainContent').innerHTML =
        '<div class="empty-msg">No tenés canales asignados. Contactá a Sur Patagonia.</div>'
      return
    }

    const esPasivo  = session.user.user_metadata?.tipo_acceso !== 'activo'
    const codigos   = canales.map(c => c.codigo)
    const ahora     = new Date()
    const hace30    = new Date(ahora - 30 * 86400000).toISOString()

    // Header
    const badgeHtml = esPasivo ? '<div class="badge-aliado">Aliado</div>' : ''
    document.getElementById('headerCanal').innerHTML =
      `<div style="display:flex;align-items:center;gap:.65rem;">${badgeHtml}<div><strong>${esc(canales[0].nombre)}</strong>${canales.length > 1 ? ` <span style="font-size:.65rem;opacity:.6;">+${canales.length - 1} canales</span>` : ''}</div></div>`

    // ── Cargar métricas globales + mensajes ───────
    const canalIds    = canales.map(c => c.id)
    const ciudadesMias = [...new Set(canales.map(c => c.ciudad).filter(Boolean))]
    const provinciasMias = [...new Set(canales.map(c => c.provincia).filter(Boolean))]

    // canal_ref almacena el codigo de la REFERENCIA (no del canal).
    // El admin lo resuelve por prefijo: canal_ref.startsWith(canal.codigo + '-').
    // Acá buscamos primero todas las referencias del canal y filtramos por esos códigos.
    // También incluimos canal.codigo directamente como fallback (links sin referencia).
    const { data: misRefs } = await supabase
      .from('referencias')
      .select('codigo, canal_id')
      .in('canal_id', canalIds)
    const refCodigos = misRefs?.map(r => r.codigo) || []
    // codigos de filtrado = referencia codes + canal codes (fallback)
    const codigosRef = [...new Set([...refCodigos, ...codigos])]

    const [rVisitas, rVisitas30, rContactos, rCampanas, rMensajes, rMisSlots] = await Promise.all([
      supabase.from('visitas').select('created_at, canal_via, canal_ref').in('canal_ref', codigosRef),
      supabase.from('visitas').select('id', { count:'exact', head:true }).in('canal_ref', codigosRef).gte('created_at', hace30),
      supabase.from('contactos').select('*').in('canal_ref', codigosRef).order('created_at', { ascending: false }),
      supabase.from('campanas_canales')
        .select('canal_id, campanas(nombre, activa, fecha_inicio, fecha_fin)')
        .in('canal_id', canales.map(c => c.id)),
      supabase.from('mensajes')
        .select('id, asunto, cuerpo, usuario_id, ciudad, provincia, tipo_acceso, provincias_arr, ciudades_arr, canal_ids, created_at, mensajes_respuestas(id, usuario_id, cuerpo, created_at)')
        .order('created_at', { ascending: false }),
      supabase.from('referencias')
        .select('id, codigo, nombre, destino, activo, proyecto_slug, canal_id')
        .in('canal_id', canalIds)
        .order('created_at', { ascending: true })
    ])

    let visitas   = rVisitas.data    || []
    const scans30 = rVisitas30.count || 0
    let contactos = rContactos.data  || []

    // ── Mis QRs: datos de slots activos ───────────
    const misSlots = rMisSlots.data || []
    // Derivar proyecto_slug desde el código cuando no está seteado en BD
    const slugify = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')
    const canalCodigoMap = {}; canales.forEach(c => { canalCodigoMap[c.id] = c.codigo })
    // ── Color determinístico por slot.id (hash estable) ──────────────
    // Paleta premium coherente con Sur Patagonia — 10 colores bien separados.
    const SLOT_PALETTE = ['#6495ed','#50c878','#e8c96a','#d76f3f','#b06cd9','#4ec9b0','#f0956a','#7aaeff','#a8e063','#e85aae']
    const SLOT_PALETTE_SOFT = ['#6495ed','#50c878','#e8c96a','#d76f3f','#b06cd9','#4ec9b0','#f0956a','#7aaeff','#a8e063','#e85aae']
    const slotColorMap = {} // slot.codigo → hex
    function colorDeSlot(codigo) {
      if (slotColorMap[codigo]) return slotColorMap[codigo]
      // FNV-1a hash del código → índice de paleta estable
      let h = 0x811c9dc5
      for (let i = 0; i < codigo.length; i++) { h ^= codigo.charCodeAt(i); h = (h * 0x01000193) >>> 0 }
      const color = SLOT_PALETTE[h % SLOT_PALETTE.length]
      slotColorMap[codigo] = color
      return color
    }
    misSlots.forEach(slot => {
      if (!slot.proyecto_slug) {
        const pfx = (canalCodigoMap[slot.canal_id] || '') + '-'
        slot.proyecto_slug = slot.codigo.startsWith(pfx) ? slot.codigo.slice(pfx.length) : slot.codigo
      }
    })
    const slotCodigos  = misSlots.map(s => s.codigo)
    const derivedSlugs = [...new Set(misSlots.map(s => s.proyecto_slug).filter(Boolean))]
    const [rScansPorSlot, rProyImgs, rPropAll] = await Promise.all([
      slotCodigos.length
        ? supabase.from('visitas').select('canal_ref').in('canal_ref', slotCodigos).gte('created_at', hace30)
        : Promise.resolve({ data: [] }),
      derivedSlugs.length
        ? supabase.from('proyectos').select('slug, nombre, foto_portada').in('slug', derivedSlugs)
        : Promise.resolve({ data: [] }),
      supabase.from('propiedades')
        .select('id, titulo, imagenes, dormitorios, banos, superficie_cubierta, superficie_total')
        .eq('activa', true).limit(200)
    ])
    const scansPorSlot = {}
    ;(rScansPorSlot.data || []).forEach(v => { scansPorSlot[v.canal_ref] = (scansPorSlot[v.canal_ref] || 0) + 1 })
    const proyImgs = {}
    ;(rProyImgs.data || []).forEach(p => { proyImgs[p.slug] = p })
    const propDataMap = {}
    ;(rPropAll.data || []).forEach(p => { propDataMap[slugify(p.titulo)] = p })
    function findPropData(slug) {
      if (!slug) return null
      if (propDataMap[slug]) return propDataMap[slug]
      for (const [k, v] of Object.entries(propDataMap)) { if (k.startsWith(slug) || slug.startsWith(k)) return v }
      return null
    }
    let _pvChart4 = null, _pvChart4a = null, _pvChart4b = null, _pvChart4c = null, _pvChart4d = null
    let _pvPanelAct = null, _pvPanelConv = null  // charts de los paneles nuevos (Actividad 30d, Conversión 30d)
    let _pvLiveRAF = null   // loop de animación del "pulso en vivo"
    let _pvLiveTimer = null // refresco automático (modo Hoy)
    let _pvDocMoveH = null, _pvDocUpH = null    // document-level pan listeners (cleanup seguro)

    // ── Zoom horario (modo Hoy) ──────────────────────────────────────────────
    window.pvZoomHoyAplicar = function() {
      if (!_pvChart4 || !window._pvHoyLbls) return
      const fromH = parseInt(document.getElementById('pvZoomDesde')?.value || '0')
      const toH   = parseInt(document.getElementById('pvZoomHasta')?.value || '24')
      const VENTANA = window._pvHoyVENTANA || 15
      const lbls = window._pvHoyLbls
      const minIdx = Math.max(0, Math.floor(fromH * 60 / VENTANA))
      const rawMax = Math.ceil(toH * 60 / VENTANA) - 1
      const maxIdx = Math.min(lbls.length - 1, rawMax)
      const safeMax = Math.max(minIdx, maxIdx)
      _pvChart4.options.scales.x.min = lbls[minIdx]
      _pvChart4.options.scales.x.max = lbls[safeMax]
      _pvChart4.update('none')
    }
    window.pvZoomHoyReset = function() {
      const f = window._pvZoomDefaultFrom, t2 = window._pvZoomDefaultTo
      if (f && t2) pvApplyViewport(f, t2)
      else if (_pvChart4) {
        delete _pvChart4.options.scales.x.min
        delete _pvChart4.options.scales.x.max
        _pvChart4.update('none')
      }
      window._pvZoomFrom = f; window._pvZoomTo = t2
      const d = document.getElementById('pvZoomDesde'); if (d) d.value = '0'
      const h = document.getElementById('pvZoomHasta'); if (h) h.value = '24'
    }

    // ── Motor de zoom temporal interactivo ──────────────────────────────────

    // Resamplea visitas/contactos/slots para [fromMs, toMs] con granularidad adaptativa
    function pvResampleChart(fromMs, toMs) {
      const rangeMins = (toMs - fromMs) / 60000
      let bucketMs, labelFn
      if (rangeMins <= 120) {
        bucketMs = 60000
        labelFn = t => { const d=new Date(t); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` }
      } else if (rangeMins <= 360) {
        bucketMs = 5*60000
        labelFn = t => { const d=new Date(t); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` }
      } else if (rangeMins <= 1440) {
        bucketMs = 15*60000
        labelFn = t => { const d=new Date(t); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` }
      } else if (rangeMins <= 10080) {
        bucketMs = 3600000
        labelFn = t => { const d=new Date(t); return `${d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})} ${String(d.getHours()).padStart(2,'0')}h` }
      } else {
        bucketMs = 86400000
        labelFn = t => new Date(t).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})
      }
      window._pvZoomBucketMs = bucketMs
      const snapFrom = Math.floor(fromMs / bucketMs) * bucketMs
      const numBuckets = Math.max(1, Math.ceil((toMs - snapFrom) / bucketMs))
      const bucketStarts = Array.from({length:numBuckets}, (_,i) => snapFrom + i*bucketMs)
      const newLbls = bucketStarts.map(t => labelFn(t))
      const ds = new Array(numBuckets).fill(0)
      const dc = new Array(numBuckets).fill(0)
      visitas.forEach(v => {
        const t = new Date(v.created_at).getTime(); if (t < fromMs || t >= toMs) return
        const idx = Math.floor((t - snapFrom) / bucketMs); if (idx >= 0 && idx < numBuckets) ds[idx]++
      })
      contactos.forEach(c => {
        const t = new Date(c.created_at).getTime(); if (t < fromMs || t >= toMs) return
        const idx = Math.floor((t - snapFrom) / bucketMs); if (idx >= 0 && idx < numBuckets) dc[idx]++
      })
      const slotData = (typeof misSlots !== 'undefined' ? misSlots : []).map(slot => {
        const arr = new Array(numBuckets).fill(0)
        visitas.forEach(v => {
          if (v.canal_ref !== slot.codigo) return
          const t = new Date(v.created_at).getTime(); if (t < fromMs || t >= toMs) return
          const idx = Math.floor((t - snapFrom) / bucketMs); if (idx >= 0 && idx < numBuckets) arr[idx]++
        })
        return { codigo: slot.codigo, data: arr }
      })
      return { labels: newLbls, dataScans: ds, dataCons: dc, slotData }
    }

    // Aplica un viewport al gráfico principal: recalcula datos y labels sin destruir el chart
    function pvApplyViewport(fromMs, toMs) {
      if (!_pvChart4?.data) return
      window._pvZoomFrom = fromMs; window._pvZoomTo = toMs
      const { labels, dataScans, dataCons, slotData } = pvResampleChart(fromMs, toMs)
      _pvChart4.data.labels = labels
      if (_pvChart4.data.datasets[0]) _pvChart4.data.datasets[0].data = dataScans
      if (_pvChart4.data.datasets[1]) _pvChart4.data.datasets[1].data = dataCons
      slotData.forEach((sd,i) => { const dst=_pvChart4.data.datasets[2+i]; if (dst) dst.data=sd.data })
      delete _pvChart4.options.scales.x.min; delete _pvChart4.options.scales.x.max
      const _cap = labels // captura para closures de callback
      if (_pvChart4.options.scales?.x?.ticks)
        _pvChart4.options.scales.x.ticks.callback = (_,i) => _cap[i] || ''
      if (_pvChart4.options.plugins?.tooltip?.callbacks)
        _pvChart4.options.plugins.tooltip.callbacks.title = items => _cap[items[0]?.dataIndex ?? 0] || ''
      _pvChart4.update('none')
    }

    // Enlaza zoom por Shift+scroll y pan por arrastre al canvas del chart principal
    function pvBindZoomPan(chart) {
      if (!chart?.canvas) return
      // Limpiar handlers previos
      if (chart._pvWheelH) chart.canvas.removeEventListener('wheel', chart._pvWheelH)
      if (chart._pvMDownH) chart.canvas.removeEventListener('mousedown', chart._pvMDownH)
      if (chart._pvDblH)   chart.canvas.removeEventListener('dblclick', chart._pvDblH)
      if (_pvDocMoveH) { document.removeEventListener('mousemove', _pvDocMoveH); _pvDocMoveH = null }
      if (_pvDocUpH)   { document.removeEventListener('mouseup',   _pvDocUpH);   _pvDocUpH   = null }

      // Shift + scroll del mouse/trackpad → zoom centrado en la posición del cursor
      chart._pvWheelH = function(e) {
        if (!e.shiftKey) return
        e.preventDefault()
        const from = window._pvZoomFrom || window._pvZoomDefaultFrom
        const to   = window._pvZoomTo   || window._pvZoomDefaultTo
        if (!from || !to) return
        const rangeMs = to - from
        const ca = chart.chartArea, rect = chart.canvas.getBoundingClientRect()
        const pct = ca ? Math.max(0, Math.min(1, (e.clientX - rect.left - ca.left) / (ca.right - ca.left))) : 0.5
        // scroll arriba = acercar (0.68×), scroll abajo = alejar (1.47×)
        const factor = e.deltaY < 0 ? 0.68 : 1.47
        const newRange = Math.max(60000, Math.min(30*86400000, rangeMs * factor))
        const anchorMs = from + rangeMs * pct
        let newFrom = anchorMs - newRange * pct
        let newTo   = anchorMs + newRange * (1-pct)
        const hardMax = Date.now() + 3600000, hardMin = hardMax - 30*86400000
        if (newFrom < hardMin) { newFrom = hardMin; newTo = Math.min(hardMax, newFrom + newRange) }
        if (newTo > hardMax)   { newTo = hardMax;   newFrom = Math.max(hardMin, newTo - newRange) }
        pvApplyViewport(newFrom, newTo)
      }
      chart.canvas.addEventListener('wheel', chart._pvWheelH, { passive: false })

      // Arrastre → pan horizontal
      let dragging = false, dragX0 = 0, dragFrom0 = 0, dragTo0 = 0
      chart._pvMDownH = function(e) {
        if (e.button !== 0 || e.shiftKey) return
        dragging = true; dragX0 = e.clientX
        dragFrom0 = window._pvZoomFrom || window._pvZoomDefaultFrom
        dragTo0   = window._pvZoomTo   || window._pvZoomDefaultTo
        if (dragFrom0 && dragTo0) chart.canvas.style.cursor = 'grabbing'
        if (chart.options.plugins?.tooltip) chart.options.plugins.tooltip.enabled = false
      }
      chart.canvas.addEventListener('mousedown', chart._pvMDownH)

      const pvMoveH = function(e) {
        if (!dragging || !dragFrom0) return
        const ca = chart.chartArea; if (!ca) return
        const dx = e.clientX - dragX0
        const rangeMs = dragTo0 - dragFrom0
        const msPerPx = rangeMs / Math.max(1, ca.right - ca.left)
        const shift = -dx * msPerPx
        const hardMax = Date.now() + 3600000, hardMin = hardMax - 30*86400000
        let newFrom = Math.max(hardMin, dragFrom0 + shift)
        let newTo = newFrom + rangeMs
        if (newTo > hardMax) { newTo = hardMax; newFrom = Math.max(hardMin, newTo - rangeMs) }
        pvApplyViewport(newFrom, newTo)
      }
      const pvUpH = function() {
        if (!dragging) return
        dragging = false
        chart.canvas.style.cursor = ''
        if (chart.options.plugins?.tooltip) chart.options.plugins.tooltip.enabled = true
      }
      _pvDocMoveH = pvMoveH; _pvDocUpH = pvUpH
      document.addEventListener('mousemove', _pvDocMoveH)
      document.addEventListener('mouseup',   _pvDocUpH)

      // Doble clic → volver a la vista completa
      chart._pvDblH = function() {
        const f = window._pvZoomDefaultFrom, t2 = window._pvZoomDefaultTo
        if (f && t2) pvApplyViewport(f, t2)
        else { delete chart.options.scales.x.min; delete chart.options.scales.x.max; chart.update('none') }
      }
      chart.canvas.addEventListener('dblclick', chart._pvDblH)
    }

    // Filtrar mensajes para este usuario
    // Lógica: si usuario_id está → solo ese usuario
    // Si no → AND entre todos los filtros activos.
    // Soporta tanto campos nuevos (arrays) como campos viejos (single value).

      // canal_ids: alguno de los mis canales debe estar en la lista
      if (m.canal_ids?.length) {
        if (!m.canal_ids.some(id => misCanalesIds.includes(id))) return false
      }
      // provincias_arr: mi provincia debe estar en alguna de las seleccionadas
      if (m.provincias_arr?.length) {
        if (!m.provincias_arr.some(p => provinciasMias.includes(p))) return false
      }
      // ciudades_arr: mi ciudad debe estar en alguna de las seleccionadas
      if (m.ciudades_arr?.length) {
        if (!m.ciudades_arr.some(c => ciudadesMias.includes(c))) return false
      }

      // ── Compatibilidad con campos viejos (mensajes anteriores) ──
      if (!m.provincias_arr && !m.ciudades_arr && !m.canal_ids) {
        if (m.ciudad      && !ciudadesMias.includes(m.ciudad))      return false
        if (m.provincia   && !provinciasMias.includes(m.provincia)) return false
        if (m.tipo_acceso && m.tipo_acceso !== userTipoAcceso)      return false
      }

      return true
    })
    const totalScans = visitas.length
    const conv       = totalScans > 0 ? ((contactos.length / totalScans) * 100).toFixed(1) : 0

    // Campaña activa por canal
    const campanaActiva = {}
    ;(rCampanas.data || []).forEach(row => {
      const c = row.campanas
      if (!c?.activa) return
      const ini = c.fecha_inicio ? new Date(c.fecha_inicio) : null
      const fin = c.fecha_fin    ? new Date(c.fecha_fin)    : null
      if ((!ini || ini <= ahora) && (!fin || fin >= ahora)) {

      }

    // Mapa refCodigo → canalId (canal_id viene en misRefs)

    function compararPeriodo(actual, anterior) {
      if (anterior === 0) return { valor:null, nueva:actual > 0 }
      return { valor:Math.round((actual - anterior) / anterior * 100), nueva:false }
    }

    function metricasPasivo(contactos) {
      const corte30 = new Date(Date.now() - 30 * 86400000)
      const corte60 = new Date(Date.now() - 60 * 86400000)
      const v30 = visitas.filter(v => new Date(v.created_at) >= corte30).length
      const c30 = contactos.filter(c => new Date(c.created_at) >= corte30).length
      const vAnt = visitas.filter(v => { const d = new Date(v.created_at); return d >= corte60 && d < corte30 }).length
      const cAnt = contactos.filter(c => { const d = new Date(c.created_at); return d >= corte60 && d < corte30 }).length
      const conv30 = v30 > 0 ? Number((c30 / v30 * 100).toFixed(1)) : 0
      const convAnt = vAnt > 0 ? Number((cAnt / vAnt * 100).toFixed(1)) : 0
      return {
        v30, c30, vAnt, cAnt, conv30,
        deltaV: compararPeriodo(v30, vAnt),
        deltaC: compararPeriodo(c30, cAnt),
        deltaConv: vAnt > 0 ? { valor:Number((conv30 - convAnt).toFixed(1)), nueva:false } : { valor:null, nueva:conv30 > 0 },
      }
    }

    function renderDelta(delta, etiqueta = 'vs período anterior') {
      if (delta.nueva) return '<div class="pv-kpi-delta pv-delta-pos">Actividad nueva</div>'
      if (delta.valor === null) return '<div class="pv-kpi-delta pv-delta-neu">Sin comparación previa</div>'
      if (delta.valor === 0) return `<div class="pv-kpi-delta pv-delta-neu">Sin variación ${esc(etiqueta)}</div>`
      const positivo = delta.valor > 0
      return `<div class="pv-kpi-delta ${positivo ? 'pv-delta-pos' : 'pv-delta-neg'}">${positivo ? '↑' : '↓'} ${Math.abs(delta.valor)}${etiqueta.startsWith('puntos') ? '' : '%'} ${esc(etiqueta)}</div>`

    function fechaRelativa(dateStr) {
      const diff = Math.max(0, Date.now() - new Date(dateStr).getTime())
      const min = Math.floor(diff / 60000)
      if (min < 1) return 'ahora'
      if (min < 60) return `hace ${min} min`
      const hs = Math.floor(min / 60)
      if (hs < 24) return `hace ${hs} h`
      const ds = Math.floor(hs / 24)
      return `hace ${ds} día${ds === 1 ? '' : 's'}`
    }

    function datosEvolucionPasivo(contactos, desde, hasta) {
      const inicio = new Date(desde)
      inicio.setHours(0,0,0,0)
      const fin = new Date(hasta)
      fin.setHours(23,59,59,999)
      const dias = Math.max(1, Math.ceil((fin - inicio) / 86400000))
      const bloqueDias = dias <= 14 ? 1 : dias <= 45 ? 3 : dias <= 120 ? 7 : 30
      const labelsEvol = [], dataScans = [], dataConsultas = []

      for (let cursor = new Date(inicio); cursor <= fin; cursor = new Date(cursor.getTime() + bloqueDias * 86400000)) {
        const bloqueIni = new Date(cursor)
        const bloqueFin = new Date(Math.min(fin.getTime() + 1, bloqueIni.getTime() + bloqueDias * 86400000))
        labelsEvol.push(bloqueIni.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' }))
        dataScans.push(visitas.filter(v => { const d = new Date(v.created_at); return d >= bloqueIni && d < bloqueFin }).length)
        dataConsultas.push(contactos.filter(c => { const d = new Date(c.created_at); return d >= bloqueIni && d < bloqueFin }).length)
      }
      // Arrancar desde el primer día con actividad real
      const firstIdx = dataScans.findIndex((v, i) => v > 0 || dataConsultas[i] > 0)
      if (firstIdx > 0) {
        labelsEvol.splice(0, firstIdx)
        dataScans.splice(0, firstIdx)
        dataConsultas.splice(0, firstIdx)
      }
      return { labelsEvol, dataScans, dataConsultas }
    }

    function pvGrad(ctx, rgb, alto = .45) {
      const h = ctx.canvas.height || 260
      const g = ctx.createLinearGradient(0, 0, 0, h)
      g.addColorStop(0,   rgb.replace('rgb','rgba').replace(')',`, ${alto})`))
      g.addColorStop(0.6, rgb.replace('rgb','rgba').replace(')',`, ${+(alto * .22).toFixed(2)})`))
      g.addColorStop(1,   rgb.replace('rgb','rgba').replace(')',', 0)'))
      return g
    }

      // ── MODO HOY: actividad real por ventana de 15 minutos (sube y baja) ──
      if (modoHoy) {
        const tagEl = document.getElementById('pvLiveTag')
        const scansLEl = document.getElementById('pvLiveScansL')
        const consultasLEl = document.getElementById('pvLiveConsultasL')
        if (tagEl) tagEl.textContent = 'En vivo · actividad del día'
        if (scansLEl) scansLEl.textContent = 'Hoy · interacciones'
        if (consultasLEl) consultasLEl.textContent = 'Hoy · consultas'

        const VENTANA = 15 // minutos por bucket
        const hoyB0 = new Date(); hoyB0.setHours(0,0,0,0)
        const ahoraMin = new Date()
        const minutosDelDia = ahoraMin.getHours()*60 + ahoraMin.getMinutes() + 1
        const numBuckets = Math.ceil(minutosDelDia / VENTANA)

        const bucketScans = new Array(numBuckets).fill(0)
        const bucketCons  = new Array(numBuckets).fill(0)
        const inHoy = (iso) => { const d=new Date(iso); return d>=hoyB0&&d<=ahoraMin }
        visitas.forEach(v => {
          if (!inHoy(v.created_at)) return
          const d=new Date(v.created_at); const m=d.getHours()*60+d.getMinutes()
          const b=Math.floor(m/VENTANA); if(b<numBuckets) bucketScans[b]++
        })
        contactos.forEach(c => {
          if (!inHoy(c.created_at)) return
          const d=new Date(c.created_at); const m=d.getHours()*60+d.getMinutes()
          const b=Math.floor(m/VENTANA); if(b<numBuckets) bucketCons[b]++
        })

        const lbls = Array.from({length:numBuckets}, (_,i) => {
          const m = i * VENTANA
          const hh=String(Math.floor(m/60)).padStart(2,'0'), mm=String(m%60).padStart(2,'0')
          return (i % 2 === 0) ? `${hh}:${mm}` : ''
        })

        const totalPorBucket = bucketScans.map((s,i)=>s+bucketCons[i])
        const peakVal = Math.max(...totalPorBucket, 0)
        const peakIdx = peakVal>0 ? totalPorBucket.indexOf(peakVal) : -1

        // ── Líneas individuales por slot (modo Hoy, por bucket de 15min) ──
        const slotLinesHoy = []
        if (multiSlot) {
          misSlots.forEach(slot => {
            const visSlot = visitas.filter(v => v.canal_ref === slot.codigo && inHoy(v.created_at))
            const arr = new Array(numBuckets).fill(0)
            visSlot.forEach(v => { const d=new Date(v.created_at); const m=d.getHours()*60+d.getMinutes(); const b=Math.floor(m/VENTANA); if(b<numBuckets) arr[b]++ })
            if (arr.some(x => x > 0)) {
              const proy = proyImgs[slot.proyecto_slug]
              slotLinesHoy.push({ codigo: slot.codigo, nombre: proy?.nombre || slot.nombre || slot.codigo, color: colorDeSlot(slot.codigo), data: arr })
            }
          })
        }

        _pvChart4 = new Chart(ctx4, {
          type:'line',
          data:{ labels:lbls, datasets:datasetsBase([bucketScans, bucketCons], slotLinesHoy) },
          plugins:[
            {
              id:'pvLivePulse4',
              afterDatasetsDraw(chart) {
                const {ctx:c,data}=chart
                const t=(Date.now()%1600)/1600
                const pulse=(1-t)*14, alpha=(1-t)*0.55
                const lastIdx=(data.labels||[]).length-1
                if(lastIdx<0) return
                const drawPulse=(di,color)=>{
                  const meta=chart.getDatasetMeta(di)
                  if(!meta?.data?.length) return
                  const pt=meta.data[lastIdx]; if(!pt) return
                  c.save()
                  c.beginPath(); c.arc(pt.x,pt.y,pulse,0,Math.PI*2)
                  c.strokeStyle=color.replace('ALPHA',alpha.toFixed(3)); c.lineWidth=1.5; c.stroke()
                  c.beginPath(); c.arc(pt.x,pt.y,4,0,Math.PI*2)
                  c.fillStyle=color.replace('ALPHA','1'); c.shadowColor=color.replace('ALPHA','.8'); c.shadowBlur=12; c.fill()
                  c.restore()
                }
                drawPulse(0,'rgba(122,174,255,ALPHA)')
                drawPulse(1,'rgba(232,201,106,ALPHA)')
              }
            },
            pluginPeakMark(peakIdx),
            pluginGoldGlow
          ],
          options:{
            responsive:true, maintainAspectRatio:false,
            animation:{duration:900,easing:'easeOutQuart'},
            interaction:{mode:'index',intersect:false},
            layout:{padding:{top:14,right:16,bottom:2,left:2}},
            plugins:{
              legend:legendBase,
              tooltip:{
                ...tooltipBase,
                callbacks:{
                  title(items){ const i=items[0]?.dataIndex||0; const m=i*VENTANA; const hh=String(Math.floor(m/60)).padStart(2,'0'); const mm=String(m%60).padStart(2,'0'); return `${hh}:${mm} – ${hh}:${String(m%60+VENTANA-1).padStart(2,'0')}` },
                  label(ctx){ return ` ${ctx.dataset.label}: ${Number(ctx.raw||0).toLocaleString('es-AR')}` },
                  // Filtra los slot ocultos del tooltip automáticamente (hidden los excluye Chart.js)
                  afterBody(items){ return null }
                }
              }
            },
            scales:{
              x:{...scalesBase.x, ticks:{...scalesBase.x.ticks, autoSkip:false, callback:(_,i)=>lbls[i]||''}},
              y:scalesBase.y
            }
          }
        })

        // Contadores en vivo
        const refrescarContadores = () => {
          const hoy=new Date(); hoy.setHours(0,0,0,0)
          setText('pvLiveScans4', visitas.filter(v=>new Date(v.created_at)>=hoy).length)
          setText('pvLiveConsultas4', contactos.filter(v=>new Date(v.created_at)>=hoy).length)
          setText('pvLiveComisiones4', contactos.length)
        }
        refrescarContadores()

        // RAF loop para el pulso
        const loopLive = () => { if(_pvChart4&&_pvChart4.canvas){_pvChart4.draw();_pvLiveRAF=requestAnimationFrame(loopLive)}else{_pvLiveRAF=null} }
        setTimeout(() => { if(_pvChart4&&!_pvLiveRAF) loopLive() }, 950)

        // Zoom/pan interactivo: establecer viewport del día actual
        window._pvZoomDefaultFrom = hoyB0.getTime()
        window._pvZoomDefaultTo   = Date.now() + 3600000
        if (!window._pvZoomFrom || window._pvZoomFrom < hoyB0.getTime()) window._pvZoomFrom = window._pvZoomDefaultFrom
        if (!window._pvZoomTo)   window._pvZoomTo   = window._pvZoomDefaultTo
        pvBindZoomPan(_pvChart4)

        // Activar barra de zoom horario para modo Hoy
        const pvZB = document.getElementById('pvHoyZoomBar')
        if (pvZB) {
          window._pvHoyLbls = lbls
          window._pvHoyVENTANA = VENTANA
          const hOpts = (from, to, sel) => Array.from({length:to-from+1},(_,i)=>{
            const v=from+i; const hh=String(v).padStart(2,'0')
            return `<option value="${v}"${v===sel?' selected':''}>${hh}:00</option>`
          }).join('')
          const elD = document.getElementById('pvZoomDesde'); if (elD) elD.innerHTML = hOpts(0,23,0)
          const elH = document.getElementById('pvZoomHasta'); if (elH) elH.innerHTML = hOpts(1,24,24)
          pvZB.style.display = 'flex'
        }

        // Refresco real cada 30s (re-fetch desde Supabase)
        _pvLiveTimer = setInterval(async () => {
          const [rV, rC] = await Promise.all([
            supabase.from('visitas').select('created_at,canal_via,canal_ref').in('canal_ref', codigosRef),
            supabase.from('contactos').select('*').in('canal_ref', codigosRef).order('created_at',{ascending:false})
          ])
          if (rV.data) visitas = rV.data
          if (rC.data) contactos = rC.data
          renderGraficoPasivo(contactos, 0, null, null, { multiSlot: opciones.multiSlot === true })
          if (opciones.multiSlot) renderPanelesActivos(contactos)
        }, 30000)

      } else {
        // ── MODO PERÍODO: diario acumulado ───────────────────────────────
        // Ocultar barra de zoom (solo activa en modo Hoy)
        const pvZBP = document.getElementById('pvHoyZoomBar'); if (pvZBP) pvZBP.style.display = 'none'
        const hasta = hastaCustom ? new Date(`${hastaCustom}T23:59:59`) : new Date()
        const desde = desdeCustom ? new Date(`${desdeCustom}T00:00:00`) : new Date(hasta.getTime()-(dias-1)*86400000)
        const { labelsEvol, dataScans, dataConsultas } = datosEvolucionPasivo(contactos, desde, hasta)

        const combined = dataScans.map((s,i)=>s+dataConsultas[i])
        const peakVal = Math.max(...combined, 0)
        const peakIdx = peakVal>0 ? combined.indexOf(peakVal) : -1

        // ── Líneas individuales por slot (modo período, por bloque de días) ──
        const slotLinesPeriodo = []
        if (multiSlot) {
          const bloqueDias = Math.ceil((hasta - desde) / 86400000) <= 14 ? 1 : Math.ceil((hasta - desde) / 86400000) <= 45 ? 3 : 7
          misSlots.forEach(slot => {
            const visSlot = visitas.filter(v => v.canal_ref === slot.codigo && new Date(v.created_at) >= desde && new Date(v.created_at) <= hasta)
            if (!visSlot.length) return
            const arr = []
            for (let cursor = new Date(desde); cursor <= hasta; cursor = new Date(cursor.getTime() + bloqueDias * 86400000)) {
              const bIni = new Date(cursor)
              const bFin = new Date(Math.min(hasta.getTime() + 1, bIni.getTime() + bloqueDias * 86400000))
              arr.push(visSlot.filter(v => { const d = new Date(v.created_at); return d >= bIni && d < bFin }).length)
            }
            if (arr.some(x => x > 0)) {
              const proy = proyImgs[slot.proyecto_slug]
              slotLinesPeriodo.push({ codigo: slot.codigo, nombre: proy?.nombre || slot.nombre || slot.codigo, color: colorDeSlot(slot.codigo), data: arr })
            }
          })
        }

        const tagEl = document.getElementById('pvLiveTag')
        const scansLEl = document.getElementById('pvLiveScansL')
        const consultasLEl = document.getElementById('pvLiveConsultasL')
        if (tagEl) tagEl.textContent = desdeCustom ? `${desdeCustom.replace(/-/g,'/')} → ${hastaCustom.replace(/-/g,'/')}` : `Últimos ${dias} días`
        if (scansLEl) scansLEl.textContent = 'período · interacciones'
        if (consultasLEl) consultasLEl.textContent = 'período · consultas'
        setText('pvLiveScans4', dataScans.reduce((s,v)=>s+v,0))
        setText('pvLiveConsultas4', dataConsultas.reduce((s,v)=>s+v,0))
        setText('pvLiveComisiones4', contactos.length)

        _pvChart4 = new Chart(ctx4, {
          type:'line',
          data:{ labels:labelsEvol, datasets:datasetsBase([dataScans, dataConsultas], slotLinesPeriodo) },
          plugins:[pluginPeakMark(peakIdx), pluginGoldGlow],
          options:{
            responsive:true, maintainAspectRatio:false,
            animation:{duration:900,easing:'easeOutQuart'},
            interaction:{mode:'index',intersect:false},
            layout:{padding:{top:14,right:16,bottom:2,left:2}},
            plugins:{
              legend:legendBase,
              tooltip:{
                ...tooltipBase,
                callbacks:{ label(ctx){ return ` ${ctx.dataset.label}: ${Number(ctx.raw||0).toLocaleString('es-AR')}` } }
              }
            },
            scales:scalesBase
          }
        })
        // Zoom/pan interactivo: viewport del período actual
        window._pvZoomDefaultFrom = desde.getTime()
        window._pvZoomDefaultTo   = hasta.getTime()
        window._pvZoomFrom = window._pvZoomDefaultFrom
        window._pvZoomTo   = window._pvZoomDefaultTo
        pvBindZoomPan(_pvChart4)
      }

      // ── Leyenda interactiva (solo modo multi-slot) ──
      if (multiSlot) renderLeyendaMultiSlot(ctx4)

      // ── Mini sparklines (siempre, independiente del modo) ───────────────
      const hoy0=new Date(); hoy0.setHours(0,0,0,0)
      const ayer0=new Date(hoy0-86400000), ayerFin=new Date(hoy0-1)
      const sem0=new Date(hoy0-7*86400000), mes0=new Date(hoy0-30*86400000)
      const enRango=(iso,a,b)=>{ const d=new Date(iso); return d>=a&&d<=b }
      const accPorDia=(arr,desde,hasta)=>{
        const d=Math.max(1,Math.round((hasta-desde)/86400000)+1)
        const out=new Array(d).fill(0)
        arr.forEach(x=>{ if(!enRango(x.created_at,desde,hasta)) return; const idx=Math.floor((new Date(x.created_at)-desde)/86400000); if(idx>=0&&idx<d) out[idx]++ })
        let run=0; return out.map(v=>{run+=v;return run})
      }
      const miniCfg=(data,color)=>({
        type:'line',
        data:{labels:data.map((_,i)=>i),datasets:[{data,borderColor:color,borderWidth:2,tension:0.4,fill:true,pointRadius:0,cubicInterpolationMode:'monotone',
          backgroundColor:(c)=>{ const {ctx:cc,chartArea}=c.chart; if(!chartArea) return 'rgba(0,0,0,0)'; const g=cc.createLinearGradient(0,chartArea.top,0,chartArea.bottom); g.addColorStop(0,color.replace('1)','0.4)')); g.addColorStop(1,color.replace('1)','0)')); return g } }]},
        options:{responsive:true,maintainAspectRatio:false,animation:{duration:600},plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}}}
      })

      const dAyerS=accPorDia(visitas,ayer0,ayerFin), dAyerC=accPorDia(contactos,ayer0,ayerFin)
      const semAll=(()=>{ const d=7; const oS=new Array(d).fill(0),oC=new Array(d).fill(0)
        visitas.forEach(v=>{ if(!enRango(v.created_at,sem0,new Date())) return; const i=Math.floor((new Date(v.created_at)-sem0)/86400000); if(i>=0&&i<d) oS[i]++ })
        contactos.forEach(c=>{ if(!enRango(c.created_at,sem0,new Date())) return; const i=Math.floor((new Date(c.created_at)-sem0)/86400000); if(i>=0&&i<d) oC[i]++ })
        let rs2=0,rc2=0; return {s:oS.map(v=>{rs2+=v;return rs2}),c:oC.map(v=>{rc2+=v;return rc2})} })()
      const mesAll=(()=>{ const d=30; const oS=new Array(d).fill(0),oC=new Array(d).fill(0)
        visitas.forEach(v=>{ if(!enRango(v.created_at,mes0,new Date())) return; const i=Math.floor((new Date(v.created_at)-mes0)/86400000); if(i>=0&&i<d) oS[i]++ })
        contactos.forEach(c=>{ if(!enRango(c.created_at,mes0,new Date())) return; const i=Math.floor((new Date(c.created_at)-mes0)/86400000); if(i>=0&&i<d) oC[i]++ })
        let rs2=0,rc2=0; return {s:oS.map(v=>{rs2+=v;return rs2}),c:oC.map(v=>{rc2+=v;return rc2})} })()

      // Tasa de conversión diaria (últimos 30 días)
      const convData=new Array(30).fill(0).map((_,i)=>{
        const dIni=new Date(mes0.getTime()+i*86400000)
        const dFin=new Date(dIni.getTime()+86400000)
        const v=visitas.filter(x=>{ const d=new Date(x.created_at); return d>=dIni&&d<dFin }).length
        const c=contactos.filter(x=>{ const d=new Date(x.created_at); return d>=dIni&&d<dFin }).length
        return v>0 ? Number((c/v*100).toFixed(1)) : 0
      })
      const convDias=convData.filter(v=>v>0)
      const convProm=convDias.length ? Number((convDias.reduce((s,v)=>s+v,0)/convDias.length).toFixed(1)) : 0

      const ca=document.getElementById('pvMiniAyer')?.getContext('2d')
      const cb=document.getElementById('pvMiniSem')?.getContext('2d')
      const cc=document.getElementById('pvMiniMes')?.getContext('2d')
      const cd=document.getElementById('pvMiniConv')?.getContext('2d')
      if(ca) _pvChart4a=new Chart(ca,miniCfg(dAyerS.map((s,i)=>s+dAyerC[i]),'rgba(232,201,106,1)'))
      if(cb) _pvChart4b=new Chart(cb,miniCfg(semAll.s.map((s,i)=>s+semAll.c[i]),'rgba(122,174,255,1)'))
      if(cc) _pvChart4c=new Chart(cc,miniCfg(mesAll.s.map((s,i)=>s+mesAll.c[i]),'rgba(110,232,154,1)'))
      if(cd) _pvChart4d=new Chart(cd,miniCfg(convData,'rgba(255,160,80,1)'))

      setText('pvMiniAyerN', (dAyerS[dAyerS.length-1]||0)+(dAyerC[dAyerC.length-1]||0))
      setText('pvMiniSemN', (semAll.s[semAll.s.length-1]||0)+(semAll.c[semAll.c.length-1]||0))
      setText('pvMiniMesN', (mesAll.s[mesAll.s.length-1]||0)+(mesAll.c[mesAll.c.length-1]||0))
      const convEl=document.getElementById('pvMiniConvN'); if(convEl) convEl.textContent=`${convProm}%`
    }


    // El modo multi-slot aplica solo al canal activo (cuando hay slots asignados)
    const _modoMultiSlot = () => misSlots && misSlots.length > 0

    window.pvSetPeriodo = function(btn) {
      document.querySelectorAll('.pv-flt-btn').forEach(b => b.classList.remove('activo'))
      btn.classList.add('activo')
      const valor = btn.dataset.dias
      const custom = valor === 'custom'
      document.getElementById('pvFltCustom').style.display = custom ? '' : 'none'
      if (!custom) {
        const dias = valor === 'hoy' ? 0 : parseInt(valor, 10)
        renderGraficoPasivo(contactos, dias, null, null, { multiSlot: _modoMultiSlot() })
        if (_modoMultiSlot()) renderPanelesActivos(contactos)
      }
    }

    window.pvAplicarFechas = function() {
      const desde = document.getElementById('pvEvolDesde').value
      const hasta = document.getElementById('pvEvolHasta').value
      if (!desde || !hasta) { alert('Seleccioná una fecha desde y una hasta.'); return }
      if (desde > hasta) { alert('La fecha desde no puede ser posterior a la fecha hasta.'); return }
      renderGraficoPasivo(contactos, 30, desde, hasta, { multiSlot: _modoMultiSlot() })
      if (_modoMultiSlot()) renderPanelesActivos(contactos)
    }

    // ── Canal activo: propiedades con mini-chart individual ──────────────────
    function renderSlotCards() {
      if (!misSlots.length) return `
        <div class="pv-sec">
          <div class="pv-sec-head"><div>
            <div class="pv-sec-titulo">Mis propiedades</div>
            <div class="pv-sec-sub">Aún no tenés slots asignados. El administrador te los va a asignar.</div>
          </div></div>
        </div>`

      const activosCount = misSlots.filter(s => s.activo !== false).length
      const cards = misSlots.map(slot => {
        const proy       = proyImgs[slot.proyecto_slug]
        const prop       = findPropData(slot.proyecto_slug)
        const fotoUrl    = proy?.foto_portada || prop?.imagenes?.[0] || ''
        const proyNombre = proy?.nombre || prop?.titulo || slot.nombre || slot.codigo
        const attrSrc    = prop || proy
        const scans      = scansPorSlot[slot.codigo] || 0
        const slotCons   = contactos.filter(c => c.canal_ref === slot.codigo)
        const conv       = scans > 0 ? ((slotCons.length / scans) * 100).toFixed(1) + '%' : '—'
        const esActivo   = slot.activo !== false
        const redirectUrl = `${location.origin}/r/${slot.codigo}`
        const imgStyle = fotoUrl ? `background-image:url('${fotoUrl.replace(/'/g,"\\'")}')` : ''
        const ptrOff = !esActivo ? 'pointer-events:none' : ''
        const colorHex = colorDeSlot(slot.codigo)

        // Atributos de propiedad (preferir propiedades sobre proyectos)
        const attrs = []
        if (attrSrc?.dormitorios)         attrs.push({ v: attrSrc.dormitorios,                     l: 'DORM.' })
        if (attrSrc?.banos)               attrs.push({ v: attrSrc.banos,                            l: 'BAÑOS' })
        if (attrSrc?.superficie_cubierta) attrs.push({ v: attrSrc.superficie_cubierta + ' m²',     l: 'M² CUB.' })
        if (attrSrc?.superficie_total)    attrs.push({ v: attrSrc.superficie_total + ' m²',        l: 'M² TOT.' })
        const attrsHtml = attrs.length ? `
          <div class="slot-attrs">
            ${attrs.map(a => `<div class="slot-attr"><span class="slot-attr-v">${a.v}</span><span class="slot-attr-l">${a.l}</span></div>`).join('')}
          </div>` : ''

        return `
        <div class="slot-full-card${esActivo ? '' : ' slot-full-inactivo'}">
          <div class="slot-full-left">
            <div class="slot-full-img"${imgStyle ? ` style="${imgStyle}"` : ''}>
              <div class="slot-full-img-overlay"></div>
              <div class="slot-img-top">
                <div class="slot-full-eyebrow">${esc(slot.codigo)}</div>
                <div class="qr-slot-estado-badge ${esActivo?'activo':'inactivo'}">${esActivo?'● ACTIVO':'● INACTIVO'}</div>
              </div>
              <div class="slot-img-bottom">
                <div class="slot-full-nombre">${esc(proyNombre)}</div>
                ${attrsHtml}
              </div>
            </div>
            <div class="slot-full-body">
              <div class="slot-full-stats">
                <div class="slot-stat">
                  <span class="slot-stat-n" style="color:${colorHex};">${scans}</span>
                  <span class="slot-stat-l">SCANS · 30D</span>
                </div>
                <div class="slot-stat">
                  <span class="slot-stat-n" style="color:#e8c96a;">${slotCons.length}</span>
                  <span class="slot-stat-l">CONSULTAS</span>
                </div>
                <div class="slot-stat">
                  <span class="slot-stat-n">${conv}</span>
                  <span class="slot-stat-l">CONVERSIÓN</span>
                </div>
              </div>
              <div class="slot-full-qr-footer" style="${ptrOff}">
                <div class="qr-slot-canvas-wrap" style="padding:5px;">
                  <canvas id="qr-canvas-${slot.id}" width="70" height="70"></canvas>

                <div style="display:flex;flex-direction:column;gap:.35rem;">
                  <button class="qr-slot-btn" onclick="descargarQR('qr-canvas-${slot.id}','${slot.codigo}')">Descargar QR</button>
                  <button class="qr-slot-btn" onclick="copiarLink('${redirectUrl}',this)">Copiar link</button>
                </div>
              </div>
              ${!esActivo ? '<div class="qr-slot-inactivo-banner">Esta propiedad ya no está disponible · Retirá el material impreso.</div>' : ''}
            </div>
          </div>
          <div class="slot-full-right">
            <div class="slot-chart-label" style="color:${colorHex};opacity:.8;">Interacciones · últimos 30 días</div>
            <div class="slot-chart-wrap"><canvas id="slot-chart-${slot.id}"></canvas></div>
            <div class="slot-chart-total">${scans} total</div>
          </div>
        </div>`
      }).join('')

      return `
        <div class="pv-sec">
          <div class="pv-sec-head">
            <div>
              <div class="pv-sec-titulo">Mis propiedades activas</div>
              <div class="pv-sec-sub">QR, estadísticas y actividad individual de cada propiedad.</div>
            </div>
            <span style="font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c9a84c;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.22);border-radius:999px;padding:.28rem .85rem;">${activosCount} activa${activosCount!==1?'s':''}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:.85rem;">${cards}</div>
        </div>`
    }

    function renderSlotMiniCharts() {
      if (typeof Chart === 'undefined') return
      const ahora  = new Date()
      const dias30 = Array.from({length: 30}, (_, i) => {
        const d = new Date(ahora); d.setDate(d.getDate() - (29 - i)); d.setHours(0,0,0,0); return d
      })
      const labels = dias30.map(d => d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'}))

      const hace30Slot = new Date(Date.now() - 30 * 86400000)

      misSlots.forEach(slot => {
        const canvas = document.getElementById(`slot-chart-${slot.id}`)
        if (!canvas) return
        // Color determinístico de la propiedad
        const colorHex = colorDeSlot(slot.codigo)
        const rgba = (a) => colorHex.replace('#','').match(/.{2}/g).map(x=>parseInt(x,16)).join(',')+`,${a}`
        // Solo últimos 30 días, filtrado por slot
        const slotVis = visitas.filter(v =>
          v.canal_ref === slot.codigo && new Date(v.created_at) >= hace30Slot
        )
        const data = dias30.map(dIni => {
          const dFin = new Date(dIni.getTime() + 86400000)
          return slotVis.filter(v => { const d = new Date(v.created_at); return d >= dIni && d < dFin }).length
        })
        const ctx2d = canvas.getContext('2d')
        new Chart(ctx2d, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              data,
              borderColor: colorHex,
              borderWidth: 2.5,
              tension: 0.4,
              cubicInterpolationMode: 'monotone',
              fill: true,
              // Gradiente creado dentro del contexto del chart (cuando ya tiene dimensiones)
              backgroundColor: (context) => {
                const chart = context.chart
                const { ctx: c, chartArea } = chart
                if (!chartArea) return `rgba(${rgba(0.2)})`
                const g = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom)
                g.addColorStop(0,   `rgba(${rgba(0.50)})`)
                g.addColorStop(0.5, `rgba(${rgba(0.15)})`)
                g.addColorStop(1,   `rgba(${rgba(0.00)})`)
                return g
              },
              pointRadius: 0,
              pointHoverRadius: 5,
              pointHoverBackgroundColor: colorHex,
              pointHoverBorderColor: '#fff',
              pointHoverBorderWidth: 2,
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            animation: { duration: 800, easing: 'easeOutQuart' },
            interaction: { mode: 'index', intersect: false },
            layout: { padding: { top: 6, right: 4, bottom: 0, left: 0 } },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: 'rgba(18,18,21,.96)',
                borderColor: 'rgba(255,255,255,.12)', borderWidth: 1,
                titleColor: 'rgba(255,255,255,.55)', titleFont: { size: 10 },
                bodyColor: colorHex, bodyFont: { size: 12, weight: '600' },
                padding: 10, cornerRadius: 6,
                callbacks: {
                  title: ctx => ctx[0].label,
                  label: ctx => ` ${ctx.raw} interacción${ctx.raw !== 1 ? 'es' : ''}`
                }
              }
            },
            scales: {
              x: {
                offset: true,
                border: { display: false },
                grid: { display: false },
                ticks: {
                  color: 'rgba(255,255,255,.28)',
                  maxRotation: 0,
                  autoSkip: true,
                  maxTicksLimit: 6,
                  padding: 4,
                  font: { size: 9, family: 'Inter' },
                  callback: (_, i) => labels[i] || ''
                }
              },
              y: {
                beginAtZero: true,
                suggestedMax: Math.max(...data, 3),
                border: { display: false },
                grid: { color: 'rgba(255,255,255,.05)', drawTicks: false },
                ticks: {
                  color: 'rgba(255,255,255,.28)',
                  precision: 0,
                  maxTicksLimit: 4,
                  padding: 6,
                  font: { size: 9, family: 'Inter' },
                  callback: v => Number(v).toLocaleString('es-AR')
                }
              }
            }
          }
        })
      })
    }

    // Panel 1 — Actividad general · últimos 30 días
    function panelActividad30d(contactos) {
      const hoy0 = new Date(); hoy0.setHours(0,0,0,0)
      const mes0 = new Date(hoy0 - 30*86400000)
      const dias = Array.from({length:30}, (_,i)=>{ const d=new Date(mes0); d.setDate(d.getDate()+i); return d })
      const dataScans = dias.map(dIni => { const dFin=new Date(dIni.getTime()+86400000); return visitas.filter(v=>{const d=new Date(v.created_at);return d>=dIni&&d<dFin}).length })
      const dataCons  = dias.map(dIni => { const dFin=new Date(dIni.getTime()+86400000); return contactos.filter(c=>{const d=new Date(c.created_at);return d>=dIni&&d<dFin}).length })
      const slotLines = misSlots.map(slot => {
        const arr = dias.map(dIni => { const dFin=new Date(dIni.getTime()+86400000); return visitas.filter(v=>v.canal_ref===slot.codigo&&(()=>{const d=new Date(v.created_at);return d>=dIni&&d<dFin})()).length })
        const proy = proyImgs[slot.proyecto_slug]
        return { codigo: slot.codigo, nombre: proy?.nombre || slot.nombre || slot.codigo, color: colorDeSlot(slot.codigo), data: arr }
      }).filter(ln => ln.data.some(x=>x>0))
      const totalScans = dataScans.reduce((s,v)=>s+v,0)
      const hayDatos = totalScans > 0 || dataCons.reduce((s,v)=>s+v,0) > 0
      return `
        <div class="pv-panel">
          <div class="pv-panel-head">
            <div>
              <div class="pv-panel-titulo">Actividad general · últimos 30 días</div>
              <div class="pv-panel-sub">Total de interacciones, consultas y cada propiedad.</div>
            </div>
          </div>
          ${hayDatos ? `<div class="pv-panel-chart"><canvas id="pvPanelAct30"></canvas></div>
            <div class="pv-panel-foot"><div id="pvPanelActLegend"></div></div>`
            : `<div class="pv-panel-empty"><div><div class="pv-panel-empty-mark"></div>Sin actividad en los últimos 30 días.</div></div>`}
        </div>`
    }

    // Panel 2 — Conversión · últimos 30 días
    function panelConversion30d(contactos) {
      const hoy0 = new Date(); hoy0.setHours(0,0,0,0)
      const mes0 = new Date(hoy0 - 30*86400000)
      const prev0 = new Date(hoy0 - 60*86400000)
      const dias = Array.from({length:30}, (_,i)=>{ const d=new Date(mes0); d.setDate(d.getDate()+i); return d })
      const convDiaria = dias.map(dIni => { const dFin=new Date(dIni.getTime()+86400000); const v=visitas.filter(x=>{const d=new Date(x.created_at);return d>=dIni&&d<dFin}).length; const c=contactos.filter(x=>{const d=new Date(x.created_at);return d>=dIni&&d<dFin}).length; return v>0?Number((c/v*100).toFixed(1)):0 })
      const v30 = visitas.filter(v=>new Date(v.created_at)>=mes0).length
      const c30 = contactos.filter(c=>new Date(c.created_at)>=mes0).length
      const vAnt = visitas.filter(v=>{const d=new Date(v.created_at);return d>=prev0&&d<mes0}).length
      const cAnt = contactos.filter(c=>{const d=new Date(c.created_at);return d>=prev0&&d<mes0}).length
      const conv30 = v30 > 0 ? Number((c30/v30*100).toFixed(1)) : 0
      const convAnt = vAnt > 0 ? Number((cAnt/vAnt*100).toFixed(1)) : null
      const delta = convAnt !== null ? Number((conv30-convAnt).toFixed(1)) : null
      const hayDatos = v30 > 0
      return `
        <div class="pv-panel">
          <div class="pv-panel-head">
            <div>
              <div class="pv-panel-titulo">Conversión · últimos 30 días</div>
              <div class="pv-panel-sub">Consultas ÷ interacciones × 100.</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:1.6rem;font-weight:300;color:#e8c96a;line-height:1;">${conv30}%</div>
              ${delta !== null ? `<div style="font-size:.58rem;color:${delta>=0?'#6ee89a':'#d9825b'};margin-top:.2rem;">${delta>=0?'↑':'↓'} ${Math.abs(delta)} pts vs período anterior</div>` : (conv30>0?`<div style="font-size:.58rem;color:#6ee89a;margin-top:.2rem;">Actividad nueva</div>`:'')}
            </div>
          </div>
          ${hayDatos ? `<div class="pv-panel-chart"><canvas id="pvPanelConv30"></canvas></div>
            <div class="pv-panel-foot" style="display:flex;gap:1.2rem;font-size:.62rem;color:rgba(255,255,255,.4);">
              <span><strong style="color:#7aaeff;">${v30}</strong> interacciones</span>
              <span><strong style="color:#e8c96a;">${c30}</strong> consultas</span>
            </div>`
            : `<div class="pv-panel-empty"><div><div class="pv-panel-empty-mark"></div>Sin interacciones en el período.</div></div>`}
        </div>`
    }

      const qr = visitas.filter(v => v.canal_via === 'qr').length

          </div>
        </div>`
      }).join('')
      return `
        <div class="pv-panel">
          <div class="pv-panel-head"><div>
            <div class="pv-panel-titulo">Origen de las interacciones</div>
            <div class="pv-panel-sub">${total.toLocaleString('es-AR')} interacciones registradas.</div>
          </div></div>
          <div class="pv-origen-list">${filas}</div>
        </div>`
