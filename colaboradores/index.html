<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Panel — Sur Patagonia Colaboradores</title>
  <link rel="manifest" href="/colaboradores/manifest.json">
  <meta name="theme-color" content="#090909">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sur Patagonia">
  <link rel="apple-touch-icon" href="/assets/app-icon-180.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/colaboradores/sw.js', { scope: '/colaboradores/' });
      });
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #090909;
      --card: #141414;
      --border: rgba(255,255,255,0.07);
      --accent: #d76f3f;
      --dorado: #c9a84c;
      --verde: #50c878;
      --gris: #aaa;
      --blanco: #f5f3f0;
      --rojo: #e05c5c;
    }
    body {
      background: var(--bg);
      color: var(--blanco);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: rgba(9,9,9,.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-brand { display:flex; flex-direction:row; align-items:center; gap:.9rem; }
    .header-brand img { width:240px; height:auto; filter:brightness(0) invert(1); opacity:.96; }
    .header-brand span { color:rgba(255,255,255,.45); font-size:.52rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase; padding-left:.9rem; border-left:1px solid rgba(255,255,255,.12); }
    .sp-bg-brand {
      position: fixed;
      bottom: 6vh; left: 0; right: 0;
      height: 65vh;
      background: url('../assets/ChatGPT Image 19 jun 2026, 23_34_52.png') center 52% / cover no-repeat;
      filter: grayscale(1) brightness(0.75);
      opacity: .11;
      pointer-events: none;
      z-index: 9;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 82%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 82%, transparent 100%);
    }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .header-canal { font-size: .75rem; color: var(--gris); }
    .header-canal strong { color: var(--blanco); display: block; font-size: .82rem; }
    .btn-salir {
      background: none;
      border: 1px solid var(--border);
      color: var(--gris);
      padding: .35rem .8rem;
      border-radius: 8px;
      font-size: .72rem;
      cursor: pointer;
      font-family: inherit;
      transition: all .18s;
    }
    .btn-salir:hover { border-color: var(--rojo); color: var(--rojo); }

    /* Main */
    .main { max-width: 900px; margin: 0 auto; padding: 2rem 1.4rem; }

    /* Hero pasivo */
    .pasivo-hero {
      position: relative; overflow: hidden;
      padding: 2rem 2.2rem 1.8rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(201,168,76,.18);
      border-top: 1px solid rgba(201,168,76,.48);
      border-radius: 14px;
      background:
        radial-gradient(circle at 92% 20%, rgba(215,111,63,.1), transparent 32%),
        linear-gradient(135deg, rgba(201,168,76,.09), rgba(255,255,255,.01) 60%),
        #11100e;
    }
    .pasivo-hero::after {
      content: ''; position: absolute; inset: auto 0 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,.4), transparent);
    }
    .pasivo-eyebrow { font-size:.55rem; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:#c9a84c; margin-bottom:.6rem; }
    .pasivo-titulo {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800; letter-spacing: -.03em; line-height: 1; text-transform: uppercase;
      background: linear-gradient(120deg, #ffffff 0%, rgba(255,255,255,.6) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: .4rem;
    }
    .pasivo-geo { font-size:.61rem; color:rgba(255,255,255,.3); letter-spacing:.14em; text-transform:uppercase; margin-top:.4rem; }
    .pasivo-status { display:flex; align-items:center; gap:.5rem; margin-top:.9rem; font-size:.61rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.45); }

    /* Estado QR */
    .qr-status {
      background: linear-gradient(160deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,.02) 100%);
      border: 1px solid rgba(255,255,255,.07);
      border-top: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      padding: 1rem 1.3rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .qr-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .qr-dot.activo { background: var(--verde); box-shadow: 0 0 8px rgba(80,200,120,.5); }
    .qr-dot.campana { background: var(--dorado); box-shadow: 0 0 8px rgba(201,168,76,.5); }
    .qr-dot.inactivo { background: var(--gris); }
    .qr-info { flex: 1; }
    .qr-label { font-size: .7rem; color: var(--gris); }
    .qr-valor { font-size: .85rem; font-weight: 600; }
    .qr-codigo { font-family: monospace; font-size: .72rem; color: var(--accent); margin-left: auto; }

    /* KPIs */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: .8rem;
      margin-bottom: 1.2rem;
    }
    .kpi {
      background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%);
      border: 1px solid rgba(255,255,255,.08);
      border-top: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
      position: relative; overflow: hidden;
    }
    .kpi::before { content:''; position:absolute; left:0; top:20%; bottom:20%; width:2px; background:linear-gradient(to bottom,transparent,var(--c,#c9a84c),transparent); border-radius:99px; }
    .kpi-grid .kpi:nth-child(1) { --c:#d76f3f; }
    .kpi-grid .kpi:nth-child(2) { --c:#6495ed; }
    .kpi-grid .kpi:nth-child(3) { --c:#c9a84c; }
    .kpi-grid .kpi:nth-child(4) { --c:#3bbf88; }
    .kpi-n {
      font-size: 2.45rem;
      font-weight: 300;
      line-height: 1;
      margin-bottom: .3rem;
      background: linear-gradient(135deg, #fff, rgba(255,255,255,.7));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .kpi-n.accent { background: linear-gradient(135deg,#d76f3f,#e8956a); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .kpi-n.dorado { background: linear-gradient(135deg,#c9a84c,#e8c96a); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .kpi-n.verde  { background: linear-gradient(135deg,#3bbf88,#5de0a0); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .kpi-label { font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gris); font-weight: 600; }
    .kpi-sub { font-size: .65rem; color: var(--gris); margin-top: .3rem; }

    /* Sección */
    .seccion {
      background: linear-gradient(160deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,.02) 100%);
      border: 1px solid rgba(255,255,255,.07);
      border-top: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      padding: 1.3rem 1.4rem;
      margin-bottom: 1.2rem;
    }
    .sec-titulo {
      font-size: .6rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gris);
      font-weight: 600;
      margin-bottom: 1rem;
    }

    /* Tabla consultas */
    .tabla { width: 100%; border-collapse: collapse; }
    .tabla th {
      font-size: .58rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gris);
      font-weight: 600;
      padding: .55rem .7rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .tabla td {
      font-size: .76rem;
      color: var(--blanco);
      padding: .75rem .7rem;
      border-bottom: 1px solid rgba(255,255,255,.04);
      vertical-align: top;
    }
    .tabla tr:last-child td { border-bottom: none; }

    /* Estado badges */
    .estado-badge {
      display: inline-block;
      padding: .15rem .55rem;
      border-radius: 999px;
      font-size: .6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      white-space: nowrap;
    }
    .estado-nueva        { background: rgba(179,157,219,.09); color: #b39ddb; border-color: rgba(179,157,219,.35); }
    .estado-en_contacto  { background: rgba(201,168,76,.12); color: var(--dorado); }
    .estado-en_negociacion { background: rgba(215,111,63,.12); color: var(--accent); }
    .estado-cerrada      { background: rgba(169,220,122,.12); color: #a9dc7a; }
    .estado-descartada   { background: rgba(136,136,136,.12); color: var(--gris); }
    /* Estados reales de producción — gobernanza visual */
    .estado-contactado   { background: rgba(53,198,180,.09); color: #35c6b4; border-color: rgba(53,198,180,.35); }
    .estado-visita       { background: rgba(242,154,90,.09); color: #f29a5a; border-color: rgba(242,154,90,.35); }
    .estado-descartado   { background: rgba(123,127,136,.12); color: #7b7f88; border-color: rgba(123,127,136,.28); }

    /* Via badge */
    .via-badge {
      font-size: .6rem;
      color: #6495ed;
      font-family: monospace;
    }
    .via-badge.qr { color: var(--verde); }

    .empty-msg {
      text-align: center;
      padding: 2rem;
      color: var(--gris);
      font-size: .8rem;
    }

    /* Tipo canal badge */
    .tipo-pill {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .62rem;
      font-weight: 600;
      padding: .18rem .55rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .tipo-pasivo    { background: rgba(136,136,136,.12); color: var(--gris); border: 1px solid rgba(136,136,136,.2); }
    .tipo-activo    { background: rgba(201,168,76,.1); color: var(--dorado); border: 1px solid rgba(201,168,76,.25); }

    .sp { width: 28px; height: 28px; border: 2px solid rgba(255,255,255,.1); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 4rem auto; display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider { height: 1px; background: var(--border); margin: 1.4rem 0; }

    /* ── Mensajes ── */
    .msg-inbox { display:flex; flex-direction:column; gap:.5rem; }
    .msg-card { background:rgba(255,255,255,.025); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .msg-card-head { display:flex; align-items:center; gap:.7rem; padding:.85rem 1rem; cursor:pointer; }
    .msg-unread-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; }
    .msg-unread-dot.leido { background:transparent; }
    .msg-card-asunto { font-size:.82rem; font-weight:600; color:var(--blanco); flex:1; }
    .msg-card-fecha  { font-size:.62rem; color:var(--gris); white-space:nowrap; }
    .msg-card-body   { display:none; border-top:1px solid var(--border); padding:.9rem 1rem 1rem; }
    .msg-card-body.open { display:block; }
    .msg-card-cuerpo { font-size:.78rem; color:rgba(255,255,255,.78); line-height:1.7; white-space:pre-wrap; margin-bottom:.8rem; }

    .reply-area { margin-top:.6rem; }
    .reply-titulo { font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gris); font-weight:600; margin-bottom:.55rem; }
    .reply-item-colab { background:rgba(215,111,63,.07); border-radius:8px; padding:.55rem .75rem; margin-bottom:.35rem; }
    .reply-item-colab .reply-cuerpo { font-size:.75rem; color:rgba(255,255,255,.7); }
    .reply-item-colab .reply-meta { font-size:.6rem; color:var(--gris); margin-top:.2rem; }
    .reply-input {
      width:100%; padding:.5rem .7rem; background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.1); color:var(--blanco);
      border-radius:8px; font-family:'Inter',sans-serif; font-size:.76rem;
      resize:vertical; min-height:60px; box-sizing:border-box; margin-top:.4rem;
    }
    .reply-input:focus { outline:none; border-color:rgba(215,111,63,.5); }
    .btn-reply {
      margin-top:.5rem; padding:.42rem 1rem; background:var(--accent); color:#fff;
      border:none; border-radius:8px; font-size:.72rem; font-weight:600;
      cursor:pointer; font-family:'Inter',sans-serif; transition:opacity .15s;
    }
    .btn-reply:hover { opacity:.85; }
    .btn-reply:disabled { opacity:.4; cursor:not-allowed; }
    .no-msgs { text-align:center; padding:2rem; color:var(--gris); font-size:.78rem; }
    .badge-nuevo { font-size:.58rem; background:rgba(215,111,63,.15); color:var(--accent); border-radius:999px; padding:.1rem .5rem; flex-shrink:0; }

    /* ── Panel de impacto del aliado ── */
    .main.pv-main { max-width:1220px; padding-top:1.5rem; }
    .pv-hero { position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:2rem; min-height:230px; padding:2.4rem 2.2rem; margin-bottom:.75rem; border:1px solid rgba(201,168,76,.18); border-top-color:rgba(201,168,76,.52); border-radius:14px; background:radial-gradient(circle at 88% 20%,rgba(215,111,63,.13),transparent 34%),linear-gradient(135deg,rgba(201,168,76,.1),rgba(255,255,255,.015) 58%),#11100e; }
    .pv-hero::after { content:''; position:absolute; inset:auto 0 0; height:1px; background:linear-gradient(90deg,transparent,rgba(201,168,76,.45),transparent); }
    .pv-hero-eyebrow { margin-bottom:1.1rem; color:#c9a84c; font-size:.55rem; font-weight:700; letter-spacing:.24em; text-transform:uppercase; }
    .pv-hero-hola { color:rgba(255,255,255,.45); font-family:'Inter',sans-serif; font-size:.82rem; font-weight:300; line-height:1.1; letter-spacing:.04em; }
    .pv-hero-hola strong { display:block; font-family:'Inter',sans-serif; font-size:2rem; font-weight:700; color:#f5f3f0; letter-spacing:-.02em; line-height:1.05; margin-top:.25rem; }
    .pv-hero-impacto { max-width:560px; margin-top:1.1rem; color:rgba(255,255,255,.52); font-size:.83rem; line-height:1.65; }
    .pv-hero-geo { display:none; }
    .pv-identity { display:flex; flex-direction:column; align-items:center; gap:.85rem; min-width:150px; }
    .pv-monogram { width:82px; height:82px; display:grid; place-items:center; border:1px solid rgba(201,168,76,.32); border-radius:50%; background:rgba(201,168,76,.07); color:#e8c96a; font-family:'Cormorant Garamond',serif; font-size:1.75rem; letter-spacing:.08em; box-shadow:0 0 32px rgba(201,168,76,.08); }
    .pv-monogram-mobile { display:none; }
    .pv-mini-mapa-wrap { display:flex; flex-direction:column; align-items:center; gap:.45rem; }
    .pv-mini-mapa { width:220px; height:220px; overflow:hidden; border:1px solid rgba(201,168,76,.25); border-radius:10px; background:#111; pointer-events:none; }
    .pv-mini-mapa-label { max-width:220px; color:rgba(255,255,255,.3); font-size:.56rem; letter-spacing:.14em; text-align:center; text-transform:uppercase; }
    #pvMiniMapa .leaflet-control-zoom, #pvMiniMapa .leaflet-control-attribution { display:none !important; }
    .pv-img-hero .pv-mini-mapa-wrap {
      position:absolute; right:clamp(1rem,3vw,2.5rem); top:50%; bottom:auto; transform:translateY(-50%); z-index:3;
    }
    .pv-hero-estado { display:flex; align-items:center; justify-content:center; gap:.5rem; color:rgba(255,255,255,.55); font-size:.61rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
    .pv-hero-code { color:rgba(255,255,255,.18); font-family:monospace; font-size:.56rem; }
    .pv-resumen { margin-bottom:1.25rem; padding:.75rem 1rem; text-align:center; color:rgba(255,255,255,.42); font-size:.72rem; }
    .pv-resumen strong { color:#e8c96a; font-weight:600; }
    .pv-kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.8rem; margin-bottom:1rem; }
    .pv-kpi { position:relative; overflow:hidden; min-height:148px; padding:1.25rem 1.3rem; border:1px solid rgba(255,255,255,.07); border-top-color:rgba(255,255,255,.13); border-radius:12px; background:linear-gradient(145deg,rgba(255,255,255,.052),rgba(255,255,255,.018)); }
    .pv-kpi::before { content:''; position:absolute; left:0; top:22%; bottom:22%; width:2px; background:var(--pv-c,#c9a84c); opacity:.75; }
    .pv-kpi-label { margin-bottom:.55rem; color:rgba(255,255,255,.42); font-size:.58rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase; }
    .pv-kpi-n { font-size:2.45rem; font-weight:300; line-height:1; background:linear-gradient(135deg,#fff,rgba(255,255,255,.7)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .pv-kpi-n.pv-dorado { background:linear-gradient(135deg,#c9a84c,#e8c96a); background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .pv-kpi-sub { margin-top:.55rem; color:rgba(255,255,255,.3); font-size:.63rem; line-height:1.45; }
    .pv-kpi-delta { display:inline-flex; align-items:center; gap:.25rem; margin-top:.45rem; font-size:.61rem; font-weight:600; }
    .pv-delta-pos { color:#47d48a; }
    .pv-delta-neg { color:#d9825b; }
    .pv-delta-neu { color:rgba(255,255,255,.3); }
    .pv-sec { padding:1.45rem 1.55rem; margin-bottom:1rem; border:1px solid rgba(255,255,255,.07); border-top-color:rgba(255,255,255,.12); border-radius:12px; background:linear-gradient(155deg,rgba(255,255,255,.042),rgba(255,255,255,.014)); }
    .pv-sec-head { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin-bottom:1.15rem; }
    .pv-sec-titulo { color:var(--gris); font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    .pv-sec-sub { margin-top:.35rem; color:rgba(255,255,255,.45); font-size:.66rem; }
    .pv-chart-wrap { position:relative; height:270px; }
    .pv-opt-label { font-size:.55rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.35); margin-bottom:.65rem; padding-bottom:.5rem; border-bottom:1px solid rgba(255,255,255,.06); }
    .pv-flt-bar { display:flex; align-items:center; gap:.35rem; flex-wrap:wrap; }
    .pv-flt-btn { min-height:32px; padding:.36rem .88rem; border:1px solid rgba(255,255,255,.09); border-radius:8px; background:rgba(255,255,255,.05); color:rgba(255,255,255,.5); font:600 .63rem 'Inter',sans-serif; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; transition:all .2s; }
    .pv-flt-btn:hover { border-color:rgba(201,168,76,.35); color:var(--dorado); }
    .pv-flt-btn.activo { background:linear-gradient(135deg,rgba(201,168,76,.22),rgba(201,168,76,.08)); border-color:rgba(201,168,76,.42); color:#e8c96a; box-shadow:0 0 14px rgba(201,168,76,.12); }
    .pv-flt-custom { display:flex; align-items:flex-end; justify-content:flex-end; gap:.55rem; margin:0 0 1rem; padding:.7rem; border-top:1px solid rgba(255,255,255,.05); }
    .pv-flt-custom label { display:flex; flex-direction:column; gap:.3rem; color:rgba(255,255,255,.3); font-size:.55rem; text-transform:uppercase; letter-spacing:.09em; }
    .pv-fecha-input { padding:.38rem .5rem; border:1px solid rgba(255,255,255,.1); border-radius:7px; background:rgba(255,255,255,.04); color:#f5f3f0; color-scheme:dark; font:500 .67rem 'Inter',sans-serif; }
    .pv-aplicar { min-height:31px; padding:.35rem .75rem; border:0; border-radius:7px; background:#c9a84c; color:#15130e; font:700 .6rem 'Inter',sans-serif; cursor:pointer; }
    .pv-impact-grid { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr); gap:1rem; margin-bottom:1rem; }
    /* ── Pipeline CRM ── */
    .pv-pipeline { display:grid; grid-template-columns:1fr 22px 1fr 22px 1fr 22px 1fr 22px 1fr 22px 1fr; gap:0; align-items:stretch; margin:.25rem 0; }

    @keyframes ansioso { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-4.5px)} 70%{transform:translateY(-1px)} }

    @keyframes caminataPareja { 0%{transform:translateX(0);opacity:0} 6%{opacity:1} 78%{transform:translateX(168px);opacity:1} 90%{transform:translateX(168px);opacity:0} 100%{transform:translateX(0);opacity:0} }
    @keyframes caminataBillete { 0%{transform:translateX(0);opacity:0} 8%{opacity:1} 80%{transform:translateX(150px);opacity:1} 92%{transform:translateX(150px);opacity:0} 100%{transform:translateX(0);opacity:0} }
    @keyframes billetear { 0%,100%{transform:rotate(-22deg)} 50%{transform:rotate(14deg)} }
    @keyframes festejo { 0%,100%{transform:rotate(-150deg)} 50%{transform:rotate(-190deg)} }
    @keyframes festejoB { 0%,100%{transform:rotate(150deg)} 50%{transform:rotate(190deg)} }
    @keyframes brinco { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

    @keyframes aparecer { 0%{opacity:0;transform:scale(.3)} 70%{opacity:1;transform:scale(1.15)} 100%{opacity:1;transform:scale(1)} }
    @keyframes yaEstoy { 0%,100%{transform:translateY(0) scale(1)} 30%{transform:translateY(-9px) scale(1.25)} 60%{transform:translateY(0) scale(1.25)} 80%{transform:translateY(-5px) scale(1.25)} }
    .anx { animation:ansioso .55s ease-in-out infinite; }
    .estrella { animation:titilar 3s ease-in-out infinite; }
    .pareja { animation:caminataPareja 7s linear infinite; }
    .solo { animation:caminataBillete 6s linear 2s infinite; }
    .lA { transform-origin:0px -1px; animation:legA .4s ease-in-out infinite; }
    .lB { transform-origin:0px -1px; animation:legB .4s ease-in-out infinite; }
    .aS { transform-origin:0px -5.5px; animation:armSwing .4s ease-in-out infinite; }
    .bill { transform-origin:1px 3px; animation:billetear .3s ease-in-out infinite; }
    .fiesta { animation:brinco .6s ease-in-out infinite; }
    .fiesta .fA { transform-origin:0px -5.5px; animation:festejo .6s ease-in-out infinite; }
    .fiesta .fB { transform-origin:0px -5.5px; animation:festejoB .6s ease-in-out infinite; }
    .humo1 { animation:humo 2.4s linear infinite; }
    .humo2 { animation:humo 2.4s linear 1.2s infinite; }
    .aparece { animation:aparecer .45s ease-out; }
    .ya-estoy { animation:yaEstoy .8s ease-in-out; }

      --pv-c:#9aa7b2;
    }
    .pv-kpi.kpi-prop .pv-kpi-n {
      background: linear-gradient(135deg,#6ee89a,#a8f5c4);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    }

    /* ── Leyenda interactiva del gráfico principal ── */
    .pv-legend {
      display:flex; flex-wrap:wrap; gap:.4rem;
      margin-top:1rem; padding-top:.9rem;
      border-top:1px solid rgba(255,255,255,.06);
    }
    .pv-legend-chip {
      display:inline-flex; align-items:center; gap:.45rem;
      padding:.32rem .75rem;
      border:1px solid rgba(255,255,255,.1);
      border-radius:999px;
      background:rgba(255,255,255,.04);
      color:rgba(255,255,255,.62);
      font-size:.6rem; font-weight:600; letter-spacing:.04em;
      cursor:pointer; user-select:none;
      transition:all .18s;
    }
    .pv-legend-chip:hover { border-color:rgba(255,255,255,.22); color:#fff; }
    .pv-legend-chip.off { opacity:.32; text-decoration:line-through; }
    .pv-legend-chip.locked { cursor:default; }
    .pv-legend-chip.locked:hover { border-color:rgba(255,255,255,.1); }
    .pv-legend-dot {
      width:9px; height:9px; border-radius:50%; flex-shrink:0;
      box-shadow:0 0 6px currentColor;
    }
    .pv-legend-name { max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* ── 4 paneles inferiores nuevos (grid 2x2) ── */
    .pv-panels-grid {
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:1rem;
      margin-bottom:1rem;
    }
    @media(max-width:760px){ .pv-panels-grid{ grid-template-columns:1fr; } }
    .pv-panel {
      padding:1.3rem 1.35rem;
      border:1px solid rgba(255,255,255,.07);
      border-top-color:rgba(255,255,255,.12);
      border-radius:12px;
      background:linear-gradient(155deg,rgba(255,255,255,.042),rgba(255,255,255,.014));
      display:flex; flex-direction:column;
    }
    .pv-panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:.8rem; margin-bottom:.95rem; }
    .pv-panel-titulo { color:#f5f3f0; font-family:'Inter',sans-serif; font-size:.78rem; font-weight:600; letter-spacing:.02em; }
    .pv-panel-sub { margin-top:.25rem; color:rgba(255,255,255,.4); font-size:.62rem; }
    .pv-panel-chart { position:relative; height:170px; margin-bottom:.6rem; }
    .pv-panel-foot { margin-top:auto; }
    .pv-panel-legend { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.7rem; padding-top:.6rem; border-top:1px solid rgba(255,255,255,.05); }
    .pv-panel-empty {
      flex:1; display:grid; place-items:center;
      padding:1.5rem 1rem; text-align:center;
      color:rgba(255,255,255,.3); font-size:.72rem; line-height:1.5;
    }
    .pv-panel-empty-mark { width:26px; height:26px; margin:0 auto .6rem; border:1px solid rgba(201,168,76,.28); border-radius:50%; }

    /* Panel Origen: barras horizontales */
    .pv-origen-list { display:flex; flex-direction:column; gap:.7rem; }
    .pv-origen-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.6rem; align-items:center; }
    .pv-origen-label { display:flex; align-items:center; gap:.5rem; font-size:.72rem; color:rgba(255,255,255,.78); }
    .pv-origen-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow:0 0 6px currentColor; }
    .pv-origen-bar-wrap { height:6px; border-radius:99px; background:rgba(255,255,255,.06); overflow:hidden; margin-top:.32rem; }
    .pv-origen-bar { height:100%; border-radius:99px; transition:width .8s cubic-bezier(.22,.68,.18,1); }
    .pv-origen-val { text-align:right; }
    .pv-origen-val-n { font-size:.92rem; font-weight:600; color:#fff; line-height:1; }
    .pv-origen-val-p { font-size:.58rem; color:rgba(255,255,255,.4); margin-top:.18rem; }

    /* Panel Rendimiento: ranking */
    .pv-rank-row {
      display:grid;
      grid-template-columns:18px minmax(0,1fr) auto auto auto;
      gap:.6rem; align-items:center;
      padding:.6rem .1rem;
      border-bottom:1px solid rgba(255,255,255,.045);
    }
    .pv-rank-row:last-child { border-bottom:0; }
    .pv-rank-pos { font-family:'Cormorant Garamond',serif; font-size:.9rem; font-weight:600; color:rgba(255,255,255,.4); text-align:center; }
    .pv-rank-nombre { display:flex; align-items:center; gap:.5rem; min-width:0; }
    .pv-rank-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; box-shadow:0 0 6px currentColor; }
    .pv-rank-nombre span { font-size:.74rem; color:rgba(255,255,255,.82); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pv-rank-num { font-size:.78rem; font-weight:600; text-align:right; min-width:42px; }
    .pv-rank-conv { font-size:.66rem; color:rgba(255,255,255,.42); text-align:right; min-width:42px; }
    .pv-rank-head {
      display:grid;
      grid-template-columns:18px minmax(0,1fr) auto auto auto;
      gap:.6rem; align-items:center;
      padding-bottom:.5rem; margin-bottom:.2rem;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .pv-rank-head span { font-size:.52rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.35); }
    .pv-rank-head span.r { text-align:right; }
  </style>
</head>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
  import { aplicarConfigVisual, leerConfigVisual } from '../js/panel-config.js'
  import QRCode from 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm'

  const supabase = createClient(
    'https://wajkfydxutptcvvfwrvq.supabase.co',
    'sb_publishable_RKpmv1VDwMOB25phyfFrog_OdI-wB8s',
    { auth: { storageKey: 'sp-colab-session' } }
  )

  leerConfigVisual(supabase).then(aplicarConfigVisual).catch(() => {})

  window.salir = async function() {
    await supabase.auth.signOut()
    location.href = 'login.html'
  }

  const esc  = s => !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  const fmt  = iso => iso ? new Date(iso).toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' }) : '—'
  const ESTADO_LABEL = { nueva:'Nueva', en_contacto:'En contacto', en_negociacion:'En negociación', cerrada:'Cerrada', descartada:'Descartada' }
  const ESTADO_LABEL_PASIVO = { nueva:'Sin avance', contactado:'Contactado', visita:'En visita', descartado:'Descartado' }

  const RECORRIDO_ENABLED = true;
  const REC_ESTADO_ORDEN = {
    nueva: 0,
    contactado: 1,
    visita: 2,
    oferta: 3,
    cerrado: 4,
    descartado: -1
  };

  const REC_ESTADO_LABEL = {
    nueva: 'Sin avance',
    contactado: 'En contacto',
    visita: 'Visita programada',
    oferta: 'Oferta enviada',
    cerrado: 'Cerrado'
  };

  const REC_COHORT_PALETTE = [
    '#3a4eb8',
    '#c0603e',
    '#2a9d7a',
    '#c040a0',
    '#c08a2e',
    '#1e5fa0',
    '#7a1f2e',
    '#3eb489',
    '#7b3fb0',
    '#b87333'
  ];

  function normalizarEstadoRecorrido(estado) {
    const key = String(estado || 'nueva').toLowerCase();
    const map = {
      en_contacto: 'contactado',
      en_negociacion: 'visita',
      cerrada: 'cerrado',
      descartada: 'descartado'
    };
    const normalizado = map[key] || key;
    return Object.prototype.hasOwnProperty.call(REC_ESTADO_ORDEN, normalizado) ? normalizado : 'nueva';
  }

  function obtenerClavePersonaRecorrido(c, index = 0) {
    const tel = String(c?.telefono || c?.telefono_contacto || '').replace(/\D/g, '');
    const email = String(c?.email || c?.mail || '').trim().toLowerCase();
    return tel ? `tel:${tel}` : email ? `email:${email}` : ('id:' + String(c?.id || `fila-${index}`));
  }

  function fechaIngresoRecorrido(c) {
    return c?.fecha || c?.created_at || null;
  }

  function mesKeyRecorrido(value) {
    const d = value ? new Date(value) : null;
    if (!d || isNaN(d.getTime())) return 'sin-fecha';
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function renderRecorridoSeguro(contactos, canal, filasTraza) {
    if (!RECORRIDO_ENABLED) return '';

    try {
      return renderRecorrido(contactos || [], canal || {}, filasTraza || []);
    } catch (error) {
      console.warn('[recorrido] fallback:', error);
      return '';
    }
  }

  function renderRecorrido(contactos, canal, filasTraza = []) {
    const lista = Array.isArray(contactos) ? contactos : [];
    const personasMap = new Map();

    lista.forEach((c, index) => {
      const clave = obtenerClavePersonaRecorrido(c, index);
      const estado = normalizarEstadoRecorrido(c?.estado);
      const ingreso = fechaIngresoRecorrido(c);
      const ingresoTime = ingreso ? new Date(ingreso).getTime() : Number.POSITIVE_INFINITY;
      const actual = personasMap.get(clave);

      if (!actual) {
        personasMap.set(clave, { clave, estado, ingresoTime, mesKey: mesKeyRecorrido(ingreso) });
        return;
      }

      if ((REC_ESTADO_ORDEN[estado] ?? 0) > (REC_ESTADO_ORDEN[actual.estado] ?? 0)) actual.estado = estado;
      if (ingresoTime < actual.ingresoTime) {
        actual.ingresoTime = ingresoTime;
        actual.mesKey = mesKeyRecorrido(ingreso);
      }
    });

    const personas = [...personasMap.values()].sort((a, b) => {
      const ta = Number.isFinite(a.ingresoTime) ? a.ingresoTime : 0;
      const tb = Number.isFinite(b.ingresoTime) ? b.ingresoTime : 0;
      return ta - tb;
    }).filter(p => p.estado !== 'descartado');

    const meses = [...new Set(personas.map(p => p.mesKey))].sort();
    const colorMes = {};
    meses.forEach((mes, index) => { colorMes[mes] = REC_COHORT_PALETTE[index % REC_COHORT_PALETTE.length]; });
    personas.forEach(p => { p.color = colorMes[p.mesKey] || REC_COHORT_PALETTE[0]; });

    const local = personas.filter(p => p.estado === 'nueva' || p.estado === 'contactado');
    const visita = personas.filter(p => p.estado === 'visita');
    const oferta = personas.filter(p => p.estado === 'oferta');
    const cerrado = personas.filter(p => p.estado === 'cerrado');
    const localMax = 15;
    const localVisibles = local.slice(0, localMax);
    const localExtra = Math.max(0, local.length - localVisibles.length);
    const nombreCanal = canal?.nombre ? esc(canal.nombre) : 'TU LOCAL';
    const total = personas.length;

    const estrellas = Array.from({ length: 70 }, (_, i) => {
      const x = ((i * 137.508) % 1000).toFixed(1);
      const y = ((i * 53.173) % 175).toFixed(1);
      const r = ((i % 7) * 0.13 + 0.35).toFixed(2);
      const delay = ((i % 17) * 0.17).toFixed(2);
      const dur = (2.2 + (i % 11) * 0.22).toFixed(2);
      return `<circle cx="${x}" cy="${y}" r="${r}" fill="#dde2ee" class="estrella" style="opacity:.45;animation-delay:${delay}s;animation-duration:${dur}s"/>`;
    }).join('');

    const localSlots = [
      [-54,-11],[-36,-8],[-18,-11],[0,-8],[18,-11],[36,-8],[54,-11],
      [-45,-28],[-27,-31],[-9,-28],[9,-31],[27,-28],[45,-31],
      [-35,-48],[-17,-51]
    ];

    const localTipitos = localVisibles.map((p, i) => {
      const [x, y] = localSlots[i % localSlots.length];
      const delay = (i * 0.09 % .55).toFixed(2);
      return `<g class="anx" style="animation-delay:${delay}s" color="${p.color}">
        <ellipse cx="${x}" cy="${y + 7}" rx="6" ry="1.6" fill="url(#sombraGrad)" opacity=".65"/>
        <use href="#tipo" x="${x}" y="${y}"/>
      </g>`;
    }).join('');

    const visitaColor = visita[0]?.color || REC_COHORT_PALETTE[0];
    const ofertaColor = oferta[0]?.color || REC_COHORT_PALETTE[1];
    const cerradoColor = cerrado[0]?.color || REC_COHORT_PALETTE[2];
    const badge = (x, y, n, color) => n > 0 ? `<g transform="translate(${x},${y})"><rect x="-14" y="-9" width="28" height="18" rx="9" fill="rgba(0,0,0,.48)" stroke="${color}" stroke-opacity=".5"/><text x="0" y="3" text-anchor="middle" fill="${color}" font-size="8" font-weight="800" font-family="Inter">${n}</text></g>` : '';

    return `<section class="pv-recorrido-card">
      <div class="pv-recorrido-head">
        <div>
          <h3>El recorrido de tu gente</h3>
          <p>De tu local a su casa — Sur Patagonia los acompaña en cada paso.</p>
        </div>
        <div class="pv-recorrido-canal">${total.toLocaleString('es-AR')} personas · ${nombreCanal}</div>
      </div>
      <svg class="pv-recorrido-svg" viewBox="0 0 1000 330" role="img" aria-label="Camino animado desde el local hasta la casita">

          <radialGradient id="sombraGrad" cx="50%" cy="50%" r="50%">

            <stop offset="100%" stop-color="rgba(255,180,80,0)"/>
          </radialGradient>
          <linearGradient id="horizonte" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(70,90,140,0)"/>
            <stop offset="70%" stop-color="rgba(70,90,140,.08)"/>
            <stop offset="100%" stop-color="rgba(110,130,170,.16)"/>
          </linearGradient>
          <radialGradient id="haloLuna" cx="50%" cy="50%" r="50%">

            <stop offset="40%" stop-color="rgba(220,225,240,.08)"/>
            <stop offset="100%" stop-color="rgba(220,225,240,0)"/>

            <circle cx="0" cy="-12" r="2.9" fill="currentColor" stroke="none"/>
            <line x1="0" y1="-8.6" x2="0" y2="-1"/>

            <line class="aS" x1="0" y1="-5.8" x2="3.8" y2="-2.4"/>
            <line class="lA" x1="0" y1="-1" x2="0" y2="6.4"/>
            <line class="lB" x1="0" y1="-1" x2="0" y2="6.4"/>
          </g>
        </defs>

        <rect x="0" y="0" width="1000" height="330" fill="#05060a"/>

        <g id="estrellas">${estrellas}</g>

        <path d="M 0 200 L 120 150 L 260 195 L 400 135 L 540 185 L 690 140 L 830 185 L 1000 158 L 1000 272 L 0 272 Z" fill="#0a0c12" opacity=".9"/>

        <ellipse cx="130" cy="274" rx="150" ry="52" fill="url(#luzLocal)"/>

        <g transform="translate(130,272)">
          <rect x="-88" y="-232" width="176" height="24" rx="4" fill="rgba(201,168,76,.12)" stroke="#c9a84c" stroke-width="1.5"/>
          <text x="0" y="-215" text-anchor="middle" fill="#c9a84c" font-size="13" font-weight="700" letter-spacing="2.5" font-family="Inter">${nombreCanal}</text>

          <ellipse cx="0" cy="-2" rx="64" ry="3" fill="url(#sombraGrad)" opacity=".5"/>
          ${localTipitos}

          <text x="0" y="26" text-anchor="middle" fill="#8a8f99" font-size="9.5" letter-spacing="1.8" font-family="Inter">TUS CONTACTOS · ${total.toLocaleString('es-AR')} Y SUMANDO</text>

        ${badge(430, 214, visita.length, '#f29a5a')}

        <g transform="translate(590,272)">

          </g>

        ${badge(700, 214, oferta.length, '#3bbf88')}
        <text x="672" y="222" text-anchor="middle" fill="#3bbf88" font-size="8" letter-spacing="1.4" font-family="Inter" opacity=".85">OFERTA ENVIADA</text>

    // Derivar proyecto_slug desde el código cuando no está seteado en BD

    const canalCodigoMap = {}; canales.forEach(c => { canalCodigoMap[c.id] = c.codigo })
    // ── Color determinístico por slot.id (hash estable) ──────────────

    const COLOR_TOTAL_GENERAL    = '#f5f3f0'

    const COLOR_QR_FISICO        = '#50c878'
    const COLOR_LINK_COMPARTIDO  = '#6495ed'
    const COLORES_RESERVADOS = [COLOR_TOTAL_GENERAL, COLOR_TOTAL_GRAFICO, COLOR_QR_FISICO, COLOR_LINK_COMPARTIDO]
    // PALETA_PROPIEDADES — fuente: registro-colores-sistema.md §10b (firmada 6/7). NO editar acá: se edita en el registro primero.
    const PALETA_PROPIEDADES = [
      '#ff4088',
      '#ccff00',
      '#8820c0',
      '#ff9500',
      '#8e1f63',
      '#7dff36',
      '#ff6830',
      '#00c8ff',
      '#d030c0',
      '#ffd428',
      '#c890f0',
      '#00ffd5',
      '#ff4a5a',
      '#9d4eff',
      '#eaff5c',
      '#b840e0',
      '#00e676',
      '#ff6bd6',
      '#ff3d3d',
      '#14e6e6',

      '#ff6d00',
      '#d4a017',

    const slotColorMap = {} // slot.codigo → hex
    const DIST_MIN = 80
    function colorDist(a, b) {
      const ah = a.replace('#',''), bh = b.replace('#','')
      const ar=parseInt(ah.slice(0,2),16),ag=parseInt(ah.slice(2,4),16),ab=parseInt(ah.slice(4,6),16)
      const br=parseInt(bh.slice(0,2),16),bg=parseInt(bh.slice(2,4),16),bb=parseInt(bh.slice(4,6),16)
      return Math.sqrt((ar-br)**2+(ag-bg)**2+(ab-bb)**2)
    }
    function colorDeSlot(codigo) {
      if (slotColorMap[codigo]) return slotColorMap[codigo]
      // FNV-1a hash del código → índice de paleta estable
      let h = 0x811c9dc5
      for (let i = 0; i < codigo.length; i++) { h ^= codigo.charCodeAt(i); h = (h * 0x01000193) >>> 0 }
      const usados = Object.values(slotColorMap)
      const libres = PALETA_PROPIEDADES.filter(c => !COLORES_RESERVADOS.includes(c) && !usados.includes(c))
      const distanciaMinima = (c, base) => base.length ? Math.min(...base.map(b => colorDist(c, b))) : 999
      let color = null
      // Paso 1: no reservado, no usado, dist >= DIST_MIN con todos los ya asignados Y con reservados
      for (let i = 0; i < PALETA_PROPIEDADES.length; i++) {
        const c = PALETA_PROPIEDADES[(h + i) % PALETA_PROPIEDADES.length]
        if (!COLORES_RESERVADOS.includes(c)
          && !usados.includes(c)
          && usados.every(u => colorDist(c, u) >= DIST_MIN)
          && COLORES_RESERVADOS.every(r => colorDist(c, r) >= DIST_MIN)) {
          color = c; break
        }
      }
      // Paso 2: fallback — si DIST_MIN deja sin candidatos, usar el color libre más lejano disponible antes de repetir
      if (!color && libres.length) {
        const base = [...usados, ...COLORES_RESERVADOS]
        let mejorScore = -1
        for (let i = 0; i < PALETA_PROPIEDADES.length; i++) {
          const c = PALETA_PROPIEDADES[(h + i) % PALETA_PROPIEDADES.length]
          if (!libres.includes(c)) continue
          const score = distanciaMinima(c, base)
          if (score > mejorScore) {
            color = c
            mejorScore = score
          }
        }
        if (color) console.warn('[colorDeSlot] DIST_MIN sin candidato: usando color libre más lejano', { codigo, color })
      }
      // Paso 3: solo si se agotaron los 25 colores, repetir de forma estable
      if (!color) color = PALETA_PROPIEDADES.find(c => !COLORES_RESERVADOS.includes(c)) || '#ff4088'
      slotColorMap[codigo] = color
      return color
    }
    misSlots.forEach(slot => {

    const slotCodigos  = misSlots.map(s => s.codigo)

    function findPropData(slug) {

    // ── Trazabilidad CRM ─────────────────────────────────────────────────────

    let _pvChart4 = null, _pvChart4b = null, _pvChart4c = null
    let _pvPanelAct = null, _pvPanelConv = null  // charts de los paneles nuevos (Actividad 30d, Conversión 30d)
    let _pvLiveRAF = null   // loop de animación del "pulso en vivo"
    let _pvLiveTimer = null // refresco automático (modo Hoy)
    let _pvDocMoveH = null, _pvDocUpH = null    // document-level pan listeners (cleanup seguro)

    // ── Zoom horario (modo Hoy) ──────────────────────────────────────────────
    window.pvZoomHoyAplicar = function() {
      // Usa pvApplyViewport para estar sincronizado con el zoom de scroll
      const fromH = parseInt(document.getElementById('pvZoomDesde')?.value || '0')
      const toH   = parseInt(document.getElementById('pvZoomHasta')?.value || '24')
      const hoyB0 = window._pvZoomDefaultFrom
      if (!hoyB0) return

    // ── Motor de zoom temporal interactivo ──────────────────────────────────

    // Resamplea visitas/contactos/slots para [fromMs, toMs] con granularidad adaptativa
    function pvResampleChart(fromMs, toMs) {
      const rangeMins = (toMs - fromMs) / 60000
      let bucketMs, labelFn
      if (rangeMins <= 120) {
        bucketMs = 60000
        labelFn = t => { const d=new Date(t); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` }
      } else if (rangeMins <= 360) {
        bucketMs = 5*60000
        labelFn = t => { const d=new Date(t); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` }
      } else if (rangeMins <= 1440) {
        bucketMs = 15*60000
        labelFn = t => { const d=new Date(t); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` }
      } else if (rangeMins <= 10080) {
        bucketMs = 3600000
        labelFn = t => { const d=new Date(t); return `${d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})} ${String(d.getHours()).padStart(2,'0')}h` }
      } else {
        bucketMs = 86400000
        labelFn = t => new Date(t).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})
      }
      window._pvZoomBucketMs = bucketMs
      const snapFrom = Math.floor(fromMs / bucketMs) * bucketMs
      const numBuckets = Math.max(1, Math.ceil((toMs - snapFrom) / bucketMs))
      const bucketStarts = Array.from({length:numBuckets}, (_,i) => snapFrom + i*bucketMs)
      const newLbls = bucketStarts.map(t => labelFn(t))
      const ds = new Array(numBuckets).fill(0)
      const dc = new Array(numBuckets).fill(0)
      visitas.forEach(v => {
        const t = new Date(v.created_at).getTime(); if (t < fromMs || t >= toMs) return
        const idx = Math.floor((t - snapFrom) / bucketMs); if (idx >= 0 && idx < numBuckets) ds[idx]++
      })
      contactos.forEach(c => {
        const t = new Date(c.created_at).getTime(); if (t < fromMs || t >= toMs) return
        const idx = Math.floor((t - snapFrom) / bucketMs); if (idx >= 0 && idx < numBuckets) dc[idx]++
      })
      const slotData = (typeof misSlots !== 'undefined' ? misSlots : []).map(slot => {
        const arr = new Array(numBuckets).fill(0)
        visitas.forEach(v => {
          if (v.canal_ref !== slot.codigo) return
          const t = new Date(v.created_at).getTime(); if (t < fromMs || t >= toMs) return
          const idx = Math.floor((t - snapFrom) / bucketMs); if (idx >= 0 && idx < numBuckets) arr[idx]++
        })
        return { codigo: slot.codigo, data: arr }
      })
      return { labels: newLbls, dataScans: ds, dataCons: dc, slotData }
    }

    // Aplica un viewport al gráfico principal: recalcula datos y labels sin destruir el chart
    function pvApplyViewport(fromMs, toMs) {
      if (!_pvChart4?.data) return
      window._pvZoomFrom = fromMs; window._pvZoomTo = toMs
      const { labels, dataScans, dataCons, slotData } = pvResampleChart(fromMs, toMs)
      _pvChart4.data.labels = labels
      if (_pvChart4.data.datasets[0]) _pvChart4.data.datasets[0].data = dataScans
      if (_pvChart4.data.datasets[1]) _pvChart4.data.datasets[1].data = dataCons
      slotData.forEach((sd,i) => { const dst=_pvChart4.data.datasets[2+i]; if (dst) dst.data=sd.data })
      delete _pvChart4.options.scales.x.min; delete _pvChart4.options.scales.x.max
      const _cap = labels // captura para closures de callback
      if (_pvChart4.options.scales?.x?.ticks) {
        _pvChart4.options.scales.x.ticks.callback = (_,i) => _cap[i] || ''
        _pvChart4.options.scales.x.ticks.autoSkip = true
        // Densidad adaptativa: máx 12 etiquetas siempre, menos si hay pocos buckets
        _pvChart4.options.scales.x.ticks.maxTicksLimit = Math.min(labels.length, 12)
      }
      if (_pvChart4.options.plugins?.tooltip?.callbacks)
        _pvChart4.options.plugins.tooltip.callbacks.title = items => _cap[items[0]?.dataIndex ?? 0] || ''
      _pvChart4.update('none')
    }

    // Enlaza zoom por Shift+scroll y pan por arrastre al canvas del chart principal
    function pvBindZoomPan(chart) {
      if (!chart?.canvas) return
      // Limpiar handlers previos
      if (chart._pvWheelH) chart.canvas.removeEventListener('wheel', chart._pvWheelH)
      if (chart._pvMDownH) chart.canvas.removeEventListener('mousedown', chart._pvMDownH)
      if (chart._pvDblH)   chart.canvas.removeEventListener('dblclick', chart._pvDblH)
      if (_pvDocMoveH) { document.removeEventListener('mousemove', _pvDocMoveH); _pvDocMoveH = null }
      if (_pvDocUpH)   { document.removeEventListener('mouseup',   _pvDocUpH);   _pvDocUpH   = null }

      // Shift + scroll del mouse/trackpad → zoom centrado en la posición del cursor
      chart._pvWheelH = function(e) {
        if (!e.shiftKey) return
        e.preventDefault()
        const from = window._pvZoomFrom || window._pvZoomDefaultFrom
        const to   = window._pvZoomTo   || window._pvZoomDefaultTo
        if (!from || !to) return
        const rangeMs = to - from
        const ca = chart.chartArea, rect = chart.canvas.getBoundingClientRect()
        const pct = ca ? Math.max(0, Math.min(1, (e.clientX - rect.left - ca.left) / (ca.right - ca.left))) : 0.5
        // scroll arriba = acercar (0.80×), scroll abajo = alejar (1.25×) — suave
        const factor = e.deltaY < 0 ? 0.80 : 1.25
        const newRange = Math.max(60000, Math.min(30*86400000, rangeMs * factor))
        const anchorMs = from + rangeMs * pct
        let newFrom = anchorMs - newRange * pct
        let newTo   = anchorMs + newRange * (1-pct)
        const hardMax = Date.now(), hardMin = hardMax - 30*86400000
        if (newFrom < hardMin) { newFrom = hardMin; newTo = Math.min(hardMax, newFrom + newRange) }
        if (newTo > hardMax)   { newTo = hardMax;   newFrom = Math.max(hardMin, newTo - newRange) }
        pvApplyViewport(newFrom, newTo)
      }
      chart.canvas.addEventListener('wheel', chart._pvWheelH, { passive: false })

      // Arrastre → pan horizontal
      let dragging = false, dragX0 = 0, dragFrom0 = 0, dragTo0 = 0
      chart._pvMDownH = function(e) {
        if (e.button !== 0 || e.shiftKey) return
        dragging = true; dragX0 = e.clientX
        dragFrom0 = window._pvZoomFrom || window._pvZoomDefaultFrom
        dragTo0   = window._pvZoomTo   || window._pvZoomDefaultTo
        if (dragFrom0 && dragTo0) chart.canvas.style.cursor = 'grabbing'
        if (chart.options.plugins?.tooltip) chart.options.plugins.tooltip.enabled = false
      }
      chart.canvas.addEventListener('mousedown', chart._pvMDownH)

      const pvMoveH = function(e) {
        if (!dragging || !dragFrom0) return
        const ca = chart.chartArea; if (!ca) return
        const dx = e.clientX - dragX0
        const rangeMs = dragTo0 - dragFrom0
        const msPerPx = rangeMs / Math.max(1, ca.right - ca.left)
        const shift = -dx * msPerPx
        const hardMax = Date.now(), hardMin = hardMax - 30*86400000
        let newFrom = Math.max(hardMin, dragFrom0 + shift)
        let newTo = newFrom + rangeMs
        if (newTo > hardMax) { newTo = hardMax; newFrom = Math.max(hardMin, newTo - rangeMs) }
        pvApplyViewport(newFrom, newTo)
      }
      const pvUpH = function() {
        if (!dragging) return
        dragging = false
        chart.canvas.style.cursor = ''
        if (chart.options.plugins?.tooltip) chart.options.plugins.tooltip.enabled = true
      }
      _pvDocMoveH = pvMoveH; _pvDocUpH = pvUpH
      document.addEventListener('mousemove', _pvDocMoveH)
      document.addEventListener('mouseup',   _pvDocUpH)

      // Doble clic → volver a la vista completa
      chart._pvDblH = function() {
        const f = window._pvZoomDefaultFrom, t2 = window._pvZoomDefaultTo
        if (f && t2) pvApplyViewport(f, t2)
        else { delete chart.options.scales.x.min; delete chart.options.scales.x.max; chart.update('none') }
      }
      chart.canvas.addEventListener('dblclick', chart._pvDblH)
    }

    // Filtrar mensajes para este usuario
    // Lógica: si usuario_id está → solo ese usuario
    // Si no → AND entre todos los filtros activos.
    // Soporta tanto campos nuevos (arrays) como campos viejos (single value).
    const userTipoAcceso = esPasivo ? 'pasivo' : 'activo'
    const misCanalesIds  = canales.map(c => c.id)
    const todosMsg = rMensajes.data || []
    const misMensajes = todosMsg.filter(m => {
      if (m.usuario_id) return m.usuario_id === userId

      // ── Nuevos campos multi-select (arrays) ──
      // canal_ids: alguno de los mis canales debe estar en la lista
      if (m.canal_ids?.length) {
        if (!m.canal_ids.some(id => misCanalesIds.includes(id))) return false
      }
      // provincias_arr: mi provincia debe estar en alguna de las seleccionadas
      if (m.provincias_arr?.length) {
        if (!m.provincias_arr.some(p => provinciasMias.includes(p))) return false
      }
      // ciudades_arr: mi ciudad debe estar en alguna de las seleccionadas
      if (m.ciudades_arr?.length) {
        if (!m.ciudades_arr.some(c => ciudadesMias.includes(c))) return false
      }

      // ── Compatibilidad con campos viejos (mensajes anteriores) ──
      if (!m.provincias_arr && !m.ciudades_arr && !m.canal_ids) {
        if (m.ciudad      && !ciudadesMias.includes(m.ciudad))      return false
        if (m.provincia   && !provinciasMias.includes(m.provincia)) return false
        if (m.tipo_acceso && m.tipo_acceso !== userTipoAcceso)      return false
      }

      return true
    })
    const totalScans = visitas.length
    const conv       = totalScans > 0 ? ((contactos.length / totalScans) * 100).toFixed(1) : 0

    // Campaña activa por canal
    const campanaActiva = {}
    ;(rCampanas.data || []).forEach(row => {
      const c = row.campanas
      if (!c?.activa) return
      const ini = c.fecha_inicio ? new Date(c.fecha_inicio) : null
      const fin = c.fecha_fin    ? new Date(c.fecha_fin)    : null
      if ((!ini || ini <= ahora) && (!fin || fin >= ahora)) {
        campanaActiva[row.canal_id] = c.nombre
      }
    })

    // Mapa refCodigo → canalId (canal_id viene en misRefs)
    const refACanal = {}
    ;(misRefs || []).forEach(r => { refACanal[r.codigo] = r.canal_id })

    // ── Mis QRs (solo lectura, canal activo) ──────
    function renderMisQRs() {
      if (!misSlots.length) return ''
      const activos   = misSlots.filter(s => s.activo).length
      const cards = misSlots.map(slot => {
        const proy       = proyImgs[slot.proyecto_slug]
        const fotoUrl    = proy?.foto_portada || ''
        const proyNombre = proy?.nombre || slot.nombre || slot.codigo
        const scans      = scansPorSlot[slot.codigo] || 0
        const esActivo   = slot.activo !== false

        const imgStyle = fotoUrl
          ? `background-image:url('${fotoUrl.replace(/'/g, "\\'")}');background-size:cover;background-position:center`
          : 'background:linear-gradient(135deg,rgba(201,168,76,.09),#11100e)'

        const badgeClass = esActivo ? 'activo' : 'inactivo'
        const badgeLabel = esActivo ? '● ACTIVO' : '● INACTIVO'

        const inactivoBanner = !esActivo ? `
          <div class="qr-slot-inactivo-banner">
            Esta propiedad ya no está disponible · Retirá el material impreso.
          </div>` : ''

        const ptrEvents = !esActivo ? 'pointer-events:none' : ''
        const redirectUrl = `${location.origin}/r/${slot.codigo}`

        return `
        <div class="qr-slot-card${esActivo ? '' : ' slot-inactivo'}">
          <div class="qr-slot-img" style="${imgStyle}">
            <div class="qr-slot-img-overlay"></div>
            <div class="qr-slot-img-nombre">${esc(proyNombre)}</div>
            <div class="qr-slot-estado-badge ${badgeClass}">${badgeLabel}</div>
          </div>
          <div class="qr-slot-body" style="${ptrEvents}">
            <div class="qr-slot-canvas-wrap">
              <canvas id="qr-canvas-${slot.id}" width="134" height="134"></canvas>
            </div>
            <div class="qr-slot-codigo">${esc(slot.codigo)}</div>
          </div>
          ${inactivoBanner}
          <div class="qr-slot-footer">
            <span class="qr-slot-scans">${scans} escaneos este mes</span>
            <div class="qr-slot-btns" style="${ptrEvents}">
              <button class="qr-slot-btn" onclick="descargarQR('qr-canvas-${slot.id}', '${slot.codigo}')">Descargar QR</button>
              <button class="qr-slot-btn" onclick="copiarLink('${redirectUrl}', this)">Copiar link</button>
            </div>
          </div>
        </div>`
      }).join('')

      return `
      <div class="seccion">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;flex-wrap:wrap;gap:.5rem;">
          <div>
            <div class="sec-titulo" style="margin-bottom:.2rem;">Mis QRs activos</div>
            <div style="font-size:.72rem;color:rgba(255,255,255,.38);">Los QRs que podés imprimir y compartir</div>
          </div>
          <span style="font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c9a84c;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.22);border-radius:999px;padding:.28rem .85rem;">${activos} activo${activos !== 1 ? 's' : ''}</span>
        </div>
        <div class="mis-qrs-grid">${cards}</div>
      </div>`
    }

    async function generarQRCanvases() {
      for (const slot of misSlots) {
        const canvas = document.getElementById(`qr-canvas-${slot.id}`)
        if (!canvas) continue
        const url = `${location.origin}/r/${slot.codigo}`
        try {
          await QRCode.toCanvas(canvas, url, {
            width: canvas.width || 70, margin: 1,
            color: { dark: '#000000', light: '#ffffff' }
          })
        } catch (e) { console.warn('QR error', slot.codigo, e) }
      }
    }

    async function descargarQR(canvasId, codigo) {
      const canvas = document.getElementById(canvasId)
      if (!canvas) return
      const SIZE = 1024
      const offscreen = document.createElement('canvas')
      offscreen.width = SIZE
      offscreen.height = SIZE
      const url = `${location.origin}/r/${codigo}`
      try {
        await QRCode.toCanvas(offscreen, url, {
          width: SIZE, margin: 4,
          color: { dark: '#000000', light: '#ffffff' }
        })
      } catch (e) {
        console.error('[descargarQR] Error generando QR de alta resolución:', e)
        return
      }
      const a = document.createElement('a')
      a.download = `qr-${codigo}.png`
      a.href = offscreen.toDataURL('image/png')
      a.click()
    }
    window.descargarQR = descargarQR

    const QR_BASE_URL_CANONICA = 'https://surpatagonia.com.ar'
    const linkQrCanonico = codigo => `${QR_BASE_URL_CANONICA}/r/${codigo}`
    const codigoQrCanonicoPasivo = canal => canal.codigo

    async function descargarQRPasivo(codigo) {
      if (!codigo || typeof QRCode === 'undefined') return
      const offscreen = document.createElement('canvas')
      offscreen.width = 230
      offscreen.height = 230
      const url = linkQrCanonico(codigo)
      try {
        await QRCode.toCanvas(offscreen, url, {
          width: 230, margin: 2,
          color: { dark: '#1a1a1a', light: '#ffffff' }
        })
      } catch (e) {
        console.error('[descargarQRPasivo] Error generando QR canónico:', e)
        return
      }
      const a = document.createElement('a')
      a.download = `qr-${codigo}.png`
      a.href = offscreen.toDataURL('image/png')
      a.click()
    }
    window.descargarQRPasivo = descargarQRPasivo

    function copiarLink(url, btn) {
      navigator.clipboard.writeText(url).then(() => {
        const orig = btn.textContent
        btn.textContent = '¡Copiado!'
        setTimeout(() => { btn.textContent = orig }, 1800)
      }).catch(() => {
        prompt('Copiá el link:', url)

    const renderCards = () => canales.map(c => {

            <div class="qr-valor" style="font-size:.68rem;">${esc(estadoLabel)}</div>
          </div>

          <span><strong style="color:var(--dorado);font-size:.9rem;">${cContacts}</strong> consultas</span>
        </div>

    }).join('')

    // ── Render ─────────────────────────────────────
    const main = document.getElementById('mainContent')
    if (esPasivo) {

      const dotColor = estadoQR === 'activo' ? '#50c878' : estadoQR === 'campana' ? '#c9a84c' : '#444'
      const dotGlow = estadoQR !== 'inactivo' ? `box-shadow:0 0 10px ${dotColor}88` : ''

      const pvQrUrl = linkQrCanonico(pvQrCodigo)

      main.innerHTML = `

            <div class="pv-periodo-bar-hero">

              <button class="pv-aplicar" onclick="pvAplicarFechas()">Aplicar</button>
            </div>
          </div>
          <div class="pv-hero-right-cluster">
            <div class="pv-hero-qr-block">
              <canvas id="pvHeroQrCanvas" width="160" height="160"></canvas>
              <div class="pv-hero-qr-badge ${estadoQR}">● ${esc(dotLabel)}</div>
            </div>
            <div class="pv-hero-counts">
              <div class="pv-hero-count-item">
                <div class="pv-flip-num">${mkFlip(totalScans, 'var(--sport-counter-accent)')}</div>
                <div class="pv-hero-count-l">Clics totales</div>
              </div>
              <div class="pv-hero-count-sep"></div>
              <div class="pv-hero-count-item">
                <div class="pv-flip-num">${mkFlip(totalRegistrosActivos, 'var(--sport-counter-accent)')}</div>
                <div class="pv-hero-count-l">Registros activos</div>
              </div>
            </div>
          </div>
        </div>

        <div class="pv-img-hero">
          <div class="pv-img-hero-overlay"></div>
          <div class="pv-img-hero-content">
            <div class="pv-img-hero-nombre">${esc(canal.nombre)}</div>
            ${geo ? `<div class="pv-img-hero-slug">${esc(geo)}</div>` : ''}
          </div>
          ${canal.latitud && canal.longitud ? `
          <div class="pv-mini-mapa-wrap">
            <div class="pv-mini-mapa" id="pvMiniMapa"></div>
            <div class="pv-mini-mapa-label">${esc(geo)}</div>
          </div>` : ''}
        </div>

        <div class="pv-kpi-grid">
          <div class="pv-kpi" style="--pv-c:#6495ed"><div class="pv-kpi-label">Interacciones generadas</div><div class="pv-kpi-n">${totalScans.toLocaleString('es-AR')}</div><div class="pv-kpi-sub">Actividad histórica desde tu QR y enlace.</div></div>
          <div class="pv-kpi" style="--pv-c:#89b4f7"><div class="pv-kpi-label">Impulso reciente</div><div class="pv-kpi-n">${m.v30.toLocaleString('es-AR')}</div>${renderDelta(m.deltaV)}<div class="pv-kpi-sub">Interacciones en los últimos 30 días.</div></div>
          <div class="pv-kpi" style="--pv-c:#c9a84c"><div class="pv-kpi-label">Consultas históricas</div><div class="pv-kpi-n pv-dorado">${contactos.length.toLocaleString('es-AR')}</div><div class="pv-kpi-sub">Oportunidades generadas desde el inicio · ${m.c30.toLocaleString('es-AR')} en los últimos 30 días.</div></div>
          <div class="pv-kpi" style="--pv-c:#6ee89a"><div class="pv-kpi-label">Registros activos</div><div class="pv-kpi-n">${totalRegistrosActivos.toLocaleString('es-AR')}</div><div class="pv-kpi-sub">Oportunidades vigentes — excluye descartados.</div></div>
        </div>

        ${renderPasivo(contactos, filasTraza, canal)}

        <div class="pv-sec pv-msg-sec" id="secMensajes">
          <div class="pv-sec-head"><div><div class="pv-sec-titulo">Novedades de la red${misMensajes.length ? ` <span class="badge-nuevo" style="margin-left:.4rem">${misMensajes.length}</span>` : ''}</div><div class="pv-sec-sub">Actualizaciones de Sur Patagonia para tu espacio.</div></div></div>
          <div class="msg-inbox" id="msgInbox">
            ${misMensajes.length ? misMensajes.map((m, i) => `
              <div class="msg-card" id="msgCard-${i}">
                <div class="msg-card-head" onclick="toggleMsg(${i})">
                  <div class="msg-unread-dot" id="dot-${i}"></div>
                  <div class="msg-card-asunto">${esc(m.asunto)}</div>
                  <div class="msg-card-fecha">${fmt(m.created_at)}</div>
                </div>
                <div class="msg-card-body" id="msgBody-${i}"><div class="msg-card-cuerpo">${esc(m.cuerpo)}</div></div>
              </div>`).join('') : '<div class="pv-empty"><div class="pv-empty-mark"></div><div class="pv-msg-empty-title">Todo al día</div><div>Cuando Sur Patagonia tenga novedades para tu canal, las vas a encontrar acá.</div></div>'}
          </div>
        </div>`

      requestAnimationFrame(() => {
        renderGraficoPasivo(contactos, 0)
        renderMiniMapaPasivo(canal)
        const heroQrCanvas = document.getElementById('pvHeroQrCanvas')
        const heroQrCodigo = codigoQrCanonicoPasivo(canal)
        if (heroQrCanvas && heroQrCodigo && typeof QRCode !== 'undefined') {
          const qrUrl = linkQrCanonico(heroQrCodigo)
          QRCode.toCanvas(heroQrCanvas, qrUrl, {
            width: 72, margin: 1,
            color: { dark: '#111111', light: '#ffffff' }
          }).catch(e => console.warn('QR hero error', e))
        }
      })
    } else {
      const mAct       = metricasPasivo(contactos)
      const primerC    = canales[0]
      const geoAct     = [primerC.ciudad, primerC.provincia].filter(Boolean).join(', ')
      const estadoAct  = !primerC.activo ? 'inactivo' : campanaActiva[primerC.id] ? 'campana' : 'activo'
      const dotColorAct = estadoAct === 'activo' ? '#52d68c' : estadoAct === 'campana' ? '#c9a84c' : '#444'
      const dotLabelAct = estadoAct === 'inactivo' ? 'Canal inactivo' : estadoAct === 'campana' ? `Campaña: ${esc(campanaActiva[primerC.id])}` : 'Canal activo'
      const nombreDisplay = canales.length > 1 ? `${primerC.nombre} +${canales.length - 1}` : primerC.nombre

      main.classList.add('pv-main')
      main.innerHTML = `

          <h1>${esc(nombreDisplay)}</h1>
          <div class="pv-hero-sub-bar">
            <span style="width:8px;height:8px;border-radius:50%;background:${dotColorAct};${estadoAct!=='inactivo'?`box-shadow:0 0 10px ${dotColorAct}88`:''};flex-shrink:0;display:inline-block;"></span>
            <span>${geoAct ? esc(geoAct) + ' · ' : ''}${esc(dotLabelAct)}</span>
          </div>
          <div class="pv-periodo-bar-hero">
            <button class="pv-flt-btn activo" data-dias="hoy" onclick="pvSetPeriodo(this)">Hoy</button>
            <button class="pv-flt-btn" data-dias="7" onclick="pvSetPeriodo(this)">7 días</button>
            <button class="pv-flt-btn" data-dias="30" onclick="pvSetPeriodo(this)">30 días</button>
            <button class="pv-flt-btn" data-dias="custom" onclick="pvSetPeriodo(this)">Personalizado</button>
            <button class="pv-btn-refresh" onclick="location.reload()">Actualizar</button>
          </div>
          <div class="pv-flt-custom" id="pvFltCustom" style="display:none;margin-top:.8rem;">
            <label>Desde<input type="date" id="pvEvolDesde" class="pv-fecha-input"></label>
            <label>Hasta<input type="date" id="pvEvolHasta" class="pv-fecha-input"></label>
            <button class="pv-aplicar" onclick="pvAplicarFechas()">Aplicar</button>
          </div>

        <div class="pv-kpi-grid">
          <div class="pv-kpi" style="--pv-c:#6495ed">
            <div class="pv-kpi-label">Interacciones del período</div>
            <div class="pv-kpi-n" id="pvKpi1N">${totalScans.toLocaleString('es-AR')}</div>
            <div class="pv-kpi-sub" id="pvKpi1Sub">Actividad histórica de todos tus QRs.</div>
          </div>
          <div class="pv-kpi" style="--pv-c:#89b4f7">
            <div class="pv-kpi-label">Escaneos QR del período</div>
            <div class="pv-kpi-n" id="pvKpi2N">${mAct.v30.toLocaleString('es-AR')}</div>

            <div class="pv-kpi-sub" id="pvKpi2Sub">Escaneos desde QR físico en el período.</div>

          <div class="pv-kpi" style="--pv-c:#c9a84c">
            <div class="pv-kpi-label">Consultas del período</div>
            <div class="pv-kpi-n pv-dorado" id="pvKpi3N">${contactos.length.toLocaleString('es-AR')}</div>
            <div id="pvKpi3Delta"></div>
            <div class="pv-kpi-sub" id="pvKpi3Sub">${mAct.c30.toLocaleString('es-AR')} consultas en el período.</div>
          </div>
          <div class="pv-kpi" style="--pv-c:#3bbf88">
            <div class="pv-kpi-label">Conversión del período</div>

          <div class="pv-kpi kpi-prop">

        ${renderActivoRico(contactos)}
        ${renderSlotCards()}
        ${renderContactosActivo_pv(contactos)}

        <div class="pv-sec pv-msg-sec" id="secMensajes">
          <div class="pv-sec-head"><div>
            <div class="pv-sec-titulo">Novedades de la red${misMensajes.length ? ` <span class="badge-nuevo" style="margin-left:.4rem">${misMensajes.length}</span>` : ''}</div>
            <div class="pv-sec-sub">Actualizaciones de Sur Patagonia para tu espacio.</div>

          <div class="msg-inbox" id="msgInbox">
            ${misMensajes.length ? misMensajes.map((msg, i) => `
              <div class="msg-card" id="msgCard-${i}">

                  <div class="msg-unread-dot" id="dot-${i}"></div>

                  <div class="msg-card-cuerpo">${esc(msg.cuerpo)}</div>
                  <div class="reply-area">
                    <div class="reply-titulo">Tu respuesta</div>
                    ${(msg.mensajes_respuestas || []).filter(r => r.usuario_id === userId).map(r => `<div class="reply-item-colab"><div class="reply-cuerpo">${esc(r.cuerpo)}</div><div class="reply-meta">${fmt(r.created_at)}</div></div>`).join('')}
                    <textarea class="reply-input" id="replyInput-${i}" placeholder="Escribí tu respuesta..."></textarea>
                    <button class="btn-reply" onclick="enviarRespuesta('${msg.id}', ${i}, ${JSON.stringify(canales[0]?.nombre||'').replace(/"/g,'&quot;')})">Enviar respuesta</button>
                  </div>
                </div>
              </div>`).join('') : '<div class="pv-empty"><div class="pv-empty-mark"></div><div class="pv-msg-empty-title">Todo al día</div><div>Cuando Sur Patagonia tenga novedades para tu canal, las vas a encontrar acá.</div></div>'}
          </div>
        </div>`

      // Render de gráficos y QR canvases tras DOM
      // ETAPA 3A.2: fechas iniciales definidas antes del RAF para pasarlas a renderPanelesActivos y renderSlotMiniCharts
      const _h = new Date(); const _d = new Date(_h); _d.setHours(0,0,0,0)
      requestAnimationFrame(() => {
        renderGraficoPasivo(contactos, 0, null, null, { multiSlot: true })
        renderPanelesActivos(contactos)
        if (misSlots.length) {
          generarQRCanvases()
        }
        // ETAPA 2: KPI iniciales en HOY (medianoche → ahora)
        actualizarKpisActivo(_d, _h)
        // ETAPA 3A.1: métricas de cards — período inicial = Hoy
        actualizarSlotCards(_d, _h)
        // ETAPA 3A.2: mini-gráficos de cards — período inicial = Hoy
        if (misSlots.length) renderSlotMiniCharts(_d, _h, 'hoy')
      })
    }

    function compararPeriodo(actual, anterior) {
      if (anterior === 0) return { valor:null, nueva:actual > 0 }
      return { valor:Math.round((actual - anterior) / anterior * 100), nueva:false }
    }

    function metricasPasivo(contactos) {
      const corte30 = new Date(Date.now() - 30 * 86400000)
      const corte60 = new Date(Date.now() - 60 * 86400000)
      const v30 = visitas.filter(v => new Date(v.created_at) >= corte30).length
      const c30 = contactos.filter(c => new Date(c.created_at) >= corte30).length
      const vAnt = visitas.filter(v => { const d = new Date(v.created_at); return d >= corte60 && d < corte30 }).length
      const cAnt = contactos.filter(c => { const d = new Date(c.created_at); return d >= corte60 && d < corte30 }).length
      const conv30 = v30 > 0 ? Number((c30 / v30 * 100).toFixed(1)) : 0
      const convAnt = vAnt > 0 ? Number((cAnt / vAnt * 100).toFixed(1)) : 0
      return {
        v30, c30, vAnt, cAnt, conv30,
        deltaV: compararPeriodo(v30, vAnt),
        deltaC: compararPeriodo(c30, cAnt),
        deltaConv: vAnt > 0 ? { valor:Number((conv30 - convAnt).toFixed(1)), nueva:false } : { valor:null, nueva:conv30 > 0 },
      }
    }

    function renderDelta(delta, etiqueta = 'vs período anterior') {
      if (delta.nueva) return '<div class="pv-kpi-delta pv-delta-pos">Actividad nueva</div>'
      if (delta.valor === null) return '<div class="pv-kpi-delta pv-delta-neu">Sin comparación previa</div>'
      if (delta.valor === 0) return `<div class="pv-kpi-delta pv-delta-neu">Sin variación ${esc(etiqueta)}</div>`
      const positivo = delta.valor > 0
      return `<div class="pv-kpi-delta ${positivo ? 'pv-delta-pos' : 'pv-delta-neg'}">${positivo ? '↑' : '↓'} ${Math.abs(delta.valor)}${etiqueta.startsWith('puntos') ? '' : '%'} ${esc(etiqueta)}</div>`
    }

    function fechaRelativa(dateStr) {
      const diff = Math.max(0, Date.now() - new Date(dateStr).getTime())
      const min = Math.floor(diff / 60000)
      if (min < 1) return 'ahora'
      if (min < 60) return `hace ${min} min`
      const hs = Math.floor(min / 60)
      if (hs < 24) return `hace ${hs} h`
      const ds = Math.floor(hs / 24)
      return `hace ${ds} día${ds === 1 ? '' : 's'}`
    }

    function renderActividadReciente(contactos) {
      const eventos = [
        ...visitas.map(v => ({ fecha:v.created_at, tipo:v.canal_via === 'qr' ? 'qr' : 'link', texto:v.canal_via === 'qr' ? 'Interacción desde el QR físico' : 'Visita desde el enlace compartido' })),
        ...contactos.map(c => ({ fecha:c.created_at, tipo:'lead', texto:'Nueva oportunidad comercial generada' })),
      ].filter(e => e.fecha).sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).slice(0, 8)

      if (!eventos.length) return '<div class="pv-empty">Todavía no hay actividad registrada.</div>'
      return `<div class="pv-feed">${eventos.map(e => `
        <div class="pv-feed-row">
          <span class="pv-feed-dot ${e.tipo}"></span>
          <span class="pv-feed-desc">${esc(e.texto)}</span>
          <span class="pv-feed-fecha">${fechaRelativa(e.fecha)}</span>
        </div>`).join('')}</div>`
    }

    function renderMiniMapaPasivo(canal) {
      const lat = Number(canal.latitud)
      const lng = Number(canal.longitud)
      const contenedor = document.getElementById('pvMiniMapa')
