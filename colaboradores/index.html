<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Panel — Sur Patagonia Colaboradores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0e0c;
      --card: #161513;
      --border: rgba(255,255,255,0.07);
      --accent: #d76f3f;
      --dorado: #c9a84c;
      --verde: #50c878;
      --gris: #888;
      --blanco: #f5f3f0;
      --rojo: #e05c5c;
    }
    body {
      background: var(--bg);
      color: var(--blanco);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-brand { display:flex; flex-direction:column; align-items:flex-start; gap:.15rem; }
    .header-brand img { width:154px; height:auto; filter:brightness(0) invert(1); opacity:.92; }
    .header-brand span { color:rgba(255,255,255,.3); font-size:.48rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase; }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .header-canal { font-size: .75rem; color: var(--gris); }
    .header-canal strong { color: var(--blanco); display: block; font-size: .82rem; }
    .btn-salir {
      background: none;
      border: 1px solid var(--border);
      color: var(--gris);
      padding: .35rem .8rem;
      border-radius: 8px;
      font-size: .72rem;
      cursor: pointer;
      font-family: inherit;
      transition: all .18s;
    }
    .btn-salir:hover { border-color: var(--rojo); color: var(--rojo); }

    /* Main */
    .main { max-width: 900px; margin: 0 auto; padding: 2rem 1.4rem; }

    .bienvenida { margin-bottom: 1.8rem; }
    .bienvenida h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.9rem;
      font-weight: 300;
      margin-bottom: .3rem;
    }
    .bienvenida p { font-size: .76rem; color: var(--gris); }

    /* Estado QR */
    .qr-status {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.3rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .qr-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .qr-dot.activo { background: var(--verde); box-shadow: 0 0 8px rgba(80,200,120,.5); }
    .qr-dot.campana { background: var(--dorado); box-shadow: 0 0 8px rgba(201,168,76,.5); }
    .qr-dot.inactivo { background: var(--gris); }
    .qr-info { flex: 1; }
    .qr-label { font-size: .7rem; color: var(--gris); }
    .qr-valor { font-size: .85rem; font-weight: 600; }
    .qr-codigo { font-family: monospace; font-size: .72rem; color: var(--accent); margin-left: auto; }

    /* KPIs */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: .8rem;
      margin-bottom: 1.2rem;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
    }
    .kpi-n {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: .3rem;
    }
    .kpi-n.accent { color: var(--accent); }
    .kpi-n.dorado { color: var(--dorado); }
    .kpi-n.verde  { color: var(--verde); }
    .kpi-label { font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gris); font-weight: 600; }
    .kpi-sub { font-size: .65rem; color: var(--gris); margin-top: .3rem; }

    /* Sección */
    .seccion {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.3rem 1.4rem;
      margin-bottom: 1.2rem;
    }
    .sec-titulo {
      font-size: .6rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gris);
      font-weight: 600;
      margin-bottom: 1rem;
    }

    /* Tabla consultas */
    .tabla { width: 100%; border-collapse: collapse; }
    .tabla th {
      font-size: .58rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gris);
      font-weight: 600;
      padding: .55rem .7rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .tabla td {
      font-size: .76rem;
      color: var(--blanco);
      padding: .75rem .7rem;
      border-bottom: 1px solid rgba(255,255,255,.04);
      vertical-align: top;
    }
    .tabla tr:last-child td { border-bottom: none; }

    /* Estado badges */
    .estado-badge {
      display: inline-block;
      padding: .15rem .55rem;
      border-radius: 999px;
      font-size: .6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      white-space: nowrap;
    }
    .estado-nueva        { background: rgba(80,200,120,.12); color: var(--verde); }
    .estado-en_contacto  { background: rgba(201,168,76,.12); color: var(--dorado); }
    .estado-en_negociacion { background: rgba(215,111,63,.12); color: var(--accent); }
    .estado-cerrada      { background: rgba(100,149,237,.12); color: #6495ed; }
    .estado-descartada   { background: rgba(136,136,136,.12); color: var(--gris); }

    /* Via badge */
    .via-badge {
      font-size: .6rem;
      color: #6495ed;
      font-family: monospace;
    }
    .via-badge.qr { color: var(--verde); }

    .empty-msg {
      text-align: center;
      padding: 2rem;
      color: var(--gris);
      font-size: .8rem;
    }

    /* Tipo canal badge */
    .tipo-pill {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .62rem;
      font-weight: 600;
      padding: .18rem .55rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .tipo-pasivo    { background: rgba(136,136,136,.12); color: var(--gris); border: 1px solid rgba(136,136,136,.2); }
    .tipo-activo    { background: rgba(201,168,76,.1); color: var(--dorado); border: 1px solid rgba(201,168,76,.25); }

    .sp { width: 28px; height: 28px; border: 2px solid rgba(255,255,255,.1); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 4rem auto; display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider { height: 1px; background: var(--border); margin: 1.4rem 0; }

    /* ── Mensajes ── */
    .msg-inbox { display:flex; flex-direction:column; gap:.5rem; }
    .msg-card { background:rgba(255,255,255,.025); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .msg-card-head { display:flex; align-items:center; gap:.7rem; padding:.85rem 1rem; cursor:pointer; }
    .msg-unread-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; }
    .msg-unread-dot.leido { background:transparent; }
    .msg-card-asunto { font-size:.82rem; font-weight:600; color:var(--blanco); flex:1; }
    .msg-card-fecha  { font-size:.62rem; color:var(--gris); white-space:nowrap; }
    .msg-card-body   { display:none; border-top:1px solid var(--border); padding:.9rem 1rem 1rem; }
    .msg-card-body.open { display:block; }
    .msg-card-cuerpo { font-size:.78rem; color:rgba(255,255,255,.78); line-height:1.7; white-space:pre-wrap; margin-bottom:.8rem; }

    .reply-area { margin-top:.6rem; }
    .reply-titulo { font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gris); font-weight:600; margin-bottom:.55rem; }
    .reply-item-colab { background:rgba(215,111,63,.07); border-radius:8px; padding:.55rem .75rem; margin-bottom:.35rem; }
    .reply-item-colab .reply-cuerpo { font-size:.75rem; color:rgba(255,255,255,.7); }
    .reply-item-colab .reply-meta { font-size:.6rem; color:var(--gris); margin-top:.2rem; }
    .reply-input {
      width:100%; padding:.5rem .7rem; background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.1); color:var(--blanco);
      border-radius:8px; font-family:'Inter',sans-serif; font-size:.76rem;
      resize:vertical; min-height:60px; box-sizing:border-box; margin-top:.4rem;
    }
    .reply-input:focus { outline:none; border-color:rgba(215,111,63,.5); }
    .btn-reply {
      margin-top:.5rem; padding:.42rem 1rem; background:var(--accent); color:#fff;
      border:none; border-radius:8px; font-size:.72rem; font-weight:600;
      cursor:pointer; font-family:'Inter',sans-serif; transition:opacity .15s;
    }
    .btn-reply:hover { opacity:.85; }
    .btn-reply:disabled { opacity:.4; cursor:not-allowed; }
    .no-msgs { text-align:center; padding:2rem; color:var(--gris); font-size:.78rem; }
    .badge-nuevo { font-size:.58rem; background:rgba(215,111,63,.15); color:var(--accent); border-radius:999px; padding:.1rem .5rem; flex-shrink:0; }

    /* ── Panel de impacto del aliado ── */
    .main.pv-main { max-width:1220px; padding-top:1.5rem; }
    .pv-hero { position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:2rem; min-height:230px; padding:2.4rem 2.2rem; margin-bottom:.75rem; border:1px solid rgba(201,168,76,.18); border-top-color:rgba(201,168,76,.52); border-radius:14px; background:radial-gradient(circle at 88% 20%,rgba(215,111,63,.13),transparent 34%),linear-gradient(135deg,rgba(201,168,76,.1),rgba(255,255,255,.015) 58%),#11100e; }
    .pv-hero::after { content:''; position:absolute; inset:auto 0 0; height:1px; background:linear-gradient(90deg,transparent,rgba(201,168,76,.45),transparent); }
    .pv-hero-eyebrow { margin-bottom:.65rem; color:#c9a84c; font-size:.55rem; font-weight:700; letter-spacing:.24em; text-transform:uppercase; }
    .pv-hero-hola { color:#f5f3f0; font-family:'Cormorant Garamond',serif; font-size:clamp(2.1rem,4vw,3.35rem); font-weight:300; line-height:1.02; }
    .pv-hero-hola strong { font-weight:400; }
    .pv-hero-impacto { max-width:650px; margin-top:.8rem; color:rgba(255,255,255,.58); font-size:.86rem; line-height:1.65; }
    .pv-hero-geo { margin-top:.75rem; color:rgba(255,255,255,.3); font-size:.61rem; letter-spacing:.14em; text-transform:uppercase; }
    .pv-identity { display:flex; flex-direction:column; align-items:center; gap:.85rem; min-width:150px; }
    .pv-monogram { width:82px; height:82px; display:grid; place-items:center; border:1px solid rgba(201,168,76,.32); border-radius:50%; background:rgba(201,168,76,.07); color:#e8c96a; font-family:'Cormorant Garamond',serif; font-size:1.75rem; letter-spacing:.08em; box-shadow:0 0 32px rgba(201,168,76,.08); }
    .pv-monogram-mobile { display:none; }
    .pv-mini-mapa-wrap { display:flex; flex-direction:column; align-items:center; gap:.45rem; }
    .pv-mini-mapa { width:160px; height:160px; overflow:hidden; border:1px solid rgba(201,168,76,.25); border-radius:10px; background:#111; pointer-events:none; }
    .pv-mini-mapa-label { max-width:160px; color:rgba(255,255,255,.3); font-size:.56rem; letter-spacing:.14em; text-align:center; text-transform:uppercase; }
    #pvMiniMapa .leaflet-control-zoom, #pvMiniMapa .leaflet-control-attribution { display:none !important; }
    .pv-hero-estado { display:flex; align-items:center; justify-content:center; gap:.5rem; color:rgba(255,255,255,.55); font-size:.61rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
    .pv-hero-code { color:rgba(255,255,255,.18); font-family:monospace; font-size:.56rem; }
    .pv-resumen { margin-bottom:1.25rem; padding:.75rem 1rem; text-align:center; color:rgba(255,255,255,.42); font-size:.72rem; }
    .pv-resumen strong { color:#e8c96a; font-weight:600; }
    .pv-kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.8rem; margin-bottom:1rem; }
    .pv-kpi { position:relative; overflow:hidden; min-height:148px; padding:1.25rem 1.3rem; border:1px solid rgba(255,255,255,.07); border-top-color:rgba(255,255,255,.13); border-radius:12px; background:linear-gradient(145deg,rgba(255,255,255,.052),rgba(255,255,255,.018)); }
    .pv-kpi::before { content:''; position:absolute; left:0; top:22%; bottom:22%; width:2px; background:var(--pv-c,#c9a84c); opacity:.75; }
    .pv-kpi-label { margin-bottom:.7rem; color:rgba(255,255,255,.38); font-size:.54rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
    .pv-kpi-n { color:#f8f6f2; font-size:2.65rem; font-weight:300; line-height:1; }
    .pv-kpi-n.pv-dorado { background:linear-gradient(135deg,#c9a84c,#e8c96a); background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .pv-kpi-sub { margin-top:.55rem; color:rgba(255,255,255,.3); font-size:.63rem; line-height:1.45; }
    .pv-kpi-delta { display:inline-flex; align-items:center; gap:.25rem; margin-top:.45rem; font-size:.61rem; font-weight:600; }
    .pv-delta-pos { color:#50c878; }
    .pv-delta-neg { color:#d9825b; }
    .pv-delta-neu { color:rgba(255,255,255,.3); }
    .pv-sec { padding:1.45rem 1.55rem; margin-bottom:1rem; border:1px solid rgba(255,255,255,.07); border-top-color:rgba(255,255,255,.12); border-radius:12px; background:linear-gradient(155deg,rgba(255,255,255,.042),rgba(255,255,255,.014)); }
    .pv-sec-head { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin-bottom:1.15rem; }
    .pv-sec-titulo { color:rgba(255,255,255,.42); font-size:.57rem; font-weight:700; letter-spacing:.19em; text-transform:uppercase; }
    .pv-sec-sub { margin-top:.35rem; color:rgba(255,255,255,.28); font-size:.66rem; }
    .pv-chart-wrap { position:relative; height:270px; }
    .pv-flt-bar { display:flex; align-items:center; gap:.35rem; flex-wrap:wrap; }
    .pv-flt-btn { min-height:30px; padding:.32rem .65rem; border:1px solid rgba(255,255,255,.09); border-radius:7px; background:rgba(255,255,255,.025); color:rgba(255,255,255,.4); font:600 .58rem 'Inter',sans-serif; cursor:pointer; }
    .pv-flt-btn.activo { border-color:rgba(201,168,76,.42); background:rgba(201,168,76,.11); color:#e8c96a; }
    .pv-flt-custom { display:flex; align-items:flex-end; justify-content:flex-end; gap:.55rem; margin:0 0 1rem; padding:.7rem; border-top:1px solid rgba(255,255,255,.05); }
    .pv-flt-custom label { display:flex; flex-direction:column; gap:.3rem; color:rgba(255,255,255,.3); font-size:.55rem; text-transform:uppercase; letter-spacing:.09em; }
    .pv-fecha-input { padding:.38rem .5rem; border:1px solid rgba(255,255,255,.1); border-radius:7px; background:rgba(255,255,255,.04); color:#f5f3f0; color-scheme:dark; font:500 .67rem 'Inter',sans-serif; }
    .pv-aplicar { min-height:31px; padding:.35rem .75rem; border:0; border-radius:7px; background:#c9a84c; color:#15130e; font:700 .6rem 'Inter',sans-serif; cursor:pointer; }
    .pv-impact-grid { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr); gap:1rem; margin-bottom:1rem; }
    .pv-funnel-sec { margin-bottom:0; }
    .pv-funnel { display:flex; flex-direction:column; gap:.55rem; padding:.25rem 0; }
    .pv-funnel-row { display:grid; grid-template-columns:minmax(0,1fr) 118px; align-items:center; gap:1rem; }
    .pv-funnel-bar-wrap { min-width:0; display:flex; justify-content:center; }
    .pv-funnel-bar { min-width:34px; height:28px; position:relative; display:flex; align-items:center; justify-content:center; padding:0 .55rem; border-radius:6px; transition:width .6s cubic-bezier(.22,.61,.36,1); }
    .pv-funnel-label-inline { overflow:hidden; color:rgba(255,255,255,.78); font-size:.62rem; font-weight:700; letter-spacing:.04em; white-space:nowrap; }
    .pv-funnel-meta { min-width:0; text-align:right; }
    .pv-funnel-n { color:#f8f6f2; font-size:1.45rem; font-weight:300; line-height:1; }
    .pv-funnel-etapa { margin-top:.2rem; color:rgba(255,255,255,.38); font-size:.54rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    .pv-funnel-conv { margin-top:.14rem; color:rgba(255,255,255,.3); font-size:.58rem; font-weight:600; }
    .pv-funnel-bar.etapa-0 { border:1px solid rgba(100,149,237,.28); background:linear-gradient(90deg,rgba(100,149,237,.32),rgba(100,149,237,.13)); }
    .pv-funnel-bar.etapa-1 { border:1px solid rgba(201,168,76,.3); background:linear-gradient(90deg,rgba(201,168,76,.3),rgba(201,168,76,.12)); }
    .pv-funnel-bar.etapa-2 { border:1px solid rgba(137,180,247,.26); background:linear-gradient(90deg,rgba(137,180,247,.25),rgba(137,180,247,.1)); }
    .pv-funnel-bar.etapa-3 { border:1px solid rgba(80,200,120,.28); background:linear-gradient(90deg,rgba(80,200,120,.3),rgba(80,200,120,.1)); }
    .pv-funnel-row.es-logro .pv-funnel-bar { border:1px solid rgba(201,168,76,.5); background:linear-gradient(90deg,rgba(201,168,76,.45),rgba(232,201,106,.24)); box-shadow:0 0 18px rgba(201,168,76,.15),0 0 32px rgba(201,168,76,.08); }
    .pv-funnel-row.es-logro .pv-funnel-n { background:linear-gradient(135deg,#c9a84c,#e8c96a); background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:2rem; font-weight:400; }
    .pv-funnel-row.es-logro .pv-funnel-etapa { color:#c9a84c; font-size:.58rem; letter-spacing:.16em; }
    .pv-funnel-logro-vacio { width:100%; padding:.7rem .8rem; border:1px dashed rgba(201,168,76,.2); border-radius:8px; color:rgba(255,255,255,.32); font-size:.66rem; text-align:center; }
    .pv-funnel-descartadas { margin-top:.6rem; color:rgba(255,255,255,.22); font-size:.61rem; text-align:center; }
    .pv-funnel-sin-actividad { margin-top:.7rem; color:rgba(255,255,255,.3); font-size:.66rem; line-height:1.5; text-align:center; }
    .pv-feed { display:flex; flex-direction:column; gap:.2rem; }
    .pv-feed-row { display:grid; grid-template-columns:8px minmax(0,1fr) auto; align-items:center; gap:.65rem; padding:.52rem .2rem; border-bottom:1px solid rgba(255,255,255,.045); }
    .pv-feed-row:last-child { border-bottom:0; }
    .pv-feed-dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.2); }
    .pv-feed-dot.qr { background:#50c878; box-shadow:0 0 7px rgba(80,200,120,.4); }
    .pv-feed-dot.link { background:#6495ed; box-shadow:0 0 7px rgba(100,149,237,.35); }
    .pv-feed-dot.lead { background:#c9a84c; box-shadow:0 0 7px rgba(201,168,76,.35); }
    .pv-feed-desc { color:rgba(255,255,255,.67); font-size:.7rem; }
    .pv-feed-fecha { color:rgba(255,255,255,.25); font-size:.61rem; white-space:nowrap; }
    .pv-tabla { width:100%; border-collapse:collapse; }
    .pv-tabla th { padding:.5rem .65rem; border-bottom:1px solid rgba(255,255,255,.06); color:rgba(255,255,255,.3); font-size:.54rem; font-weight:600; letter-spacing:.1em; text-align:left; text-transform:uppercase; }
    .pv-tabla td { padding:.75rem .65rem; border-bottom:1px solid rgba(255,255,255,.04); color:rgba(255,255,255,.78); font-size:.73rem; vertical-align:middle; }
    .pv-tabla tr:last-child td { border-bottom:none; }
    .pv-tabla tr:hover td { background:rgba(255,255,255,.02); }
    .pv-dot-nueva { width:7px; height:7px; border-radius:50%; background:#50c878; box-shadow:0 0 7px rgba(80,200,120,.48); }
    .pv-via { display:inline-flex; align-items:center; gap:.35rem; color:#6495ed; font-size:.61rem; }
    .pv-via-mark { width:8px; height:8px; border:1px solid currentColor; }
    .pv-via.qr { color:#50c878; font-weight:600; }
    .pv-via.link { color:#6495ed; }
    .pv-fecha { color:rgba(255,255,255,.38); font-size:.66rem; white-space:nowrap; }
    .pv-slug { display:inline-block; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:rgba(255,255,255,.67); font-size:.67rem; }
    .pv-empty { padding:2rem 1rem; text-align:center; color:rgba(255,255,255,.28); font-size:.72rem; }
    .pv-empty-mark { width:26px; height:26px; margin:0 auto .65rem; border:1px solid rgba(201,168,76,.28); border-radius:50%; }
    .pv-msg-sec .msg-card { border-radius:8px; border-left:2px solid rgba(201,168,76,.28); }

    @media(max-width:900px){ .pv-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pv-impact-grid{grid-template-columns:1fr}.pv-hero{min-height:210px} }
    @media(max-width:560px){ .header{padding:.85rem 1rem}.header-brand img{width:122px}.header-canal{display:none}.main.pv-main{padding:1rem}.pv-hero{grid-template-columns:1fr;min-height:0;padding:1.5rem}.pv-identity{align-items:flex-start;min-width:0}.pv-mini-mapa-wrap{display:none}.pv-monogram-mobile{display:grid}.pv-monogram{width:58px;height:58px;font-size:1.3rem}.pv-hero-estado{justify-content:flex-start}.pv-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}.pv-kpi{min-height:135px;padding:1rem}.pv-kpi-n{font-size:2rem}.pv-sec{padding:1rem}.pv-sec-head{flex-direction:column}.pv-chart-wrap{height:235px}.pv-funnel-row{grid-template-columns:1fr;gap:.4rem}.pv-funnel-meta{text-align:left;padding-left:.4rem}.pv-funnel-bar{width:100% !important}.pv-flt-custom{align-items:stretch;flex-direction:column}.pv-aplicar{width:100%}.pv-tabla{min-width:500px} }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-brand">
    <img src="../assets/logohorizontalnegro.png" alt="Sur Patagonia" />
    <span>Red de aliados</span>
  </div>
  <div class="header-right">
    <div class="header-canal" id="headerCanal"></div>
    <button class="btn-salir" onclick="salir()">Salir</button>
  </div>
</header>

<!-- MAIN -->
<main class="main" id="mainContent">
  <div class="sp"></div>
</main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const supabase = createClient(
    'https://wajkfydxutptcvvfwrvq.supabase.co',
    'sb_publishable_RKpmv1VDwMOB25phyfFrog_OdI-wB8s',
    { auth: { storageKey: 'sp-colab-session' } }
  )

  window.salir = async function() {
    await supabase.auth.signOut()
    location.href = 'login.html'
  }

  const esc  = s => !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  const fmt  = iso => iso ? new Date(iso).toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' }) : '—'
  const ESTADO_LABEL = { nueva:'Nueva', en_contacto:'En contacto', en_negociacion:'En negociación', cerrada:'Cerrada', descartada:'Descartada' }
  const ESTADO_LABEL_PASIVO = { nueva:'Nueva', en_contacto:'Contactada', en_negociacion:'Visita programada', cerrada:'Operación cerrada', descartada:'Descartada' }

  // Codifica el apellido: "Juan González" → "Juan Go***"
  const codificarNombre = nombre => {
    if (!nombre) return '—'
    const partes = nombre.trim().split(/\s+/)
    if (partes.length === 1) return partes[0]
    const apellido = partes[partes.length - 1]
    const codApellido = apellido.slice(0, 2) + '***'
    return [...partes.slice(0, -1), codApellido].join(' ')
  }

  ;(async () => {
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) { location.href = 'login.html'; return }

    const userId = session.user.id

    // ── Cargar TODOS los canales del usuario ───────
    const { data: canales } = await supabase
      .from('canales').select('*').eq('user_id', userId).order('nombre')

    if (!canales?.length) {
      document.getElementById('mainContent').innerHTML =
        '<div class="empty-msg">No tenés canales asignados. Contactá a Sur Patagonia.</div>'
      return
    }

    const esPasivo  = session.user.user_metadata?.tipo_acceso !== 'activo'
    const codigos   = canales.map(c => c.codigo)
    const ahora     = new Date()
    const hace30    = new Date(ahora - 30 * 86400000).toISOString()

    // Header
    document.getElementById('headerCanal').innerHTML =
      `<strong>${esc(canales[0].nombre)}</strong>${canales.length > 1 ? ` <span style="font-size:.65rem;opacity:.6;">+${canales.length - 1} canales</span>` : ''}`

    // ── Cargar métricas globales + mensajes ───────
    const canalIds    = canales.map(c => c.id)
    const ciudadesMias = [...new Set(canales.map(c => c.ciudad).filter(Boolean))]
    const provinciasMias = [...new Set(canales.map(c => c.provincia).filter(Boolean))]

    // canal_ref almacena el codigo de la REFERENCIA (no del canal).
    // El admin lo resuelve por prefijo: canal_ref.startsWith(canal.codigo + '-').
    // Acá buscamos primero todas las referencias del canal y filtramos por esos códigos.
    // También incluimos canal.codigo directamente como fallback (links sin referencia).
    const { data: misRefs } = await supabase
      .from('referencias')
      .select('codigo, canal_id')
      .in('canal_id', canalIds)
    const refCodigos = misRefs?.map(r => r.codigo) || []
    // codigos de filtrado = referencia codes + canal codes (fallback)
    const codigosRef = [...new Set([...refCodigos, ...codigos])]

    const [rVisitas, rVisitas30, rContactos, rCampanas, rMensajes] = await Promise.all([
      supabase.from('visitas').select('created_at, canal_via, canal_ref').in('canal_ref', codigosRef),
      supabase.from('visitas').select('id', { count:'exact', head:true }).in('canal_ref', codigosRef).gte('created_at', hace30),
      supabase.from('contactos').select('*').in('canal_ref', codigosRef).order('created_at', { ascending: false }),
      supabase.from('campanas_canales')
        .select('canal_id, campanas(nombre, activa, fecha_inicio, fecha_fin)')
        .in('canal_id', canales.map(c => c.id)),
      supabase.from('mensajes')
        .select('id, asunto, cuerpo, usuario_id, ciudad, provincia, tipo_acceso, provincias_arr, ciudades_arr, canal_ids, created_at, mensajes_respuestas(id, usuario_id, cuerpo, created_at)')
        .order('created_at', { ascending: false })
    ])

    const visitas    = rVisitas.data    || []
    const scans30    = rVisitas30.count || 0
    const contactos  = rContactos.data  || []
    let _pvChart = null

    // Filtrar mensajes para este usuario
    // Lógica: si usuario_id está → solo ese usuario
    // Si no → AND entre todos los filtros activos.
    // Soporta tanto campos nuevos (arrays) como campos viejos (single value).
    const userTipoAcceso = esPasivo ? 'pasivo' : 'activo'
    const misCanalesIds  = canales.map(c => c.id)
    const todosMsg = rMensajes.data || []
    const misMensajes = todosMsg.filter(m => {
      if (m.usuario_id) return m.usuario_id === userId

      // ── Nuevos campos multi-select (arrays) ──
      // canal_ids: alguno de los mis canales debe estar en la lista
      if (m.canal_ids?.length) {
        if (!m.canal_ids.some(id => misCanalesIds.includes(id))) return false
      }
      // provincias_arr: mi provincia debe estar en alguna de las seleccionadas
      if (m.provincias_arr?.length) {
        if (!m.provincias_arr.some(p => provinciasMias.includes(p))) return false
      }
      // ciudades_arr: mi ciudad debe estar en alguna de las seleccionadas
      if (m.ciudades_arr?.length) {
        if (!m.ciudades_arr.some(c => ciudadesMias.includes(c))) return false
      }

      // ── Compatibilidad con campos viejos (mensajes anteriores) ──
      if (!m.provincias_arr && !m.ciudades_arr && !m.canal_ids) {
        if (m.ciudad      && !ciudadesMias.includes(m.ciudad))      return false
        if (m.provincia   && !provinciasMias.includes(m.provincia)) return false
        if (m.tipo_acceso && m.tipo_acceso !== userTipoAcceso)      return false
      }

      return true
    })
    const totalScans = visitas.length
    const conv       = totalScans > 0 ? ((contactos.length / totalScans) * 100).toFixed(1) : 0

    // Campaña activa por canal
    const campanaActiva = {}
    ;(rCampanas.data || []).forEach(row => {
      const c = row.campanas
      if (!c?.activa) return
      const ini = c.fecha_inicio ? new Date(c.fecha_inicio) : null
      const fin = c.fecha_fin    ? new Date(c.fecha_fin)    : null
      if ((!ini || ini <= ahora) && (!fin || fin >= ahora)) {
        campanaActiva[row.canal_id] = c.nombre
      }
    })

    // Mapa refCodigo → canalId (canal_id viene en misRefs)
    const refACanal = {}
    ;(misRefs || []).forEach(r => { refACanal[r.codigo] = r.canal_id })

    // ── Cards de canales (activo) ──────────────────
    const renderCards = () => canales.map(c => {
      // Todos los codigos (referencia o canal directo) que pertenecen a este canal
      const misCodigos = new Set([c.codigo, ...(misRefs || []).filter(r => r.canal_id === c.id).map(r => r.codigo)])
      const cScans    = visitas.filter(v => misCodigos.has(v.canal_ref)).length
      const cContacts = contactos.filter(x => misCodigos.has(x.canal_ref)).length
      const estado    = !c.activo ? 'inactivo' : campanaActiva[c.id] ? 'campana' : 'activo'
      const estadoLabel = estado === 'inactivo' ? 'QR inactivo'
        : campanaActiva[c.id] ? `Campaña: ${campanaActiva[c.id]}`
        : 'QR activo'
      return `
      <div class="qr-status" style="flex-direction:column;align-items:flex-start;gap:.6rem;padding:1rem 1.2rem;">
        <div style="display:flex;align-items:center;gap:.6rem;width:100%;">
          <div class="qr-dot ${estado}"></div>
          <div class="qr-info" style="flex:1;">
            <div class="qr-label" style="font-weight:600;font-size:.8rem;">${esc(c.nombre)}</div>
            <div class="qr-valor" style="font-size:.68rem;">${esc(estadoLabel)}</div>
          </div>
          <div class="qr-codigo">${esc(c.codigo)}</div>
        </div>
        <div style="display:flex;gap:1.5rem;font-size:.72rem;color:var(--gris);">
          <span><strong style="color:var(--blanco);font-size:.9rem;">${cScans}</strong> scans</span>
          <span><strong style="color:var(--dorado);font-size:.9rem;">${cContacts}</strong> consultas</span>
        </div>
      </div>`
    }).join('')

    // ── Render ─────────────────────────────────────
    const main = document.getElementById('mainContent')
    if (esPasivo) {
      main.classList.add('pv-main')
      const canal = canales[0]
      const geo = [canal.ciudad, canal.provincia].filter(Boolean).join(', ')
      const estadoQR = !canal.activo ? 'inactivo' : campanaActiva[canal.id] ? 'campana' : 'activo'
      const dotColor = estadoQR === 'activo' ? '#50c878' : estadoQR === 'campana' ? '#c9a84c' : '#444'
      const dotGlow = estadoQR !== 'inactivo' ? `box-shadow:0 0 10px ${dotColor}88` : ''
      const dotLabel = estadoQR === 'inactivo' ? 'QR inactivo' : estadoQR === 'campana' ? `Campaña: ${campanaActiva[canal.id]}` : 'QR activo'
      const m = metricasPasivo(contactos)
      const monograma = (canal.nombre || 'SP').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase()

      main.innerHTML = `
        <div class="pv-hero">
          <div>
            <div class="pv-hero-eyebrow">Aliado Sur Patagonia</div>
            <div class="pv-hero-hola">Hola, <strong>${esc(canal.nombre)}</strong></div>
            <div class="pv-hero-impacto">Este es el impacto que tu espacio está generando dentro de la red Sur Patagonia.</div>
            ${geo ? `<div class="pv-hero-geo">${esc(geo)}</div>` : ''}
          </div>
          <div class="pv-identity">
            ${canal.latitud && canal.longitud ? `
              <div class="pv-mini-mapa-wrap">
                <div id="pvMiniMapa" class="pv-mini-mapa"></div>
                ${geo ? `<div class="pv-mini-mapa-label">${esc(geo)}</div>` : ''}
              </div>
              <div class="pv-monogram pv-monogram-mobile">${esc(monograma)}</div>
            ` : `<div class="pv-monogram">${esc(monograma)}</div>`}
            <div class="pv-hero-estado">
              <span style="width:8px;height:8px;border-radius:50%;background:${dotColor};${dotGlow};flex-shrink:0"></span>
              <span style="color:${dotColor}">${esc(dotLabel)}</span>
            </div>
            <div class="pv-hero-code">Código ${esc(canal.codigo)}</div>
          </div>
        </div>

        <div class="pv-resumen">En los últimos 30 días, tu canal generó <strong>${m.v30.toLocaleString('es-AR')} interacciones</strong> y <strong>${m.c30.toLocaleString('es-AR')} consultas comerciales</strong>.</div>

        <div class="pv-kpi-grid">
          <div class="pv-kpi" style="--pv-c:#6495ed"><div class="pv-kpi-label">Interacciones generadas</div><div class="pv-kpi-n">${totalScans.toLocaleString('es-AR')}</div><div class="pv-kpi-sub">Actividad histórica desde tu QR y enlace.</div></div>
          <div class="pv-kpi" style="--pv-c:#89b4f7"><div class="pv-kpi-label">Impulso reciente</div><div class="pv-kpi-n">${m.v30.toLocaleString('es-AR')}</div>${renderDelta(m.deltaV)}<div class="pv-kpi-sub">Interacciones en los últimos 30 días.</div></div>
          <div class="pv-kpi" style="--pv-c:#c9a84c"><div class="pv-kpi-label">Consultas históricas</div><div class="pv-kpi-n pv-dorado">${contactos.length.toLocaleString('es-AR')}</div><div class="pv-kpi-sub">Oportunidades generadas desde el inicio · ${m.c30.toLocaleString('es-AR')} en los últimos 30 días.</div></div>
          <div class="pv-kpi" style="--pv-c:#50c878"><div class="pv-kpi-label">Conversión a consulta</div><div class="pv-kpi-n">${m.conv30}%</div>${renderDelta(m.deltaConv, 'puntos vs período anterior')}<div class="pv-kpi-sub">Interacciones que se convirtieron en oportunidades.</div></div>
        </div>

        ${renderPasivo(contactos)}

        <div class="pv-sec pv-msg-sec" id="secMensajes">
          <div class="pv-sec-head"><div><div class="pv-sec-titulo">Novedades de la red${misMensajes.length ? ` <span class="badge-nuevo" style="margin-left:.4rem">${misMensajes.length}</span>` : ''}</div><div class="pv-sec-sub">Actualizaciones de Sur Patagonia para tu espacio.</div></div></div>
          <div class="msg-inbox" id="msgInbox">
            ${misMensajes.length ? misMensajes.map((m, i) => `
              <div class="msg-card" id="msgCard-${i}">
                <div class="msg-card-head" onclick="toggleMsg(${i})">
                  <div class="msg-unread-dot" id="dot-${i}"></div>
                  <div class="msg-card-asunto">${esc(m.asunto)}</div>
                  <div class="msg-card-fecha">${fmt(m.created_at)}</div>
                </div>
                <div class="msg-card-body" id="msgBody-${i}"><div class="msg-card-cuerpo">${esc(m.cuerpo)}</div></div>
              </div>`).join('') : '<div class="pv-empty"><div class="pv-empty-mark"></div><div class="pv-msg-empty-title">Todo al día</div><div>Cuando Sur Patagonia tenga novedades para tu canal, las vas a encontrar acá.</div></div>'}
          </div>
        </div>`

      requestAnimationFrame(() => {
        renderGraficoPasivo(contactos, 30)
        renderMiniMapaPasivo(canal)
      })
    } else {
      main.innerHTML = `
        <div class="bienvenida">
          <h1>Bienvenido</h1>
          <p>${canales[0].ciudad ? esc(canales[0].ciudad) + (canales[0].provincia ? ', ' + esc(canales[0].provincia) : '') : 'Tu panel de colaborador'}
            · <span class="tipo-pill tipo-activo">Inmobiliaria / Vendedor</span>
          </p>
        </div>
        <div class="kpi-grid">
          <div class="kpi"><div class="kpi-n accent">${totalScans.toLocaleString('es-AR')}</div><div class="kpi-label">Scans totales</div><div class="kpi-sub">todos tus canales</div></div>
          <div class="kpi"><div class="kpi-n">${scans30.toLocaleString('es-AR')}</div><div class="kpi-label">Scans últimos 30 días</div><div class="kpi-sub">actividad reciente</div></div>
          <div class="kpi"><div class="kpi-n dorado">${contactos.length}</div><div class="kpi-label">Consultas generadas</div><div class="kpi-sub">leads de tus canales</div></div>
          <div class="kpi"><div class="kpi-n verde">${conv}%</div><div class="kpi-label">Tasa de conversión</div><div class="kpi-sub">scans → consultas</div></div>
        </div>
        ${canales.length > 1 ? `<div class="seccion"><div class="sec-titulo">Tus canales</div><div style="display:flex;flex-direction:column;gap:.6rem;">${renderCards()}</div></div>` : renderCards()}
        ${renderActivo(contactos)}
        <div class="seccion" id="secMensajes">
          <div class="sec-titulo">Mensajes de Sur Patagonia${misMensajes.length ? ` <span class="badge-nuevo" style="margin-left:.4rem;">${misMensajes.length}</span>` : ''}</div>
          <div class="msg-inbox" id="msgInbox">
            ${misMensajes.length ? misMensajes.map((m, i) => `
              <div class="msg-card" id="msgCard-${i}">
                <div class="msg-card-head" onclick="toggleMsg(${i})">
                  <div class="msg-unread-dot" id="dot-${i}"></div>
                  <div class="msg-card-asunto">${esc(m.asunto)}</div>
                  <div class="msg-card-fecha">${fmt(m.created_at)}</div>
                </div>
                <div class="msg-card-body" id="msgBody-${i}">
                  <div class="msg-card-cuerpo">${esc(m.cuerpo)}</div>
                  <div class="reply-area">
                    <div class="reply-titulo">Tu respuesta</div>
                    ${(m.mensajes_respuestas || []).filter(r => r.usuario_id === userId).map(r => `<div class="reply-item-colab"><div class="reply-cuerpo">${esc(r.cuerpo)}</div><div class="reply-meta">${fmt(r.created_at)}</div></div>`).join('')}
                    <textarea class="reply-input" id="replyInput-${i}" placeholder="Escribí tu respuesta..."></textarea>
                    <button class="btn-reply" onclick="enviarRespuesta('${m.id}', ${i}, ${JSON.stringify(canales[0]?.nombre||'').replace(/"/g,'&quot;')})">Enviar respuesta</button>
                  </div>
                </div>
              </div>`).join('') : '<div class="no-msgs">No tenés mensajes por ahora.</div>'}
          </div>
        </div>`
    }

    function compararPeriodo(actual, anterior) {
      if (anterior === 0) return { valor:null, nueva:actual > 0 }
      return { valor:Math.round((actual - anterior) / anterior * 100), nueva:false }
    }

    function metricasPasivo(contactos) {
      const corte30 = new Date(Date.now() - 30 * 86400000)
      const corte60 = new Date(Date.now() - 60 * 86400000)
      const v30 = visitas.filter(v => new Date(v.created_at) >= corte30).length
      const c30 = contactos.filter(c => new Date(c.created_at) >= corte30).length
      const vAnt = visitas.filter(v => { const d = new Date(v.created_at); return d >= corte60 && d < corte30 }).length
      const cAnt = contactos.filter(c => { const d = new Date(c.created_at); return d >= corte60 && d < corte30 }).length
      const conv30 = v30 > 0 ? Number((c30 / v30 * 100).toFixed(1)) : 0
      const convAnt = vAnt > 0 ? Number((cAnt / vAnt * 100).toFixed(1)) : 0
      return {
        v30, c30, vAnt, cAnt, conv30,
        deltaV: compararPeriodo(v30, vAnt),
        deltaC: compararPeriodo(c30, cAnt),
        deltaConv: vAnt > 0 ? { valor:Number((conv30 - convAnt).toFixed(1)), nueva:false } : { valor:null, nueva:conv30 > 0 },
      }
    }

    function renderDelta(delta, etiqueta = 'vs período anterior') {
      if (delta.nueva) return '<div class="pv-kpi-delta pv-delta-pos">Actividad nueva</div>'
      if (delta.valor === null) return '<div class="pv-kpi-delta pv-delta-neu">Sin comparación previa</div>'
      if (delta.valor === 0) return `<div class="pv-kpi-delta pv-delta-neu">Sin variación ${esc(etiqueta)}</div>`
      const positivo = delta.valor > 0
      return `<div class="pv-kpi-delta ${positivo ? 'pv-delta-pos' : 'pv-delta-neg'}">${positivo ? '↑' : '↓'} ${Math.abs(delta.valor)}${etiqueta.startsWith('puntos') ? '' : '%'} ${esc(etiqueta)}</div>`
    }

    function fechaRelativa(dateStr) {
      const diff = Math.max(0, Date.now() - new Date(dateStr).getTime())
      const min = Math.floor(diff / 60000)
      if (min < 1) return 'ahora'
      if (min < 60) return `hace ${min} min`
      const hs = Math.floor(min / 60)
      if (hs < 24) return `hace ${hs} h`
      const ds = Math.floor(hs / 24)
      return `hace ${ds} día${ds === 1 ? '' : 's'}`
    }

    function renderActividadReciente(contactos) {
      const eventos = [
        ...visitas.map(v => ({ fecha:v.created_at, tipo:v.canal_via === 'qr' ? 'qr' : 'link', texto:v.canal_via === 'qr' ? 'Interacción desde el QR físico' : 'Visita desde el enlace compartido' })),
        ...contactos.map(c => ({ fecha:c.created_at, tipo:'lead', texto:'Nueva oportunidad comercial generada' })),
      ].filter(e => e.fecha).sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).slice(0, 8)

      if (!eventos.length) return '<div class="pv-empty">Todavía no hay actividad registrada.</div>'
      return `<div class="pv-feed">${eventos.map(e => `
        <div class="pv-feed-row">
          <span class="pv-feed-dot ${e.tipo}"></span>
          <span class="pv-feed-desc">${esc(e.texto)}</span>
          <span class="pv-feed-fecha">${fechaRelativa(e.fecha)}</span>
        </div>`).join('')}</div>`
    }

    function renderMiniMapaPasivo(canal) {
      const lat = Number(canal.latitud)
      const lng = Number(canal.longitud)
      const contenedor = document.getElementById('pvMiniMapa')
      const leaflet = window.L
      if (!contenedor || !Number.isFinite(lat) || !Number.isFinite(lng) || window.innerWidth <= 560 || !leaflet) return

      const miniMap = leaflet.map(contenedor, {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        touchZoom: false,
        keyboard: false,
      }).setView([lat, lng], 13)

      leaflet.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd',
        maxZoom: 19,
      }).addTo(miniMap)

      const icon = leaflet.divIcon({
        className: '',
        html: '<div style="width:14px;height:14px;background:#c9a84c;border:2px solid rgba(201,168,76,.5);border-radius:50%;box-shadow:0 0 12px rgba(201,168,76,.7),0 0 24px rgba(201,168,76,.3)"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7],
      })

      leaflet.marker([lat, lng], { icon }).addTo(miniMap)
    }

    function renderFunnelCRM(contactos) {
      const totalInteracciones = visitas.length
      const totalConsultas = contactos.length
      const totalContactadas = contactos.filter(c => ['en_contacto','en_negociacion','cerrada'].includes(c.estado)).length
      const totalVisitas = contactos.filter(c => ['en_negociacion','cerrada'].includes(c.estado)).length
      const totalCerradas = contactos.filter(c => c.estado === 'cerrada').length
      const totalDescartadas = contactos.filter(c => c.estado === 'descartada').length
      const pct = (actual, anterior) => anterior > 0 ? `${Math.round(actual / anterior * 100)}%` : null
      const etapas = [
        { clase:'etapa-0', n:totalInteracciones, label:'Interacciones', conv:null },
        { clase:'etapa-1', n:totalConsultas, label:'Consultas generadas', conv:pct(totalConsultas, totalInteracciones) },
        { clase:'etapa-2', n:totalContactadas, label:'Contactadas', conv:pct(totalContactadas, totalConsultas) },
        { clase:'etapa-3', n:totalVisitas, label:'Visita programada', conv:pct(totalVisitas, totalContactadas) },
      ]
      const maxN = Math.max(totalInteracciones, 1)

      const filas = etapas.map(e => {
        const ancho = Math.min(100, Math.max(8, Math.round(e.n / maxN * 100)))
        return `<div class="pv-funnel-row">
          <div class="pv-funnel-bar-wrap"><div class="pv-funnel-bar ${e.clase}" style="width:${ancho}%"><span class="pv-funnel-label-inline">${e.n > 0 ? e.n.toLocaleString('es-AR') : '0'}</span></div></div>
          <div class="pv-funnel-meta"><div class="pv-funnel-n">${e.n.toLocaleString('es-AR')}</div><div class="pv-funnel-etapa">${esc(e.label)}</div>${e.conv ? `<div class="pv-funnel-conv">${e.conv} de la etapa anterior</div>` : ''}</div>
        </div>`
      }).join('')

      const convCierre = pct(totalCerradas, totalVisitas)
      const anchoCierre = Math.min(100, Math.max(8, Math.round(totalCerradas / maxN * 100)))
      const cierre = totalCerradas > 0
        ? `<div class="pv-funnel-row es-logro">
            <div class="pv-funnel-bar-wrap"><div class="pv-funnel-bar" style="width:${anchoCierre}%"><span class="pv-funnel-label-inline">★</span></div></div>
            <div class="pv-funnel-meta"><div class="pv-funnel-n">${totalCerradas.toLocaleString('es-AR')}</div><div class="pv-funnel-etapa">Operación cerrada</div>${convCierre ? `<div class="pv-funnel-conv" style="color:#c9a84c">${convCierre} de visitas a cierre</div>` : ''}</div>
          </div>`
        : `<div class="pv-funnel-row">
            <div class="pv-funnel-bar-wrap"><div class="pv-funnel-logro-vacio">★ Primera operación cerrada en camino</div></div>
            <div class="pv-funnel-meta"><div class="pv-funnel-n" style="color:rgba(255,255,255,.25)">0</div><div class="pv-funnel-etapa">Operación cerrada</div></div>
          </div>`

      return `<div class="pv-sec pv-funnel-sec">
        <div class="pv-sec-head"><div><div class="pv-sec-titulo">Tu trayectoria comercial</div><div class="pv-sec-sub">Cada avance acerca una oportunidad al cierre.</div></div></div>
        <div class="pv-funnel">${filas}${cierre}</div>
        ${totalDescartadas > 0 ? `<div class="pv-funnel-descartadas">${totalDescartadas} descartada${totalDescartadas === 1 ? '' : 's'}</div>` : ''}
        ${totalInteracciones === 0 ? '<div class="pv-funnel-sin-actividad">Tu canal todavía no registra actividad. Cuando alguien escanee tu QR o visite tu enlace, lo vas a ver acá.</div>' : ''}
      </div>`
    }

    function renderPasivo(contactos) {
      const m = metricasPasivo(contactos)

      const filas = contactos.length
        ? contactos.slice(0, 40).map(c => {
            return `<tr>
              <td style="width:10px">${(c.estado || 'nueva') === 'nueva' ? '<div class="pv-dot-nueva"></div>' : ''}</td>
              <td class="pv-fecha">${fmt(c.created_at)}</td>
              <td><span class="pv-via ${c.canal_via === 'qr' ? 'qr' : 'link'}"><span class="pv-via-mark"></span>${c.canal_via === 'qr' ? 'QR físico' : 'Enlace'}</span></td>
              <td><span class="estado-badge estado-${esc(c.estado||'nueva')}">${esc(ESTADO_LABEL_PASIVO[c.estado]||'Nueva')}</span></td>
            </tr>`
          }).join('')
        : '<tr><td colspan="4"><div class="pv-empty">Aún no hay oportunidades generadas desde tu canal.</div></td></tr>'

      return `
        <div class="pv-sec">
          <div class="pv-sec-head">
            <div><div class="pv-sec-titulo">Evolución de la actividad de tu canal</div><div class="pv-sec-sub">Interacciones y oportunidades reales generadas en el período.</div></div>
            <div class="pv-flt-bar">
              <button class="pv-flt-btn" data-dias="7" onclick="pvSetPeriodo(this)">7 días</button>
              <button class="pv-flt-btn activo" data-dias="30" onclick="pvSetPeriodo(this)">30 días</button>
              <button class="pv-flt-btn" data-dias="90" onclick="pvSetPeriodo(this)">90 días</button>
              <button class="pv-flt-btn" data-dias="custom" onclick="pvSetPeriodo(this)">Personalizado</button>
            </div>
          </div>
          <div class="pv-flt-custom" id="pvFltCustom" style="display:none">
            <label>Desde<input type="date" id="pvEvolDesde" class="pv-fecha-input"></label>
            <label>Hasta<input type="date" id="pvEvolHasta" class="pv-fecha-input"></label>
            <button class="pv-aplicar" onclick="pvAplicarFechas()">Aplicar</button>
          </div>
          <div class="pv-chart-wrap"><canvas id="pvChartEvol"></canvas></div>
        </div>

        <div class="pv-impact-grid">
          ${renderFunnelCRM(contactos)}
          <div class="pv-sec" style="margin-bottom:0">
            <div class="pv-sec-head"><div><div class="pv-sec-titulo">Actividad reciente</div><div class="pv-sec-sub">Últimos movimientos registrados.</div></div></div>
            ${renderActividadReciente(contactos)}
          </div>
        </div>

        <div class="pv-sec">
          <div class="pv-sec-head"><div><div class="pv-sec-titulo">Estado de las oportunidades generadas</div><div class="pv-sec-sub">Seguimiento comercial de las consultas atribuidas a tu canal.</div></div></div>
          <div style="overflow-x:auto">
            <table class="pv-tabla">
              <thead><tr><th></th><th>Fecha</th><th>Origen</th><th>Estado</th></tr></thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
        </div>`
    }

    function datosEvolucionPasivo(contactos, desde, hasta) {
      const inicio = new Date(desde)
      inicio.setHours(0,0,0,0)
      const fin = new Date(hasta)
      fin.setHours(23,59,59,999)
      const dias = Math.max(1, Math.ceil((fin - inicio) / 86400000))
      const bloqueDias = dias <= 14 ? 1 : dias <= 45 ? 3 : dias <= 120 ? 7 : 30
      const labelsEvol = [], dataScans = [], dataConsultas = []

      for (let cursor = new Date(inicio); cursor <= fin; cursor = new Date(cursor.getTime() + bloqueDias * 86400000)) {
        const bloqueIni = new Date(cursor)
        const bloqueFin = new Date(Math.min(fin.getTime() + 1, bloqueIni.getTime() + bloqueDias * 86400000))
        labelsEvol.push(bloqueIni.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' }))
        dataScans.push(visitas.filter(v => { const d = new Date(v.created_at); return d >= bloqueIni && d < bloqueFin }).length)
        dataConsultas.push(contactos.filter(c => { const d = new Date(c.created_at); return d >= bloqueIni && d < bloqueFin }).length)
      }
      return { labelsEvol, dataScans, dataConsultas }
    }

    function renderGraficoPasivo(contactos, dias, desdeCustom = null, hastaCustom = null) {
      if (typeof Chart === 'undefined') return
      const ctx = document.getElementById('pvChartEvol')?.getContext('2d')
      if (!ctx) return
      const hasta = hastaCustom ? new Date(`${hastaCustom}T23:59:59`) : new Date()
      const desde = desdeCustom ? new Date(`${desdeCustom}T00:00:00`) : new Date(hasta.getTime() - (dias - 1) * 86400000)
      const { labelsEvol, dataScans, dataConsultas } = datosEvolucionPasivo(contactos, desde, hasta)

      if (_pvChart) _pvChart.destroy()
      _pvChart = new Chart(ctx, {
        type:'line',
        data:{
          labels:labelsEvol,
          datasets:[
            { label:'Interacciones', data:dataScans, borderColor:'#6495ed', backgroundColor:'rgba(100,149,237,.1)', tension:.32, fill:true, pointRadius:2.5, pointHoverRadius:5, pointBackgroundColor:'#6495ed', borderWidth:1.7 },
            { label:'Oportunidades', data:dataConsultas, borderColor:'#50c878', backgroundColor:'rgba(80,200,120,.07)', tension:.32, fill:true, pointRadius:2.5, pointHoverRadius:5, pointBackgroundColor:'#50c878', borderWidth:1.7 }
          ]
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          interaction:{ mode:'index', intersect:false },
          plugins:{
            legend:{ labels:{ color:'rgba(255,255,255,.48)', font:{size:10}, boxWidth:10, usePointStyle:true } },
            tooltip:{ backgroundColor:'#171613', borderColor:'rgba(255,255,255,.1)', borderWidth:1, titleColor:'#fff', bodyColor:'rgba(255,255,255,.7)', padding:10 }
          },
          scales:{
            x:{ ticks:{color:'rgba(255,255,255,.27)',font:{size:9},maxTicksLimit:10}, grid:{color:'rgba(255,255,255,.035)'} },
            y:{ beginAtZero:true, ticks:{color:'rgba(255,255,255,.27)',font:{size:9},precision:0}, grid:{color:'rgba(255,255,255,.04)'} }
          }
        }
      })
    }

    window.pvSetPeriodo = function(btn) {
      document.querySelectorAll('.pv-flt-btn').forEach(b => b.classList.remove('activo'))
      btn.classList.add('activo')
      const valor = btn.dataset.dias
      const custom = valor === 'custom'
      document.getElementById('pvFltCustom').style.display = custom ? '' : 'none'
      if (!custom) renderGraficoPasivo(contactos, parseInt(valor, 10))
    }

    window.pvAplicarFechas = function() {
      const desde = document.getElementById('pvEvolDesde').value
      const hasta = document.getElementById('pvEvolHasta').value
      if (!desde || !hasta) { alert('Seleccioná una fecha desde y una fecha hasta.'); return }
      if (desde > hasta) { alert('La fecha desde no puede ser posterior a la fecha hasta.'); return }
      renderGraficoPasivo(contactos, 30, desde, hasta)
    }

    function renderActivo(contactos) {
      if (!contactos.length) return `
        <div class="seccion">
          <div class="sec-titulo">Consultas</div>
          <div class="empty-msg">Aún no hay consultas de tus canales.</div>
        </div>`

      // Mapa codigo → nombre de canal para la columna Canal
      const nombreCanal = {}
      canales.forEach(c => { nombreCanal[c.codigo] = c.nombre })

      const filas = contactos.slice(0, 50).map(c => `
        <tr>
          <td style="white-space:nowrap">${fmt(c.created_at)}</td>
          <td>
            <span style="font-weight:500">${esc(codificarNombre(c.nombre))}</span>
            ${c.mensaje ? `<span style="display:block;font-size:.67rem;color:var(--gris);margin-top:.15rem;">${esc(c.mensaje.slice(0,70))}${c.mensaje.length > 70 ? '…':''}</span>` : ''}
          </td>
          <td style="font-size:.72rem;color:var(--gris);">${esc(c.propiedades?.titulo || c.proyecto_slug || '—')}</td>
          <td style="font-size:.7rem;color:var(--gris);">${esc(nombreCanal[c.canal_ref] || c.canal_ref || '—')}</td>
          <td><span class="via-badge ${c.canal_via === 'qr' ? 'qr':''}">${c.canal_via === 'qr' ? '⬛ QR' : '🔗 Link'}</span></td>
          <td><span class="estado-badge estado-${esc(c.estado||'nueva')}">${esc(ESTADO_LABEL[c.estado]||'Nueva')}</span></td>
        </tr>`).join('')

      return `
        <div class="seccion">
          <div class="sec-titulo">Tus consultas — todos los canales</div>
          <div style="overflow-x:auto;">
            <table class="tabla">
              <thead>
                <tr>
                  <th>Fecha</th><th>Nombre</th><th>Propiedad</th><th>Canal</th><th>Origen</th><th>Estado</th>
                </tr>
              </thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
        </div>`
    }

    // ── Mensajes: toggle y respuesta ──
    window.toggleMsg = (i) => {
      document.getElementById(`msgBody-${i}`).classList.toggle('open')
      const dot = document.getElementById(`dot-${i}`)
      if (dot) dot.classList.add('leido')
    }

    window.enviarRespuesta = async (mensajeId, i, canalNombre) => {
      const input = document.getElementById(`replyInput-${i}`)
      const cuerpo = input.value.trim()
      if (!cuerpo) return
      const btn = input.nextElementSibling
      btn.disabled = true; btn.textContent = 'Enviando...'
      const { error } = await supabase.from('mensajes_respuestas').insert({
        mensaje_id: mensajeId,
        usuario_id: userId,
        usuario_nombre: session.user.email,
        canal_nombre: canalNombre,
        cuerpo
      })
      if (error) {
        btn.textContent = 'Error — intentá de nuevo'
        btn.disabled = false
      } else {
        input.value = ''
        btn.textContent = '✓ Respuesta enviada'
        // Mostrar respuesta en pantalla
        const replyArea = input.parentNode
        const newItem = document.createElement('div')
        newItem.className = 'reply-item-colab'
        newItem.innerHTML = `<div class="reply-cuerpo">${esc(cuerpo)}</div><div class="reply-meta">Ahora</div>`
        replyArea.insertBefore(newItem, input)
        setTimeout(() => { btn.textContent = 'Enviar respuesta'; btn.disabled = false }, 2000)
      }
    }

  })()
</script>
</body>
