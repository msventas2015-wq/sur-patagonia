    // Panel 4 — Rendimiento por propiedad (ranking)
    function panelRendimientoPropiedad(contactos) {
      if (!misSlots.length) return `
        <div class="pv-panel">
          <div class="pv-panel-head"><div>
            <div class="pv-panel-titulo">Rendimiento por propiedad</div>
            <div class="pv-panel-sub">Ranking por interacciones.</div>
          </div></div>
          <div class="pv-panel-empty"><div><div class="pv-panel-empty-mark"></div>Aún no tenés propiedades asignadas.</div></div>
        </div>`
      const rows = misSlots.map(slot => {
        const scans = scansPorSlot[slot.codigo] || 0
        const slotCons = contactos.filter(c => c.canal_ref === slot.codigo).length
        const conv = scans > 0 ? Number((slotCons/scans*100).toFixed(1)) : 0
        const proy = proyImgs[slot.proyecto_slug]
        return { codigo: slot.codigo, nombre: proy?.nombre || slot.nombre || slot.codigo, color: colorDeSlot(slot.codigo), scans, consultas: slotCons, conv }
      }).sort((a,b) => b.scans - a.scans)
      return `
        <div class="pv-panel">
          <div class="pv-panel-head"><div>
            <div class="pv-panel-titulo">Rendimiento por propiedad</div>
            <div class="pv-panel-sub">Ordenado por interacciones (mayor a menor).</div>
          </div></div>
          <div class="pv-rank-head"><span>#</span><span>Propiedad</span><span class="r">Scan</span><span class="r">Cons.</span><span class="r">Conv.</span></div>
          ${rows.map((r,i) => `
            <div class="pv-rank-row">
              <div class="pv-rank-pos">${i+1}</div>
              <div class="pv-rank-nombre"><span class="pv-rank-dot" style="background:${r.color};color:${r.color};"></span><span>${esc(r.nombre)}</span></div>
              <div class="pv-rank-num" style="color:${r.color};">${r.scans}</div>
              <div class="pv-rank-num" style="color:#e8c96a;">${r.consultas}</div>
              <div class="pv-rank-conv">${r.scans>0?r.conv+'%':'—'}</div>
            </div>`).join('')}
        </div>`
    }

    // ── Canal activo: tabla de rendimiento por slot ──────────────────────────
    function renderSlotBreakdown() {
      if (!misSlots.length) return ''
      const rows = misSlots.map(slot => {
        const scans     = scansPorSlot[slot.codigo] || 0
        const slotCons  = contactos.filter(c => c.canal_ref === slot.codigo)
        const conv      = scans > 0 ? ((slotCons.length / scans) * 100).toFixed(1) + '%' : '—'
        const proy      = proyImgs[slot.proyecto_slug]
        const nombre    = proy?.nombre || slot.nombre || slot.codigo
        const esActivo  = slot.activo !== false
        return `
          <tr>
            <td>
              <div style="display:flex;align-items:center;gap:.55rem;">
                <div style="width:8px;height:8px;border-radius:50%;background:${esActivo ? '#50c878' : '#555'};${esActivo ? 'box-shadow:0 0 7px rgba(80,200,120,.4)' : ''}"></div>
                <span style="font-family:monospace;font-size:.68rem;color:#c9a84c;">${esc(slot.codigo)}</span>
              </div>
            </td>
            <td>
              <span style="font-size:.78rem;font-weight:500;">${esc(nombre)}</span>
              ${!esActivo ? '<span style="display:block;font-size:.6rem;color:#e05c5c;margin-top:.1rem;">Inactivo</span>' : ''}
            </td>
            <td style="text-align:right;font-size:.82rem;font-weight:600;color:#9fc0ff;">${scans}</td>
            <td style="text-align:right;font-size:.82rem;font-weight:600;color:#e8c96a;">${slotCons.length}</td>
            <td style="text-align:right;font-size:.78rem;color:rgba(255,255,255,.5);">${conv}</td>
          </tr>`
      }).join('')
      return `
        <div class="pv-sec">
          <div class="pv-sec-head">
            <div>
              <div class="pv-sec-titulo">Rendimiento por slot QR</div>
              <div class="pv-sec-sub">Actividad individual de cada propiedad en los últimos 30 días.</div>
            </div>
          </div>
          <div style="overflow-x:auto">
            <table class="pv-tabla">
              <thead><tr>
                <th>Código</th>
                <th>Propiedad</th>
                <th style="text-align:right">Scans 30d</th>
                <th style="text-align:right">Consultas</th>
                <th style="text-align:right">Conversión</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`
    }

    // ── Canal activo: tabla de contactos enriquecida ─────────────────────────
    function renderContactosActivo_pv(contactos) {
      const nombreSlot = {}
      ;(misSlots || []).forEach(s => {
        nombreSlot[s.codigo] = proyImgs[s.proyecto_slug]?.nombre || s.nombre || s.codigo
      })
      canales.forEach(c => { if (!nombreSlot[c.codigo]) nombreSlot[c.codigo] = c.nombre })

      const filas = contactos.length
        ? contactos.slice(0, 50).map(c => `
          <tr>
            <td style="width:10px">${(c.estado||'nueva')==='nueva' ? '<div class="pv-dot-nueva"></div>' : ''}</td>
            <td class="pv-fecha">${fmt(c.created_at)}</td>
            <td>
              <span style="font-weight:500">${esc(codificarNombre(c.nombre))}</span>
              ${c.mensaje ? `<span style="display:block;font-size:.62rem;color:rgba(255,255,255,.35);margin-top:.1rem;">${esc(c.mensaje.slice(0,60))}${c.mensaje.length > 60 ? '…':''}</span>` : ''}
            </td>
            <td style="font-size:.7rem;color:rgba(255,255,255,.55);">${esc(c.propiedades?.titulo || c.proyecto_slug || '—')}</td>
            <td><span style="font-family:monospace;font-size:.65rem;color:#c9a84c;">${esc(nombreSlot[c.canal_ref] || c.canal_ref || '—')}</span></td>
            <td><span class="pv-via ${c.canal_via==='qr'?'qr':'link'}"><span class="pv-via-mark"></span>${c.canal_via==='qr'?'QR':'Link'}</span></td>
            <td><span class="estado-badge estado-${esc(c.estado||'nueva')}">${esc(ESTADO_LABEL[c.estado]||'Nueva')}</span></td>
          </tr>`).join('')
        : '<tr><td colspan="7"><div class="pv-empty"><div class="pv-empty-mark"></div>Aún no hay consultas generadas desde tus slots.</div></td></tr>'

      return `
        <div class="pv-sec">
          <div class="pv-sec-head">
            <div>
              <div class="pv-sec-titulo">Consultas generadas</div>
              <div class="pv-sec-sub">Oportunidades de comisión vinculadas a tu actividad comercial.</div>
            </div>
          </div>
          <div style="overflow-x:auto">
            <table class="pv-tabla">
              <thead><tr>
                <th></th><th>Fecha</th><th>Consulta</th><th>Propiedad</th><th>Slot</th><th>Origen</th><th>Estado</th>
              </tr></thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
        </div>`
    }

    function renderActivo(contactos) {
      if (!contactos.length) return `
        <div class="seccion">
          <div class="sec-titulo">Consultas</div>
          <div class="empty-msg">Aún no hay consultas de tus canales.</div>
        </div>`

      // Mapa codigo → nombre de canal para la columna Canal
      const nombreCanal = {}
      canales.forEach(c => { nombreCanal[c.codigo] = c.nombre })

      const filas = contactos.slice(0, 50).map(c => `
        <tr>
          <td style="white-space:nowrap">${fmt(c.created_at)}</td>
          <td>
            <span style="font-weight:500">${esc(codificarNombre(c.nombre))}</span>
            ${c.mensaje ? `<span style="display:block;font-size:.67rem;color:var(--gris);margin-top:.15rem;">${esc(c.mensaje.slice(0,70))}${c.mensaje.length > 70 ? '…':''}</span>` : ''}
          </td>
          <td style="font-size:.72rem;color:var(--gris);">${esc(c.propiedades?.titulo || c.proyecto_slug || '—')}</td>
          <td style="font-size:.7rem;color:var(--gris);">${esc(nombreCanal[c.canal_ref] || c.canal_ref || '—')}</td>
          <td><span class="via-badge ${c.canal_via === 'qr' ? 'qr':''}">${c.canal_via === 'qr' ? '⬛ QR' : '🔗 Link'}</span></td>
          <td><span class="estado-badge estado-${esc(c.estado||'nueva')}">${esc(ESTADO_LABEL[c.estado]||'Nueva')}</span></td>
        </tr>`).join('')

      return `
        <div class="seccion">
          <div class="sec-titulo">Tus consultas — todos los canales</div>
          <div style="overflow-x:auto;">
            <table class="tabla">
              <thead>
                <tr>
                  <th>Fecha</th><th>Nombre</th><th>Propiedad</th><th>Canal</th><th>Origen</th><th>Estado</th>
                </tr>
              </thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
        </div>`
    }

    // ── Mensajes: toggle y respuesta ──
    window.toggleMsg = (i) => {
      document.getElementById(`msgBody-${i}`).classList.toggle('open')
      const dot = document.getElementById(`dot-${i}`)
      if (dot) dot.classList.add('leido')
    }

    window.enviarRespuesta = async (mensajeId, i, canalNombre) => {
      const input = document.getElementById(`replyInput-${i}`)
      const cuerpo = input.value.trim()
      if (!cuerpo) return
      const btn = input.nextElementSibling
      btn.disabled = true; btn.textContent = 'Enviando...'
      const { error } = await supabase.from('mensajes_respuestas').insert({
        mensaje_id: mensajeId,
        usuario_id: userId,
        usuario_nombre: session.user.email,
        canal_nombre: canalNombre,
        cuerpo
      })
      if (error) {
        btn.textContent = 'Error — intentá de nuevo'
        btn.disabled = false
      } else {
        input.value = ''
        btn.textContent = '✓ Respuesta enviada'
        // Mostrar respuesta en pantalla
        const replyArea = input.parentNode
        const newItem = document.createElement('div')
        newItem.className = 'reply-item-colab'
        newItem.innerHTML = `<div class="reply-cuerpo">${esc(cuerpo)}</div><div class="reply-meta">Ahora</div>`
        replyArea.insertBefore(newItem, input)
        setTimeout(() => { btn.textContent = 'Enviar respuesta'; btn.disabled = false }, 2000)
      }
    }

  })()
</script>
</body>
</html>
