    function renderFunnelCRM(contactos) {
      const totalInteracciones = visitas.length
      const contactosFunnel = contactos.filter(c => c.estado !== 'descartado')
      const totalConsultas = contactosFunnel.length
      const totalDescartadas = contactos.filter(c => c.estado === 'descartado').length
      const ordenEstado = {
        nueva: 0,
        contactado: 1,
        visita: 2,
        visita_realizada: 3,
        oferta: 4,
        cerrado: 5,
      }
      const nivel = estado => ordenEstado[estado] ?? 0
      const totalContactadas = contactosFunnel.filter(c => nivel(c.estado) >= ordenEstado.contactado).length
      const totalVisitas = contactosFunnel.filter(c => nivel(c.estado) >= ordenEstado.visita).length
      const totalVisitasRealizadas = contactosFunnel.filter(c => nivel(c.estado) >= ordenEstado.visita_realizada).length
      const totalOfertas = contactosFunnel.filter(c => nivel(c.estado) >= ordenEstado.oferta).length
      const totalCerrados = contactosFunnel.filter(c => c.estado === 'cerrado').length

      const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : null
      const fmtPct = (a, b) => { const v = pct(a, b); return v !== null ? `${v}% convirtió` : null }

      const convC = fmtPct(totalConsultas, totalInteracciones)
      const convCo = fmtPct(totalContactadas, totalConsultas)
      const convV = fmtPct(totalVisitas, totalContactadas)
      const convO = fmtPct(totalOfertas, totalVisitas)
      const convCe = fmtPct(totalCerrados, totalOfertas)

      const arrow = `<div class="pv-pipe-arrow">›</div>`

      const paso = (cls, n, label, conv) => `
        <div class="pv-pipe-step ${cls}">
          <div class="pv-pipe-ico"><span class="pv-pipe-dot"></span></div>
          <div class="pv-pipe-n">${n.toLocaleString('es-AR')}</div>
          <div class="pv-pipe-label">${label}</div>
          ${conv ? `<div class="pv-pipe-conv">${conv}</div>` : '<div class="pv-pipe-conv">&nbsp;</div>'}
        </div>`

      return `<div class="pv-sec">
        <div class="pv-sec-head">
          <div>
            <div class="pv-sec-titulo">Tu trayectoria comercial</div>
            <div class="pv-sec-sub">Cada etapa que avanza acerca una operación al cierre.</div>
          </div>
        </div>
        <div class="pv-pipeline">
          ${paso('p0',totalInteracciones,'Interacciones',null)}
          ${arrow}
          ${paso('p1',totalConsultas,'Consultas',convC)}
          ${arrow}
          ${paso('p2',totalContactadas,'Contactados',convCo)}
          ${arrow}
          ${paso('p3',totalVisitas,`Visitas<br><span style="font-weight:600;letter-spacing:.04em;text-transform:none;color:rgba(255,255,255,.28)">${totalVisitasRealizadas.toLocaleString('es-AR')} realizadas</span>`,convV)}
          ${arrow}
          ${paso('p4',totalOfertas,'Ofertas',convO)}
          ${arrow}
          ${paso('p5',totalCerrados,'Cerrados',convCe)}
        </div>
        ${totalDescartadas > 0 ? `<div class="pv-funnel-descartadas">${totalDescartadas} descartado${totalDescartadas === 1 ? '' : 's'} — no avanzaron</div>` : ''}
        ${totalInteracciones === 0 ? '<div class="pv-funnel-sin-actividad">Tu canal todavía no registra actividad. Cuando alguien escanee tu QR o visite tu enlace, lo vas a ver acá.</div>' : ''}
      </div>`
    }

    function renderCarteraAcumulada(contactos) {
      // Campos permitidos: estado, fecha, created_at, canal_via
      // NO se expone: nombre, email, teléfono, mensaje, notas, notas_log, crm_eventos, propiedad_id, proyecto_slug
      const total        = contactos.length
      const totalNueva   = contactos.filter(c => c.estado === 'nueva').length
      const totalContact = contactos.filter(c => c.estado === 'contactado').length
      const totalVisita  = contactos.filter(c => c.estado === 'visita').length
      const totalDescar  = contactos.filter(c => c.estado === 'descartado').length

      const nombresMes = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']

      // Paleta de cohortes — identifica meses/cohortes, NO estados CRM
      const COHORT_PALETTE = ['#3a4eb8','#c0603e','#2a9d7a','#c040a0','#c08a2e','#1e5fa0','#7a1f2e','#3eb489','#7b3fb0','#b87333']

      // Agrupar por mes de ingreso (c.fecha || c.created_at — sin leer crm_eventos)
      const porMes = {}
      const porMesEstado = {}
      contactos.forEach(c => {
        const d = new Date(c.fecha || c.created_at)
        if (isNaN(d.getTime())) return
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
        porMes[key] = (porMes[key] || 0) + 1
        if (!porMesEstado[key]) porMesEstado[key] = { nueva: 0, contactado: 0, visita: 0, descartado: 0 }
        const est = c.estado || 'nueva'
        if (porMesEstado[key][est] !== undefined) porMesEstado[key][est]++
      })

      const mesesOrdenados = Object.keys(porMes).sort()
      const MAX_BAR_H = 60
      const maxMes = mesesOrdenados.length ? Math.max(...mesesOrdenados.map(k => porMes[k])) : 1

      // Barras: Registros por mes — color de cohorte por mes (no color semántico de estado)
      const barrasMes = mesesOrdenados.map((k, idx) => {
        const color = COHORT_PALETTE[idx % COHORT_PALETTE.length]
        const h = Math.max(2, Math.round(porMes[k] / maxMes * MAX_BAR_H))
        const [y, m] = k.split('-')
        const label = nombresMes[parseInt(m) - 1] + ' ' + y.slice(2)
        return `<div class="pv-carta-mes-col">
          <div class="pv-carta-mes-n" style="color:${color}">${porMes[k]}</div>
          <div class="pv-carta-mes-bar" style="height:${h}px;background:linear-gradient(to top,${color}cc,${color}44)"></div>
          <div class="pv-carta-mes-label">${label}</div>
        </div>`
      }).join('')

      // Estado actual por mes — gobernanza visual: color de estado ≠ color de cohorte
      const EST_LABEL = { nueva: 'Sin avance', contactado: 'Contactado', visita: 'En visita', descartado: 'Descartado' }
      const EST_COLOR = { nueva: '#b39ddb', contactado: '#35c6b4', visita: '#f29a5a', descartado: '#7b7f88' }

      const filasMesEstado = mesesOrdenados.map((k, idx) => {
        const cohortColor = COHORT_PALETTE[idx % COHORT_PALETTE.length]
        const [y, m] = k.split('-')
        const mesLabel = nombresMes[parseInt(m) - 1] + ' ' + y
        const datos = porMesEstado[k]
        const pills = ['nueva','contactado','visita','descartado']
          .filter(est => datos[est] > 0)
          .map(est =>
            `<span class="pv-carta-est-pill" style="background:${EST_COLOR[est]}18;color:${EST_COLOR[est]};border-color:${EST_COLOR[est]}45">${datos[est]} ${EST_LABEL[est]}</span>`
          ).join('')
        if (!pills) return ''
        return `<div class="pv-carta-mes-row">
          <div class="pv-carta-mes-row-label" style="border-left:2px solid ${cohortColor};padding-left:.5rem">${mesLabel}</div>
          <div class="pv-carta-mes-row-arrow">→ hoy:</div>
          <div class="pv-carta-mes-row-pills">${pills}</div>
        </div>`
      }).filter(Boolean).join('')

      // Canal de ingreso — solo canal_via (propiedad/proyecto NO visible al aliado)
      const porQR   = contactos.filter(c => c.canal_via === 'qr').length
      const porLink = total - porQR

      const origenItem = (color, texto, n) =>
        `<div class="pv-carta-origen-item"><span class="pv-carta-origen-dot" style="background:${color}"></span>${texto}<strong>${n}</strong></div>`

      return `<div class="pv-sec pv-cartera-sec">
        <div class="pv-sec-head">
          <div>
            <div class="pv-sec-titulo">Historial de tu canal</div>
            <div class="pv-sec-sub">Estado actual de los registros generados desde el inicio.</div>
          </div>
        </div>

        <div class="pv-carta-stat-mini-grid" style="margin-bottom:1.25rem">
          <div class="pv-carta-stat-mini" style="--sc:#b39ddb"><span>${totalNueva.toLocaleString('es-AR')}</span><small>Sin avance</small></div>
          <div class="pv-carta-stat-mini" style="--sc:#35c6b4"><span>${totalContact.toLocaleString('es-AR')}</span><small>Contactado</small></div>
          <div class="pv-carta-stat-mini" style="--sc:#f29a5a"><span>${totalVisita.toLocaleString('es-AR')}</span><small>En visita</small></div>
          <div class="pv-carta-stat-mini" style="--sc:#7b7f88"><span>${totalDescar.toLocaleString('es-AR')}</span><small>Descartado</small></div>
        </div>

        ${mesesOrdenados.length > 0 ? `
        <div class="pv-carta-seccion-titulo">Registros por mes de ingreso</div>
        <div class="pv-carta-evol">${barrasMes}</div>
        ` : ''}

        ${filasMesEstado ? `
        <div class="pv-carta-seccion-titulo">Estado actual por mes de ingreso</div>
        <div class="pv-carta-sub-hint">Mes en que ingresó el registro → estado comercial hoy.</div>
        <div class="pv-carta-mes-estado">${filasMesEstado}</div>
        ` : ''}

        ${total > 0 ? `
        <div class="pv-carta-origen-block" style="margin-bottom:.85rem">
          <div class="pv-carta-origen-title">Canal de ingreso</div>
          ${porQR   > 0 ? origenItem('#50c878', 'QR físico', porQR) : ''}
          ${porLink > 0 ? origenItem('#6495ed', 'Enlace digital', porLink) : ''}
        </div>
        ` : ''}

        <div class="pv-carta-nota">El estado refleja el avance comercial actual. Un registro puede avanzar meses después de ingresar.</div>
      </div>`
    }

    // ── Trazabilidad CRM ────────────────────────────────────────────────────────
    // Recibe filasTraza desde RPCs SECURITY DEFINER. NO lee crm_eventos directo.
    // Pasivo mantiene anonimato; activo muestra nombre/propiedad de sus propios leads.
    function renderTrazabilidad(filasTraza, { anonimo = true } = {}) {
      if (!filasTraza || filasTraza.length === 0) return ''

      const COHORT_PALETTE_T = ['#3a4eb8','#c0603e','#2a9d7a','#c040a0','#c08a2e','#1e5fa0','#7a1f2e','#3eb489','#7b3fb0','#b87333']
      const NOMBRES_MES_T    = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']

      const fmtMesDesdeFecha = dateStr => {
        if (!dateStr) return '—'
        const d = new Date(dateStr + 'T00:00:00')
        if (isNaN(d.getTime())) return '—'
        return NOMBRES_MES_T[d.getMonth()] + ' ' + d.getFullYear()
      }

      // Separar por fila_tipo — cada sección usa SOLO su tipo correspondiente
      const bloques      = filasTraza.filter(f => f.fila_tipo === 'bloque_estado_actual')
      const movimientos  = filasTraza.filter(f => f.fila_tipo === 'movimiento_registro_anonimo')
      const legacySinFec = filasTraza.filter(f => f.fila_tipo === 'estado_actual_sin_fecha_historica')

      // Paleta de cohortes: color = mes de ingreso (nunca = estado CRM)
      const todosLosKeys = [...new Set(filasTraza.map(f => f.mes_ingreso_key).filter(Boolean))].sort()
      const cohortColorMap = {}
      todosLosKeys.forEach((k, idx) => { cohortColorMap[k] = COHORT_PALETTE_T[idx % COHORT_PALETTE_T.length] })

      const labelDeMesKey = k => {
        if (!k) return '—'
        const [y, m] = k.split('-')
        return NOMBRES_MES_T[parseInt(m, 10) - 1] + ' ' + y
      }

      // ── Bloque: estado actual por cohorte (bloque_estado_actual) ─────────────
      // Columnas = estados CRM con datos; filas = mes de ingreso (cohorte)
      // color visual = cohorte — posición = estado actual
      const EST_CLR = {
        contactado: '#35c6b4', visita: '#f29a5a', oferta: '#7aaeff',
        visita_realizada: '#f29a5a', cerrado: '#50c878', descartado: '#7b7f88', nueva: '#b39ddb'
      }
      const ETAPAS_ORDEN = [
        { key: 'nueva',      col: 1  },
        { key: 'contactado', col: 2  },
        { key: 'visita',     col: 3  },
        { key: 'visita_realizada', col: 3  },
        { key: 'oferta',     col: 4  },
        { key: 'cerrado',    col: 5  },
        { key: 'descartado', col: 90 }
      ]
      // Solo mostrar etapas con al menos 1 bloque con cantidad > 0
      const etapasConDatos = ETAPAS_ORDEN.filter(e =>
        bloques.some(b => b.estado_publico === e.key && (b.cantidad || 0) > 0)
      )
      // Acumular cantidad por (mes_key, estado_publico)
      const bloqueMap = {}
      bloques.forEach(b => {
        if (!bloqueMap[b.mes_ingreso_key]) bloqueMap[b.mes_ingreso_key] = {}
        const prev = bloqueMap[b.mes_ingreso_key][b.estado_publico] || 0
        bloqueMap[b.mes_ingreso_key][b.estado_publico] = prev + (b.cantidad || 0)
      })

      let bloqueHTML = ''
      if (etapasConDatos.length > 0 && todosLosKeys.length > 0) {
        const headerCols = etapasConDatos.map(e =>
          `<th style="color:${EST_CLR[e.key]};font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:.38rem .6rem;white-space:nowrap;font-weight:700">${esc((bloques.find(b => b.estado_publico === e.key) || {}).estado_label || e.key)}</th>`
        ).join('')
        const filasBloques = todosLosKeys.map(k => {
          const color = cohortColorMap[k]
          const celdas = etapasConDatos.map(e => {
            const n = (bloqueMap[k] || {})[e.key] || 0
            return `<td style="text-align:center;padding:.38rem .6rem">
              ${n > 0
                ? `<span class="pv-traza-bloque" style="background:${color}1e;color:${color};border-color:${color}55">${n}</span>`
                : `<span style="color:rgba(255,255,255,.12)">—</span>`}
            </td>`
          }).join('')
          return `<tr>
            <td style="padding:.38rem .6rem;white-space:nowrap">
              <span class="pv-traza-cohorte-dot" style="background:${color}"></span>
              <span style="color:rgba(255,255,255,.62);font-size:.72rem">${labelDeMesKey(k)}</span>
            </td>
            ${celdas}
          </tr>`
        }).join('')
        bloqueHTML = `
          <div class="pv-traza-sub-titulo">Estado actual por mes de ingreso</div>
          <div style="overflow-x:auto;margin-bottom:1.1rem">
            <table class="pv-traza-tabla">
              <thead><tr>
                <th style="font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:.38rem .6rem;color:rgba(255,255,255,.3);white-space:nowrap">Mes de ingreso</th>
                ${headerCols}
              </tr></thead>
              <tbody>${filasBloques}</tbody>
            </table>
          </div>`
      }

      // ── Timeline: movimiento_registro_anonimo ─────────────────────────────────
      // Agrupar por (mes_ingreso_key + registro_anon_n) → una card por lead
      const timelineMap = {}
      movimientos.forEach(mv => {
        const cardKey = anonimo
          ? (mv.mes_ingreso_key || '') + '|' + (mv.registro_anon_n || 0)
          : (mv.contacto_id || ((mv.mes_ingreso_key || '') + '|' + (mv.registro_anon_n || 0)))
        if (!timelineMap[cardKey]) timelineMap[cardKey] = {
          mes_ingreso_key: mv.mes_ingreso_key,
          registro_anon_n: mv.registro_anon_n,
          contacto_id: mv.contacto_id,
          lead_nombre: mv.lead_nombre,
          lead_propiedad: mv.lead_propiedad,
          eventos: []
        }
        timelineMap[cardKey].eventos.push(mv)
      })
      const cards = Object.values(timelineMap).sort((a, b) => {
        if (b.mes_ingreso_key > a.mes_ingreso_key) return 1
        if (b.mes_ingreso_key < a.mes_ingreso_key) return -1
        return (a.registro_anon_n || 0) - (b.registro_anon_n || 0)
      })
      // Contar cuántos leads hay por mes para saber si agregar número
      const countPorMes = {}
      cards.forEach(c => { countPorMes[c.mes_ingreso_key] = (countPorMes[c.mes_ingreso_key] || 0) + 1 })

      let timelineHTML = ''
      if (cards.length > 0) {
        const cardEls = cards.map(card => {
          const color = cohortColorMap[card.mes_ingreso_key] || '#888'
          const numLabel = countPorMes[card.mes_ingreso_key] > 1 ? ` (${card.registro_anon_n})` : ''
          const leadTitulo = anonimo
            ? `Lead de ${labelDeMesKey(card.mes_ingreso_key)}${numLabel}`
            : (card.lead_nombre || 'Lead sin nombre')
          const leadSub = anonimo
            ? ''
            : `<div style="font-size:.62rem;color:rgba(255,255,255,.34);margin-top:.18rem;line-height:1.35">${esc(card.lead_propiedad || 'Sin propiedad asociada')} · Ingresó en ${esc(labelDeMesKey(card.mes_ingreso_key))}</div>`
          const eventoEls = card.eventos
            .slice()
            .sort((a, b) => (a.orden_evento || 0) - (b.orden_evento || 0))
            .map(ev => {
              const evColor = EST_CLR[ev.estado_publico] || '#888'
              // Mostrar solo mes — nunca día exacto
              const mesEvLabel = fmtMesDesdeFecha(ev.fecha_evento_publica || ev.mes_evento)
              return `<div class="pv-traza-evento">
                <span class="pv-traza-arrow">→</span>
                <span class="pv-traza-mes-evento">${esc(mesEvLabel)}</span>
                <span class="pv-traza-estado-label" style="color:${evColor}">${esc(ev.estado_label || ev.estado_publico || '')}</span>
              </div>`
            }).join('')
          return `<div class="pv-traza-card" style="border-left-color:${color}">
            <div class="pv-traza-card-head">
              <span class="pv-traza-cohorte-dot" style="background:${color}"></span>
              <span>
                <span class="pv-traza-card-titulo">${esc(leadTitulo)}</span>
                ${leadSub}
              </span>
            </div>
            ${eventoEls}
          </div>`
        }).join('')
        timelineHTML = `
          <div class="pv-traza-sub-titulo" style="margin-top:.75rem">Recorrido comercial</div>
          <div class="pv-traza-cards">${cardEls}</div>`
      } else {
        // Sin movimientos todavía — mensaje claro, no es error
        timelineHTML = `
          <div class="pv-traza-empty">
            <span class="pv-traza-empty-icon">⏳</span>
            <span>Los avances comerciales se mostrarán a medida que el equipo actualice el CRM.</span>
          </div>`
      }

      // ── Legacy sin fecha histórica (estado_actual_sin_fecha_historica) ────────
      // Leads que avanzaron antes de que existiera el historial de eventos
      let legacyHTML = ''
      if (legacySinFec.length > 0) {
        const legacyEls = legacySinFec.map(lf => {
          const color    = cohortColorMap[lf.mes_ingreso_key] || '#888'
          const estColor = EST_CLR[lf.estado_publico] || '#888'
          return `<div class="pv-traza-legacy-row">
            <span class="pv-traza-cohorte-dot" style="background:${color}"></span>
            <span class="pv-traza-legacy-mes">${labelDeMesKey(lf.mes_ingreso_key)}</span>
            <span class="pv-traza-arrow">·</span>
            <span class="pv-traza-legacy-n" style="color:${estColor}">${lf.cantidad} ${esc(lf.estado_label || lf.estado_publico || '')}</span>
            <span class="pv-traza-legacy-hint">(sin fecha de avance registrada)</span>
          </div>`
        }).join('')
        legacyHTML = `
          <div class="pv-traza-sub-titulo" style="margin-top:.85rem">Estado actual sin fecha histórica</div>
          <div class="pv-traza-legacy-hint-global">Registros que ya tenían un estado avanzado cuando se activó el historial de eventos.</div>
          <div class="pv-traza-legacy">${legacyEls}</div>`
      }

      return `<div class="pv-sec pv-traza-sec">
        <div class="pv-sec-head">
          <div>
            <div class="pv-sec-titulo">${anonimo ? 'Trayectoria comercial de tu canal' : 'Movimientos de tus leads'}</div>
            <div class="pv-sec-sub">${anonimo ? 'Seguimiento anónimo del recorrido CRM de los registros generados desde tu QR.' : 'Trazabilidad en el tiempo de las oportunidades de tus canales — un lead viejo puede avanzar meses después.'}</div>
          </div>
        </div>
        ${bloqueHTML}
        ${timelineHTML}
        ${legacyHTML}
      </div>`
    }

    function renderRecorridoLeadsActivo(filasTraza = []) {
      if (!filasTraza || filasTraza.length === 0) return ''

      const COHORT_PALETTE_A = ['#3a4eb8','#c0603e','#2a9d7a','#c040a0','#c08a2e','#1e5fa0','#7a1f2e','#3eb489','#7b3fb0','#b87333']
      const NOMBRES_MES_A    = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC']
      const NOMBRES_MES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']
      const EST_COLOR_A = {
        nueva: 'rgba(255,255,255,.5)',
        contactado: '#35c6b4',
        visita: '#f29a5a',
        visita_realizada: '#7fd1c6',
        oferta: '#d9a7ff',
        cerrado: '#a9dc7a',
        descartado: '#7b7f88'
      }
      const EST_ORDEN_A = { nueva:1, contactado:2, visita:3, visita_realizada:3.5, oferta:4, cerrado:5, descartado:0 }
      const EST_LABEL_A = {
        nueva:'Sin avance',
        contactado:'Contactado',
        visita:'Visita',
        visita_realizada:'Visita realizada',
        oferta:'Oferta',
        cerrado:'Cerrado',
        descartado:'Descartado'
      }

      const hoy = new Date()
      const year = hoy.getFullYear()
      const currentMesKey = `${year}-${String(hoy.getMonth() + 1).padStart(2, '0')}`
      const bloques = filasTraza.filter(f => f.fila_tipo === 'bloque_estado_actual')
      const movimientos = filasTraza.filter(f =>
        f.fila_tipo === 'movimiento_registro_activo' || f.fila_tipo === 'movimiento_registro_anonimo'
      )

      const keysConDatos = [...new Set(filasTraza.map(f => f.mes_ingreso_key).filter(Boolean))].sort()
      const cohortColorMap = {}
      keysConDatos.forEach((k, idx) => { cohortColorMap[k] = COHORT_PALETTE_A[idx % COHORT_PALETTE_A.length] })
      const colorMes = k => cohortColorMap[k] || COHORT_PALETTE_A[Math.max(0, keysConDatos.length) % COHORT_PALETTE_A.length]

      const fmtMesKey = k => {
        if (!k) return '—'
        const [y, m] = String(k).split('-')
        const mi = parseInt(m, 10) - 1
        return `${NOMBRES_MES_CORTO[mi] || m} ${String(y || '').slice(2)}`
      }
      const fechaObj = v => {
        if (!v) return null
        const d = new Date(v)
        return isNaN(d.getTime()) ? null : d
      }
      const fmtDia = v => {
        const d = fechaObj(v)
        if (!d) return '—'
        return `${String(d.getDate()).padStart(2, '0')} ${NOMBRES_MES_CORTO[d.getMonth()] || ''}`
      }
      const diasDesde = v => {
        const d = fechaObj(v)
        if (!d) return 'sin fecha'
        const base = new Date(hoy); base.setHours(0,0,0,0)
        const target = new Date(d); target.setHours(0,0,0,0)
        const diff = Math.max(0, Math.round((base - target) / 86400000))
        if (diff === 0) return 'hoy'
        if (diff === 1) return 'ayer'
        return `hace ${diff} días`
      }

      const ingresoPorMes = {}
      bloques.forEach(b => {
        if (!b.mes_ingreso_key) return
        ingresoPorMes[b.mes_ingreso_key] = (ingresoPorMes[b.mes_ingreso_key] || 0) + (b.cantidad || 0)
      })
      const totalLeads = Object.values(ingresoPorMes).reduce((s, n) => s + n, 0)
      const sumaEstado = estados => bloques
        .filter(b => estados.includes(b.estado_publico))
        .reduce((s, b) => s + (b.cantidad || 0), 0)
      const porMesEstado = estados => {
        const out = {}
        bloques.forEach(b => {
          if (!estados.includes(b.estado_publico) || !b.mes_ingreso_key) return
          out[b.mes_ingreso_key] = (out[b.mes_ingreso_key] || 0) + (b.cantidad || 0)
        })
        return Object.entries(out).sort(([a], [b]) => a.localeCompare(b))
      }

      const renderStationCards = (entries, maxWidth = 150) => {
        if (!entries.length) return ''
        const gap = entries.length <= 1 ? 0 : Math.min(44, Math.max(26, Math.floor((maxWidth - 34) / Math.max(1, entries.length - 1))))
        const start = -((entries.length - 1) * gap) / 2
        return entries.map(([key, n], idx) => {
          const x = Math.round(start + idx * gap)
          const color = colorMes(key)
          return `<g transform="translate(${x},-42)" color="${color}">
            <use href="#cardChica"/>
            <text x="0" y="-10" text-anchor="middle" fill="#f5f3f0" font-size="13" font-weight="700" font-family="Inter">${n}</text>
          </g>`
        }).join('')
      }

      const mesCells = Array.from({ length: 12 }, (_, i) => {
        const m = i + 1
        const key = `${year}-${String(m).padStart(2, '0')}`
        const row = Math.floor(i / 4)
        const col = i % 4
        const x = [-69, -23, 23, 69][col]
        const y = [-160, -98, -36][row]
        const n = ingresoPorMes[key] || 0
        const isCurrent = key === currentMesKey
        const color = n > 0 ? colorMes(key) : colorMes(currentMesKey)
        const label = NOMBRES_MES_A[i]
        if (n > 0 || isCurrent) {
          const dash = isCurrent ? ' stroke-dasharray="4 3"' : ''
          return `<g transform="translate(${x},${y})" color="${color}">
            <rect x="-18" y="-20" width="36" height="40" rx="4" fill="color-mix(in srgb, currentColor ${n > 0 ? 24 : 8}%, transparent)" stroke="currentColor" stroke-width="1.5"${dash}/>
            <rect x="-18" y="-20" width="36" height="40" rx="4" fill="url(#gradTarjeta)"/>
            ${n > 0 ? `<text x="0" y="5" text-anchor="middle" fill="#f5f3f0" font-size="14" font-weight="700" font-family="Inter">${n}</text>` : ''}
            <text x="0" y="30" text-anchor="middle" fill="currentColor" font-size="7" letter-spacing="1" font-family="Inter">${label}</text>
          </g>`
        }
        return `<g transform="translate(${x},${y})">
          <use href="#mesVacio"/>
          <text x="0" y="30" text-anchor="middle" fill="rgba(255,255,255,.22)" font-size="7" letter-spacing="1" font-family="Inter">${label}</text>
        </g>`
      }).join('')

      const seguimientoN = sumaEstado(['nueva', 'contactado'])
      const visitaN = sumaEstado(['visita', 'visita_realizada'])
      const ofertaN = sumaEstado(['oferta'])
      const cerradoN = sumaEstado(['cerrado'])
      const agenciaNombre = (() => {
        if (typeof canales !== 'undefined' && canales?.length) {
          const primero = canales[0]?.nombre || 'Tus canales'
          return canales.length > 1 ? `${primero} +${canales.length - 1}` : primero
        }
        return 'TUS CANALES'
      })()
      const vendidoStroke = cerradoN > 0 ? 'rgba(232,201,106,.75)' : 'rgba(255,255,255,.2)'
      const vendidoFilter = cerradoN > 0 ? 'filter:drop-shadow(0 0 9px rgba(232,201,106,.45))' : ''
      const vendidoText = cerradoN > 0 ? 'rgba(232,201,106,.8)' : 'rgba(255,255,255,.55)'

      const svg = `<svg class="pv-activo-recorrido-svg" viewBox="0 0 1000 340" role="img" aria-label="Recorrido de leads desde la agencia hasta el cierre">
        <defs>
          <linearGradient id="gradEstacionActivo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,.05)"/><stop offset="100%" stop-color="rgba(255,255,255,.012)"/>
          </linearGradient>
          <linearGradient id="gradTarjeta" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,.22)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
          <g id="cardChica">
            <rect x="-16" y="-36" width="32" height="42" rx="4" fill="color-mix(in srgb, currentColor 30%, transparent)" stroke="currentColor" stroke-width="1.5"/>
            <rect x="-16" y="-36" width="32" height="42" rx="4" fill="url(#gradTarjeta)"/>
          </g>
          <g id="mesVacio">
            <rect x="-18" y="-20" width="36" height="40" rx="4" fill="rgba(255,255,255,.015)" stroke="rgba(255,255,255,.09)" stroke-width="1" stroke-dasharray="3 3"/>
          </g>
        </defs>
        <rect x="0" y="0" width="1000" height="340" fill="#070709"/>
        <line x1="30" y1="272" x2="970" y2="272" stroke="#2a2a2a" stroke-width="3"/>
        <line x1="42" y1="272" x2="958" y2="272" stroke="#3a3a36" stroke-width="1" stroke-dasharray="9 11"/>
        <g stroke="rgba(255,255,255,.14)" stroke-width="1.6" fill="none">
          <path d="M 268 266 l 6 6 l -6 6"/><path d="M 645 266 l 6 6 l -6 6"/><path d="M 838 266 l 6 6 l -6 6"/>
        </g>
        <g transform="translate(140,272)">
          <rect x="-105" y="-228" width="210" height="228" rx="10" fill="url(#gradEstacionActivo)" stroke="rgba(255,255,255,.16)" stroke-width="1.4"/>
          <text x="0" y="-206" text-anchor="middle" fill="rgba(255,255,255,.75)" font-size="12" font-weight="700" letter-spacing="2.4" font-family="Inter">${esc(agenciaNombre).toUpperCase()}</text>
          <line x1="-80" y1="-195" x2="80" y2="-195" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
          ${mesCells}
          <text x="0" y="20" text-anchor="middle" fill="#8a8f99" font-size="9.5" letter-spacing="1.8" font-family="Inter">TUS LEADS · ${totalLeads.toLocaleString('es-AR')} Y SUMANDO</text>
        </g>
        <g transform="translate(325,272)">
          <text x="0" y="-64" text-anchor="middle" fill="#8a8f99" font-size="8.5" letter-spacing="2.6" font-family="Inter" opacity=".8">SUR PATAGONIA</text>
          <line x1="0" y1="0" x2="0" y2="-28" stroke="#35c6b4" stroke-opacity=".5" stroke-width="1.5"/>
          <circle cx="0" cy="-35" r="5.5" fill="none" stroke="#35c6b4" stroke-opacity=".7" stroke-width="1.5"/>
          <circle cx="0" cy="-35" r="2" fill="#35c6b4" opacity=".7"/>
          <text x="0" y="20" text-anchor="middle" fill="#35c6b4" font-size="9" letter-spacing="1.6" font-family="Inter" opacity=".85">PROCESO DE CONTACTO</text>
          <text x="0" y="34" text-anchor="middle" fill="#8a8f99" font-size="8" font-family="Inter" opacity=".7">${seguimientoN.toLocaleString('es-AR')} en seguimiento</text>
        </g>
        <g transform="translate(510,272)">
          <path d="M -100 0 L -100 -124 L 0 -204 L 100 -124 L 100 0 Z" fill="url(#gradEstacionActivo)" stroke="rgba(255,255,255,.22)" stroke-width="1.6"/>
          <text x="0" y="-140" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="9" letter-spacing="1.8" font-family="Inter">PROPIEDAD EN VENTA</text>
          <line x1="-72" y1="-128" x2="72" y2="-128" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
          ${renderStationCards(porMesEstado(['visita', 'visita_realizada']), 160)}
          <text x="0" y="20" text-anchor="middle" fill="#f29a5a" font-size="9.5" letter-spacing="1.8" font-weight="700" font-family="Inter">VISITA · ${visitaN.toLocaleString('es-AR')}</text>
        </g>
        <g transform="translate(735,272)">
          <rect x="-72" y="-152" width="144" height="152" rx="10" fill="url(#gradEstacionActivo)" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
          <text x="0" y="-130" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="9" letter-spacing="1.8" font-family="Inter">OFERTA ENVIADA</text>
          <line x1="-52" y1="-120" x2="52" y2="-120" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
          <g transform="translate(0,-94)">
            <circle r="13" fill="rgba(59,191,136,.1)" stroke="#3bbf88" stroke-opacity=".6" stroke-width="1.4"/>
            <text x="0" y="4.5" text-anchor="middle" fill="#3bbf88" font-size="13" font-weight="700" font-family="Inter">$</text>
          </g>
          ${renderStationCards(porMesEstado(['oferta']), 110)}
          <text x="0" y="20" text-anchor="middle" fill="#d9a7ff" font-size="9.5" letter-spacing="1.8" font-weight="700" font-family="Inter">OFERTA · ${ofertaN.toLocaleString('es-AR')}</text>
        </g>
        <g transform="translate(918,272)">
          <path d="M -55 0 L -55 -104 L 0 -164 L 55 -104 L 55 0 Z" fill="url(#gradEstacionActivo)" stroke="${vendidoStroke}" stroke-width="1.8" style="${vendidoFilter}"/>
          <text x="0" y="-174" text-anchor="middle" fill="${vendidoText}" font-size="9" letter-spacing="1.8" font-family="Inter">PROPIEDAD VENDIDA</text>
          ${renderStationCards(porMesEstado(['cerrado']), 80)}
          <text x="0" y="20" text-anchor="middle" fill="#a9dc7a" font-size="9.5" letter-spacing="1.8" font-weight="700" font-family="Inter">CERRADO · ${cerradoN.toLocaleString('es-AR')}</text>
        </g>
      </svg>`

      const movimientosPorLead = {}
      movimientos.forEach(mv => {
        const key = mv.contacto_id || `${mv.mes_ingreso_key || ''}|${mv.registro_anon_n || 0}`
        if (!movimientosPorLead[key]) movimientosPorLead[key] = {
          mes_ingreso_key: mv.mes_ingreso_key,
          registro_anon_n: mv.registro_anon_n,
          contacto_id: mv.contacto_id,
          lead_nombre: mv.lead_nombre,
          lead_propiedad: mv.lead_propiedad,
          eventos: []
        }
        movimientosPorLead[key].eventos.push(mv)
      })
      const leadRows = Object.values(movimientosPorLead)
        .map(card => {
          const eventos = card.eventos.slice().sort((a, b) => {
            const da = fechaObj(a.fecha_evento || a.fecha_evento_publica)?.getTime() || 0
            const db = fechaObj(b.fecha_evento || b.fecha_evento_publica)?.getTime() || 0
            if (da !== db) return da - db
            return (a.orden_evento || 0) - (b.orden_evento || 0)
          })
          const ultimo = eventos[eventos.length - 1]
          const fechaUltima = ultimo?.fecha_evento || ultimo?.fecha_evento_publica
          return { ...card, eventos, fechaUltima }
        })
        .sort((a, b) => (fechaObj(b.fechaUltima)?.getTime() || 0) - (fechaObj(a.fechaUltima)?.getTime() || 0))
        .slice(0, 30)

      const registroHtml = leadRows.length ? leadRows.map(card => {
        const color = colorMes(card.mes_ingreso_key)
        const nombre = card.lead_nombre || 'Lead sin nombre'
        const propiedad = card.lead_propiedad || 'Sin propiedad asociada'
        let estadoPrevioOrden = 1
        const nodos = [
          `<div class="pv-activo-tl-nodo">
            <span class="pv-activo-tl-estado" style="color:rgba(255,255,255,.5)">Ingresó</span>
            <span class="pv-activo-tl-fecha">${esc(fmtMesKey(card.mes_ingreso_key))}</span>
          </div>`
        ]
        card.eventos.forEach((ev, idx) => {
          const estado = ev.estado_publico || ev.estado_nuevo || 'nueva'
          const orden = EST_ORDEN_A[estado] ?? estadoPrevioOrden
          const retro = orden < estadoPrevioOrden
          estadoPrevioOrden = orden
          const isLast = idx === card.eventos.length - 1
          const label = retro && (estado === 'nueva' || estado === 'contactado')
            ? 'Volvió a seguimiento'
            : (ev.estado_label || EST_LABEL_A[estado] || estado)
          const colorEstado = retro ? 'rgba(255,255,255,.45)' : (EST_COLOR_A[estado] || '#888')
          nodos.push(`<div class="pv-activo-tl-nodo${retro ? ' retro' : ''}${isLast ? ' ultimo' : ''}">
            <span class="pv-activo-tl-estado" style="color:${colorEstado}">${esc(label)}</span>
            <span class="pv-activo-tl-fecha">${esc(fmtDia(ev.fecha_evento || ev.fecha_evento_publica))}</span>
          </div>`)
        })
        const timeline = nodos.map((n, i) => i === 0 ? n : `<span class="pv-activo-tl-linea"></span>${n}`).join('')
        return `<div class="pv-activo-lead">
          <div>
            <span class="pv-activo-chip-mes" style="color:${color}">Lead de ${esc(fmtMesKey(card.mes_ingreso_key))}</span>
            <div class="pv-activo-lead-nombre">${esc(nombre)}</div>
            <div class="pv-activo-lead-prop">${esc(propiedad)}</div>
          </div>
          <div class="pv-activo-timeline">${timeline}</div>
          <div class="pv-activo-mov-reciente">se movió ${esc(diasDesde(card.fechaUltima))}</div>
        </div>`
      }).join('') : `<div class="pv-activo-empty">Sin movimientos en el período.</div>`

      return `<div class="pv-sec pv-activo-recorrido-sec">
        <div class="pv-sec-head">
          <div>
            <div class="pv-sec-titulo">El recorrido de tus leads</div>
            <div class="pv-sec-sub">Cada color es un mes de ingreso. El número dice cuántos leads de ese mes están en esa etapa.</div>
          </div>
          <span class="pv-activo-hoy-ancla">HOY · ${fmtDia(hoy.toISOString())}</span>
        </div>
        ${svg}
      </div>
      <div class="pv-sec pv-activo-registro-sec">
        <div class="pv-sec-head">
          <div>
            <div class="pv-sec-titulo">Registro de movimientos</div>
            <div class="pv-sec-sub">El detalle de cada tarjeta del gráfico — quién es, qué propiedad, y su camino con fechas.</div>
          </div>
        </div>
        <div class="pv-activo-registro">${registroHtml}</div>
      </div>`
    }

    function renderPasivo(contactos, filasTraza = [], canal = null) {
      const m = metricasPasivo(contactos)

      const filas = contactos.length
        ? contactos.slice(0, 40).map(c => {
            return `<tr>
              <td style="width:10px">${(c.estado || 'nueva') === 'nueva' ? '<div class="pv-dot-nueva"></div>' : ''}</td>
              <td class="pv-fecha">${fmt(c.created_at)}</td>
              <td><span class="pv-via ${c.canal_via === 'qr' ? 'qr' : 'link'}"><span class="pv-via-mark"></span>${c.canal_via === 'qr' ? 'QR físico' : 'Enlace'}</span></td>
              <td><span class="estado-badge estado-${esc(c.estado||'nueva')}">${esc(ESTADO_LABEL_PASIVO[c.estado]||'Sin avance')}</span></td>
            </tr>`
          }).join('')
        : '<tr><td colspan="4"><div class="pv-empty">Aún no hay oportunidades generadas desde tu canal.</div></td></tr>'

      return `
        <div class="pv-sec">
          <div class="pv-sec-head">
            <div>
              <div class="pv-sec-titulo">Evolución de la actividad de tu canal</div>
              <div class="pv-sec-sub">Interacciones y oportunidades reales generadas en el período seleccionado.</div>
            </div>
          </div>
          <div id="pvLiveBar4" class="pv-live-bar">
            <div class="pv-live-left">
              <span class="pv-live-dot"></span>

    function datosEvolucionPasivo(contactos, desde, hasta) {
      const inicio = new Date(desde)
      inicio.setHours(0,0,0,0)
      const fin = new Date(hasta)
      fin.setHours(23,59,59,999)
      const dias = Math.max(1, Math.ceil((fin - inicio) / 86400000))
      const bloqueDias = dias <= 14 ? 1 : dias <= 45 ? 3 : dias <= 120 ? 7 : 30
      const labelsEvol = [], dataScans = [], dataConsultas = []

      for (let cursor = new Date(inicio); cursor <= fin; cursor = new Date(cursor.getTime() + bloqueDias * 86400000)) {
        const bloqueIni = new Date(cursor)
        const bloqueFin = new Date(Math.min(fin.getTime() + 1, bloqueIni.getTime() + bloqueDias * 86400000))
        labelsEvol.push(bloqueIni.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' }))
        dataScans.push(visitas.filter(v => { const d = new Date(v.created_at); return d >= bloqueIni && d < bloqueFin }).length)
        dataConsultas.push(contactos.filter(c => { const d = new Date(c.created_at); return d >= bloqueIni && d < bloqueFin }).length)
      }
      // Arrancar desde el primer día con actividad real
      const firstIdx = dataScans.findIndex((v, i) => v > 0 || dataConsultas[i] > 0)
      if (firstIdx > 0) {
        labelsEvol.splice(0, firstIdx)
        dataScans.splice(0, firstIdx)
        dataConsultas.splice(0, firstIdx)
      }
      return { labelsEvol, dataScans, dataConsultas }
    }

    // datosEvolucionActivo — igual que datosEvolucionPasivo pero con bloqueDias del panel activo:
    // ≤30d → 1 punto por día, 31-45d → 3d, 46-120d → 7d, >120d → 30d
    // NO modificar datosEvolucionPasivo para no afectar panel pasivo.
    function datosEvolucionActivo(contactos, desde, hasta) {
      const inicio = new Date(desde)
      inicio.setHours(0,0,0,0)
      const fin = new Date(hasta)
      fin.setHours(23,59,59,999)
      const dias = Math.max(1, Math.ceil((fin - inicio) / 86400000))
      const bloqueDias = dias <= 30 ? 1 : dias <= 45 ? 3 : dias <= 120 ? 7 : 30
      const labelsEvol = [], dataScans = [], dataConsultas = []
      for (let cursor = new Date(inicio); cursor <= fin; cursor = new Date(cursor.getTime() + bloqueDias * 86400000)) {
        const bloqueIni = new Date(cursor)
        const bloqueFin = new Date(Math.min(fin.getTime() + 1, bloqueIni.getTime() + bloqueDias * 86400000))
        labelsEvol.push(bloqueIni.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' }))
        dataScans.push(visitas.filter(v => { const d = new Date(v.created_at); return d >= bloqueIni && d < bloqueFin }).length)
        dataConsultas.push(contactos.filter(c => { const d = new Date(c.created_at); return d >= bloqueIni && d < bloqueFin }).length)
      }
      const firstIdx = dataScans.findIndex((v, i) => v > 0 || dataConsultas[i] > 0)
      if (firstIdx > 0) { labelsEvol.splice(0, firstIdx); dataScans.splice(0, firstIdx); dataConsultas.splice(0, firstIdx) }
      return { labelsEvol, dataScans, dataConsultas }
    }

    function pvGrad(ctx, rgb, alto = .45) {
      const h = ctx.canvas.height || 260
      const g = ctx.createLinearGradient(0, 0, 0, h)
      g.addColorStop(0,   rgb.replace('rgb','rgba').replace(')',`, ${alto})`))
      g.addColorStop(0.6, rgb.replace('rgb','rgba').replace(')',`, ${+(alto * .22).toFixed(2)})`))
      g.addColorStop(1,   rgb.replace('rgb','rgba').replace(')',', 0)'))
      return g
    }

    // ── Leyenda interactiva del gráfico principal (modo multi-slot) ──
    // Total y Consultas siempre visibles (locked). Cada propiedad se oculta/muestra con click.
    function renderLeyendaMultiSlot(ctx) {
      const host = document.getElementById('pvLegendHost')
      if (!host) return
      const chips = []
      // Total de interacciones (locked)
      chips.push(`<div class="pv-legend-chip locked" title="Siempre visible">
        <span class="pv-legend-dot" style="background:#7aaeff;color:#7aaeff;"></span>
        <span class="pv-legend-name">Total interacciones</span>
      </div>`)
      // Consultas (locked)
      chips.push(`<div class="pv-legend-chip locked" title="Siempre visible">
        <span class="pv-legend-dot" style="background:#e8c96a;color:#e8c96a;"></span>
        <span class="pv-legend-name">Consultas</span>
      </div>`)
      // Una por slot activo con actividad (todos los slots activos, no solo propiedades reales)
      misSlots.filter(s => s.activo !== false).forEach(slot => {
        const color = colorDeSlot(slot.codigo)
        const proy = proyImgs[slot.proyecto_slug]
        const nombre = proy?.nombre || slot.nombre || slot.codigo
        const off = window._pvSlotHidden[slot.codigo] === true ? ' off' : ''
        chips.push(`<div class="pv-legend-chip${off}" data-slot="${esc(slot.codigo)}" title="Click para mostrar/ocultar">
          <span class="pv-legend-dot" style="background:${color};color:${color};"></span>
          <span class="pv-legend-name">${esc(nombre)}</span>
        </div>`)
      })
      host.innerHTML = `<div class="pv-legend">${chips.join('')}</div>`
      host.querySelectorAll('.pv-legend-chip[data-slot]').forEach(chip => {
        chip.addEventListener('click', () => {
          const codigo = chip.dataset.slot
          window._pvSlotHidden[codigo] = !(window._pvSlotHidden[codigo] === true)
          // Re-render solo el chart sin recalcular datos
          if (_pvChart4) {
            _pvChart4.data.datasets.forEach(ds => {
              if (ds._slotCodigo === codigo) ds.hidden = window._pvSlotHidden[codigo] === true
            })
            _pvChart4.update('none')
          }
          chip.classList.toggle('off')
        })
      })
    }

      }
      const gradAzul = (c) => { const {ctx:cc,chartArea}=c.chart; if(!chartArea) return 'rgba(122,174,255,.32)'; const g=cc.createLinearGradient(0,chartArea.top,0,chartArea.bottom); g.addColorStop(0,'rgba(122,174,255,.72)'); g.addColorStop(0.45,'rgba(122,174,255,.34)'); g.addColorStop(1,'rgba(122,174,255,0)'); return g }
      const pluginPeakMark = (peakIdx) => ({
        id:'pvPeakMark4',
        beforeDatasetsDraw(chart) {
          const {ctx:c,chartArea,scales}=chart
          if(!chartArea||peakIdx<0) return
          const x=scales.x.getPixelForValue(peakIdx)
          if(!Number.isFinite(x)) return
          const g=c.createLinearGradient(x-40,0,x+40,0)
          g.addColorStop(0,'rgba(232,201,106,0)'); g.addColorStop(0.5,'rgba(232,201,106,.12)'); g.addColorStop(1,'rgba(232,201,106,0)')
          c.save(); c.fillStyle=g; c.fillRect(x-40,chartArea.top,80,chartArea.bottom-chartArea.top)
          c.beginPath(); c.setLineDash([4,6]); c.strokeStyle='rgba(232,201,106,.35)'; c.lineWidth=1
          c.moveTo(x,chartArea.top); c.lineTo(x,chartArea.bottom); c.stroke(); c.restore()
        }
      })
      const pluginGoldGlow = {
        id:'pvGoldGlow4',
        beforeDatasetDraw(chart,args) {
          if (args.index===0) { chart.ctx.save(); chart.ctx.shadowColor='rgba(122,174,255,.28)'; chart.ctx.shadowBlur=6 }
          else if (args.index===1) { chart.ctx.save(); chart.ctx.shadowColor='rgba(232,201,106,.5)'; chart.ctx.shadowBlur=10 }
        },
        afterDatasetDraw(chart,args) { if(args.index===0||args.index===1) chart.ctx.restore() }
      }
      // datasetsBase ahora recibe también el array de líneas por propiedad (opcional)
      const datasetsBase = (lblsData, slotLines = []) => {

          {
            label:'Interacciones', data:lblsData[0], order:2,

        return base
      }

      // ── MODO HOY: actividad real por ventana de 15 minutos (sube y baja) ──
      if (modoHoy) {
        const tagEl = document.getElementById('pvLiveTag')

        const VENTANA = 15 // minutos por bucket
        const hoyB0 = new Date(); hoyB0.setHours(0,0,0,0)
        const ahoraMin = new Date()
        const minutosDelDia = ahoraMin.getHours()*60 + ahoraMin.getMinutes() + 1
        const numBuckets = Math.ceil(minutosDelDia / VENTANA)

        const bucketScans = new Array(numBuckets).fill(0)
        const bucketCons  = new Array(numBuckets).fill(0)
        const inHoy = (iso) => { const d=new Date(iso); return d>=hoyB0&&d<=ahoraMin }
        visitas.forEach(v => {
          if (!inHoy(v.created_at)) return
          const d=new Date(v.created_at); const m=d.getHours()*60+d.getMinutes()

        contactos.forEach(c => {
          if (!inHoy(c.created_at)) return

          if (rV.data) visitas = rV.data
          if (rC.data) contactos = rC.data
          renderGraficoPasivo(contactos, 0, null, null, { multiSlot: opciones.multiSlot === true })
          if (opciones.multiSlot) renderPanelesActivos(contactos)
        }, 30000)

      } else {
        // ── MODO PERÍODO: diario acumulado ───────────────────────────────
        // Ocultar barra de zoom (solo activa en modo Hoy)
        const pvZBP = document.getElementById('pvHoyZoomBar'); if (pvZBP) pvZBP.style.display = 'none'
        const hasta = hastaCustom ? new Date(`${hastaCustom}T23:59:59`) : new Date()
        const desde = desdeCustom ? new Date(`${desdeCustom}T00:00:00`) : new Date(hasta.getTime()-(dias-1)*86400000)
        const { labelsEvol, dataScans, dataConsultas } = (multiSlot ? datosEvolucionActivo : datosEvolucionPasivo)(contactos, desde, hasta)

        const combined = dataScans.map((s,i)=>s+dataConsultas[i])
        const peakVal = Math.max(...combined, 0)
        const peakIdx = peakVal>0 ? combined.indexOf(peakVal) : -1

        // ── Líneas individuales por slot (modo período, alineadas al total) ──
        // ETAPA 1: buckets idénticos a datosEvolucionPasivo para que ninguna
        // línea individual pueda superar visualmente a la línea total.
        const slotLinesPeriodo = []
        if (multiSlot) {
          // 1. Deduplicar misSlots por codigo solo en memoria
          const _seenCod = new Set()
          const slotsDedup = misSlots.filter(s => {
            if (_seenCod.has(s.codigo)) { console.warn('[Etapa1] Slot duplicado omitido:', s.codigo); return false }
            _seenCod.add(s.codigo); return true
          })
          // 2. Replicar la normalización exacta de datosEvolucionPasivo
          const _ini = new Date(desde); _ini.setHours(0,0,0,0)
          const _fin = new Date(hasta);  _fin.setHours(23,59,59,999)
          const _dias = Math.max(1, Math.ceil((_fin - _ini) / 86400000))
          const bloqueDias = _dias <= 30 ? 1 : _dias <= 45 ? 3 : _dias <= 120 ? 7 : 30
          // 3. Construir los mismos buckets que usó la línea total
          const _buckets = []
          for (let _c = new Date(_ini); _c <= _fin; _c = new Date(_c.getTime() + bloqueDias * 86400000)) {
            const bIni = new Date(_c)
            const bFin = new Date(Math.min(_fin.getTime() + 1, bIni.getTime() + bloqueDias * 86400000))
            _buckets.push({ bIni, bFin })
          }
          // 4. Eliminar los mismos buckets iniciales que recortó datosEvolucionPasivo
          const _recorte = _buckets.length - labelsEvol.length
          const _buckAlin = _recorte > 0 ? _buckets.slice(_recorte) : _buckets
          // 5. Construir series con los buckets alineados (todos los slots activos)
          slotsDedup.filter(s => s.activo !== false).forEach(slot => {
            const visSlot = visitas.filter(v => v.canal_ref === slot.codigo)
            const arr = _buckAlin.map(({ bIni, bFin }) =>
              visSlot.filter(v => { const d = new Date(v.created_at); return d >= bIni && d < bFin }).length
            )
            if (arr.some(x => x > 0)) {
              const proy = proyImgs[slot.proyecto_slug]
              slotLinesPeriodo.push({ codigo: slot.codigo, nombre: proy?.nombre || slot.nombre || slot.codigo, color: colorDeSlot(slot.codigo), data: arr })
            }
          })
        }

        const tagEl = document.getElementById('pvLiveTag')
        const scansLEl = document.getElementById('pvLiveScansL')
        const consultasLEl = document.getElementById('pvLiveConsultasL')
        if (tagEl) tagEl.textContent = desdeCustom ? `${desdeCustom.replace(/-/g,'/')} → ${hastaCustom.replace(/-/g,'/')}` : `Últimos ${dias} días`
        if (scansLEl) scansLEl.textContent = 'período · interacciones'
        if (consultasLEl) consultasLEl.textContent = 'período · consultas'
        setText('pvLiveScans4', dataScans.reduce((s,v)=>s+v,0))
        setText('pvLiveConsultas4', dataConsultas.reduce((s,v)=>s+v,0))

        const _dsPer = datasetsBase([dataScans, dataConsultas], slotLinesPeriodo)
        _dsPer[1].pointRadius = dataConsultas.map(v => v > 0 ? 6 : 0)
        _dsPer[1].pointBackgroundColor = '#e8c96a'
        _pvChart4 = new Chart(ctx4, {
          type:'line',
          data:{ labels:labelsEvol, datasets:_dsPer },
          plugins:[pluginPeakMark(peakIdx), pluginGoldGlow],
          options:{
            responsive:true, maintainAspectRatio:false,
            animation:{duration:900,easing:'easeOutQuart'},
            interaction:{mode:'index',intersect:false},
            layout:{padding:{top:14,right:16,bottom:2,left:2}},
            plugins:{
              legend: multiSlot ? {display:false} : legendBase,
              tooltip:{
                ...tooltipBase,
                filter: item => item.datasetIndex === 0 || Number(item.raw) > 0,
                callbacks:{ label(ctx){ return ` ${ctx.dataset.label}: ${Number(ctx.raw||0).toLocaleString('es-AR')}` } }
              }
            },
            scales:scalesBase
          }
        })
        // Zoom/pan interactivo: viewport del período actual
        window._pvZoomDefaultFrom = desde.getTime()
        window._pvZoomDefaultTo   = hasta.getTime()
        window._pvZoomFrom = window._pvZoomDefaultFrom
        window._pvZoomTo   = window._pvZoomDefaultTo
        pvBindZoomPan(_pvChart4)
      }

      // ── Leyenda interactiva (solo modo multi-slot) ──
      if (multiSlot) renderLeyendaMultiSlot(ctx4)

      // ── Mini sparklines (siempre, independiente del modo) ───────────────
      const hoy0=new Date(); hoy0.setHours(0,0,0,0)
      const sem0=new Date(hoy0-7*86400000), mes0=new Date(hoy0-30*86400000)
      const enRango=(iso,a,b)=>{ const d=new Date(iso); return d>=a&&d<=b }
      const miniCfg=(data,color)=>({
        type:'line',
        data:{labels:data.map((_,i)=>i),datasets:[{data,borderColor:color,borderWidth:2,tension:0.4,fill:true,pointRadius:0,cubicInterpolationMode:'monotone',
          backgroundColor:(c)=>{ const {ctx:cc,chartArea}=c.chart; if(!chartArea) return 'rgba(0,0,0,0)'; const g=cc.createLinearGradient(0,chartArea.top,0,chartArea.bottom); g.addColorStop(0,color.replace('1)','0.4)')); g.addColorStop(1,color.replace('1)','0)')); return g } }]},
        options:{responsive:true,maintainAspectRatio:false,animation:{duration:600},plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}}}
      })

      const semAll=(()=>{ const d=7; const oS=new Array(d).fill(0),oC=new Array(d).fill(0)
        visitas.forEach(v=>{ if(!enRango(v.created_at,sem0,new Date())) return; const i=Math.floor((new Date(v.created_at)-sem0)/86400000); if(i>=0&&i<d) oS[i]++ })
        contactos.forEach(c=>{ if(!enRango(c.created_at,sem0,new Date())) return; const i=Math.floor((new Date(c.created_at)-sem0)/86400000); if(i>=0&&i<d) oC[i]++ })
        let rs2=0,rc2=0; return {s:oS.map(v=>{rs2+=v;return rs2}),c:oC.map(v=>{rc2+=v;return rc2})} })()
      const mesAll=(()=>{ const d=30; const oS=new Array(d).fill(0),oC=new Array(d).fill(0)
        visitas.forEach(v=>{ if(!enRango(v.created_at,mes0,new Date())) return; const i=Math.floor((new Date(v.created_at)-mes0)/86400000); if(i>=0&&i<d) oS[i]++ })
        contactos.forEach(c=>{ if(!enRango(c.created_at,mes0,new Date())) return; const i=Math.floor((new Date(c.created_at)-mes0)/86400000); if(i>=0&&i<d) oC[i]++ })
        let rs2=0,rc2=0; return {s:oS.map(v=>{rs2+=v;return rs2}),c:oC.map(v=>{rc2+=v;return rc2})} })()

      const cb=document.getElementById('pvMiniSem')?.getContext('2d')
      const cc=document.getElementById('pvMiniMes')?.getContext('2d')
      if(cb) _pvChart4b=new Chart(cb,miniCfg(semAll.s.map((s,i)=>s+semAll.c[i]),'rgba(122,174,255,1)'))
      if(cc) _pvChart4c=new Chart(cc,miniCfg(mesAll.s.map((s,i)=>s+mesAll.c[i]),'rgba(110,232,154,1)'))

      setText('pvMiniSemN', (semAll.s[semAll.s.length-1]||0)+(semAll.c[semAll.c.length-1]||0))
      setText('pvMiniMesN', (mesAll.s[mesAll.s.length-1]||0)+(mesAll.c[mesAll.c.length-1]||0))
    }


    // El modo multi-slot aplica solo al canal activo (cuando hay slots asignados)
    const _modoMultiSlot = () => misSlots && misSlots.length > 0

    // ── ETAPA 2: Actualizar KPI superiores según el período seleccionado ──
    function actualizarKpisActivo(desde, hasta) {
      const d0 = new Date(desde); d0.setHours(0,0,0,0)
      const d1 = new Date(hasta); d1.setHours(23,59,59,999)

      const vP  = visitas.filter(v  => { const d=new Date(v.created_at);  return d>=d0 && d<=d1 }).length
      const qrP = visitas.filter(v  => { const d=new Date(v.created_at);  return d>=d0 && d<=d1 && v.canal_via==='qr' }).length
      const cP  = contactos.filter(c => { const d=new Date(c.created_at); return d>=d0 && d<=d1 }).length
      const conv = vP > 0 ? Number((cP / vP * 100).toFixed(1)) : 0

      const setEl   = (id, v) => { const el=document.getElementById(id); if(el) el.textContent=v }
      const clearEl = (id)    => { const el=document.getElementById(id); if(el) el.innerHTML='' }

      setEl('pvKpi1N',   vP.toLocaleString('es-AR'))
      setEl('pvKpi1Sub', 'Interacciones en el período seleccionado.')
      setEl('pvKpi2N',   qrP.toLocaleString('es-AR'))
      clearEl('pvKpi2Delta')
      setEl('pvKpi2Sub', 'Escaneos desde QR físico en el período.')
      setEl('pvKpi3N',   cP.toLocaleString('es-AR'))
      clearEl('pvKpi3Delta')
      setEl('pvKpi3Sub', `${cP.toLocaleString('es-AR')} consultas en el período.`)
      setEl('pvKpi4N',   `${conv}%`)
      clearEl('pvKpi4Delta')
      setEl('pvKpi4Sub', 'Consultas sobre interacciones del período.')
    }

    window.pvSetPeriodo = function(btn) {
      document.querySelectorAll('.pv-flt-btn').forEach(b => b.classList.remove('activo'))
      btn.classList.add('activo')
      const valor = btn.dataset.dias
      const custom = valor === 'custom'
      document.getElementById('pvFltCustom').style.display = custom ? '' : 'none'
      if (!custom) {
        const dias = valor === 'hoy' ? 0 : parseInt(valor, 10)
        const hasta = new Date()
        const desde = new Date(hasta)
        if (dias === 0) {
          desde.setHours(0,0,0,0)
        } else {
          desde.setTime(hasta.getTime() - (dias - 1) * 86400000)
          desde.setHours(0,0,0,0)
        }
        const _lbl = valor === 'hoy' ? 'hoy' : `últimos ${dias} días`
        renderGraficoPasivo(contactos, dias, null, null, { multiSlot: _modoMultiSlot() })
        if (_modoMultiSlot()) renderPanelesActivos(contactos)
        actualizarKpisActivo(desde, hasta)
        actualizarSlotCards(desde, hasta)
        if (misSlots.length) renderSlotMiniCharts(desde, hasta, _lbl)
      }
    }

    window.pvAplicarFechas = function() {
      const desde = document.getElementById('pvEvolDesde').value
      const hasta = document.getElementById('pvEvolHasta').value
      if (!desde || !hasta) { alert('Seleccioná una fecha desde y una hasta.'); return }
      if (desde > hasta) { alert('La fecha desde no puede ser posterior a la fecha hasta.'); return }
      const fechaLocal = val => { const [y,m,d] = val.split('-').map(Number); return new Date(y, m-1, d) }
      renderGraficoPasivo(contactos, 30, desde, hasta, { multiSlot: _modoMultiSlot() })
      if (_modoMultiSlot()) renderPanelesActivos(contactos)
      actualizarKpisActivo(fechaLocal(desde), fechaLocal(hasta))
      actualizarSlotCards(fechaLocal(desde), fechaLocal(hasta))
      if (misSlots.length) renderSlotMiniCharts(fechaLocal(desde), fechaLocal(hasta), 'período seleccionado')
    }

    // ── ETAPA 3A.1: actualizar métricas de cards por período (sin regenerar HTML) ──
    function actualizarSlotCards(desde, hasta) {
      const d0 = new Date(desde); d0.setHours(0,0,0,0)
      const d1 = new Date(hasta); d1.setHours(23,59,59,999)
      const en  = t => { const d = new Date(t); return d >= d0 && d <= d1 }
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v }
      misSlots.filter(s => s.activo !== false).forEach(slot => {
        const vSlot = visitas.filter(v => v.canal_ref === slot.codigo && en(v.created_at))
        const int   = vSlot.length
        const qrN   = vSlot.filter(v => v.canal_via === 'qr').length
        const lnkN  = int - qrN
        const cons  = contactos.filter(c => c.canal_ref === slot.codigo && en(c.created_at)).length
        const conv  = int > 0 ? (cons / int * 100).toFixed(1) + '%' : '—'
        set(`slot-n-int-${slot.id}`,  int)
        set(`slot-n-cons-${slot.id}`, cons)
        set(`slot-n-conv-${slot.id}`, conv)
        set(`slot-n-qr-${slot.id}`,   qrN)
        set(`slot-n-lnk-${slot.id}`,  lnkN)
      })
    }

    // ── Canal activo: propiedades con mini-chart individual ──────────────────
    function renderSlotCards() {
      if (!misSlots.length) return `
        <div class="pv-sec">
          <div class="pv-sec-head"><div>
            <div class="pv-sec-titulo">Mis canales activos</div>
            <div class="pv-sec-sub">Aún no tenés slots asignados. El administrador te los va a asignar.</div>
          </div></div>
        </div>`

      // ── ETAPA 1C: separar propiedades reales de canales generales ──
      const slotsActivos = misSlots.filter(s => s.activo !== false)
      const propSlots    = slotsActivos.filter(esPropiedadReal)
      const canalSlots   = slotsActivos.filter(s => !esPropiedadReal(s))
      const activosCount = propSlots.length

      // ── Sección A: Propiedades activas (código sin cambios) ──
      const cards = propSlots.map(slot => {
        const proy       = proyImgs[slot.proyecto_slug]
        const prop       = findPropData(slot.proyecto_slug)
        const fotoUrl    = proy?.foto_portada || prop?.imagenes?.[0] || ''
        const proyNombre = proy?.nombre || prop?.titulo || slot.nombre || slot.codigo
        const attrSrc    = prop || proy
        const scans      = scansPorSlot[slot.codigo] || 0
        const slotCons   = contactos.filter(c => c.canal_ref === slot.codigo)
        const conv       = scans > 0 ? ((slotCons.length / scans) * 100).toFixed(1) + '%' : '—'
        const esActivo   = slot.activo !== false
        const redirectUrl = `${location.origin}/r/${slot.codigo}`
        const imgStyle = fotoUrl ? `background-image:url('${fotoUrl.replace(/'/g,"\\'")}')` : ''
        const ptrOff = !esActivo ? 'pointer-events:none' : ''
        const colorHex = colorDeSlot(slot.codigo)

        // Atributos de propiedad (preferir propiedades sobre proyectos)
        const attrs = []
        if (attrSrc?.dormitorios)         attrs.push({ v: attrSrc.dormitorios,                     l: 'DORM.' })
        if (attrSrc?.banos)               attrs.push({ v: attrSrc.banos,                            l: 'BAÑOS' })
        if (attrSrc?.superficie_cubierta) attrs.push({ v: attrSrc.superficie_cubierta + ' m²',     l: 'M² CUB.' })
        if (attrSrc?.superficie_total)    attrs.push({ v: attrSrc.superficie_total + ' m²',        l: 'M² TOT.' })
        const attrsHtml = attrs.length ? `
          <div class="slot-attrs">
            ${attrs.map(a => `<div class="slot-attr"><span class="slot-attr-v">${a.v}</span><span class="slot-attr-l">${a.l}</span></div>`).join('')}
          </div>` : ''

        return `
        <div class="slot-full-card${esActivo ? '' : ' slot-full-inactivo'}">
          <div class="slot-full-left">
            <div class="slot-full-img"${imgStyle ? ` style="${imgStyle}"` : ''}>
              <div class="slot-full-img-overlay"></div>
              <div class="slot-img-top">
                <div class="slot-full-eyebrow">${esc(slot.codigo)}</div>
                <div class="qr-slot-estado-badge ${esActivo?'activo':'inactivo'}">${esActivo?'● ACTIVO':'● INACTIVO'}</div>
              </div>
              <div class="slot-img-bottom">
                <div class="slot-full-nombre">${esc(proyNombre)}</div>
                ${attrsHtml}
              </div>
            </div>
            <div class="slot-full-body">
              <div class="slot-full-stats">
                <div class="slot-stat">
                  <span class="slot-stat-n" id="slot-n-int-${slot.id}" style="color:${colorHex};">${scans}</span>
                  <span class="slot-stat-l">INTERACCIONES</span>
                </div>
                <div class="slot-stat">
                  <span class="slot-stat-n" id="slot-n-cons-${slot.id}" style="color:#e8c96a;">${slotCons.length}</span>
                  <span class="slot-stat-l">CONSULTAS</span>
                </div>
                <div class="slot-stat">
                  <span class="slot-stat-n" id="slot-n-conv-${slot.id}">${conv}</span>
                  <span class="slot-stat-l">CONVERSIÓN</span>
                </div>
              </div>
              <div style="display:flex;gap:.8rem;margin-top:.4rem;padding-top:.38rem;border-top:1px solid rgba(255,255,255,.07);">
                <span style="font-size:.6rem;color:rgba(255,255,255,.42);display:flex;align-items:center;gap:.25rem;letter-spacing:.04em;text-transform:uppercase;"><span style="color:#50c878;">●</span> QR&nbsp;<strong id="slot-n-qr-${slot.id}" style="color:#50c878;font-weight:700;">—</strong></span>
                <span style="font-size:.6rem;color:rgba(255,255,255,.42);display:flex;align-items:center;gap:.25rem;letter-spacing:.04em;text-transform:uppercase;"><span style="color:#6495ed;">●</span> Link&nbsp;<strong id="slot-n-lnk-${slot.id}" style="color:#6495ed;font-weight:700;">—</strong></span>
              </div>
              <div class="slot-full-qr-footer" style="${ptrOff}">
                <div class="qr-slot-canvas-wrap" style="padding:5px;">
                  <canvas id="qr-canvas-${slot.id}" width="70" height="70"></canvas>
                </div>
                <div style="display:flex;flex-direction:column;gap:.35rem;">
                  <button class="qr-slot-btn" onclick="descargarQR('qr-canvas-${slot.id}','${slot.codigo}')">Descargar QR</button>
                  <button class="qr-slot-btn" onclick="copiarLink('${redirectUrl}',this)">Copiar link</button>
                </div>
              </div>
              ${!esActivo ? '<div class="qr-slot-inactivo-banner">Esta propiedad ya no está disponible · Retirá el material impreso.</div>' : ''}
            </div>
          </div>
          <div class="slot-full-right">
            <div class="slot-chart-label" id="slot-chart-lbl-${slot.id}" style="color:${colorHex};opacity:.8;">Interacciones · últimos 30 días</div>
            <div class="slot-chart-wrap"><canvas id="slot-chart-${slot.id}"></canvas></div>
            <div class="slot-chart-total" id="slot-chart-tot-${slot.id}">${scans} total</div>
          </div>
        </div>`
      }).join('')

      // ── Sección B: Canales generales (ETAPA 1C) ──
      const canalCards = canalSlots.map(slot => {
        const scans      = scansPorSlot[slot.codigo] || 0
        const slotCons   = contactos.filter(c => c.canal_ref === slot.codigo)
        const conv       = scans > 0 ? ((slotCons.length / scans) * 100).toFixed(1) + '%' : '—'
        const esActivo   = slot.activo !== false
        const redirectUrl = `${location.origin}/r/${slot.codigo}`
        const dest       = slot.destino || '/'
        const esExterno  = dest.startsWith('http://') || dest.startsWith('https://')
        const colorHex   = colorDeSlot(slot.codigo)
        const rgb        = colorHex.replace('#','').match(/.{2}/g).map(x=>parseInt(x,16)).join(',')
        const ptrOff     = !esActivo ? 'pointer-events:none' : ''
        const badgeTxt   = esExterno ? 'Destino externo' : 'Canal general'
        const badgeStyle = esExterno
          ? 'background:rgba(232,140,106,.12);color:#f0956a;border:1px solid rgba(232,140,106,.25)'
          : 'background:rgba(100,149,237,.10);color:#6495ed;border:1px solid rgba(100,149,237,.22)'
        const destLabel  = esExterno ? dest.replace(/^https?:\/\//, '') : dest

        return `
        <div class="slot-full-card${esActivo ? '' : ' slot-full-inactivo'}">
          <div class="slot-full-left">
            <div class="slot-full-img" style="background:linear-gradient(135deg,rgba(${rgb},0.18),rgba(17,16,14,0.95))">
              <div class="slot-full-img-overlay"></div>
              <div class="slot-img-top">
                <div class="slot-full-eyebrow">${esc(slot.codigo)}</div>
                <div class="qr-slot-estado-badge ${esActivo?'activo':'inactivo'}">${esActivo?'● ACTIVO':'● INACTIVO'}</div>
              </div>
              <div class="slot-img-bottom">
                <div class="slot-full-nombre">${esc(slot.nombre || slot.codigo)}</div>
                <div style="margin-top:.35rem;">
                  <span style="font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.18rem .5rem;border-radius:999px;${badgeStyle}">${badgeTxt}</span>
                </div>
              </div>
            </div>
            <div class="slot-full-body">
              <div style="font-size:.68rem;color:rgba(255,255,255,.38);letter-spacing:.03em;margin-bottom:.65rem;word-break:break-all;">${esc(destLabel)}</div>
              <div class="slot-full-stats">
                <div class="slot-stat">
                  <span class="slot-stat-n" id="slot-n-int-${slot.id}" style="color:${colorHex};">${scans}</span>
                  <span class="slot-stat-l">INTERACCIONES</span>
                </div>
                <div class="slot-stat">
                  <span class="slot-stat-n" id="slot-n-cons-${slot.id}" style="color:#e8c96a;">${slotCons.length}</span>
                  <span class="slot-stat-l">CONSULTAS</span>
                </div>
                <div class="slot-stat">
                  <span class="slot-stat-n" id="slot-n-conv-${slot.id}">${conv}</span>
                  <span class="slot-stat-l">CONVERSIÓN</span>
                </div>
              </div>
              <div style="display:flex;gap:.8rem;margin-top:.4rem;padding-top:.38rem;border-top:1px solid rgba(255,255,255,.07);">
                <span style="font-size:.6rem;color:rgba(255,255,255,.42);display:flex;align-items:center;gap:.25rem;letter-spacing:.04em;text-transform:uppercase;"><span style="color:#50c878;">●</span> QR&nbsp;<strong id="slot-n-qr-${slot.id}" style="color:#50c878;font-weight:700;">—</strong></span>
                <span style="font-size:.6rem;color:rgba(255,255,255,.42);display:flex;align-items:center;gap:.25rem;letter-spacing:.04em;text-transform:uppercase;"><span style="color:#6495ed;">●</span> Link&nbsp;<strong id="slot-n-lnk-${slot.id}" style="color:#6495ed;font-weight:700;">—</strong></span>
              </div>

    // ETAPA 3A.2: registro de instancias para destroy antes de recrear
    const _slotCharts = {}

    function renderSlotMiniCharts(desde, hasta, labelPeriodo) {
      if (typeof Chart === 'undefined') return
      const d0 = desde ? new Date(desde) : new Date(Date.now() - 30 * 86400000)
      const d1 = hasta ? new Date(hasta) : new Date()
      d0.setHours(0,0,0,0); d1.setHours(23,59,59,999)
      const totalDias = Math.max(1, Math.ceil((d1 - d0) / 86400000))
      // HOY o período de 1 día → buckets horarios (24h); más días → buckets diarios
      const isSingleDay = totalDias === 1
      const diasArr = isSingleDay ? [] : Array.from({length: totalDias}, (_, i) => {
        const d = new Date(d0.getTime() + i * 86400000); d.setHours(0,0,0,0); return d
      })
      const labels = isSingleDay
        ? Array.from({length: 24}, (_, h) => `${String(h).padStart(2,'0')}:00`)
        : diasArr.map(d => d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'}))
      const lblPeriodo = labelPeriodo || 'últimos 30 días'

      misSlots.forEach(slot => {
        const canvas = document.getElementById(`slot-chart-${slot.id}`)
        if (!canvas) return
        // Destroy instancia anterior antes de recrear
        if (_slotCharts[slot.id]) { try { _slotCharts[slot.id].destroy() } catch(e){} ; _slotCharts[slot.id] = null }
        const colorHex = colorDeSlot(slot.codigo)
        const rgba = (a) => colorHex.replace('#','').match(/.{2}/g).map(x=>parseInt(x,16)).join(',')+`,${a}`
        const slotVis  = visitas.filter(v => v.canal_ref === slot.codigo)
        const slotCons = contactos.filter(c => c.canal_ref === slot.codigo)
        // HOY → contar por hora; multiday → contar por día
        let data, dataCons
        if (isSingleDay) {
          data     = Array.from({length:24}, (_, h) => { const hI=new Date(d0); hI.setHours(h,0,0,0); const hF=new Date(d0); hF.setHours(h,59,59,999); return slotVis.filter(v=>{const d=new Date(v.created_at);return d>=hI&&d<=hF}).length })
          dataCons = Array.from({length:24}, (_, h) => { const hI=new Date(d0); hI.setHours(h,0,0,0); const hF=new Date(d0); hF.setHours(h,59,59,999); return slotCons.filter(c=>{const d=new Date(c.created_at);return d>=hI&&d<=hF}).length })
        } else {
          data     = diasArr.map(dIni => { const dFin=new Date(dIni.getTime()+86400000); return slotVis.filter(v=>{const d=new Date(v.created_at);return d>=dIni&&d<dFin}).length })
          dataCons = diasArr.map(dIni => { const dFin=new Date(dIni.getTime()+86400000); return slotCons.filter(c=>{const d=new Date(c.created_at);return d>=dIni&&d<dFin}).length })
        }
        const ctx2d = canvas.getContext('2d')
        _slotCharts[slot.id] = new Chart(ctx2d, {
          type: 'line',
          data: {
            labels,
            datasets: [
              {
                data,
                borderColor: colorHex,
                borderWidth: 2.5,
                tension: 0.4,
                cubicInterpolationMode: 'monotone',
                fill: true,
                backgroundColor: (context) => {
                  const chart = context.chart
                  const { ctx: c, chartArea } = chart
                  if (!chartArea) return `rgba(${rgba(0.2)})`
                  const g = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom)
                  g.addColorStop(0,   `rgba(${rgba(0.50)})`)
                  g.addColorStop(0.5, `rgba(${rgba(0.15)})`)
                  g.addColorStop(1,   `rgba(${rgba(0.00)})`)
                  return g
                },
                pointRadius: 0,
                pointHoverRadius: 5,
                pointHoverBackgroundColor: colorHex,
                pointHoverBorderColor: '#fff',
                pointHoverBorderWidth: 2,
              },
              {
                data: dataCons,
                borderColor: '#e8c96a',
                borderWidth: 1.5,
                tension: 0.4,
                cubicInterpolationMode: 'monotone',
                fill: false,
                spanGaps: true,

                pointBackgroundColor: '#e8c96a',
                pointHoverRadius: 6,
                pointHoverBackgroundColor: '#e8c96a',
                pointHoverBorderColor: '#fff',
                pointHoverBorderWidth: 2,
              }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            animation: { duration: 800, easing: 'easeOutQuart' },
            interaction: { mode: 'index', intersect: false },
            layout: { padding: { top: 6, right: 4, bottom: 0, left: 0 } },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: 'rgba(18,18,21,.96)',
