<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px/1.35 system-ui,sans-serif;color:#292b2c}
body{display:flex;flex-direction:column;background:#f5f3f3}
#mapa{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab;isolation:isolate}
#mapa:active{cursor:grabbing}#mapa:focus-visible{outline:2px solid #292b2c;outline-offset:-2px}

.label,.pin{position:absolute;white-space:nowrap}.label{transform:translate(-50%,-50%) rotate(var(--angle,0deg));font-size:clamp(10px,1.35vw,13px);font-weight:600;color:#454a4d;text-shadow:0 0 2px white,1px 1px 2px white,-1px -1px 2px white}
.route{padding:1px 4px;background:white;border:1px solid #829ab1;border-radius:4px}.town{font-size:clamp(12px,1.6vw,17px);font-weight:700}
.pin{transform:translate(-50%,-100%);display:grid;justify-items:center;filter:drop-shadow(0 2px 2px #0004)}
.pin:after{content:"";border-top:8px solid #1a1714;border-inline:5px solid transparent}
.disk{width:clamp(22px,3.6vw,36px);aspect-ratio:1;display:grid;place-items:center;background:#1a1714;border:2px solid #c9a84c;border-radius:50%}
.disk img{width:70%;height:auto}.office .disk{background:white}
.pin b{position:absolute;top:32%;left:calc(100% + 5px);transform:translateY(-50%);font-size:clamp(11px,1.5vw,15px);text-shadow:0 0 3px white,1px 1px 2px white,-1px -1px 2px white}
.office b{right:calc(100% + 5px);left:auto}
.controls{position:absolute;right:10px;top:10px;display:grid;overflow:hidden;border:1px solid #c7ccd1;border-radius:4px;background:white;box-shadow:0 1px 4px #0002}
button{width:40px;height:40px;padding:0;background:white;color:#292b2c;border:0;cursor:pointer;font:500 21px/1 system-ui}button+button{border-top:1px solid #d6dee5}button:disabled{color:#888}
.credit{position:absolute;bottom:0;right:0;max-width:100%;padding:1px 5px;background:#fffffff0;color:#38424a;font-size:10px}.credit a,footer a{color:inherit}
footer{padding:7px 10px;background:#f5f3f3;font-size:clamp(11px,1.4vw,14px)}
@media(max-width:550px){.office b{top:100%;right:calc(50% - 5px);transform:translateY(2px)}.route{transform:translate(-95%,-50%)}.controls{right:6px;top:6px}button{width:36px;height:36px}}
@media(max-height:360px){.avenida{margin-left:clamp(20px,4vw,28px)}.malvinas{margin-top:-15px;margin-left:2px}.town{margin-top:-5px}}

<script type="module">
const map=document.querySelector('#mapa'), base=document.querySelector('#base'), project=document.querySelector('#project');
const params=new URLSearchParams(location.search);
const lat=Number(params.get('lat')),lng=Number(params.get('lng'));
// Web Mercator pixels at zoom 15, relative to the top left of the packaged OSM extract.
const size=2560,world=2**23;
const px=(lng+180)/360*world-4934*512,py=(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*world-10297*512;
const inMap=params.has('lat')&&params.has('lng')&&px>=0&&px<size&&py>=0&&py<size;
if(inMap){project.dataset.x=px;project.dataset.y=py;project.querySelector('b').textContent=params.get('nombre')||'Proyecto'}
else project.remove();
const points=[...map.querySelectorAll('[data-x]')];
const office={x:1233.43,y:1268.32};
let cx,cy,scale,minScale,width,height;
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function draw(){
 const w=width/scale,h=height/scale;
 cx=clamp(cx,w/2,size-w/2);cy=clamp(cy,h/2,size-h/2);
 base.setAttribute('viewBox',[cx-w/2,cy-h/2,w,h].join(' '));
 for(const point of points){
  point.style.left=(width/2+(point.dataset.x-cx)*scale)+'px';
  point.style.top=(height/2+(point.dataset.y-cy)*scale)+'px';
 }
 zoomIn.disabled=scale>=4;zoomOut.disabled=scale<=minScale;
}
function fit(){
 width=map.clientWidth;height=map.clientHeight;if(!width||!height)return;
 minScale=Math.max(width,height)/size;
 const x=inMap?px:office.x,y=inMap?py:office.y;
 scale=Math.max(minScale,Math.min(width/(width<550?640:1000),height/530,width*.53/Math.max(1,Math.abs(office.x-x)),height*.60/Math.max(1,Math.abs(office.y-y))));
 cx=x;cy=y;
 if(width<600||Math.abs(office.x-x)*scale>width*.35)cx=(x+office.x)/2;
 if(Math.abs(office.y-y)*scale>height*.35)cy=(y+office.y)/2;
 draw();
}
function zoom(factor,x=width/2,y=height/2){
 const next=clamp(scale*factor,minScale,Math.max(4,minScale));
 cx+=(x-width/2)*(1/scale-1/next);cy+=(y-height/2)*(1/scale-1/next);scale=next;draw();
}
const zoomIn=document.querySelector('#zoomIn'),zoomOut=document.querySelector('#zoomOut');
zoomIn.onclick=()=>zoom(1.5);zoomOut.onclick=()=>zoom(1/1.5);document.querySelector('#reset').onclick=fit;
map.addEventListener('keydown',e=>{
 if(e.target!==map)return;
 const step=55/scale;
 switch(e.key){case 'ArrowLeft':cx-=step;break;case 'ArrowRight':cx+=step;break;case 'ArrowUp':cy-=step;break;case 'ArrowDown':cy+=step;break;case '+':case '=':zoom(1.5);break;case '-':zoom(1/1.5);break;case 'Home':fit();break;default:return}
 e.preventDefault();draw();
});
map.addEventListener('wheel',e=>{
 if(!e.ctrlKey&&!e.shiftKey)return;e.preventDefault();
 const b=map.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.003),e.clientX-b.left,e.clientY-b.top);
},{passive:false});
const pointers=new Map();
function gesture(){
 const [a,b]=pointers.values();return b?{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)}:{...a,d:0};
}
map.addEventListener('pointerdown',e=>{
 if(e.target.closest('button,a')||e.button!==0||pointers.size>=2)return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});map.setPointerCapture(e.pointerId);
});
map.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 const before=gesture();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const now=gesture();
 cx-=(now.x-before.x)/scale;cy-=(now.y-before.y)/scale;
 if(before.d&&now.d){const b=map.getBoundingClientRect();zoom(now.d/before.d,now.x-b.left,now.y-b.top)}else draw();
});
for(const event of ['pointerup','pointercancel','lostpointercapture'])map.addEventListener(event,e=>pointers.delete(e.pointerId));
new ResizeObserver(()=>{if(width!==map.clientWidth||height!==map.clientHeight)fit()}).observe(map);fit();
</script>
