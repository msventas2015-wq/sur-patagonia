<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso — Sur Patagonia</title>
  <link rel="stylesheet" href="../css/estilos.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--negro);
    }
    .login-box {
      background: var(--negro-2);
      border: 1px solid var(--gris-oscuro);
      padding: 3rem;
      width: 100%;
      max-width: 420px;
    }
    .login-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .login-logo span { color: var(--dorado); }
    .login-subtitulo {
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gris-claro);
      margin-bottom: 2.5rem;
    }
    .alerta-error {
      background: rgba(192,57,43,.08);
      border-left: 3px solid #c0392b;
      color: #c0392b;
      padding: 0.8rem 1rem;
      font-size: 0.75rem;
      margin-bottom: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">SUR <span>PATAGONIA</span></div>
    <p class="login-subtitulo">Panel de acceso</p>
    <div id="alertaLogin"></div>
    <form id="formLogin">
      <div class="form-grupo" style="margin-bottom:1.2rem;">
        <label>Email</label>
        <input type="email" id="email" placeholder="tu@email.com" required autofocus />
      </div>
      <div class="form-grupo" style="margin-bottom:2rem;">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-dorado" style="width:100%;" id="btnLogin">Ingresar</button>
    </form>
    <p style="text-align:center; margin-top:1.5rem;">
      <a href="../index.html" style="font-size:0.75rem; color:var(--gris-claro);">← Volver al sitio</a>
    </p>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const supabase = createClient(
      'https://wajkfydxutptcvvfwrvq.supabase.co',
      'sb_publishable_RKpmv1VDwMOB25phyfFrog_OdI-wB8s'
    )

    async function redirigirPorRol(rol) {
      if (rol === 'admin')  window.location.href = 'dashboard.html'
      else if (rol === 'agente') window.location.href = '../portal/index.html'
      else {
        await supabase.auth.signOut()
        document.getElementById('alertaLogin').innerHTML =
          `<div class="alerta-error">Tu cuenta no tiene acceso al panel. Contactá a Sur Patagonia.</div>`
        document.getElementById('btnLogin').textContent = 'Ingresar'
        document.getElementById('btnLogin').disabled = false
      }
    }

    // Si ya hay sesión activa, redirigir según rol
    const { data: { user } } = await supabase.auth.getUser()
    if (user) redirigirPorRol(user.user_metadata?.rol)

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('btnLogin')
      btn.textContent = 'Ingresando...'
      btn.disabled = true
      document.getElementById('alertaLogin').innerHTML = ''

      const { data, error } = await supabase.auth.signInWithPassword({
        email:    document.getElementById('email').value,
        password: document.getElementById('password').value
      })

      if (error) {
        document.getElementById('alertaLogin').innerHTML =
          `<div class="alerta-error">Email o contraseña incorrectos.</div>`
        btn.textContent = 'Ingresar'
        btn.disabled = false
        return
      }

      redirigirPorRol(data.user?.user_metadata?.rol)
    })
  </script>
</body>
</html>
