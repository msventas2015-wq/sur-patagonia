<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Mapa de lotes · Redirección</title>
</head>
<body>
  <p id="estado">Abriendo el editor de proyectos…</p>
  <noscript>Necesitás activar JavaScript para abrir el editor.</noscript>
  <script>
    const params = new URLSearchParams(location.search)
    const proyectoId = params.get('proyecto')
    if (proyectoId) {
      const destino = new URL('nuevo-proyecto.html', location.href)
      destino.searchParams.set('id', proyectoId)
      destino.searchParams.set('panel', 'mapa')
      location.replace(destino)
    } else {
      document.getElementById('estado').textContent = 'Elegí un proyecto para abrir su mapa.'
      const enlace = document.createElement('a')
      enlace.href = 'proyectos.html'
      enlace.textContent = 'Volver a proyectos'
      document.body.appendChild(enlace)
    }
  </script>
</body>
</html>
