<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reporte de Campaña — Admin</title>
  <link rel="stylesheet" href="../css/estilos.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --card-bg:#161513; --card-border:rgba(255,255,255,0.07); --card-radius:14px; --accent:#d76f3f; --gris:#888; --blanco:#f5f3f0; --verde:#50c878; --dorado:#c9a84c; }
    .admin-main { font-family:'Inter',system-ui,sans-serif; }

    .rp-back { display:inline-flex; align-items:center; gap:.45rem; font-size:.74rem; color:var(--gris); text-decoration:none; margin-bottom:1.4rem; transition:color .18s; }
    .rp-back:hover { color:var(--accent); }

    /* Hero */
    .rp-hero { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--card-radius); padding:1.5rem 1.6rem; margin-bottom:1.2rem; }
    .rp-nombre { font-family:'Cormorant Garamond',serif; font-size:1.8rem; font-weight:300; margin-bottom:.3rem; }
    .rp-desc { font-size:.78rem; color:var(--gris); margin-bottom:1rem; }
    .rp-meta { display:flex; gap:1.4rem; flex-wrap:wrap; align-items:center; }
    .rp-meta-item { font-size:.7rem; color:var(--gris); }
    .rp-meta-item strong { color:var(--blanco); display:block; font-weight:500; font-size:.78rem; }
    .rp-acciones { display:flex; gap:.5rem; margin-top:1.2rem; flex-wrap:wrap; }
    .btn-acc { padding:.45rem 1rem; border-radius:8px; font-size:.74rem; font-weight:600; cursor:pointer; font-family:inherit; text-decoration:none; border:none; display:inline-flex; align-items:center; gap:.4rem; transition:opacity .18s; }
    .btn-acc:hover { opacity:.85; }
    .btn-acc.primary { background:var(--accent); color:#fff; }
    .btn-acc.secondary { background:rgba(255,255,255,.06); color:var(--blanco); border:1px solid var(--card-border); }
    .btn-acc.share { background:rgba(80,200,120,.1); color:var(--verde); border:1px solid rgba(80,200,120,.25); }
    .estado-pill { display:inline-flex; align-items:center; gap:.35rem; font-size:.64rem; font-weight:600; padding:.2rem .6rem; border-radius:999px; }
    .estado-activa { background:rgba(80,200,120,.12); color:var(--verde); }
    .estado-finalizada { background:rgba(136,136,136,.12); color:var(--gris); }
    .estado-programada { background:rgba(201,168,76,.12); color:var(--dorado); }
    .estado-dot { width:6px; height:6px; border-radius:50%; background:currentColor; }

    /* KPIs */
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:.8rem; margin-bottom:1.2rem; }
    .kpi { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--card-radius); padding:1rem 1.1rem; }
    .kpi-n { font-size:1.9rem; font-weight:700; line-height:1; color:var(--blanco); margin-bottom:.3rem; }
    .kpi-n.accent { color:var(--accent); }
    .kpi-n.dorado { color:var(--dorado); }
    .kpi-n.verde { color:var(--verde); }
    .kpi-label { font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gris); font-weight:600; }

    /* Secciones */
    .seccion { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--card-radius); padding:1.3rem 1.4rem; margin-bottom:1.2rem; }
    .sec-titulo { font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gris); font-weight:600; margin-bottom:1rem; }

    /* Mapa */
    #mapaAdmin { height:320px; border-radius:10px; overflow:hidden; border:1px solid var(--card-border); }

    /* Tabla */
    .rp-tabla { width:100%; border-collapse:collapse; }
    .rp-tabla th { font-size:.58rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gris); font-weight:600; padding:.55rem .7rem; border-bottom:1px solid var(--card-border); text-align:left; }
    .rp-tabla td { font-size:.76rem; color:var(--blanco); padding:.65rem .7rem; border-bottom:1px solid rgba(255,255,255,.04); vertical-align:middle; }
    .rp-tabla tr:last-child td { border-bottom:none; }
    .tipo-badge { display:inline-block; padding:.12rem .45rem; border-radius:999px; font-size:.56rem; text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
    .tipo-punto_venta { background:rgba(80,200,120,.12); color:var(--verde); }
    .tipo-inmobiliaria { background:rgba(100,149,237,.12); color:#6495ed; }
    .tipo-particular { background:rgba(215,111,63,.12); color:var(--accent); }
    .tipo-evento { background:rgba(201,168,76,.12); color:var(--dorado); }
    .num { font-weight:700; }
    .bar-wrap { background:rgba(255,255,255,.05); border-radius:3px; height:3px; width:70px; display:inline-block; vertical-align:middle; margin-left:.4rem; }
    .bar-fill { height:3px; border-radius:3px; background:var(--accent); }
    .pct-conv { font-size:.68rem; color:var(--dorado); }

    /* Provincias */
    .prov-chips { display:flex; flex-wrap:wrap; gap:.5rem; }
    .prov-chip { background:rgba(255,255,255,.04); border:1px solid var(--card-border); border-radius:999px; padding:.3rem .8rem; font-size:.72rem; display:flex; align-items:center; gap:.45rem; }
    .prov-chip b { color:var(--accent); }

    .sp { width:24px; height:24px; border:2px solid rgba(255,255,255,.1); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; margin:3rem auto; display:block; }
    @keyframes spin{to{transform:rotate(360deg);}}
    .empty-msg { text-align:center; padding:2rem; color:var(--gris); font-size:.82rem; }
  </style>
</head>
<body>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  import { supabase } from '../js/config.js'

  const esc = s => !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  const fmt = iso => iso ? new Date(iso).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—'
  const TIPO = { punto_venta:'Punto de venta', inmobiliaria:'Inmobiliaria', particular:'Particular', evento:'Evento' }

  const { data: { session } } = await supabase.auth.getSession()
  if (!session) { location.href = 'login.html'; throw new Error('no session') }
if (session.user.user_metadata?.rol !== 'admin') { window.location.href = 'login.html'; throw new Error('not admin') }
  document.getElementById('btnLogout').addEventListener('click', async e => {
    e.preventDefault(); await supabase.auth.signOut(); location.href = 'login.html'
  })

  const campId = new URLSearchParams(location.search).get('id')
  const main = document.getElementById('mainContent')

  function estadoCampana(c) {
    const now = new Date(), ini = c.fecha_inicio ? new Date(c.fecha_inicio) : null, fin = c.fecha_fin ? new Date(c.fecha_fin) : null
    if (!c.activa) return 'finalizada'
    if (ini && ini > now) return 'programada'
    if (fin && fin < now) return 'finalizada'
    return 'activa'
  }

  if (!campId) {
    main.innerHTML = '<div class="empty-msg"><a href="campanas.html" style="color:var(--accent)">← Volver a campañas</a><br><br>No se especificó campaña.</div>'
  } else {
    await init()
  }

  async function init() {
    const { data: camp } = await supabase.from('campanas').select('*').eq('id', campId).maybeSingle()
    if (!camp) { main.innerHTML = '<div class="empty-msg">Campaña no encontrada. <a href="campanas.html" style="color:var(--accent)">← Volver</a></div>'; return }

    const { data: ccRows } = await supabase.from('campanas_canales').select('canal_id').eq('campana_id', campId)
    const canalIds = (ccRows||[]).map(r=>r.canal_id)
    const { data: canales } = canalIds.length ? await supabase.from('canales').select('*').in('id', canalIds) : { data: [] }
    const codigos = (canales||[]).map(c=>c.codigo).filter(Boolean)

    let scansPorCodigo = {}, leadsPorCodigo = {}
    codigos.forEach(c => { scansPorCodigo[c] = 0; leadsPorCodigo[c] = 0 })

    if (codigos.length) {
      let qV = supabase.from('visitas').select('canal_ref').in('canal_ref', codigos)
      let qL = supabase.from('contactos').select('canal_ref').in('canal_ref', codigos)
      if (camp.fecha_inicio) { qV = qV.gte('created_at', camp.fecha_inicio); qL = qL.gte('created_at', camp.fecha_inicio) }
      if (camp.fecha_fin)    { qV = qV.lte('created_at', camp.fecha_fin);    qL = qL.lte('created_at', camp.fecha_fin) }
      const [rV, rL] = await Promise.all([qV, qL])
      ;(rV.data||[]).forEach(v => { if (scansPorCodigo[v.canal_ref]!==undefined) scansPorCodigo[v.canal_ref]++ })
      ;(rL.data||[]).forEach(l => { if (leadsPorCodigo[l.canal_ref]!==undefined) leadsPorCodigo[l.canal_ref]++ })
    }

    const totalScans  = Object.values(scansPorCodigo).reduce((a,b)=>a+b,0)
    const totalLeads  = Object.values(leadsPorCodigo).reduce((a,b)=>a+b,0)
    const maxScans    = Math.max(1, ...Object.values(scansPorCodigo))
    const est         = estadoCampana(camp)
    const estLabel    = est==='activa'?'Activa':est==='programada'?'Programada':'Finalizada'
    const conv        = totalScans > 0 ? ((totalLeads/totalScans)*100).toFixed(1) : 0
    const ciudades    = new Set((canales||[]).map(c=>c.ciudad).filter(Boolean)).size
    const provincias  = new Set((canales||[]).map(c=>c.provincia).filter(Boolean)).size
    const linkPublico = `${location.origin}/reporte.html?campana=${campId}`

    // ── Provincias ──
    const porProv = {}
    ;(canales||[]).forEach(c => {
      if (!c.provincia) return
      if (!porProv[c.provincia]) porProv[c.provincia] = { canales:0, scans:0 }
      porProv[c.provincia].canales++
      porProv[c.provincia].scans += scansPorCodigo[c.codigo]||0
    })
    const provHtml = Object.entries(porProv).sort((a,b)=>b[1].scans-a[1].scans)
      .map(([p,d])=>`<div class="prov-chip"><b>${d.scans}</b><span>${esc(p)} · ${d.canales} punto${d.canales!==1?'s':''}</span></div>`).join('') ||
      '<span style="color:var(--gris);font-size:.8rem;">Sin datos</span>'

    // ── Tabla canales ──
    const tablaHtml = [...(canales||[])].sort((a,b)=>(scansPorCodigo[b.codigo]||0)-(scansPorCodigo[a.codigo]||0)).map(c => {
      const sc = scansPorCodigo[c.codigo]||0
      const ld = leadsPorCodigo[c.codigo]||0
      const pct = Math.round((sc/maxScans)*100)
      const cv = sc>0 ? ((ld/sc)*100).toFixed(0)+'%' : '—'
      return `<tr>
        <td><span style="font-weight:500">${esc(c.nombre)}</span><span style="font-family:monospace;font-size:.63rem;color:var(--accent);display:block">${esc(c.codigo)}</span></td>
        <td><span class="tipo-badge tipo-${esc(c.tipo)}">${esc(TIPO[c.tipo]||c.tipo)}</span></td>
        <td style="font-size:.7rem;color:var(--gris)">${[c.ciudad,c.provincia].filter(Boolean).map(esc).join(', ')||'—'}</td>
        <td><span class="num">${sc}</span><span class="bar-wrap"><span class="bar-fill" style="width:${pct}%"></span></span></td>
        <td><span class="num" style="color:var(--dorado)">${ld}</span></td>
        <td><span class="pct-conv">${cv}</span></td>
      </tr>`
    }).join('') || `<tr><td colspan="6" class="empty-msg">Sin canales asignados.</td></tr>`

    main.innerHTML = `
      <a href="campanas.html" class="rp-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Volver a campañas
      </a>

      <div class="rp-hero">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;">
          <div>
            <h2 class="rp-nombre">${esc(camp.nombre)}</h2>
            ${camp.descripcion ? `<p class="rp-desc">${esc(camp.descripcion)}</p>` : ''}
            <div class="rp-meta">
              <div class="rp-meta-item"><strong>${fmt(camp.fecha_inicio)||'Inmediato'}</strong>Inicio</div>
              <div class="rp-meta-item"><strong>${camp.fecha_fin?fmt(camp.fecha_fin):'Sin vencimiento'}</strong>Fin</div>
              <div class="rp-meta-item"><strong style="font-family:monospace;font-size:.72rem">${esc(camp.url_destino)}</strong>Destino</div>
            </div>
          </div>
          <span class="estado-pill estado-${est}"><span class="estado-dot"></span>${estLabel}</span>
        </div>
        <div class="rp-acciones">
          <button class="btn-acc share" onclick="compartir()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            Compartir reporte
          </button>
          <a href="${linkPublico}" target="_blank" class="btn-acc secondary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Ver como desarrollador
          </a>
          <a href="campanas.html" class="btn-acc secondary">Gestionar canales</a>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi"><div class="kpi-n accent">${totalScans.toLocaleString('es-AR')}</div><div class="kpi-label">Scans QR</div></div>
        <div class="kpi"><div class="kpi-n dorado">${totalLeads}</div><div class="kpi-label">Consultas</div></div>
        <div class="kpi"><div class="kpi-n verde">${(canales||[]).length}</div><div class="kpi-label">Puntos activos</div></div>
        <div class="kpi"><div class="kpi-n">${ciudades}</div><div class="kpi-label">Ciudades</div></div>
        <div class="kpi"><div class="kpi-n">${provincias}</div><div class="kpi-label">Provincias</div></div>
        <div class="kpi"><div class="kpi-n" style="font-size:1.5rem;">${conv}%</div><div class="kpi-label">Conversión</div></div>
      </div>

      <div class="seccion">
        <div class="sec-titulo">Cobertura geográfica</div>
        <div id="mapaAdmin"></div>
      </div>

      <div class="seccion">
        <div class="sec-titulo">Provincias alcanzadas</div>
        <div class="prov-chips">${provHtml}</div>
      </div>

      <div class="seccion">
        <div class="sec-titulo">Rendimiento por canal</div>
        <div style="overflow-x:auto;">
          <table class="rp-tabla">
            <thead><tr>
              <th>Canal</th><th>Tipo</th><th>Ubicación</th>
              <th>Scans</th><th>Consultas</th><th>Conversión</th>
            </tr></thead>
            <tbody>${tablaHtml}</tbody>
          </table>
        </div>
      </div>
    `

    // ── Mapa ──
    const conCoords = (canales||[]).filter(c=>c.latitud&&c.longitud)
    const centro = conCoords.length
      ? [conCoords.reduce((s,c)=>s+c.latitud,0)/conCoords.length, conCoords.reduce((s,c)=>s+c.longitud,0)/conCoords.length]
      : [-40.5,-68.5]
    const mapa = L.map('mapaAdmin').setView(centro, conCoords.length>1?6:9)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19}).addTo(mapa)
    conCoords.forEach(c => {
      const sc = scansPorCodigo[c.codigo]||0
      const icon = L.divIcon({ className:'', html:`<div style="width:${sc>0?16:10}px;height:${sc>0?16:10}px;background:${sc>0?'#d76f3f':'#555'};border:2px solid ${sc>0?'rgba(215,111,63,.4)':'rgba(255,255,255,.2)'};border-radius:50%;"></div>`, iconSize:[20,20], iconAnchor:[10,10] })
      L.marker([c.latitud,c.longitud],{icon}).bindPopup(`<b style="color:#f5f3f0">${c.nombre}</b><br><span style="color:#888;font-size:11px">${[c.ciudad,c.provincia].filter(Boolean).join(', ')}</span><br><span style="color:#d76f3f;font-weight:700">${sc} scans</span>`).addTo(mapa)
    })
    if (conCoords.length>1) mapa.fitBounds(L.latLngBounds(conCoords.map(c=>[c.latitud,c.longitud])),{padding:[40,40]})

    // ── Compartir ──
    window.compartir = function() {
      navigator.clipboard.writeText(linkPublico)
        .then(() => alert('Link copiado al portapapeles:\n' + linkPublico))
        .catch(() => prompt('Copiá este link para compartir:', linkPublico))
    }
  }
</script>
</body>
</html>
