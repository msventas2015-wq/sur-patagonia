<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyecto — Sur Patagonian</title>
  <link rel="apple-touch-icon" href="/assets/app-icon-180.png" />
  <meta property="og:site_name" content="Sur Patagonian" />
  <meta property="og:image" content="https://surpatagonian.com/assets/og-image.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Serif+Display:ital@0;1&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&family=Raleway:wght@300;400;500&family=Josefin+Sans:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* ══ RESET & BASE ═══════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Paleta por defecto: Clásico */
      --bg:         #080808;
      --surface:    #111111;
      --gold:       #c9a84c;
      --gold2:      #e2c87a;
      --text:       #f0ede8;
      --muted:      #888880;
      --line:       rgba(255,255,255,0.08);
      /* Tipografías por defecto */
      --font-serif: Inter, system-ui, sans-serif;
      --font-sans:  'Montserrat', sans-serif;
    }
    /* Las paletas y fuentes se aplican vía JS inline style en :root — no necesitamos clases CSS */
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-weight: 300;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ══ FONDO TEXTURA ══════════════════════════════════════════════════ */
    #bgTextura {
      position: fixed; inset: 0; z-index: 0;
      overflow: hidden; pointer-events: none;
    }
    #bgTextura::before {
      content: '';
      position: absolute;
      top: -30%; left: -30%;
      width: 160%; height: 160%;
      background-image: var(--bg-foto, none);
      background-size: cover;
      background-position: center;
      opacity: var(--bg-opacidad, 0);
      filter: grayscale(100%) contrast(1.15) brightness(0.55);
    }
    /* Todo el contenido sobre la textura */
    #loading, #lightbox, #nav,
    #hero, #atmosfera, #presentacion, #plano,
    #disponibilidad, #galeria, #info,
    #ubicacion, #contacto, #representantes, footer {
      position: relative; z-index: 1;
    }

    /* ══ LOADING ════════════════════════════════════════════════════════ */
    #loading {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.7s;
    }
    #loading.fade { opacity: 0; pointer-events: none; }
    .loading-bar {
      width: 72px; height: 1px; background: rgba(255,255,255,.15); overflow: hidden;
    }
    .loading-fill {
      height: 100%; background: rgba(255,255,255,.65);
      animation: loadFill 1.4s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) { .loading-fill { animation: none; width: 100%; } }
    @keyframes loadFill {
      0%   { width: 0; margin-left: 0; }
      50%  { width: 100%; margin-left: 0; }
      100% { width: 0; margin-left: 100%; }
    }

    /* ══ NAV ════════════════════════════════════════════════════════════ */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.8rem 4rem;
      display: flex; align-items: center; justify-content: space-between;
      transition: background 0.4s, padding 0.4s, backdrop-filter 0.4s;
    }
    #nav.scrolled {
      background: var(--overlay-nav);
      backdrop-filter: blur(14px);
      padding: 1rem 4rem;
      border-bottom: 1px solid var(--line);
    }
    .nav-brand {
      display: flex; flex-direction: column; gap: 0.05rem; line-height: 1.15;
      text-decoration: none;
    }
    .nav-brand-nombre {
      font-family: var(--font-serif);
      font-size: clamp(0.85rem, 1.6vw, 1.1rem);
      font-weight: 400; letter-spacing: 0.22em;
      transition: color 0.3s;
    }
    .nav-brand:hover .nav-brand-nombre { color: var(--gold); }
    .nav-brand-by {
      font-size: 0.58rem; letter-spacing: 0.5em; text-transform: uppercase;
      margin-top: 0.35rem; transition: color 0.3s;
    }
    .nav-brand-by span { color: var(--gold); opacity: 0.85; }
    .nav-links { display: flex; align-items: center; gap: 2.5rem; }
    .nav-link {
      font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
      transition: color 0.3s;
    }
    .nav-link:hover { color: var(--gold); }
    .nav-cta {
      font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 0.55rem 1.4rem; transition: background 0.3s, border-color 0.3s, color 0.3s;
      border: 1px solid rgba(255,255,255,0.35);
    }
    .nav-cta:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.6); }

    /* Nav transparente (sobre foto): siempre texto blanco */
    #nav:not(.scrolled) .nav-brand-nombre { color: rgba(255,255,255,0.95); }
    #nav:not(.scrolled) .nav-brand-by     { color: rgba(255,255,255,0.45); }
    #nav:not(.scrolled) .nav-link         { color: rgba(255,255,255,0.65); }
    #nav:not(.scrolled) .nav-cta          { color: rgba(255,255,255,0.9); }

    /* Nav scrolleado: texto sigue la paleta elegida */
    #nav.scrolled .nav-brand-nombre { color: var(--text); }
    #nav.scrolled .nav-brand-by     { color: var(--muted); }
    #nav.scrolled .nav-link         { color: var(--muted); }
    #nav.scrolled .nav-cta          { color: var(--gold); border-color: var(--line); }
    @media (max-width: 768px) {
      #nav, #nav.scrolled { padding: 1.1rem 1.5rem; }
      .nav-link { display: none; }
    }

    /* ══ HERO — VIDEO / FOTO ══════════════════════════════════════════ */
    #hero {
      position: relative; height: 100vh; min-height: 600px;
      overflow: hidden; display: flex; align-items: flex-end;
    }
    .hero-video-wrap {
      position: absolute; inset: 0; overflow: hidden; background: var(--bg);
    }
    .hero-video-wrap iframe {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: max(177.78vh, 100vw);
      height: max(56.25vw, 100vh);
      pointer-events: none;
    }
    .hero-foto {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
    }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(8,8,8,0.2) 0%,
        rgba(8,8,8,0.05) 35%,
        rgba(8,8,8,0.6) 70%,
        rgba(8,8,8,0.95) 100%
      );
    }
    .hero-content {
      position: relative; z-index: 2;
      padding: 0 5vw 5.5rem; width: 100%;
    }
    .hero-eyebrow {
      font-size: var(--el-size-hero-eyebrow, 0.58rem); letter-spacing: 0.45em; text-transform: uppercase;
      color: var(--el-color-hero-eyebrow, var(--color-acento, var(--gold))); margin-bottom: 1.2rem;
      text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    }
    .hero-title {
      font-family: var(--font-serif);
      font-size: var(--el-size-hero-titulo, clamp(3.8rem, 7.5vw, 7rem));
      font-weight: 400; line-height: 0.95; color: var(--el-color-hero-titulo, var(--color-titulo, var(--text)));
      margin-bottom: 1rem;
      text-shadow: 0 2px 20px rgba(0,0,0,0.25);
    }
    .hero-title em { font-style: italic; color: var(--el-em-color-hero-titulo, var(--color-acento, var(--gold))); }
    .hero-tagline {
      font-size: var(--el-size-hero-tagline, 0.78rem); letter-spacing: 0.06em;
      color: var(--el-color-hero-tagline, var(--color-texto, var(--muted))); margin-bottom: 3rem; max-width: 440px;
    }
    .hero-stats { display: flex; gap: 3rem; flex-wrap: wrap; }
    .hero-stat-val {
      font-family: var(--font-serif);
      font-size: 1.7rem; font-weight: 300; color: var(--color-acento, var(--gold)); line-height: 1;
    }
    .hero-stat-label {
      font-size: 0.57rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); margin-top: 0.35rem;
    }
    .hero-scroll {
      position: absolute; right: 3rem; bottom: 4.5rem; z-index: 2;
      display: flex; flex-direction: column; align-items: center; gap: 0.7rem;
    }
    .hero-scroll span {
      font-size: 0.52rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--muted); writing-mode: vertical-rl;
    }
    .hero-scroll-line {
      width: 1px; height: 46px; background: var(--gold); opacity: 0.4;
      animation: scrollLine 1.8s ease-in-out infinite;
    }
    @keyframes scrollLine {
      0%   { transform: scaleY(0); transform-origin: top; }
      50%  { transform: scaleY(1); transform-origin: top; }
      51%  { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }
    @media (max-width: 768px) {
      .hero-content { padding: 0 1.5rem 4rem; }
      .hero-scroll { display: none; }
    }

    /* ══ PRESENTACIÓN ══════════════════════════════════════════════════ */
    #presentacion {
      padding: 8rem 5vw 7rem;
      display: grid; grid-template-columns: 55% 45%; gap: 5rem;
      align-items: start; max-width: 1260px; margin: 0 auto;
    }
    .pres-left {
      position: relative; padding-left: 2rem;
      border-left: 1px solid rgba(201,168,76,0.22);
    }
    .pres-eyebrow {
      font-size: var(--el-size-pres-eyebrow, 0.58rem); letter-spacing: 0.45em; text-transform: uppercase;
      color: var(--el-color-pres-eyebrow, var(--color-acento, var(--gold))); margin-bottom: 1.8rem;
    }
    .pres-titulo {
      font-family: var(--font-serif);
      font-size: var(--el-size-pres-titulo, clamp(2.6rem, 4.5vw, 4rem));
      font-weight: 300; line-height: 1.08; color: var(--el-color-pres-titulo, var(--color-titulo, var(--text)));
    }
    .pres-titulo em { font-style: italic; color: var(--el-em-color-pres-titulo, var(--color-acento, var(--gold))); }
    .pres-linea {
      width: 40px; height: 1px; background: var(--color-acento, var(--gold)); margin: 2.2rem 0;
    }
    .pres-desc {
      font-size: var(--el-size-pres-desc, 0.88rem); line-height: 2.05;
      color: var(--el-color-pres-desc, var(--color-cuerpo, var(--muted)));
    }
    .pres-right { padding-top: 0; }

    /* Ilustración SVG lote */
    .pres-lote-wrap {
      border: 1px solid var(--line);
      overflow: hidden; background: #050505;
      margin-bottom: 0;
    }
    .pres-lote-caption {
      padding: 0.8rem 1.2rem;
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--line);
      font-size: 0.58rem; letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--muted);
    }
    .pres-lote-caption span { color: var(--color-acento, var(--gold)); }

    @media (max-width: 900px) {
      #presentacion { grid-template-columns: 1fr; gap: 3.5rem; padding: 5rem 5vw; }
      .pres-left { padding-left: 1.2rem; }
    }

    /* ══ PLANO ══════════════════════════════════════════════════════════ */
    #plano { background: var(--surface); border-top: 1px solid var(--line); }
    .plano-header {
      padding: 3rem 5vw 1.5rem;
      display: flex; align-items: center; justify-content: space-between; gap: 2rem;
      flex-wrap: wrap; max-width: 900px; margin: 0 auto;
    }
    .plano-eyebrow {
      font-size: var(--el-size-plano-eyebrow, 0.58rem); letter-spacing: 0.45em; text-transform: uppercase;
      color: var(--el-color-plano-eyebrow, var(--color-acento, var(--gold))); margin-bottom: 0.5rem;
    }
    .plano-titulo {
      font-family: var(--font-serif);
      font-size: var(--el-size-plano-titulo, clamp(1.2rem, 2vw, 1.8rem)); font-weight: 300; color: var(--el-color-plano-titulo, var(--color-titulo, var(--text)));
    }
    .plano-titulo em { font-style: italic; color: var(--el-em-color-plano-titulo, var(--color-acento, var(--gold))); }
    .plano-legend { display: flex; gap: 1.2rem; flex-wrap: wrap; }
    .plano-leg {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    }
    .leg-dot { width: 7px; height: 7px; border-radius: 50%; }
    .leg-disp { background: #4cc982; }
    .leg-res  { background: var(--gold); }
    .leg-vend { background: #c94c4c; }

    /* Imagen del plano — contenida y centrada */
    .plano-img-wrap {
      position: relative; cursor: zoom-in;
      background: #0d0d0d;
      max-width: 900px; margin: 0 auto;
    }
    .plano-img-wrap img {
      width: 100%; height: auto; display: block;
      transition: transform 0.5s ease;
    }
    .plano-img-wrap:hover img { transform: scale(1.01); }
    .plano-watermark {
      position: absolute; bottom: 1.5rem; left: 2rem;
      font-family: var(--font-serif);
      font-size: clamp(0.8rem, 2vw, 1.4rem); font-weight: 300;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: rgba(201,168,76,0.35);
      pointer-events: none; user-select: none;
    }
    .plano-hint {
      padding: 0.7rem 5vw 2rem;
      font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); max-width: 900px; margin: 0 auto;
    }
    .plano-hint span { color: var(--color-acento, var(--gold)); }

    /* ══ LIGHTBOX ════════════════════════════════════════════════════ */
    #lightbox {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.96); align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 88vw; max-height: 90vh; object-fit: contain; cursor: default; }
    .lb-close {
      position: absolute; top: 1.5rem; right: 2rem;
      font-size: 1.4rem; color: var(--muted); cursor: pointer;
      background: none; border: none; transition: color 0.2s;
    }
    .lb-close:hover { color: var(--gold); }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.5); font-size: 2.2rem; line-height: 1;
      padding: 1rem 1.4rem; transition: color 0.2s;
      user-select: none;
    }
    .lb-nav:hover { color: #fff; }
    .lb-prev { left: 0; }
    .lb-next { right: 0; }
    .lb-counter {
      position: absolute; bottom: 1.4rem; left: 50%; transform: translateX(-50%);
      font-size: 0.65rem; letter-spacing: 0.2em; color: rgba(255,255,255,0.35);
      font-family: 'Montserrat', sans-serif;
    }
    .lb-nav.hidden { opacity: 0; pointer-events: none; }

    /* ══ DISPONIBILIDAD ════════════════════════════════════════════════ */
    #disponibilidad { padding: 7rem 5vw; border-top: 1px solid var(--line); }
    .disp-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 3rem; gap: 1.5rem; flex-wrap: wrap;
    }
    .disp-eyebrow {
      font-size: var(--el-size-disp-eyebrow, 0.58rem); letter-spacing: 0.45em; text-transform: uppercase;
      color: var(--el-color-disp-eyebrow, var(--color-acento, var(--gold))); margin-bottom: 0.8rem;
    }
    .disp-titulo {
      font-family: var(--font-serif);
      font-size: var(--el-size-disp-titulo, clamp(1.7rem, 3vw, 2.6rem)); font-weight: 300; color: var(--el-color-disp-titulo, var(--color-titulo, var(--text)));
    }
    .disp-filtros { display: flex; gap: 0.4rem; }
    .disp-filtro {
      font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.4rem 1rem; border: 1px solid var(--line);
      background: none; color: var(--muted); cursor: pointer; transition: all 0.2s;
    }
    .disp-filtro.activo, .disp-filtro:hover { border-color: var(--gold); color: var(--gold); }
    .disp-tabla-wrap { overflow-x: auto; }
    .disp-tabla { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .disp-tabla th {
      text-align: left; padding: 0.75rem 1.2rem;
      font-size: 0.59rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--color-acento, var(--gold)); border-bottom: 1px solid var(--line);
    }
    .disp-tabla td {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--line); color: var(--muted);
    }
    .disp-tabla tr:hover td { background: rgba(255,255,255,0.02); }
    .lote-num { color: var(--text) !important; font-weight: 400; }
    .lote-precio { color: var(--text) !important; }
    .badge {
      display: inline-block; padding: 0.22rem 0.7rem;
      font-size: 0.59rem; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .badge-disponible { background: rgba(76,201,130,0.12); color: #4cc982; }
    .badge-reservado  { background: rgba(201,168,76,0.12); color: var(--gold); }
    .badge-vendido    { background: rgba(201,76,76,0.12);  color: #c94c4c; }
    .disp-empty { padding: 3rem; text-align: center; color: var(--muted); font-size: 0.8rem; }
    .lote-cta {
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--gold); border-bottom: 1px solid rgba(201,168,76,0.3);
    }

    /* ══ INFO + SERVICIOS ══════════════════════════════════════════════ */
    #info {
      padding: 7rem 5vw;
      background: var(--surface); border-top: 1px solid var(--line);
    }
    .info-wrap {
      display: grid; grid-template-columns: 1fr 1fr; gap: 5rem 7rem;
      max-width: 1100px; margin: 0 auto;
    }
    .info-col-label {
      font-size: 0.58rem; letter-spacing: 0.45em; text-transform: uppercase;
      color: var(--color-acento, var(--gold)); margin-bottom: 2.5rem; padding-bottom: 1rem;
      border-bottom: 1px solid var(--line);
    }
    .info-item { display: flex; gap: 1.2rem; margin-bottom: 2rem; align-items: flex-start; }
    .info-icon {
      flex-shrink: 0; width: 34px; height: 34px;
      border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    }
    .info-icon svg { width: 15px; height: 15px; stroke: var(--gold); fill: none; stroke-width: 1.4; }
    .info-lbl {
      font-size: 0.59rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.35rem;
    }
    .info-val { font-size: 0.84rem; color: var(--text); line-height: 1.6; }

    /* Chips servicios */
    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chip {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.45rem 0.9rem; border: 1px solid var(--line);
      font-size: 0.64rem; color: var(--muted);
    }
    .chip svg { width: 11px; height: 11px; stroke: var(--gold); fill: none; stroke-width: 1.5; flex-shrink: 0; }

    @media (max-width: 900px) {
      .info-wrap { grid-template-columns: 1fr; gap: 3.5rem; }
    }

    /* ══ GALERÍA ════════════════════════════════════════════════════════ */
    #galeria { padding: 7rem 5vw; border-top: 1px solid var(--line); }
    .gal-head { margin-bottom: 3.5rem; }
    .gal-eyebrow {
      font-size: var(--el-size-gal-eyebrow, 0.58rem); letter-spacing: 0.45em; text-transform: uppercase;
      color: var(--el-color-gal-eyebrow, var(--color-acento, var(--gold))); margin-bottom: 0.8rem;
    }
    .gal-titulo {
      font-family: var(--font-serif);
      font-size: var(--el-size-gal-titulo, clamp(1.9rem, 3.5vw, 3rem)); font-weight: 300; color: var(--el-color-gal-titulo, var(--color-titulo, var(--text)));
    }
    .gal-titulo em { font-style: italic; color: var(--el-em-color-gal-titulo, var(--color-acento, var(--gold))); }
    .gal-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 230px;
      gap: 3px;
    }
    .gal-item { overflow: hidden; cursor: pointer; }
    .gal-item img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.65s ease, filter 0.4s;
      filter: brightness(0.9);
    }

function ytId(url) {
  if (!url) return null
  const m = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/)
  return m ? m[1] : null
}

function buildLoteSVG(p) {
  const gold = '#c9a84c'
  const sup   = p.sup_min_m2 ? Math.round(Number(p.sup_min_m2)) : null
  const supMax = p.sup_max_m2 ? Math.round(Number(p.sup_max_m2)) : null
  const supTxt = sup
    ? (supMax && Number(supMax) > Number(sup)
        ? `${Number(sup).toLocaleString()} – ${Number(supMax).toLocaleString()} m²`
        : `desde ${Number(sup).toLocaleString()} m²`)
    : null

  // Polígono de 5 vértices — más rectangular, techo recto, leve irregularidad
  // Top: línea recta (misma Y=46). Lados ligeramente inclinados. Sin "techo de casa".
  const V = [[52,234],[308,247],[320,46],[60,46],[36,140]]
  const pts = V.map(v => v.join(',')).join(' ')

  // Marcadores de vértice (cruces de agrimensura)
  const markers = V.map(([x,y]) => `
    <line x1="${x-7}" y1="${y}" x2="${x+7}" y2="${y}" stroke="${gold}" stroke-width="0.7" opacity="0.55"/>
    <line x1="${x}" y1="${y-7}" x2="${x}" y2="${y+7}" stroke="${gold}" stroke-width="0.7" opacity="0.55"/>
    <circle cx="${x}" cy="${y}" r="1.8" fill="${gold}" opacity="0.4"/>`
  ).join('')

  // Líneas de cota decorativas (lado inferior y lado derecho)
  const [ax,ay] = V[0], [bx,by] = V[1]
  const [cx2,cy2] = V[1], [dx,dy] = V[2]
  const bmy = Math.max(ay, by) + 13
  const rmx = Math.max(cx2, dx) + 14

  const dimLines = `
    <line x1="${ax}" y1="${bmy}" x2="${bx}" y2="${bmy}" stroke="${gold}" stroke-width="0.5" opacity="0.25"/>
    <line x1="${ax}" y1="${bmy-6}" x2="${ax}" y2="${bmy+6}" stroke="${gold}" stroke-width="0.5" opacity="0.25"/>
    <line x1="${bx}" y1="${bmy-6}" x2="${bx}" y2="${bmy+6}" stroke="${gold}" stroke-width="0.5" opacity="0.25"/>
    <line x1="${rmx}" y1="${cy2}" x2="${rmx}" y2="${dy}" stroke="${gold}" stroke-width="0.5" opacity="0.25"/>
    <line x1="${rmx-6}" y1="${cy2}" x2="${rmx+6}" y2="${cy2}" stroke="${gold}" stroke-width="0.5" opacity="0.25"/>
    <line x1="${rmx-6}" y1="${dy}" x2="${rmx+6}" y2="${dy}" stroke="${gold}" stroke-width="0.5" opacity="0.25"/>`

  // Flecha de norte
  const north = `<g transform="translate(338,66)">
    <circle r="14" fill="none" stroke="${gold}" stroke-width="0.5" opacity="0.28"/>
    <line x1="0" y1="11" x2="0" y2="-11" stroke="${gold}" stroke-width="0.9" opacity="0.6"/>
    <polygon points="0,-13 -3.5,-4 3.5,-4" fill="${gold}" opacity="0.75"/>
    <text y="22" text-anchor="middle" font-family="'Courier New',monospace" font-size="7"
      fill="${gold}" opacity="0.5" letter-spacing="1">N</text>
  </g>`

  // Texto central
  const cx3 = 178, cy3 = 148
  const centerTxt = `
    <text x="${cx3}" y="${cy3-12}" text-anchor="middle"
      font-family="'Courier New',monospace" font-size="6.5" fill="${gold}" opacity="0.4" letter-spacing="3.5">LOTE ILUSTRATIVO</text>
    <line x1="${cx3-26}" y1="${cy3-5}" x2="${cx3+26}" y2="${cy3-5}"
      stroke="${gold}" stroke-width="0.4" opacity="0.18"/>
    ${supTxt ? `<text x="${cx3}" y="${cy3+14}" text-anchor="middle"
      font-family="'Courier New',monospace" font-size="12.5"
      fill="rgba(240,237,232,0.7)" letter-spacing="0.5">Superficie ${supTxt}</text>` : ''}`

  return `<svg viewBox="0 0 380 290" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;">
    <defs>
      <pattern id="lot-grid" width="22" height="22" patternUnits="userSpaceOnUse">
        <path d="M22 0L0 0 0 22" fill="none" stroke="${gold}" stroke-width="0.3" opacity="0.13"/>
      </pattern>
    </defs>
    <rect width="380" height="290" fill="#040404"/>
    <rect width="380" height="290" fill="url(#lot-grid)"/>
    <rect x="7" y="7" width="366" height="276" fill="none" stroke="${gold}" stroke-width="0.6" opacity="0.16"/>

    <text x="18" y="27" font-family="'Courier New',monospace" font-size="6.5"

}

function applyTema(tema) {
  let t = { paleta: 'clasico', titulo: 'inter', cuerpo: 'montserrat' }
  if (tema) {
    try { t = JSON.parse(tema) } catch(e) { t.paleta = tema } // fallback formato antiguo
  }
  const root = document.documentElement
  const pal = PALETAS[t.paleta] || PALETAS.clasico
  for (const [k, v] of Object.entries(pal)) root.style.setProperty(k, v)
  root.style.setProperty('--font-serif', FUENTES_TITULO[t.titulo] || FUENTES_TITULO.inter)
  root.style.setProperty('--font-sans',  FUENTES_CUERPO[t.cuerpo]  || FUENTES_CUERPO.montserrat)
  // Overlays adaptativos según el color de fondo
  const bgHex = (pal['--bg'] || '#080808').replace('#', '')
  const r = parseInt(bgHex.slice(0,2), 16)
  const g = parseInt(bgHex.slice(2,4), 16)
  const b = parseInt(bgHex.slice(4,6), 16)
  const rgb = `${r},${g},${b}`
  // Los velos del hero y atmósfera son FIJOS (oscuros sutiles, en CSS):
  // nunca se recolorean con la paleta para no lavar el video/foto.
  root.style.setProperty('--overlay-nav',  `rgba(${rgb},0.93)`)
  // Colores personalizados (si se guardaron en el tema)
  if (t.colorTitulo)  root.style.setProperty('--color-titulo',  t.colorTitulo)
  else                root.style.removeProperty('--color-titulo')
  if (t.colorAccento) root.style.setProperty('--color-acento', t.colorAccento)
  else                root.style.removeProperty('--color-acento')
  if (t.colorTexto)   root.style.setProperty('--color-texto',  t.colorTexto)
  else                root.style.removeProperty('--color-texto')
  if (t.colorCuerpo)  root.style.setProperty('--color-cuerpo', t.colorCuerpo)
  else                root.style.removeProperty('--color-cuerpo')

  // ── Overrides por elemento individual ────────────────────────────────
  const EL_SIZE = {
    'hero-eyebrow':  { xs:'0.44rem', s:'0.52rem', l:'0.68rem', xl:'0.82rem' },
    'hero-titulo':   { xs:'clamp(2.8rem,5.5vw,5.2rem)', s:'clamp(3.3rem,6.5vw,6rem)', l:'clamp(4.5rem,8.5vw,8rem)', xl:'clamp(5.2rem,10vw,9.5rem)' },
    'hero-tagline':  { xs:'0.62rem', s:'0.7rem', l:'0.9rem', xl:'1.05rem' },
    'pres-eyebrow':  { xs:'0.44rem', s:'0.52rem', l:'0.68rem', xl:'0.82rem' },
    'pres-titulo':   { xs:'clamp(1.9rem,3.5vw,3rem)', s:'clamp(2.2rem,4vw,3.5rem)', l:'clamp(3rem,5.2vw,4.7rem)', xl:'clamp(3.5rem,6vw,5.5rem)' },
    'pres-desc':     { xs:'0.72rem', s:'0.8rem', l:'1rem', xl:'1.1rem' },
    'plano-eyebrow': { xs:'0.44rem', s:'0.52rem', l:'0.68rem', xl:'0.82rem' },
    'plano-titulo':  { xs:'clamp(0.9rem,1.5vw,1.3rem)', s:'clamp(1rem,1.7vw,1.5rem)', l:'clamp(1.4rem,2.4vw,2.1rem)', xl:'clamp(1.7rem,2.8vw,2.5rem)' },
    'disp-eyebrow':  { xs:'0.44rem', s:'0.52rem', l:'0.68rem', xl:'0.82rem' },
    'disp-titulo':   { xs:'clamp(1.2rem,2.3vw,1.9rem)', s:'clamp(1.4rem,2.5vw,2.2rem)', l:'clamp(2rem,3.5vw,3rem)', xl:'clamp(2.4rem,4vw,3.5rem)' },
    'gal-eyebrow':   { xs:'0.44rem', s:'0.52rem', l:'0.68rem', xl:'0.82rem' },
    'gal-titulo':    { xs:'clamp(1.4rem,2.5vw,2.2rem)', s:'clamp(1.6rem,3vw,2.6rem)', l:'clamp(2.2rem,4vw,3.5rem)', xl:'clamp(2.6rem,4.8vw,4.2rem)' },
    'cta-eyebrow':   { xs:'0.44rem', s:'0.52rem', l:'0.68rem', xl:'0.82rem' },
    'cta-titulo':    { xs:'clamp(2rem,4vw,3.6rem)', s:'clamp(2.4rem,4.8vw,4.3rem)', l:'clamp(3.3rem,6.5vw,5.9rem)', xl:'clamp(3.9rem,7.5vw,6.8rem)' },
    'cta-sub':       { xs:'0.65rem', s:'0.74rem', l:'0.95rem', xl:'1.06rem' },
    'atm-quote':     { xs:'clamp(1.1rem,2vw,2rem)', s:'clamp(1.4rem,2.6vw,2.5rem)', l:'clamp(2.2rem,4vw,3.8rem)', xl:'clamp(2.8rem,5vw,4.8rem)' },
  }
  // Limpiar todos los overrides primero
  for (const elId of Object.keys(EL_SIZE)) {
    root.style.removeProperty(`--el-color-${elId}`)
    root.style.removeProperty(`--el-em-color-${elId}`)
    root.style.removeProperty(`--el-size-${elId}`)
  }
  // Aplicar overrides guardados
  if (t.elementos) {
    for (const [elId, cfg] of Object.entries(t.elementos)) {
      if (cfg.color)   root.style.setProperty(`--el-color-${elId}`,    cfg.color)
      if (cfg.emColor) root.style.setProperty(`--el-em-color-${elId}`, cfg.emColor)
      if (cfg.size && cfg.size !== 'm' && EL_SIZE[elId] && EL_SIZE[elId][cfg.size]) {
        root.style.setProperty(`--el-size-${elId}`, EL_SIZE[elId][cfg.size])
      }
    }
  }
}

async function init() {
  if (!slug) { $('loading').classList.add('fade'); return }


  // Recuperar el tema del proyecto; el indicador de carga permanece neutro
  try {
    const temaCache = localStorage.getItem('tema_' + slug)
    if (temaCache) applyTema(temaCache)
  } catch(e) {}

  let p
  try {
    const servicios = await cargarServiciosDelProyecto()
    ;({supabase, getRef, registrarVisita, enviarContactoSeguro} = servicios)
    const camposPublicos = [
      'id,nombre,slug,categoria,tipo_propiedad,tagline,descripcion,provincia,ciudad,descripcion_ubicacion,distancia_km,tipo_acceso,acceso_desc,latitud,longitud',
      'hectareas_total,cantidad_lotes,sup_min_m2,sup_max_m2,zonificacion,altura_max,fos,reglamento_obs,servicios,fecha_entrega,cronograma',
      'precio_desde,precio_hasta,monto_reserva,condiciones_venta,financiacion,tema,foto_portada,fotos,foto_atmosfera,foto_fondo,opacidad_fondo',
      'video_url,masterplan_url,brochure_url,mapa_imagen_url,mapa_zonas,mapa_pin_estilo,mapa_activo,plano_activo,rep_activo,representantes',
      'contacto_nombre,contacto_whatsapp,contacto_email'
    ].join(',')
    let respuesta = await supabase.from('proyectos_publicos_v1').select(camposPublicos).eq('slug',slug).maybeSingle()
    if (!respuesta.error && !respuesta.data && supabase.auth) {
      const {data} = await supabase.auth.getSession()
      if (data?.session?.user?.app_metadata?.rol === 'admin') {
        // «Ver miniweb» del admin también abre sus borradores. La tabla conserva su RLS.
        respuesta = await supabase.from('proyectos').select(camposPublicos).eq('slug',slug).maybeSingle()
      }
    }
    if (respuesta.error) throw respuesta.error
    p = respuesta.data
  } catch {
    mostrarEntradaProyecto(true)
    return
  }
  if (!p) {
    mostrarEntradaProyecto(false)
    return
  }

  applyTema(p.tema)
  try { if (p.tema) localStorage.setItem('tema_' + slug, p.tema) } catch { /* La caché es opcional. */ }

  // Fondo de textura dinámico desde Supabase
  if (p.foto_fondo) {
    const root = document.documentElement
    root.style.setProperty('--bg-foto', `url('${p.foto_fondo}')`)
    root.style.setProperty('--bg-opacidad', ((p.opacidad_fondo || 7) / 100).toFixed(2))
  }

  document.title = `${p.nombre} — Sur Patagonian`

  let allLotes = [], inventory
  try {
    const {leerInventarioCompleto} = await import('/js/lotes-inventario.mjs?v=20261117-publico')
    const lectura = await leerInventarioCompleto(supabase,p.id)
    if (lectura.error) throw lectura.error
    allLotes = lectura.data
    const {projectSaleInventory} = await import('/js/zonas-venta.mjs?v=20261115-inventario')
    inventory = projectSaleInventory(p, allLotes)
  } catch (error) {
    console.error('No se pudo comprobar la disponibilidad de los lotes.', error)
  }
  const publicLots = inventory?.lots || []
  const publicProject = {...p, cantidad_lotes: inventory?.total}

  // Guardar datos globalmente para el brochure PDF
  window._proyectoData = publicProject
  window._lotesData = inventory?.lots
  window._galeria = p.fotos || []

  // New miniwebs are opt-in through the existing tema JSON. QA comparison is
  // URL-only and never saves data or changes the project slug/QR contracts.
  const miniwebTema = inventory?.config
  const miniwebParams = new URLSearchParams(location.search)
  const miniwebQa = location.hostname === 'staging.surpatagonian.com'
  const miniwebOverride = miniwebQa && ['inmersivo','editorial','arquitectonico','sectores','catalogo'].includes(miniwebParams.get('miniweb'))
  if (inventory && ((miniwebTema && miniwebTema.activa !== false) || miniwebOverride)) {
    try {
      const {mountMiniweb} = await import('/js/miniweb.mjs?v=20261118-miniweb')
      const mount = document.createElement('div')
      mount.id = 'miniweb-root'
      document.body.append(mount)
      let miniwebProject = p
      if (miniwebQa && p.slug === 'alamos' && miniwebParams.get('comparar') === '1') {
        // Static copies of this project's public media keep QA isolated. No DB
        // rewrite, external proxy or relaxation of the staging CSP.
        const qaImages = {"/storage/v1/object/public/imagenes/portadas/1780034911010-oc1crpb6mkk.webp":"/assets/miniweb-alamos/portada.webp","/storage/v1/object/public/imagenes/mapas/alamos/1781906820699_DJI_0266_copia.webp":"/assets/miniweb-alamos/mapa.webp","/storage/v1/object/public/imagenes/masterplans/1781905680312-gwdjyhi67zr.webp":"/assets/miniweb-alamos/plano.webp","/storage/v1/object/public/imagenes/galeria/1781905555041-bl745stwocs.webp":"/assets/miniweb-alamos/galeria-01.webp","/storage/v1/object/public/imagenes/galeria/1781905568048-worhqtvn5s.webp":"/assets/miniweb-alamos/galeria-02.webp","/storage/v1/object/public/imagenes/galeria/1781905575076-tjna460ga3q.webp":"/assets/miniweb-alamos/galeria-03.webp","/storage/v1/object/public/imagenes/galeria/1781905579863-qgh41jbp1ns.webp":"/assets/miniweb-alamos/galeria-04.webp","/storage/v1/object/public/imagenes/galeria/1781905585300-8z27o0fmobn.webp":"/assets/miniweb-alamos/galeria-05.webp","/storage/v1/object/public/imagenes/galeria/1781905600128-p859q4wbzjg.webp":"/assets/miniweb-alamos/galeria-06.webp","/storage/v1/object/public/imagenes/galeria/1781905609265-4rf0r6bcaen.webp":"/assets/miniweb-alamos/galeria-07.webp","/storage/v1/object/public/imagenes/galeria/1781905613303-sv1xweefytj.webp":"/assets/miniweb-alamos/galeria-08.webp","/storage/v1/object/public/imagenes/galeria/1781905617955-uupgm4u8i4.webp":"/assets/miniweb-alamos/galeria-09.webp"}
        const localImage = value => { try { return qaImages[new URL(value, location.origin).pathname] || value } catch { return value } }
        miniwebProject = {...p, foto_portada:localImage(p.foto_portada), fotos:(p.fotos || []).map(localImage),
          masterplan_url:localImage(p.masterplan_url), mapa_imagen_url:localImage(p.mapa_imagen_url), mapa_activo:true,
          representantes:p.representantes}
      }
      let miniwebPreviewConfig = miniwebOverride ? {...miniwebTema,estilo:miniwebParams.get('miniweb')} : miniwebTema
      // Explicit comparison-only photo preview. Never saves or changes the project.
      if (miniwebQa && miniwebParams.get('comparar') === '1' && miniwebParams.get('medio') === 'foto') {
        miniwebPreviewConfig = {...miniwebPreviewConfig,medio:'foto'}
        if (Array.isArray(miniwebPreviewConfig.bloques)) miniwebPreviewConfig.bloques = miniwebPreviewConfig.bloques.map(b => b.tipo === 'portada' ? {...b,opciones:{...b.opciones,medio:'foto'}} : b)
      }
      const comercial = slug==='terrazas-del-piltri' && !miniwebOverride && miniwebPreviewConfig?.estilo==='inmersivo'
        ? await import('/js/terrazas-comercial.mjs?v=20261120') : null
      if (comercial) {
        if (['Terrazas del Piltriquitron','Terrazas del Piltri','Terrazas del Piltrí'].includes(p.nombre)) miniwebProject={...miniwebProject,nombreIdentidad:p.nombre,nombre:'Terrazas del Piltriquitrón'}
        document.title=miniwebProject.nombre+' — Sur Patagonian'
        miniwebPreviewConfig=comercial.configuracionTerrazas(miniwebPreviewConfig,miniwebProject)
      }
      await mountMiniweb(mount, {project:miniwebProject, lots:allLotes, publicPage:true,
        compare:miniwebQa && miniwebParams.get('comparar') === '1',
        config:miniwebPreviewConfig,
        onContact: fields => enviarContactoSeguro({lote_id:fields.lote_id,nombre:fields.nombre,telefono:fields.telefono,email:fields.email,mensaje:`[${miniwebProject.nombre}] ${fields.mensaje}`,proyecto_slug:slug,fuente:'proyecto_mini_form'},mount),
        onPdf: request => window.generarBrochure(request)
      })
      if (comercial) comercial.presentarTerrazas(mount.shadowRoot,miniwebProject,allLotes)
      $('loading').remove()
      // Shadow DOM isolates the new compositions from legacy typography and GSAP.
      document.documentElement.style.background = '#0c1113'
      document.body.style.margin = '0'
      if (!miniwebQa || miniwebParams.get('comparar') !== '1') registrarVisita({pagina:slug}).catch(() => {})
      return
    } catch (error) {
      document.getElementById('miniweb-root')?.remove()
      console.error('No se pudo cargar la nueva presentación; se conserva la miniweb.', error)
    }
  }

  const { montarProyectoClasico } = await import('/js/proyecto-clasico.mjs?v=20261118-consulta-lote')
  montarProyectoClasico($('loading'))
  $('navBrandNombre').textContent = p.nombre || ''
  document.addEventListener('keydown', navegarLightbox)
  window.addEventListener('scroll', actualizarNavClasica, { passive: true })
  renderHero(publicProject)
  renderAtmosfera(p)
  renderPres(publicProject, publicLots)
  renderPlano(p)
  const consultarLote = renderContacto(p)
  if (p.mapa_imagen_url && p.mapa_activo !== false && inventory) renderMapaLotes(publicLots, p.mapa_imagen_url, p.mapa_pin_estilo || 'gotita', consultarLote)
  if (p.representantes?.length && p.rep_activo !== false) renderRepresentantes(p.representantes)
  renderDisponibilidad(publicLots, consultarLote)
  renderGaleria(p)
  renderInfo(p)
  renderMapa(p)

  registrarVisita({ pagina: slug }).catch(() => {})

  setTimeout(() => $('loading').classList.add('fade'), 400)
  setTimeout(() => initAnimations(), 100)
}

// ── Hero ─────────────────────────────────────────────────────────────
function renderHero(p) {
  $('heroTitle').textContent = p.nombre || ''
  $('heroTagline').textContent = p.tagline || ''

  const loc = [p.ciudad, p.provincia?.replace(/_/g,' ')].filter(Boolean).join(' · ')
  if (loc) $('heroEyebrow').textContent = `Sur Patagonian · ${loc}`

  // stats
  const stats = []
  if (p.hectareas_total) stats.push({ v: p.hectareas_total + ' ha', l: 'Superficie' })
  if (p.cantidad_lotes)  stats.push({ v: p.cantidad_lotes, l: 'Lotes' })
  if (p.precio_desde)    stats.push({ v: 'USD ' + Number(p.precio_desde).toLocaleString(), l: 'Desde' })
  $('heroStats').innerHTML = stats.map(s =>
    `<div><div class="hero-stat-val">${s.v}</div><div class="hero-stat-label">${s.l}</div></div>`
  ).join('')

  // video o foto
  const vid = ytId(p.video_url)
  if (vid) {
    $('heroMedia').innerHTML = `<iframe
      src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&loop=1&playlist=${vid}&controls=0&rel=0&showinfo=0&iv_load_policy=3&modestbranding=1&playsinline=1"
      frameborder="0" allow="autoplay;encrypted-media" allowfullscreen></iframe>`
  } else if (p.foto_portada) {
    $('heroMedia').innerHTML = `<div class="hero-foto" style="background-image:url('${p.foto_portada}')"></div>`
  }
}

// ── Presentación ─────────────────────────────────────────────────────
function renderPres(p, lotes) {
  $('presTitulo').innerHTML = `<em>${p.nombre}</em>`
  $('presDesc').textContent = p.descripcion || ''

  const loc = [p.ciudad, p.provincia?.replace(/_/g,' ')].filter(Boolean).join(', ')
  if (loc) $('presEyebrow').textContent = loc

  // Stats en columna izquierda
  const disp = lotes.filter(l => l.estado === 'disponible').length
  const stats = []
  if (p.hectareas_total) stats.push({ n: parseFloat(p.hectareas_total), u: 'ha',  l: 'Superficie total' })
  if (p.cantidad_lotes)  stats.push({ n: parseInt(p.cantidad_lotes),    u: '',    l: 'Lotes en total' })
  if (disp > 0)          stats.push({ n: disp,                           u: '',    l: 'Disponibles hoy' })
  if (p.precio_desde)    stats.push({ n: Math.round(Number(p.precio_desde)/1000), u: 'k', l: 'USD desde' })

  $('presStats').innerHTML = stats.length ? `<div class="pres-stats-row">${stats.map(s =>
    `<div class="pres-stat-ed">
      <div class="pres-stat-num-ed" data-counter="${s.n}">0<span class="pres-stat-unit">${s.u}</span></div>
      <div class="pres-stat-lbl-ed">${s.l}</div>
    </div>`
  ).join('')}</div>` : ''

  // SVG plano ilustrativo en columna derecha
  $('presLote').innerHTML = buildLoteSVG(p)
}

// ── Plano ─────────────────────────────────────────────────────────────
function renderPlano(p) {
  if (!p.masterplan_url || p.plano_activo === false) {
    document.getElementById('plano').style.display = 'none'

    document.querySelector('a[href="#plano"]')?.style.setProperty('display','none')

  $('planoTitulo').style.display = 'none'
  $('planoMarca').textContent = p.nombre

  $('planoHint').style.display = 'block'
}

// ── Mapa interactivo de lotes (dinámico desde Supabase) ───────────────
const ZONA_COLOR = { 'Laguna':'#7ec8d4', 'Bosque':'#8aab78', 'Río':'#6aabb4', 'Complejo turístico':'#c8bfa8' }

function renderMapaLotes(lotes, mapaImagenUrl, pinEstilo, consultarLote) {
  const seccion = document.getElementById('mapa-lotes')
  const img   = document.getElementById('mlMapImg')
  const svg   = document.getElementById('mlSvg')
  const popup = document.getElementById('mlPopup')
  const wrap  = document.getElementById('mlMapWrap')
  if (!svg || !popup || !wrap || !img) return

  // Solo mostrar lotes que tienen posición configurada
  const lotesConPos = lotes.filter(l => l.mapa_x != null && l.mapa_y != null)
  if (!lotesConPos.length && !mapaImagenUrl) return

  if (seccion) seccion.style.display = ''
  img.alt = 'Mapa de ' + (window._proyectoData?.nombre || 'lotes')
  img.src = mapaImagenUrl
  const leyenda = seccion.querySelector('.ml-leyenda')
  const esHuemules = window._proyectoData?.slug === 'aldea-los-huemules'
  const tipos = esHuemules ? Object.keys(ZONA_COLOR) : [...new Set(lotesConPos.map(lote => lote.tipo_lote).filter(Boolean))]
  function agregarReferencia(texto, color, clase = '') {
    const item = document.createElement('div')
    item.className = 'ml-leg-item'
    const punto = document.createElement('span')
    punto.className = 'ml-leg-dot ' + clase
    if (color) punto.style.backgroundColor = color
    item.append(punto, texto)
    leyenda.append(item)
  }
  for (const tipo of tipos.filter(tipo => tipo !== 'Complejo turístico')) {
    agregarReferencia(esHuemules ? tipo + ' — disponible' : tipo, ZONA_COLOR[tipo] || '#8aab78')
  }
  agregarReferencia('Vendido / Reservado', null, 'ml-c-vend')
  if (tipos.includes('Complejo turístico')) agregarReferencia('Complejo turístico', null, 'ml-c-comp')

  // Contadores
  let disp=0, res=0, vend=0
  lotes.forEach(l => {
    if (l.estado==='disponible') disp++
    else if (l.estado==='reservado') res++
    else if(l.estado==='vendido')vend++
  })
  const cntEl = document.getElementById('mlCounters')
  if (cntEl) cntEl.innerHTML = `
    <div class="ml-cnt"><div class="ml-cnt-n">${disp}</div><div class="ml-cnt-l">Disponibles</div></div>
    <div class="ml-cnt"><div class="ml-cnt-n">${res}</div><div class="ml-cnt-l">Reservados</div></div>
    <div class="ml-cnt"><div class="ml-cnt-n">${vend}</div><div class="ml-cnt-l">Vendidos</div></div>
    <div class="ml-cnt"><div class="ml-cnt-n">${lotes.length}</div><div class="ml-cnt-l">Total lotes</div></div>`

  // Renderizar pines estilo mapa una vez que carga la imagen
  function dibujar() {
    const W = img.naturalWidth || img.clientWidth
    const H = img.naturalHeight || img.clientHeight
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`)
    const r  = Math.round(W * 0.017)
    const sh = Math.round(W * 0.003)
    const estilo = pinEstilo || 'gotita'

    svg.innerHTML = `<defs>
      <filter id="mlSh" x="-70%" y="-70%" width="240%" height="300%">
        <feDropShadow dx="0" dy="${Math.round(W*0.002)}" stdDeviation="${sh}" flood-color="#000" flood-opacity="0.38"/>
      </filter>
    </defs>`

    const ns = 'http://www.w3.org/2000/svg'
    const mk = tag => document.createElementNS(ns, tag)

    lotesConPos.forEach(l => {
      const tipX = (l.mapa_x / 100) * W
      const tipY = (l.mapa_y / 100) * H

      const zona   = l.tipo_lote || (esHuemules ? 'Bosque' : '')
      const isComp = zona === 'Complejo turístico'
      const estado = isComp ? 'complejo' : (l.estado || 'sin')
      const muted  = estado === 'vendido' || estado === 'complejo'
      const fo     = muted ? '0.62' : '0.93'
      const color  = estado==='disponible' ? (ZONA_COLOR[zona] || '#8aab78')
                   : estado==='reservado'  ? '#c9a84c'
                   : estado==='complejo'   ? '#a8b8c0'
                   : '#c4734a'
      const SW = Math.round(W * 0.0018)

      const g = mk('g'); g.setAttribute('class', 'ml-lot')

      const addText = (x, y) => {
        const t = mk('text')
        t.setAttribute('x', x); t.setAttribute('y', y)
        t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','central')
        t.setAttribute('font-size', Math.round(W * 0.009)); t.setAttribute('font-weight','500')
        t.setAttribute('fill','white'); t.setAttribute('fill-opacity', muted ? '0.7' : '1')
        t.setAttribute('pointer-events','none')
        t.textContent = String(l.numero || '').replace(/^lote\s+/i, '')
        g.appendChild(t)
      }
      const addRing = (cx, cy) => {
        const ring = mk('circle')
        ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('r', r * 0.68)
        ring.setAttribute('fill','none'); ring.setAttribute('stroke','rgba(255,255,255,0.28)')
        ring.setAttribute('stroke-width', Math.round(W*0.0012)); ring.setAttribute('pointer-events','none')
        g.appendChild(ring)
      }
      const addShadow = (cx, cy) => {
        const ell = mk('ellipse')
        ell.setAttribute('cx', cx); ell.setAttribute('cy', cy + r*0.18)
        ell.setAttribute('rx', r*0.4); ell.setAttribute('ry', r*0.12)
        ell.setAttribute('fill','rgba(0,0,0,0.18)'); ell.setAttribute('pointer-events','none')
        g.appendChild(ell)
      }

      let ccx = tipX, ccy = tipY

      if (estilo === 'circulo') {
        addShadow(tipX, tipY)
        const c = mk('circle')
        c.setAttribute('cx', tipX); c.setAttribute('cy', tipY); c.setAttribute('r', r)
        c.setAttribute('fill', color); c.setAttribute('fill-opacity', fo)
        c.setAttribute('stroke','rgba(255,255,255,0.7)'); c.setAttribute('stroke-width', SW)
        c.setAttribute('filter','url(#mlSh)')
        g.appendChild(c); addRing(tipX, tipY); addText(tipX, tipY)

      } else if (estilo === 'gotita') {
        ccy = tipY - r*2.2; const ty = ccy + r, tw = r*0.44
        addShadow(tipX, tipY)
        const tail = mk('polygon')
        tail.setAttribute('points',`${tipX-tw},${ty} ${tipX+tw},${ty} ${tipX},${tipY}`)
        tail.setAttribute('fill',color); tail.setAttribute('fill-opacity',fo); tail.setAttribute('filter','url(#mlSh)')
        g.appendChild(tail)
        const c = mk('circle')
        c.setAttribute('cx',tipX); c.setAttribute('cy',ccy); c.setAttribute('r',r)
        c.setAttribute('fill',color); c.setAttribute('fill-opacity',fo)
        c.setAttribute('stroke','rgba(255,255,255,0.7)'); c.setAttribute('stroke-width',SW)
        c.setAttribute('filter','url(#mlSh)')
        g.appendChild(c); addRing(tipX, ccy); addText(tipX, ccy)

      } else {
        // etiqueta
        const bw = Math.round(r*2.8), bh = Math.round(r*1.4), brad = Math.round(r*0.35)
        const by = tipY - bh - r*1.1, ty = by + bh, tw = r*0.38
        ccy = by + bh/2
        addShadow(tipX, tipY)
        const tail = mk('polygon')
        tail.setAttribute('points',`${tipX-tw},${ty} ${tipX+tw},${ty} ${tipX},${tipY}`)
        tail.setAttribute('fill',color); tail.setAttribute('fill-opacity',fo); tail.setAttribute('filter','url(#mlSh)')
        g.appendChild(tail)
        const rect = mk('rect')
        rect.setAttribute('x', tipX-bw/2); rect.setAttribute('y', by)
        rect.setAttribute('width', bw); rect.setAttribute('height', bh); rect.setAttribute('rx', brad)
        rect.setAttribute('fill',color); rect.setAttribute('fill-opacity',fo)
        rect.setAttribute('stroke','rgba(255,255,255,0.7)'); rect.setAttribute('stroke-width',SW)
        rect.setAttribute('filter','url(#mlSh)')
        g.appendChild(rect); addText(tipX, by+bh/2)
      }

      // Popup al hover
      g.addEventListener('mouseenter', () => {
        const svgR  = svg.getBoundingClientRect()
        const wrapR = wrap.getBoundingClientRect()
        const sx = svgR.width / W, sy = svgR.height / H
        let px = (ccx * sx) + (svgR.left - wrapR.left) + 18
        let py = (ccy * sy) + (svgR.top  - wrapR.top)  - 24
        if (px + 210 > wrapR.width) px -= 228
        if (py < 0) py += 56
        const eLabel = estado==='disponible'?'Disponible':estado==='reservado'?'Reservado':estado==='complejo'?'Complejo turístico':estado==='vendido'?'Vendido':estado==='proximamente'?'Próximamente':'Sin informar'
        let html = `<div class="ml-popup-lote">Lote ${l.numero}</div><div class="ml-popup-zona">${zona}</div>`
        if (l.superficie_m2) html += `<div class="ml-popup-row"><span class="ml-popup-lbl">Superficie</span><span class="ml-popup-val">${Number(l.superficie_m2).toLocaleString('es-AR')} m²</span></div>`
        if (l.precio_usd && estado==='disponible') html += `<div class="ml-popup-row"><span class="ml-popup-lbl">Precio</span><span class="ml-popup-val">USD ${Number(l.precio_usd).toLocaleString('es-AR')}</span></div>`
        html += `<span class="ml-popup-badge ${estado}">${eLabel}</span>`
        if (l.permiteConsulta && !isComp) html += `<a class="ml-popup-cta" href="#contacto">Consultar este lote →</a>`
        popup.innerHTML = html
        popup.querySelector('.ml-popup-cta')?.addEventListener('click', event => {
          event.preventDefault()
          consultarLote(l)
        })
        popup.style.left = px + 'px'; popup.style.top = py + 'px'
        popup.classList.add('visible')
      })
      g.addEventListener('mouseleave', () => popup.classList.remove('visible'))
      g.addEventListener('click', () => { if (l.permiteConsulta && !isComp) consultarLote(l) })
      svg.appendChild(g)
    })
  }

  if (img.complete && img.naturalWidth) dibujar()
  else img.addEventListener('load', dibujar)
}

function renderDisponibilidad(lotes, consultarLote) {
  renderLotes(lotes, 'todos', consultarLote)
  document.querySelectorAll('.disp-filtro').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.disp-filtro').forEach(b => b.classList.remove('activo'))
      btn.classList.add('activo')
      renderLotes(lotes, btn.dataset.f, consultarLote)
    })
  })
}

function renderLotes(lotes, filtro, consultarLote) {
  const tb = $('lotesBody')
  const list = filtro === 'todos' ? lotes : lotes.filter(l => l.estado === filtro)
  if (!list.length) {
    tb.innerHTML = `<tr><td colspan="6" class="disp-empty">${lotes.length ? 'Sin lotes con ese estado.' : 'Información de lotes no disponible.'}</td></tr>`
    return
  }
  tb.innerHTML = list.map(l => `<tr>
    <td class="lote-num">Lote ${l.numero}</td>
    <td>${l.superficie_m2 ? Number(l.superficie_m2).toLocaleString() + ' m²' : '—'}</td>
    <td class="lote-precio">${l.precio_usd ? 'USD ' + Number(l.precio_usd).toLocaleString() : '—'}</td>
    <td>${l.frente_agua ? '<span style="color:var(--gold)">✦ Sí</span>' : '—'}</td>
    <td><span class="badge badge-${l.estado}">${
      l.estado === 'disponible' ? 'Disponible' : l.estado === 'reservado' ? 'Reservado' : l.estado === 'vendido' ? 'Vendido' : l.estado === 'proximamente' ? 'Próximamente' : 'Sin informar'
    }</span></td>
    <td>${l.permiteConsulta
      ? `<a href="#contacto" class="lote-cta">Consultar →</a>` : ''}</td>
  </tr>`).join('')
  tb.onclick = event => {
    const enlace = event.target.closest('.lote-cta')
    if (!enlace) return
    event.preventDefault()
    consultarLote(list[enlace.closest('tr').sectionRowIndex])
  }
}

// ── Atmósfera ─────────────────────────────────────────────────────────
function renderAtmosfera(p) {
  const foto = p.foto_atmosfera || (p.fotos && p.fotos.length > 0 ? p.fotos[0] : p.foto_portada)
  if (!foto) return
  $('atmBg').style.backgroundImage = `url('${foto}')`
  $('atmQuote').textContent = p.tagline || p.nombre || ''
  const loc = [p.ciudad, p.provincia?.replace(/_/g,' ')].filter(Boolean).join(' · ')
  $('atmSub').textContent = loc || 'Patagonia Argentina'
  $('atmosfera').style.display = 'flex'
}

// ── Info + Servicios ──────────────────────────────────────────────────
function renderInfo(p) {
  // Foto split — usa segunda foto de galería si existe, sino la primera, sino portada
  const fotoInfo = (p.fotos && p.fotos.length > 1) ? p.fotos[1]
                 : (p.fotos && p.fotos[0]) || p.foto_portada || null
  if (fotoInfo) {
    $('infoFotoImg').src = fotoInfo
    $('infoFotoCol').style.display = 'block'
    $('info').classList.add('has-foto')
  }

  const items = []
  const loc = [p.ciudad, p.provincia?.replace(/_/g,' ')].filter(Boolean).join(', ')
  if (loc) items.push({ icon:'<circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 018 8c0 5.5-8 14-8 14S4 15.5 4 10a8 8 0 018-8z"/>', l:'Ubicación', v: loc + (p.distancia_km ? ` · a ${p.distancia_km} km` : '') })
  if (p.sup_min_m2 || p.sup_max_m2) items.push({ icon:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>', l:'Tamaño de lotes', v: p.sup_min_m2 && p.sup_max_m2 ? `${Number(p.sup_min_m2).toLocaleString()} m² — ${Number(p.sup_max_m2).toLocaleString()} m²` : `${Number(p.sup_min_m2||p.sup_max_m2).toLocaleString()} m²` })
  if (p.zonificacion) items.push({ icon:'<path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/>', l:'Zonificación', v: p.zonificacion })
  if (p.tipo_acceso) items.push({ icon:'<path d="M5 12h14M12 5l7 7-7 7"/>', l:'Acceso', v: {asfalto:'Ruta asfaltada',ripio:'Camino de ripio',tierra:'Camino de tierra',mixto:'Mixto'}[p.tipo_acceso]||p.tipo_acceso })
  if (p.monto_reserva) items.push({ icon:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>', l:'Reserva desde', v:'USD ' + Number(p.monto_reserva).toLocaleString() })
  if (p.fecha_entrega) items.push({ icon:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>', l:'Entrega estimada', v: p.fecha_entrega })

  $('infoItems').innerHTML = items.map(it =>
    `<div class="info-item">
      <div class="info-icon"><svg viewBox="0 0 24 24">${it.icon}</svg></div>
      <div><div class="info-lbl">${it.l}</div><div class="info-val">${it.v}</div></div>
    </div>`
  ).join('')

  // Servicios
  const serv = p.servicios || []
  $('serviciosChips').innerHTML = serv.map(s => {
    const info = SERVICIOS[s] || { label: s, svg:'<circle cx="12" cy="12" r="2"/>' }
    return `<div class="chip"><svg viewBox="0 0 24 24">${info.svg}</svg>${info.label}</div>`
  }).join('')

  if (p.condiciones_venta) {
    $('condicionesText').textContent = p.condiciones_venta
    $('condicionesBlq').style.display = 'block'
  }
}

// ── Mapa ──────────────────────────────────────────────────────────────
function renderMapa(p) {
  if (!p.latitud || !p.longitud) return
  const lat = p.latitud, lng = p.longitud
  const loc = [p.ciudad, p.provincia?.replace(/_/g,' ')].filter(Boolean).join(', ')
  $('ubicTitulo').innerHTML = `<em>${loc || p.nombre}</em>`
  $('ubicDesc').textContent = p.descripcion_ubicacion
    || `${p.nombre} se encuentra en ${loc || 'la Patagonia Argentina'}, en un entorno natural privilegiado.`
  $('ubicMapa').innerHTML = `<iframe src="https://maps.google.com/maps?q=${lat},${lng}&hl=es&z=14&output=embed&iwloc=B" allowfullscreen loading="lazy"></iframe><div class="ubic-overlay"></div>`
  $('ubicacion').style.display = 'block'
}

// ── Galería ───────────────────────────────────────────────────────────
let _lbFotos = []
let _lbIndex = 0

function renderGaleria(p) {
  const fotos = p.fotos || []
  if (!fotos.length) return
  _lbFotos = fotos
  document.getElementById('galeria').style.display = 'block'
  $('galeriaGrid').innerHTML = fotos.map((url, i) =>
    `<div class="gal-item" onclick="openLightbox(${i})">
      <img src="${url}" alt="" loading="lazy" />
    </div>`
  ).join('')
}

// ── Contacto ──────────────────────────────────────────────────────────
// Siempre va a Sur Patagonian — cambiá estos datos si cambia el contacto
const SUR_WSP   = '5492944791799'
const SUR_EMAIL = 'contacto@surpatagonian.com' // ← reemplazá con tu email real

function renderContacto(p) {
  const nombre = p.nombre || 'el proyecto'
  // Si el visitante vino por un canal, el ref viaja también en el mensaje
  // de WhatsApp para no perder la atribución por esa vía.
  const _ref = getRef()
  const msg = encodeURIComponent(`Hola, me interesa ${nombre}. ¿Podemos hablar?${_ref ? ` (ref: ${_ref})` : ''}`)
  const wspUrl = `https://wa.me/${SUR_WSP}?text=${msg}`
  $('btnWsp').href = wspUrl
  $('btnWsp').style.display = 'inline-flex'
  $('navWsp').href = wspUrl
  $('btnMail').href = `mailto:${SUR_EMAIL}?subject=${encodeURIComponent('Consulta: ' + nombre)}`
  $('btnMail').style.display = 'inline-flex'

  let loteSeleccionado = null
  function indicarLote(lote) {
    loteSeleccionado = lote
    $('fContextoLote').hidden = !lote
    $('fLote').textContent = lote ? 'Consulta por lote ' + lote.numero : ''
  }
  $('fQuitarLote').onclick = () => {
    indicarLote(null)
    $('fMsg2').textContent = ''
    $('fMsg').focus()
  }
  $('formContacto').addEventListener('submit', async e => {
    e.preventDefault()
    const form = e.currentTarget
    const btn = $('fBtn')
    if (btn.disabled) return
    btn.disabled = true; btn.textContent = 'Enviando...'
    $('fQuitarLote').disabled = true
    let error = null
    try {
      const {validarConsulta} = await import('/js/consulta-miniweb.mjs')
      const campos = validarConsulta({
        nombre: $('fNombre').value,
        telefono: $('fTel').value,
        email: $('fEmail').value,
        mensaje: (loteSeleccionado ? 'Consulta por lote ' + loteSeleccionado.numero + '.\n\n' : '') + $('fMsg').value
      }, `[${nombre}] `)
      await enviarContactoSeguro({
        ...campos, mensaje: `[${nombre}] ${campos.mensaje}`,
        ...(loteSeleccionado ? {lote_id: loteSeleccionado.id} : {}),
        proyecto_slug: slug,
        fuente: 'proyecto_mini_form'
      },form)
    } catch (err) { error = err }
    $('fQuitarLote').disabled = false
    const m = $('fMsg2')
    if (error) {
      m.className = 'form-err'
      try {
        const {errorConsulta} = await import('/js/consulta-miniweb.mjs')
        m.textContent = errorConsulta(error)
      } catch { m.textContent = 'No pudimos confirmar el envío. Puede volver a intentarlo.' }
      btn.disabled = false; btn.textContent = 'Enviar consulta'
    } else {
      m.className = 'form-ok'; m.textContent = '¡Consulta recibida! Te contactamos pronto.'
      form.reset(); indicarLote(null); btn.disabled = false; btn.textContent = 'Enviar consulta'
    }
  })
  return lote => {
    if (!lote?.permiteConsulta || !lote.id || $('fBtn').disabled) return
    indicarLote(lote)
    $('fMsg2').textContent = ''
    $('contacto').scrollIntoView({behavior:'smooth'})
    $('fNombre').focus({preventScroll:true})
  }
}

// ── Lightbox ──────────────────────────────────────────────────────────
function lbShow(index) {
  _lbIndex = index
  const fotos = _lbFotos
  $('lbImg').src = fotos[index]
  $('lbCounter').textContent = `${index + 1} / ${fotos.length}`
  $('lbPrev').classList.toggle('hidden', index === 0)
  $('lbNext').classList.toggle('hidden', index === fotos.length - 1)
}

window.openLightbox = (indexOrSrc) => {
  if (typeof indexOrSrc === 'number') {
    lbShow(indexOrSrc)
  } else {
    // fallback para el plano (se llama con src directo, sin galería)
    $('lbImg').src = indexOrSrc
    $('lbCounter').textContent = ''
    $('lbPrev').classList.add('hidden')
    $('lbNext').classList.add('hidden')
  }
  $('lightbox').classList.add('open')
  document.body.style.overflow = 'hidden'
}
window.closeLightbox = () => {
  $('lightbox').classList.remove('open')
  document.body.style.overflow = ''
}
window.lbNavigate = dir => {
  const next = _lbIndex + dir
  if (next >= 0 && next < _lbFotos.length) lbShow(next)
}
function navegarLightbox(e) {
  if (!$('lightbox').classList.contains('open')) return
  if (e.key === 'Escape')     closeLightbox()
  if (e.key === 'ArrowLeft')  lbNavigate(-1)
  if (e.key === 'ArrowRight') lbNavigate(1)
}

// ── Nav scroll ────────────────────────────────────────────────────────
function actualizarNavClasica() {
  $('nav').classList.toggle('scrolled', scrollY > 60)
}

// ── Animaciones GSAP ──────────────────────────────────────────────────
function initAnimations() {
  if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return
  gsap.registerPlugin(ScrollTrigger)

  // Hero parallax
  const heroFoto = document.querySelector('.hero-foto')
  if (heroFoto) {
    gsap.to(heroFoto, {
      yPercent: 22, ease: 'none',
      scrollTrigger: { trigger: '#hero', start: 'top top', end: 'bottom top', scrub: true }
    })
  }

  // Atmósfera: parallax fondo + entrada de contenido
  const atmBgEl = document.getElementById('atmBg')
  if (atmBgEl && document.getElementById('atmosfera').style.display !== 'none') {
    gsap.fromTo(atmBgEl, { yPercent: -8 }, {
      yPercent: 8, ease: 'none',
      scrollTrigger: { trigger: '#atmosfera', start: 'top bottom', end: 'bottom top', scrub: true }
    })
    gsap.from('#atmosfera .atm-linea', {
      scaleY: 0, transformOrigin: 'top center', duration: 1, ease: 'power2.out',
      scrollTrigger: { trigger: '#atmosfera', start: 'top 65%', toggleActions: 'play none none none' }
    })
    gsap.from('#atmosfera .atm-quote, #atmosfera .atm-sub', {
      opacity: 0, y: 32, duration: 1.1, ease: 'power2.out', stagger: 0.15,
      scrollTrigger: { trigger: '#atmosfera', start: 'top 60%', toggleActions: 'play none none none' }
    })
  }

  // Presentación: slide in desde lados
  gsap.from('.pres-left', {
    opacity: 0, x: -50, duration: 1, ease: 'power2.out',
    scrollTrigger: { trigger: '#presentacion', start: 'top 75%', toggleActions: 'play none none none' }
  })
  gsap.from('.pres-right', {
    opacity: 0, x: 50, duration: 1, ease: 'power2.out', delay: 0.15,
    scrollTrigger: { trigger: '#presentacion', start: 'top 75%', toggleActions: 'play none none none' }
  })
  gsap.from('.pres-linea', {
    scaleX: 0, transformOrigin: 'left center', duration: 0.8, ease: 'power2.out',
    scrollTrigger: { trigger: '.pres-linea', start: 'top 82%', toggleActions: 'play none none none' }
  })

  // Contadores animados
  document.querySelectorAll('[data-counter]').forEach(el => {
    const target = parseFloat(el.dataset.counter)
    const unit = el.querySelector('.pres-stat-unit')
    const isDecimal = (target % 1 !== 0)
    ScrollTrigger.create({
      trigger: el, start: 'top 82%', once: true,
      onEnter: () => {
        gsap.to({ val: 0 }, {
          val: target, duration: 1.8, ease: 'power2.out',
          onUpdate: function() {
            const v = isDecimal
              ? this.targets()[0].val.toFixed(1)
              : Math.round(this.targets()[0].val)
            // first text node holds the number
            el.firstChild.textContent = v
          }
        })
      }
    })
  })

  // Galería: stagger de items
  const galItems = document.querySelectorAll('.gal-item')
  if (galItems.length) {
    gsap.from(galItems, {
      opacity: 0, scale: 0.96, stagger: 0.07, duration: 0.7, ease: 'power2.out',
      scrollTrigger: { trigger: '#galeria', start: 'top 75%', toggleActions: 'play none none none' }
    })
  }

  // Info split: foto izq / datos der
  gsap.from('#info .info-foto-col', {
    opacity: 0, x: -40, duration: 1.1, ease: 'power2.out',
    scrollTrigger: { trigger: '#info', start: 'top 70%', toggleActions: 'play none none none' }
  })
  gsap.from('#info .info-data-col', {
    opacity: 0, x: 40, duration: 1.1, ease: 'power2.out', delay: 0.1,
    scrollTrigger: { trigger: '#info', start: 'top 70%', toggleActions: 'play none none none' }
  })

  // Ubicación
  if (document.getElementById('ubicacion').style.display !== 'none') {
    gsap.from('#ubicacion .ubic-header', {
      opacity: 0, y: 30, duration: 1, ease: 'power2.out',
      scrollTrigger: { trigger: '#ubicacion', start: 'top 75%', toggleActions: 'play none none none' }
    })
  }

  // Contacto: stagger de elementos
  gsap.from(['.cta-eyebrow', '.cta-titulo', '.cta-sub', '.cta-btns'], {
    opacity: 0, y: 28, stagger: 0.12, duration: 0.9, ease: 'power2.out',
    scrollTrigger: { trigger: '#contacto', start: 'top 75%', toggleActions: 'play none none none' }
  })
}

init()

// ══ BROCHURE PDF ═════════════════════════════════════════════════════════
let brochureReady = null
window.generarBrochure = async function(request) {
  try {
    brochureReady ||= import('/js/brochure-proyecto.mjs?v=20261123-compartido').then(({createBrochureGenerator}) =>
      createBrochureGenerator(() => ({project:window._proyectoData,lots:window._lotesData,gallery:window._galeria,
        reference:getRef(),fallbackPhone:SUR_WSP,fallbackEmail:SUR_EMAIL,button:document.getElementById('btnBrochure')})))
    const generate = await brochureReady
    return await generate(request)
  } catch (error) {
    brochureReady = null
    console.error('Brochure error:', error)
    alert('Error al generar el PDF. Intentá de nuevo.')
    return false
  }
}

document.addEventListener('click', event => {
  const target = event.target instanceof Element ? event.target : null
  if (!target?.closest('#btnBrochure')) return
  event.preventDefault()
  window.generarBrochure()
})
