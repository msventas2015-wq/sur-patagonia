<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <title>Proyecto · Redirección</title>
</head>
<body>
  <p id="estado">Abriendo el proyecto…</p>
  <noscript>Necesitás activar JavaScript para abrir el proyecto.</noscript>
  <script>
    const params = new URLSearchParams(location.search)
    const slug = params.get('slug')
    if (slug && /^[a-z0-9-]+$/.test(slug)) {
      params.delete('slug')
      const query = params.toString()
      location.replace(`/${encodeURIComponent(slug)}${query ? `?${query}` : ''}${location.hash}`)
    } else {
      document.getElementById('estado').textContent = slug
        ? 'El identificador del proyecto no es válido.'
        : 'Falta indicar qué proyecto querés abrir.'
      const enlace = document.createElement('a')
      enlace.href = '/'
      enlace.textContent = 'Volver al inicio'
      document.body.appendChild(enlace)
    }
  </script>
</body>
</html>
