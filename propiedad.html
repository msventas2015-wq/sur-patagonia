<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Propiedad — Sur Patagonia</title>
  <link rel="stylesheet" href="css/estilos.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { cursor: none; }
    #cur { position:fixed; z-index:9999; pointer-events:none; width:7px; height:7px; border-radius:50%; background:var(--dorado); transform:translate(-50%,-50%); transition:width .3s,height .3s,background .3s,border .3s; will-change:transform; }
    #cur.big { width:40px; height:40px; background:transparent; border:1px solid rgba(201,168,76,0.6); }
    a,button,[onclick],select,input,label,textarea { cursor: none; }
  </style>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .detalle-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 3rem;
      align-items: start;
    }
    .detalle-sidebar {
      position: sticky;
      top: 6rem;
    }
    .ficha-contacto {
      background: var(--negro-2);
      border: 1px solid var(--gris-oscuro);
      padding: 2rem;
    }
    .ficha-precio {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      color: var(--dorado);
      margin-bottom: 1.5rem;
    }
    .ficha-precio small {
      font-size: 1rem;
      color: var(--gris-claro);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
    }
    .modal-galeria {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .modal-galeria.abierto { display: flex; }
    .modal-galeria img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
    }
    .modal-cerrar {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: var(--blanco);
      font-size: 2rem;
      cursor: pointer;
    }
    .modal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--blanco);
      font-size: 2rem;
      cursor: pointer;
      padding: 1rem;
      transition: all 0.2s;
    }
    .modal-nav:hover { background: rgba(201,168,76,0.3); }
    .modal-prev { left: 1rem; }
    .modal-next { right: 1rem; }
    @media (max-width: 768px) {
      .detalle-layout { grid-template-columns: 1fr; }
      .detalle-sidebar { position: static; }
    }

    /* Botones de acción */
    .prop-acciones {
      display: flex;
      gap: 0.6rem;
      margin-top: 1rem;
    }
    .btn-wsp {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem;
      background: #25D366;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-wsp:hover { opacity: 0.88; }
    .btn-pdf {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem;
      background: transparent;
      color: var(--dorado);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--dorado);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-pdf:hover { background: var(--dorado); color: var(--negro); }

    /* Estilos de impresión para PDF */
    @media print {
      nav, .modal-galeria, .ficha-contacto, .prop-acciones,
      .galeria-miniaturas, footer { display: none !important; }
      body { background: white !important; color: #111 !important; }
      .detalle-layout { grid-template-columns: 1fr !important; }
      .galeria-principal { height: 300px !important; }
      #detalleDescripcion { color: #333 !important; }
      .detalle-spec { border: 1px solid #ddd !important; }
      .detalle-spec-valor { color: #111 !important; }
      .detalle-spec-label { color: #555 !important; }
      .breadcrumb, .card-badge { display: none; }
      h1 { color: #111 !important; font-size: 2rem !important; }
      .print-header {
        display: flex !important;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid #c9a84c;
      }
    }
    .print-header { display: none; }
  </style>
</head>
<body>

  <div id="cur"></div>

  <!-- NAV -->
  <nav class="nav scrolled">
    <div class="contenedor">
      <div class="nav-inner">
        <a href="index.html" class="nav-logo"><img src="logohorizontal.png" alt="Sur Patagonia" style="height:49px;" /></a>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="propiedades.html" class="activo">Propiedades</a></li>
          <li><a href="proyectos.html">Proyectos</a></li>
          <li><a href="index.html#contacto">Contacto</a></li>
        </ul>
        <button class="nav-menu-btn" id="menuBtn" aria-label="Menú">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- CARGANDO -->
  <div id="estadoCargando" style="padding:10rem 0; text-align:center;">
    <div class="spinner" style="margin:0 auto 1rem;"></div>
    <p style="color:var(--gris-claro);">Cargando propiedad...</p>
  </div>

  <!-- CONTENIDO PROPIEDAD -->
  <div id="contenidoPropiedad" style="display:none;">

    <!-- GALERÍA -->
    <div style="padding-top:5rem; background:var(--negro);">
      <div class="contenedor">
        <div class="galeria-principal" id="galeriaPrincipal">
          <div style="display:flex;align-items:center;justify-content:center;height:100%;background:var(--negro-3);color:var(--gris);font-size:3rem;">🏠</div>
        </div>
        <div class="galeria-miniaturas" id="galeriaMiniaturas"></div>
      </div>
    </div>

    <!-- DETALLE -->
    <section class="seccion">
      <div class="contenedor">
        <p class="breadcrumb" style="margin-bottom:2rem;">
          <a href="index.html" style="color:var(--dorado)">Inicio</a> /
          <a href="propiedades.html" style="color:var(--dorado)">Propiedades</a> /
          <span id="breadcrumbTitulo">—</span>
        </p>
        <div class="detalle-layout">
          <!-- COLUMNA PRINCIPAL -->
          <div>
            <div style="display:flex; gap:0.8rem; margin-bottom:1rem;">
              <span class="card-badge" id="detalleBadgeOp" style="position:static; display:inline-block;"></span>
              <span style="font-size:0.7rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--dorado);align-self:center;" id="detalleTipo"></span>
            </div>
            <h1 id="detalleTitulo" style="margin-bottom:0.5rem;"></h1>
            <p id="detalleUbicacion" style="color:var(--gris-claro);margin-bottom:2rem;font-size:0.9rem;">📍 —</p>

            <div class="detalle-specs" id="detalleSpecs"></div>

            <h3 style="font-weight:300; margin-bottom:1rem;">Descripción</h3>
            <div id="detalleDescripcion" style="color:var(--gris-claro); font-size:0.9rem; line-height:1.9; margin-bottom:2rem; white-space:pre-wrap;"></div>

            <!-- MAPA -->
            <div id="bloqueUbicacion" style="display:none; margin-top:2rem;">
              <h3 style="font-weight:300; margin-bottom:1rem;">Ubicación</h3>
              <div id="mapaPropiedad" style="height:380px; border:1px solid var(--gris-oscuro); overflow:hidden;"></div>
              <p id="coordsLink" style="font-size:0.72rem; color:var(--gris-claro); margin-top:0.5rem;"></p>
            </div>
          </div>

          <!-- SIDEBAR -->
          <div class="detalle-sidebar">
            <div class="ficha-contacto">
              <div class="ficha-precio" id="fichaPrecio"></div>
              <!-- Botones compartir -->
              <div class="prop-acciones">
                <a id="btnWsp" href="#" target="_blank" class="btn-wsp">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.964-1.405A9.956 9.956 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18a7.946 7.946 0 01-4.031-1.09l-.29-.172-2.947.835.797-2.877-.189-.295A7.962 7.962 0 014 12c0-4.411 3.589-8 8-8s8 3.589 8 8-3.589 8-8 8z"/></svg>
                  WhatsApp
                </a>
                <button onclick="window.print()" class="btn-pdf">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg>
                  PDF
                </button>
              </div>
              <div id="alertaFicha"></div>
              <form id="formFicha">
                <div class="form-grupo" style="margin-bottom:1rem;">
                  <label>Tu nombre</label>
                  <input type="text" id="fNombre" placeholder="Nombre completo" required />
                </div>
                <div class="form-grupo" style="margin-bottom:1rem;">
                  <label>Email</label>
                  <input type="email" id="fEmail" placeholder="tu@email.com" required />
                </div>
                <div class="form-grupo" style="margin-bottom:1rem;">
                  <label>Teléfono</label>
                  <input type="tel" id="fTelefono" placeholder="+54 9..." />
                </div>
                <div class="form-grupo" style="margin-bottom:1.5rem;">
                  <label>Mensaje</label>
                  <textarea id="fMensaje" rows="3" placeholder="Quisiera más información sobre esta propiedad..."></textarea>
                </div>
                <button type="submit" class="btn btn-dorado" style="width:100%;">Consultar</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

  </div>

  <!-- PROPIEDAD NO ENCONTRADA -->
  <div id="noEncontrado" style="display:none; padding:10rem 0; text-align:center;">
    <h2 style="color:var(--gris-claro);">Propiedad no encontrada</h2>
    <a href="propiedades.html" class="btn btn-dorado" style="margin-top:2rem;">Ver todas las propiedades</a>
  </div>

  <!-- MODAL GALERÍA -->
  <div class="modal-galeria" id="modalGaleria">
    <button class="modal-cerrar" id="modalCerrar">✕</button>
    <button class="modal-nav modal-prev" id="modalPrev">‹</button>
    <img id="modalImg" src="" alt="" />
    <button class="modal-nav modal-next" id="modalNext">›</button>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="contenedor">
      <div class="footer-bottom" style="border-top:none;">
        <span>© 2025 Sur Patagonia.</span>
        <a href="propiedades.html" style="color:var(--dorado);">← Volver a propiedades</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { supabase } from './js/config.js'

    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('abierto')
    })

    const params = new URLSearchParams(window.location.search)
    const id = params.get('id')

    if (!id) {
      document.getElementById('estadoCargando').style.display = 'none'
      document.getElementById('noEncontrado').style.display = 'block'
    } else {
      cargarPropiedad(id)
    }

    async function cargarPropiedad(id) {
      const { data, error } = await supabase
        .from('propiedades')
        .select('*')
        .eq('id', id)
        .eq('activa', true)
        .single()

      document.getElementById('estadoCargando').style.display = 'none'

      if (error || !data) {
        document.getElementById('noEncontrado').style.display = 'block'
        return
      }

      renderPropiedad(data)
      document.getElementById('contenidoPropiedad').style.display = 'block'
      document.title = `${data.titulo} — Sur Patagonia`
    }

    let imagenesActuales = []
    let idxActual = 0

    function renderPropiedad(p) {
      imagenesActuales = p.imagenes || []

      // Galería principal
      const galPrincipal = document.getElementById('galeriaPrincipal')
      if (imagenesActuales.length > 0) {
        galPrincipal.innerHTML = `<img id="imgPrincipal" src="${imagenesActuales[0]}" alt="${p.titulo}" style="cursor:zoom-in;" />`
        document.getElementById('imgPrincipal').addEventListener('click', () => abrirModal(0))
      }

      // Miniaturas
      const galMin = document.getElementById('galeriaMiniaturas')
      galMin.innerHTML = imagenesActuales.map((url, i) => `
        <div class="galeria-miniatura${i === 0 ? ' activa' : ''}" data-idx="${i}">
          <img src="${url}" alt="${p.titulo}" loading="lazy" />
        </div>`).join('')
      galMin.querySelectorAll('.galeria-miniatura').forEach(m => {
        m.addEventListener('click', () => {
          const idx = parseInt(m.dataset.idx)
          document.getElementById('imgPrincipal').src = imagenesActuales[idx]
          galMin.querySelectorAll('.galeria-miniatura').forEach(x => x.classList.remove('activa'))
          m.classList.add('activa')
        })
      })

      // Badge operación
      const badgeOp = document.getElementById('detalleBadgeOp')
      badgeOp.textContent = p.operacion === 'venta' ? 'Venta' : p.operacion === 'alquiler' ? 'Alquiler' : 'Temporario'
      badgeOp.className = `card-badge badge-${p.operacion}`

      document.getElementById('detalleTipo').textContent = p.tipo || ''
      document.getElementById('detalleTitulo').textContent = p.titulo
      document.getElementById('breadcrumbTitulo').textContent = p.titulo
      document.getElementById('detalleUbicacion').textContent = `📍 ${[p.ubicacion, p.ciudad, p.provincia].filter(Boolean).join(', ')}`
      document.getElementById('detalleDescripcion').textContent = p.descripcion || 'Sin descripción.'

      // Precio
      const precio = p.precio
        ? `${p.moneda || 'USD'} ${Number(p.precio).toLocaleString('es-AR')}`
        : 'Consultar precio'
      document.getElementById('fichaPrecio').innerHTML =
        `${precio}<br><small>${p.operacion !== 'venta' ? '/ mes' : ''}</small>`

      // Specs
      const specs = []
      if (p.dormitorios) specs.push({ val: p.dormitorios, label: 'Dormitorios' })
      if (p.banos) specs.push({ val: p.banos, label: 'Baños' })
      if (p.superficie_cubierta) specs.push({ val: p.superficie_cubierta + ' m²', label: 'Sup. cubierta' })
      if (p.superficie_total) specs.push({ val: p.superficie_total + ' m²', label: 'Sup. total' })
      document.getElementById('detalleSpecs').innerHTML = specs.map(s => `
        <div class="detalle-spec">
          <span class="detalle-spec-valor">${s.val}</span>
          <span class="detalle-spec-label">${s.label}</span>
        </div>`).join('')

      // Mensaje predeterminado
      document.getElementById('fMensaje').value = `Hola, quisiera más información sobre la propiedad "${p.titulo}".`

      // Mapa de ubicación
      if (p.latitud && p.longitud) {
        document.getElementById('bloqueUbicacion').style.display = 'block'
        const mapa = L.map('mapaPropiedad').setView([p.latitud, p.longitud], 15)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap'
        }).addTo(mapa)
        L.marker([p.latitud, p.longitud])
          .addTo(mapa)
          .bindPopup(`<b>${p.titulo}</b><br>${[p.ubicacion, p.ciudad].filter(Boolean).join(', ')}`)
          .openPopup()
        document.getElementById('coordsLink').innerHTML =
          `<a href="https://www.google.com/maps?q=${p.latitud},${p.longitud}" target="_blank" style="color:var(--dorado);">📍 Ver en Google Maps</a>`
      }

      // Botón WhatsApp — comparte link de la propiedad
      const urlPropiedad = window.location.href
      const msgWsp = encodeURIComponent(`Mirá esta propiedad en Sur Patagonia:\n*${p.titulo}*\n${urlPropiedad}`)
      document.getElementById('btnWsp').href = `https://wa.me/?text=${msgWsp}`

      // Formulario contacto
      document.getElementById('formFicha').addEventListener('submit', async (e) => {
        e.preventDefault()
        const btn = e.target.querySelector('button')
        btn.textContent = 'Enviando...'
        btn.disabled = true
        const { error } = await supabase.from('contactos').insert({
          nombre: document.getElementById('fNombre').value,
          email: document.getElementById('fEmail').value,
          telefono: document.getElementById('fTelefono').value,
          mensaje: document.getElementById('fMensaje').value,
          propiedad_id: p.id
        })
        const alerta = document.getElementById('alertaFicha')
        if (error) {
          alerta.innerHTML = `<div class="alerta alerta-error">Error. Intentá de nuevo.</div>`
        } else {
          alerta.innerHTML = `<div class="alerta alerta-exito">¡Consulta enviada! Te contactamos pronto.</div>`
          e.target.reset()
        }
        btn.textContent = 'Consultar'
        btn.disabled = false
      })
    }

    // Modal galería
    function abrirModal(idx) {
      idxActual = idx
      document.getElementById('modalImg').src = imagenesActuales[idx]
      document.getElementById('modalGaleria').classList.add('abierto')
    }

    document.getElementById('modalCerrar').addEventListener('click', () => {
      document.getElementById('modalGaleria').classList.remove('abierto')
    })

    document.getElementById('modalPrev').addEventListener('click', () => {
      idxActual = (idxActual - 1 + imagenesActuales.length) % imagenesActuales.length
      document.getElementById('modalImg').src = imagenesActuales[idxActual]
    })

    document.getElementById('modalNext').addEventListener('click', () => {
      idxActual = (idxActual + 1) % imagenesActuales.length
      document.getElementById('modalImg').src = imagenesActuales[idxActual]
    })

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') document.getElementById('modalGaleria').classList.remove('abierto')
      if (e.key === 'ArrowLeft') document.getElementById('modalPrev').click()
      if (e.key === 'ArrowRight') document.getElementById('modalNext').click()
    })
  </script>
  <script>
    const cur = document.getElementById('cur')
    document.addEventListener('mousemove', e => {
      cur.style.left = e.clientX + 'px'
      cur.style.top  = e.clientY + 'px'
    })
    document.addEventListener('mouseleave', () => cur.style.opacity = '0')
    document.addEventListener('mouseenter', () => cur.style.opacity = '1')
    document.querySelectorAll('a,button,[onclick],select,input,label,textarea').forEach(el => {
      el.addEventListener('mouseenter', () => cur.classList.add('big'))
      el.addEventListener('mouseleave', () => cur.classList.remove('big'))
    })
  </script>
</body>
</html>
