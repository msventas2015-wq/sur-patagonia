            <a href="apariencia.html" class="admin-nav-item">

  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h2 style="font-weight:300;">Consultas recibidas</h2>
        <p style="font-size:0.78rem; color:var(--gris-claro);">Mensajes de clientes interesados</p>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table class="admin-tabla">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Mensaje</th>
            <th>Propiedad</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tablaContactos">
          <tr><td colspan="8" style="text-align:center;padding:3rem;color:var(--gris-claro);">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { supabase } from '../js/config.js'

  const { data: { session } } = await supabase.auth.getSession()
  if (!session) window.location.href = 'login.html'

  document.getElementById('btnLogout').addEventListener('click', async (e) => {
    e.preventDefault()
    await supabase.auth.signOut()
    window.location.href = 'login.html'
  })

  async function cargar() {
    const { data } = await supabase
      .from('contactos')
      .select('*, propiedades(titulo)')
      .order('created_at', { ascending: false })

    const tbody = document.getElementById('tablaContactos')
    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:3rem;color:var(--gris-claro);">Sin consultas aún.</td></tr>'
      return
    }

    tbody.innerHTML = data.map(c => `
      <tr style="${!c.leido ? 'background:rgba(201,168,76,0.04);' : ''}">
        <td style="color:var(--blanco); font-weight:${!c.leido ? '500' : '300'}">${c.nombre}</td>
        <td><a href="mailto:${c.email}" style="color:var(--dorado);">${c.email}</a></td>
        <td>${c.telefono || '—'}</td>
        <td style="max-width:300px; white-space:pre-wrap; word-break:break-word; font-size:0.8rem;">${c.mensaje || '—'}</td>
        <td style="font-size:0.8rem;">${c.propiedades?.titulo || '—'}</td>
        <td style="white-space:nowrap;">${new Date(c.created_at).toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' })}</td>
        <td><span class="badge-activo ${c.leido ? 'si' : 'no'}">${c.leido ? 'Leído' : 'Nuevo'}</span></td>
        <td>
          ${!c.leido ? `<button class="btn-accion btn-editar" data-id="${c.id}">Marcar leído</button>` : ''}
        </td>
      </tr>`).join('')

    tbody.querySelectorAll('.btn-editar').forEach(btn => {
      btn.addEventListener('click', async () => {
        await supabase.from('contactos').update({ leido: true }).eq('id', btn.dataset.id)
        cargar()
      })
    })
  }

  cargar()
</script>
</body>
</html>
