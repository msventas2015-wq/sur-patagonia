<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Propiedades — Sur Patagonia Admin</title>
  <link rel="stylesheet" href="../css/estilos.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --card-bg:#161513; --card-border:rgba(255,255,255,0.07); --card-radius:14px; --accent:#d76f3f; }
    .admin-main { font-family:'Inter',system-ui,sans-serif; }
    .admin-tabla { border-radius: var(--card-radius); overflow: hidden; }
    .admin-tabla th { background: #1a1815; }
    .admin-tabla td { background: transparent; }
    .admin-tabla tbody tr:hover td { background: rgba(215,111,63,0.04); }
    input, select, textarea { border-radius: 8px !important; font-family: 'Inter', sans-serif; }
    .btn, .btn-dorado { border-radius: 8px !important; font-family: 'Inter', sans-serif; font-weight: 600; }
    .acciones-tabla { display:flex; gap:0.4rem; flex-wrap:wrap; }
    .btn-accion {
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.06em;
      padding: 0.35rem 0.8rem; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1); background: none;
      color: var(--gris-claro); cursor: pointer; transition: all .18s;
      text-decoration: none; font-family: 'Inter', sans-serif;
    }
    .btn-accion:hover, .btn-editar:hover { border-color: var(--accent); color: var(--accent); }
    .btn-eliminar:hover { border-color: #e05c5c; color: #e05c5c; }
    #alerta { border-radius: 8px; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-logo">SUR <span>PATAGONIA</span></div>
    <nav class="admin-nav">
      <a href="dashboard.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="propiedades.html" class="admin-nav-item activo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
        Propiedades
      </a>
      <a href="nueva-propiedad.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Nueva propiedad
      </a>
      <a href="proyectos.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        Proyectos
      </a>
      <a href="nuevo-proyecto.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Nuevo proyecto
      </a>
      <a href="contactos.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Consultas
      </a>
      <a href="canales.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Canales
      </a>
      <a href="apariencia.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M8.46 8.46a5 5 0 0 0 0 7.07"/></svg>
        Apariencia
      </a>
      <a href="generador-pdf.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        Generar PDF
      </a>
            <a href="usuarios.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Usuarios
      </a>
      <a href="../index.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
        Ver sitio
      </a>
      <a href="#" class="admin-nav-item" id="btnLogout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Salir
      </a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h2 style="font-weight:300;">Propiedades</h2>
        <p style="font-size:0.78rem; color:var(--gris-claro);">Gestioná todas las propiedades del sitio</p>
      </div>
      <a href="nueva-propiedad.html" class="btn btn-dorado">+ Nueva propiedad</a>
    </div>
    <div id="alerta"></div>
    <div style="overflow-x:auto;">
      <table class="admin-tabla">
        <thead>
          <tr>
            <th>Imagen</th>
            <th>Título</th>
            <th>Tipo</th>
            <th>Operación</th>
            <th>Ciudad</th>
            <th>Precio</th>
            <th>Destacada</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaPropiedades">
          <tr><td colspan="9" style="text-align:center;padding:3rem;color:var(--gris-claro);">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { supabase } from '../js/config.js'

  const { data: { session } } = await supabase.auth.getSession()
  if (!session) window.location.href = 'login.html'

  document.getElementById('btnLogout').addEventListener('click', async (e) => {
    e.preventDefault()
    await supabase.auth.signOut()
    window.location.href = 'login.html'
  })

  async function cargar() {
    const { data } = await supabase
      .from('propiedades')
      .select('*')
      .order('created_at', { ascending: false })

    const tbody = document.getElementById('tablaPropiedades')
    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:3rem;color:var(--gris-claro);">No hay propiedades. <a href="nueva-propiedad.html" style="color:var(--dorado)">Crear primera</a></td></tr>`
      return
    }

    tbody.innerHTML = data.map(p => `
      <tr>
        <td>${p.imagenes && p.imagenes[0] ? `<img src="${p.imagenes[0]}" alt="" />` : '—'}</td>
        <td style="color:var(--blanco); font-weight:400;">${p.titulo}</td>
        <td>${p.tipo || '—'}</td>
        <td>${p.operacion || '—'}</td>
        <td>${p.ciudad || '—'}</td>
        <td>${p.precio ? (p.moneda || 'USD') + ' ' + Number(p.precio).toLocaleString() : 'Consultar'}</td>
        <td><span class="badge-activo ${p.destacada ? 'si' : 'no'}">${p.destacada ? 'Sí' : 'No'}</span></td>
        <td><span class="badge-activo ${p.activa ? 'si' : 'no'}">${p.activa ? 'Activa' : 'Inactiva'}</span></td>
        <td>
          <div class="acciones-tabla">
            <a class="btn-accion" href="../propiedad?id=${p.id}" target="_blank" rel="noopener">Ver</a>
            <button class="btn-accion btn-editar" data-id="${p.id}">Editar</button>
            <button class="btn-accion btn-eliminar" data-id="${p.id}" data-activa="${p.activa}">${p.activa ? 'Desactivar' : 'Activar'}</button>
          </div>
        </td>
      </tr>`).join('')

    tbody.querySelectorAll('.btn-editar').forEach(btn => {
      btn.addEventListener('click', () => window.location.href = `nueva-propiedad.html?id=${btn.dataset.id}`)
    })

    tbody.querySelectorAll('.btn-eliminar').forEach(btn => {
      btn.addEventListener('click', async () => {
        const activar = btn.dataset.activa === 'false'
        if (!confirm(`¿${activar ? 'Activar' : 'Desactivar'} esta propiedad?`)) return
        await supabase.from('propiedades').update({ activa: activar }).eq('id', btn.dataset.id)
        cargar()
      })
    })
  }

  cargar()
</script>
</body>
</html>
