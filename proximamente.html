<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sur Patagonian Red Inmobiliaria · Próximamente</title>
  <link rel="apple-touch-icon" href="/assets/app-icon-180.png" />
  <link rel="canonical" href="https://surpatagonian.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sur Patagonian" />
  <meta property="og:title" content="Sur Patagonian Red Inmobiliaria — Propiedades en la Patagonia" />
  <meta property="og:description" content="Propiedades, terrenos y desarrollos en la Patagonia argentina." />
  <meta property="og:url" content="https://surpatagonian.com/" />
  <meta property="og:image" content="https://surpatagonian.com/assets/og-image.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root { --bg:#0c0c0e; --text:rgba(240,237,232,0.88); --gold:#c9a84c; --muted:rgba(240,237,232,0.35); }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); }

    /* ── LOADING — copiado exacto del index ── */
    #loading { position:fixed; inset:0; z-index:9999; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
    #loading-content { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.2rem; width:100%; text-align:center; }
    #loading-picos { width:110px; opacity:0; transform:translateY(-18px); mix-blend-mode:screen; display:block; margin:0 auto; }
    #loading-title { font-family:'Montserrat',sans-serif; font-size:1.5rem; font-weight:700; letter-spacing:0.45em; text-transform:uppercase; color:var(--text); display:flex; gap:0; overflow:hidden; }
    #loading-title .lc { display:inline-block; opacity:0; transform:translateY(14px); }
    #loading-title .ls { display:inline-block; width:0.45em; }
    #loading-sub { font-size:0.52rem; font-weight:400; letter-spacing:0.55em; text-transform:uppercase; color:var(--muted); opacity:0; }
    #loading-line-wrap { position:absolute; bottom:0; left:0; right:0; height:1px; background:rgba(255,255,255,0.04); }
    #loading-line { height:100%; width:0%; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
    #loading-wipe { position:absolute; inset:0; background:var(--bg); transform:translateY(100%); }

    /* ── VIDEO FONDO ── */
    #yt-bg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
    #yt-player { position:absolute; top:50%; left:50%; width:177.78vh; height:56.25vw; min-width:100%; min-height:100%; transform:translate(-50%,-50%); }

    /* ── OVERLAY ── */
    #overlay { position:fixed; inset:0; z-index:1; background:linear-gradient(to bottom, rgba(12,12,14,0.55) 0%, rgba(12,12,14,0.15) 40%, rgba(12,12,14,0.15) 60%, rgba(12,12,14,0.70) 100%); }

    /* ── CONTENIDO ── */
    #content { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; opacity:0; }
    .logo-wrap { margin-bottom:2.8rem; }
    .logo-wrap img { width:clamp(210px,26vw,330px); opacity:0.88; }
    .divider { width:36px; height:1px; background:rgba(201,168,76,0.5); margin-bottom:2.2rem; }
    .proximo { font-family:'Montserrat',sans-serif; font-size:clamp(2rem,5.2vw,4.2rem); font-weight:700; letter-spacing:0.14em; color:rgba(240,237,232,0.4); text-shadow:0 4px 40px rgba(0,0,0,0.5); }
    @media (max-width:640px) {
      .logo-wrap { margin-bottom:1.0rem; }
      .divider { margin-bottom:1.0rem; }
    }
  </style>
</head>
<body>

  <!-- LOADING — igual al index -->
  <div id="loading">
    <div id="loading-content">
      <picture>
        <source srcset="picos.webp" type="image/webp">
        <img id="loading-picos" src="picos.png" alt="Sur Patagonian">
      </picture>
      <div id="loading-title">
        <span class="lc">S</span><span class="lc">U</span><span class="lc">R</span><span class="ls"> </span><span class="lc">P</span><span class="lc">A</span><span class="lc">T</span><span class="lc">A</span><span class="lc">G</span><span class="lc">O</span><span class="lc">N</span><span class="lc">I</span><span class="lc">A</span><span class="lc">N</span>
      </div>
      <div id="loading-sub">Red Inmobiliaria</div>
    </div>
    <div id="loading-line-wrap"><div id="loading-line"></div></div>
    <div id="loading-wipe"></div>
  </div>

  <!-- VIDEO FONDO -->
  <div id="yt-bg"><div id="yt-player"></div></div>

  <!-- OVERLAY -->
  <div id="overlay"></div>

  <!-- CONTENIDO -->
  <div id="content">
    <div class="logo-wrap">
      <picture>
        <img src="assets/logos/logo-vertical-blanco.png" alt="Sur Patagonian Red Inmobiliaria">
      </picture>
    </div>
    <div class="divider"></div>
    <div class="proximo">PRÓXIMAMENTE</div>
  </div>

  <script>
    history.pushState(null, '', location.href)
    window.addEventListener('popstate', () => history.pushState(null, '', location.href))

    // YouTube
    var tag = document.createElement('script')
    tag.src = 'https://www.youtube.com/iframe_api'
    document.head.appendChild(tag)
    window.onYouTubeIframeAPIReady = function() {
      new YT.Player('yt-player', {
        videoId: 'sczsBI1Pb0E',
        playerVars: { autoplay:1, mute:1, loop:1, controls:0, showinfo:0, rel:0, modestbranding:1, playlist:'sczsBI1Pb0E', playsinline:1, iv_load_policy:3, disablekb:1, fs:0 },
        events: {
          onReady: e => e.target.playVideo(),
          onStateChange: e => { if (e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED) e.target.playVideo() }
        }
      })
    }

    // Loading — lógica copiada exacta del index
    const lineEl    = document.getElementById('loading-line')
    const loadingEl = document.getElementById('loading')
    const picosEl   = document.getElementById('loading-picos')
    const chars     = document.querySelectorAll('#loading-title .lc')
    const subEl     = document.getElementById('loading-sub')
    const wipeEl    = document.getElementById('loading-wipe')
    const contentEl = document.getElementById('content')

    gsap.timeline()
      .to(picosEl, { opacity:1, y:0, duration:0.9, ease:'power3.out' }, 0.1)
      .to(chars,   { opacity:1, y:0, duration:0.5, ease:'power2.out', stagger:0.05 }, 0.5)
      .to(subEl,   { opacity:1, duration:0.6, ease:'power2.out' }, 1.3)

    const MIN_LOAD = 1400
    let pageLoaded = false
    const loadStart = performance.now()
    window.addEventListener('load', () => { pageLoaded = true })
    if (document.readyState === 'complete') pageLoaded = true

    function closeLoading() {
      setTimeout(() => {
        gsap.to(wipeEl, { y:0, duration:0.65, ease:'power3.inOut', onComplete: () => {
          loadingEl.style.display = 'none'
          gsap.to(contentEl, { opacity:1, duration:1.2, ease:'power2.out' })
        }})
      }, 300)
    }

    function tick(now) {
      const elapsed = now - loadStart
      let pct
      if (!pageLoaded)           pct = Math.min((elapsed/MIN_LOAD)*80, 80)
      else if (elapsed<MIN_LOAD) pct = Math.min((elapsed/MIN_LOAD)*100, 100)
      else                       pct = 100
      lineEl.style.width = pct + '%'
      if (pct < 100) { requestAnimationFrame(tick); return }
      closeLoading()
    }
    requestAnimationFrame(tick)
  </script>

</body>
</html>
